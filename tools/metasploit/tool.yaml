name: metasploit
kind: mcp
version: "6.4"
description: "Rapid7's official Metasploit MCP server (msfmcpd) running against a per-engagement msfrpcd + Postgres database. Read-only surface — 8 tools for searching the module catalog and querying workspace database state (hosts, services, vulnerabilities, notes, credentials, loot). Returns structured JSON with pagination metadata. Sessions and exploit execution are NOT available through this tool — for that, use exploit-runner with public PoC scripts. Upstream (Rapid7) has stated that execution and session-interaction tools will land in a future iteration; we'll inherit them automatically when they ship."
source: https://github.com/rapid7/metasploit-framework
image: "ghcr.io/silicon-works/mcp-tools-metasploit:latest"
image_size_mb: 3000
timeout_seconds: 60
idle_timeout_seconds: 600   # service-mode tool, ~30s cold-start cost; 10min keeps the bundle warm across an engagement turn

service: true
service_name: "metasploit"

capabilities:
  - module_search
  - module_metadata
  - workspace_database
  - vulnerability_lookup
  - credential_lookup
  - loot_inventory

phases:
  - enumeration       # query DB state populated by other tools (nmap, etc.)
  - exploitation      # search for relevant modules / look up CVE → module mapping

requirements:
  network: true
  privileged: false

resources:
  memory_mb: 2048
  cpu: 1.0

# Cross-tool routing hints — agents discover the catalog→execution
# handoff pattern through these.
see_also:
  - tool: exploit-runner
    reason: "Execution path. msfmcpd is read-only — once you've identified a module via msf_search_modules + msf_module_info, run the actual exploit through exploit-runner with a public PoC script (Python/shell)."
  - tool: searchsploit
    reason: "Broader exploit catalog (Exploit-DB) covering non-msf PoCs. metasploit's catalog is curated/maintained; searchsploit's is broad/historical. Use both when narrowing down a CVE — they don't fully overlap."
  - tool: nmap
    reason: "Populates the metasploit workspace database when scan results are imported via msfconsole's db_import. Without that, msf_host_info / msf_service_info / etc. return empty."
  - tool: nuclei
    reason: "Independent vulnerability validation. After msf_search_modules suggests a module is exploitable, nuclei templates can confirm the target's actually vulnerable before you commit to running the exploit."

# Hard rules — surfaced separately from gotchas because these are "DO NOT
# violate" rather than "expected behavior to be aware of."
warnings:
  - "READ-ONLY surface. This MCP cannot execute exploits, fire scanners, generate payloads, or interact with sessions. If you need to fire something, route through exploit-runner — never try to coerce a write operation through msfmcpd, it will return Unknown method."
  - "DB-backed tools (5 of 6) require workspace='default' explicitly. Upstream marks workspace required despite having a default. Omitting it returns JSON-RPC -32602 'Missing required arguments: workspace'."
  - "Rate limit: 60 req/min, burst 10. Tight loops (>10 calls in <10s) will fail the 11th+ call until the bucket refills. Pace catalog enumeration with ≥1s gaps."

notes: |
  Architecture: msfmcpd is a thin MCP-protocol layer over msfrpcd. The
  container auto-spawns msfrpcd internally with random credentials at
  startup, then translates incoming MCP tool calls into MessagePack-RPC
  calls against the local msfrpcd. The DB tools query Postgres via the
  framework's ActiveRecord layer.

  Why this exists alongside exploit-runner: msfmcpd's value is the
  CURATED MODULE CATALOG — ~2,300 maintained modules with structured
  metadata (options, targets, references, reliability rankings). Looking
  up a CVE → module mapping is much faster than searching ExploitDB +
  reading PoC code. But upstream has not (yet) exposed module execution
  through MCP, so the actual exploit run lives in exploit-runner.

  Migration history (May 2026): replaces a 29-method Python wrapper that
  duplicated msfconsole over pymetasploit3. The wrapper was retired once
  Rapid7 shipped msfmcpd because (1) duplicating upstream's surface is
  maintenance debt and (2) execution belongs in exploit-runner where it
  unifies the attack-pattern across all tools (msf, public PoCs, custom
  scripts). The wrapper is preserved at commit ad330f9 in case the
  decision ever reverses.

  Cold start: ~30s end-to-end (Postgres start + msfdb init + workspace
  bootstrap + msfmcpd auto-spawn of msfrpcd + module index load).
  ContainerManager's idle_timeout (set to 600s above) keeps the warm
  container alive across multiple agent calls within an engagement.

# Routing hints for tool selection. Triggers are REGEX patterns matched
# against the agent's query (regex match → +35 score). Use_for is
# substring-matched (+8). Phase match adds +0.15 multiplicative bonus.
routing:
  use_for:
    - "search Metasploit modules by CVE, keyword, or module name"
    - "look up which Metasploit module exploits a given CVE"
    - "get detailed info / options / targets / references for a Metasploit module"
    - "query workspace database for discovered hosts populated by other tools"
    - "query workspace database for discovered services / open ports"
    - "query workspace database for vulnerabilities flagged by msf scanners"
    - "list credentials harvested into the metasploit workspace"
    - "list loot files (SAM dumps, configs, screenshots) collected into the workspace"
    - "list notes attached to hosts/services in the workspace"
  never_use_for:
    - task: "execute an exploit module against a target"
      use_instead: "exploit-runner"
      reason: "msfmcpd is read-only; use exploit-runner with the module's public PoC script"
    - task: "interact with an open meterpreter or shell session"
      use_instead: "shell-session"
      reason: "msfmcpd does not expose session command APIs"
    - task: "generate a payload (msfvenom)"
      use_instead: "exploit-runner"
      reason: "wrap the msfvenom invocation in a script and run it through exploit-runner"
    - task: "run an auxiliary scanner / check_vuln"
      use_instead: "exploit-runner"
      reason: "use the public PoC for the CVE; metasploit MCP cannot fire scanners"
    - task: "port scanning"
      use_instead: "nmap"
    - task: "directory enumeration / web fuzzing"
      use_instead: "ffuf"
    - task: "SQL injection"
      use_instead: "sqlmap"
    - task: "password brute force"
      use_instead: "hydra"
  # Triggers are matched as case-insensitive regex. Plain substrings work
  # for most cases.
  triggers:
    - metasploit
    - msfconsole
    - msfmcpd
    - 'msf '
    - 'msf module'
    - 'metasploit module'
    - 'auxiliary module'
    - 'exploit module'
    - 'post module'
    - 'CVE-\d{4}-\d{4,7}'
    - 'MS\d{2}-\d{3}'
    - EternalBlue
    - EternalRomance
    - BlueKeep
    - ZeroLogon
    - PrintNightmare
    - 'samba.*usermap'
    - 'workspace database'
    - 'msf workspace'
  prefer_over: []

methods:
  msf_search_modules:
    description: "Search the Metasploit module catalog by keyword, CVE, or module name. Full-text matching across module name, description, and references. Returns a paginated list of matches with type/name/fullname/rank/disclosure_date."
    when_to_use: "Map a CVE or vulnerability description to one or more Metasploit module paths. Common queries: 'CVE-2017-0144', 'eternalblue', 'samba usermap', 'apache struts'. After identifying a module, call msf_module_info for full options + targets, then run the actual exploit via exploit-runner with the public PoC."
    params:
      query:
        type: string
        required: true
        description: "Search terms (keywords, module path fragment, CVE, advisory ID). 1–500 characters."
      limit:
        type: integer
        default: 100
        description: "Max results (1-1000)"
      offset:
        type: integer
        default: 0
        description: "Pagination offset"
    returns:
      metadata:
        type: object
        description: "{query, query_time, total_items, returned_items, limit, offset}"
      data:
        type: array
        description: "Matching modules — each record has {fullname, type, name, rank, disclosure_date}"

  msf_module_info:
    description: "Return detailed metadata for a single Metasploit module — description, options (with type/required/default/desc/enums), targets, references, authors, has_check_method, default action, etc. No execution."
    when_to_use: "After msf_search_modules narrows down a module path, call this to discover what RHOSTS/LHOST/payload/target options it accepts. Avoids agent trial-and-error guessing option names. Useful before writing a PoC script for exploit-runner."
    params:
      type:
        type: enum
        values: [exploit, auxiliary, post, payload, encoder, nop]
        required: true
        description: "Module type"
      name:
        type: string
        required: true
        description: "Module path WITHOUT the type prefix (e.g. 'windows/smb/ms17_010_eternalblue', not 'exploit/windows/smb/ms17_010_eternalblue'). 1–500 characters."
    returns:
      metadata:
        type: object
        description: "{query_time}"
      data:
        type: object
        description: "{type, name, fullname, rank, disclosure_date, description, license, filepath, architectures, platforms, authors, privileged, has_check_method, default_options, references, targets, default_target, stance, actions, default_action, options}"

  msf_host_info:
    description: "Query hosts in the metasploit workspace database. Hosts are populated by db_nmap, db_import, or successful module runs against discovered targets."
    when_to_use: "Inventory check — what hosts has msf seen during the engagement, what's their inferred OS / state. Useful after the recon phase has imported scan data."
    params:
      workspace:
        type: string
        default: "default"
        description: "Workspace name (alphanumeric + underscore/hyphen)"
      addresses:
        type: string
        description: "Filter by IP or CIDR (e.g. '192.168.1.0/24')"
      only_up:
        type: boolean
        default: false
        description: "Only return hosts marked alive"
      limit:
        type: integer
        default: 100
      offset:
        type: integer
        default: 0
    returns:
      metadata:
        type: object
      data:
        type: array
        description: "Host records (address, mac, name, os_name, os_flavor, os_sp, purpose, info, …)"

  msf_service_info:
    description: "Query services discovered on hosts in the workspace database. Populated by db_nmap, auxiliary scanners, or successful module enumeration."
    when_to_use: "Find what's open on which host — service inventory. Filter by host/port/protocol/name when narrowing down."
    params:
      workspace:
        type: string
        required: true
        default: "default"
        description: "Workspace name. Upstream marks this required even though it has a default — always pass 'default' unless you've explicitly created another workspace."
      names:
        type: string
        description: "Comma-separated service names to filter (e.g. 'http' or 'ldap,ssh')"
      host:
        type: string
        description: "Filter by host IP"
      ports:
        type: string
        description: "Port or range (e.g. '80,443' or '1-1024')"
      protocol:
        type: enum
        values: [tcp, udp]
        description: "Protocol filter"
      only_up:
        type: boolean
        default: false
      limit:
        type: integer
        default: 100
      offset:
        type: integer
        default: 0
    returns:
      metadata:
        type: object
      data:
        type: array
        description: "Service records (host, port, proto, name, state, info)"

  msf_vulnerability_info:
    description: "Query vulnerabilities flagged by msf modules in the workspace database. Each vuln record links a host, service, and module name."
    when_to_use: "After running auxiliary scanners (via exploit-runner with msf in scripted mode, or having imported scan data), enumerate which CVEs are confirmed exploitable on which hosts."
    params:
      workspace:
        type: string
        required: true
        default: "default"
        description: "Workspace name. Upstream marks this required even though it has a default — always pass 'default' unless you've explicitly created another workspace."
      names:
        type: array
        description: "Array of vulnerability/module names (exact, case-sensitive match)"
      host:
        type: string
      ports:
        type: string
      protocol:
        type: enum
        values: [tcp, udp]
      limit:
        type: integer
        default: 100
      offset:
        type: integer
        default: 0
    returns:
      metadata:
        type: object
      data:
        type: array

  msf_note_info:
    description: "Query notes attached to hosts/services in the workspace. Notes record arbitrary metadata (smb fingerprints, ssl certs, banner text, version strings)."
    when_to_use: "Drill into details that scanners stored as notes — smb_version, ssh_version, ssl.certificate, etc. Useful when planning the exploit phase."
    params:
      workspace:
        type: string
        required: true
        default: "default"
        description: "Workspace name. Upstream marks this required even though it has a default — always pass 'default' unless you've explicitly created another workspace."
      type:
        type: string
        description: "Note type (e.g. 'smb.fingerprint', 'ssl.certificate')"
      host:
        type: string
      ports:
        type: string
      protocol:
        type: enum
        values: [tcp, udp]
      limit:
        type: integer
        default: 100
      offset:
        type: integer
        default: 0
    returns:
      metadata:
        type: object
      data:
        type: array

  msf_credential_info:
    description: "Query credentials harvested into the workspace. Populated by login_check scanners, hashdump-style post modules, or db_import of credential dumps."
    when_to_use: "After credential-gathering activity, enumerate what creds are known and which hosts they apply to. Useful for password-spray planning."
    params:
      workspace:
        type: string
        required: true
        default: "default"
        description: "Workspace name. Upstream marks this required even though it has a default — always pass 'default' unless you've explicitly created another workspace."
      limit:
        type: integer
        default: 100
      offset:
        type: integer
        default: 0
    returns:
      metadata:
        type: object
      data:
        type: array

  msf_loot_info:
    description: "Query loot — files and data dumps collected into the workspace (SAM hashes, configs, screenshots, documents)."
    when_to_use: "After post-exploitation gathered data has been written to the workspace, find the file paths to retrieve content. Loot tracks the inventory; the actual files live on disk."
    params:
      workspace:
        type: string
        required: true
        default: "default"
        description: "Workspace name. Upstream marks this required even though it has a default — always pass 'default' unless you've explicitly created another workspace."
      limit:
        type: integer
        default: 100
      offset:
        type: integer
        default: 0
    returns:
      metadata:
        type: object
      data:
        type: array

# ── Failure signatures (substring-matched against tool error/output) ──────
failure_signatures:
  - signal: "rate limit exceeded"
    error_class: rate_limited
    remediation: "Reduce call rate. msfmcpd defaults to 60 req/min, burst 10."
  - signal: "authentication failed"
    error_class: auth_failed
    remediation: "msfmcpd auto-generates random credentials each container start; auth failures suggest the embedded msfrpcd died."
  - signal: "database is not available"
    error_class: tool_misconfigured
    remediation: "Postgres is not running in the container. msf_search_modules and msf_module_info still work; the 6 DB-backed tools (host/service/vuln/note/credential/loot info) won't."
  - signal: "metasploit api error"
    error_class: tool_misconfigured
    remediation: "Generic msfrpcd-side failure. Check container logs (stderr)."
  - signal: "invalid"
    error_class: invalid_parameter
    remediation: "Check tool arguments against the schema (workspace must be alphanumeric+underscore/hyphen, ports 1-65535, search query ≤500 chars)."

# ── Gotchas — non-obvious behaviors ───────────────────────────────────────
gotchas:
  - "READ-ONLY: this tool cannot run an exploit, fire a scanner, generate a payload, or talk to a session. For execution → exploit-runner with the public PoC script for the CVE. Upstream (Rapid7) plans to add execution tools later — they will appear here automatically when they ship."
  - "Module path conventions differ between methods: msf_search_modules returns 'fullname' INCLUDING the type prefix (e.g. 'exploit/windows/smb/ms17_010_eternalblue'). msf_module_info wants 'type' + 'name' SEPARATELY (type='exploit', name='windows/smb/ms17_010_eternalblue'). Strip the leading 'exploit/' when calling module_info."
  - "Workspace database empty by default — msf only knows about hosts that this MCP's underlying msfrpcd has seen (via db_nmap/db_import or successful module runs). Other tools' findings (nmap MCP results) do NOT auto-populate this DB. To use msf_host_info / msf_service_info productively, route nmap results through msf via db_import."
  - "DB-backed tools (host, service, vulnerability, note, credential, loot) require Postgres to be running inside the container. The entrypoint initializes it but if init fails (e.g. on resource-constrained hosts), those 6 tools will return 'database is not available'. msf_search_modules and msf_module_info don't touch the DB and still work."
  - "msfmcpd auto-spawns msfrpcd internally with random credentials each container start. Sessions / state from a prior container do NOT persist — every per-engagement spin-up gets a clean DB."
  - "Cold-start cost: ~30s on first call (Postgres start + msfdb init + workspace bootstrap + msfmcpd-spawned msfrpcd loading ~2,300 modules). Subsequent calls within ContainerManager's idle window (default 5min, this tool's set to 10min) are <1s."
  - "Pagination defaults limit=100 max=1000. For exhaustive enumeration of hosts/services on a large workspace, page through with offset increments."
  - "Rate limit: 60 requests/minute with burst of 10. Hammering more than 10 tool calls in quick succession will fail the 11th+ with a rate-limit error until the token bucket refills. Pace tight loops with ≥1s gaps, or cluster heavy enumeration calls and wait between bursts."
  - "5 of 6 DB-backed tools mark `workspace` as REQUIRED in their JSON-Schema even though the param has a default value of 'default' (upstream inconsistency — only msf_host_info treats it as truly optional). Always pass `workspace: \"default\"` explicitly to msf_service_info / msf_vulnerability_info / msf_note_info / msf_credential_info / msf_loot_info, or you'll get '-32602 Missing required arguments: workspace'."
  - "The auto-spawned msfrpcd creates DB schema but NOT any workspaces. The container's entrypoint pre-creates the 'default' workspace via `msfconsole -x 'workspace -a default; exit'` so DB tools work out of the box. If you ever see 'Invalid workspace', either the bootstrap failed or you passed a name that wasn't created — fall back to a manual `workspace -a <name>` from msfconsole."

# ── Usage patterns ────────────────────────────────────────────────────────
usage_patterns:
  - name: "CVE → module mapping"
    description: "Find which Metasploit modules cover a known CVE."
    method: msf_search_modules
    args:
      query: "CVE-2017-0144"
      limit: 20

  - name: "Search by service + advisory"
    description: "Find SMB-related auxiliary modules for MS17-010 detection."
    method: msf_search_modules
    args:
      query: "type:auxiliary smb ms17_010"

  - name: "Module options before scripting"
    description: "Look up RHOSTS/LHOST/payload/target options for an exploit module before writing the PoC script for exploit-runner."
    method: msf_module_info
    args:
      type: "exploit"
      name: "windows/smb/ms17_010_eternalblue"

  - name: "Workspace host inventory"
    description: "After db_import or db_nmap (run via exploit-runner), enumerate discovered hosts."
    method: msf_host_info
    args:
      only_up: true
      limit: 100

  - name: "Service inventory by port range"
    description: "What's listening on the upper port range across the workspace?"
    method: msf_service_info
    args:
      ports: "1024-65535"
      protocol: "tcp"
