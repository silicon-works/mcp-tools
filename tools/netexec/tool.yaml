name: netexec
kind: cli
binary: netexec
version: "1.5.0"
description: "Network execution tool (NetExec/nxc v1.5.0, CrackMapExec successor, codename Yippie-Ki-Yay) for credential validation, authenticated command execution, credential dumping, AD enumeration, and Kerberos attacks across 10 protocols: SMB, WinRM, LDAP, MSSQL, WMI, RDP, SSH, FTP, NFS, VNC. Single binary (`netexec`; older alias `nxc`) with sub-protocol architecture: `netexec <protocol> <target> [options...]`. CIDR targets supported and idiomatic — credential spraying across /24 subnets is a primary use case (allow_multi_target: true). Supports password, NTLM pass-the-hash (-H), Kerberos (-k/--use-kcache), AES key, and certificate authentication. 70+ built-in modules for SMB including lsassy, enum_av, spider_plus, zerologon, nopac, printnightmare, bloodhound, masky, nanodump. Output markers: [+] success, [-] failure, (Pwn3d!) admin access. Default 256 concurrent threads. Native CLI; the LLM constructs the full netexec invocation. Maintained by @NeffIsBack, @MJHallenbeck, @_zblurx."
image: "ghcr.io/silicon-works/mcp-tools-netexec:latest"
image_size_mb: 800
# Dual-clock model — long enums on /24 can be quiet between hosts (especially
# unreachable hosts that exhaust per-host TCP timeouts). Idle catches a wedged
# container; max_runtime is the hard cap for full subnet enumeration with
# multiple modules.
idle_timeout_seconds: 600       # 10 min — quiet stretches between hosts on /24 are normal
max_runtime_seconds: 21600      # 6 h — full /24 enum + multiple modules + dumps
timeout_seconds: 21600
idle_timeout: 1800              # legacy field, retained for older clients
allow_multi_target: true

capabilities:
  - credential_validation
  - authenticated_execution
  - credential_dumping
  - share_enumeration
  - ad_enumeration
  - pass_the_hash
  - kerberoasting
  - bloodhound

phases:
  - enumeration
  - exploitation
  - post-exploitation

requirements:
  network: true
  privileged: false

resources:
  memory_mb: 512
  cpu: 1.0

routing:
  use_for:
    - "credential validation across multiple protocols (SMB, WinRM, LDAP, MSSQL, RDP, SSH, WMI)"
    - "WinRM command execution and credential dumping (SAM/LSA/DPAPI)"
    - "crackmapexec replacement for credential spraying and pass-the-hash"
    - "pass-the-hash validation against SMB/WinRM/LDAP/MSSQL/RDP/WMI"
    - "SMB authenticated share enumeration, spidering, and file transfer"
    - "credential spraying with --no-bruteforce and --continue-on-success"
    - "SAM/LSA/NTDS/DPAPI credential dumping from Windows targets"
    - "kerberoasting and AS-REP roasting via LDAP"
    - "BloodHound AD data collection (Group, LocalAdmin, Session, Trusts, All)"
    - "AD user/group/computer/delegation enumeration via LDAP"
    - "WMI command execution via DCOM (port 135) as SMB alternative"
    - "RID brute force user discovery via SMB or MSSQL"
    - "share spidering with spider_plus module for file discovery"
    - "netexec module execution (lsassy, enum_av, zerologon, nopac, masky)"
    - "MSSQL xp_cmdshell command execution and SQL queries"
    - "RDP credential validation and screenshot capture"
    - "SSH credential validation, sudo check, and command execution"
    - "SMB signing check for relay attack targeting (--gen-relay-list)"
  never_use_for:
    - "port scanning (use nmap)"
    - "web application testing (use ffuf, nikto, zap)"
    - "SQL injection (use sqlmap)"
    - "vulnerability scanning (use nuclei, nikto)"
    - "SSH brute-force (use hydra for wordlist attacks)"
    - "BloodHound data collection (use bloodhound — writes to /session/ unlike nxc's trapped output)"
  triggers:
    - "netexec"
    - "nxc"
    - "crackmapexec"
    - "cme"
    - "evil-winrm"
    - "winrm exec"
    - "credential spray"
    - "credential validation"
    - "pass-the-hash"
    - "sam dump"
    - "lsa dump"
    - "ntds dump"
    - "kerberoast"
    - "asreproast"
    - "bloodhound"
    - "wmiexec"
    - "dpapi dump"
    - "lsassy"
    - "rid brute"
    - "share spider"
  prefer_over: []

see_also:
  - tool: impacket
    reason: "wmiexec/psexec/secretsdump for non-NetExec remote execution and Kerberos ticket operations"
  - tool: evil-winrm
    reason: "Dedicated WinRM shell with pywinrm for file upload/download via PowerShell base64 chunking"
  - tool: bloodhound
    reason: "Use bloodhound for BloodHound data collection — writes JSON to /session/ unlike nxc's --bloodhound which traps files in container."
  - tool: kerbrute
    reason: "Use kerbrute for Kerberos username enumeration without credentials. Netexec requires at least a username for most operations."

# ── kind:cli specific sections ──────────────────────────────────────

target_extraction:
  # netexec invocation form: `netexec <protocol> <target> [options...]`
  # The protocol (smb/ldap/mssql/winrm/ssh/ftp/wmi/rdp/nfs/vnc) is the FIRST
  # positional, the target is the SECOND positional. The plugin's DSL
  # evaluates positional_match against EACH positional independently — there
  # is no way to express "the positional AFTER the protocol token". So we
  # rely on the SHAPE of the target value: a positional that looks like an
  # IPv4, IPv4 CIDR, IPv6 (bracketed), or dotted hostname/FQDN. Bare
  # protocol tokens like `smb` won't match (no dot, no slash).
  #
  # CIDR support: the regex includes the optional /NN suffix so that
  # `10.10.10.0/24` is captured intact — netexec accepts CIDR natively for
  # subnet enumeration. allow_multi_target: true is set because CIDR is
  # idiomatic credential spraying. multi_target_detected fires only when
  # MULTIPLE distinct positional tokens match — single CIDR is fine.
  #
  # Rule order:
  #   1. positional_match — IPv4 / IPv4 CIDR / dotted FQDN. Captures the
  #      whole positional verbatim (no group, parse_as: raw — the plugin
  #      validates the IP/host shape downstream).
  #   2. positional_match — bracketed IPv6 form `[fe80::1]`. Defensive;
  #      HTB labs are IPv4-only but netexec supports IPv6 natively.
  #   3. NO first_non_flag_positional fallback — that would extract the
  #      protocol token (smb / ldap / etc.) which is NEVER a target. If no
  #      shape-match fires, target=null and the plugin's scope validation
  #      surfaces a helpful error.
  - rule: "positional_match"
    pattern: '^(?:(?:\d{1,3}\.){3}\d{1,3}(?:/\d{1,2})?|[a-zA-Z0-9][a-zA-Z0-9-]*(?:\.[a-zA-Z0-9-]+)+)$'
    parse_as: "raw"
  - rule: "positional_match"
    pattern: '^\[[0-9a-fA-F:]+\](?::\d+)?$'
    parse_as: "raw"

# Flags that put the target outside the command line where scope validation
# can't reach it. netexec accepts `<target>` as a file path containing
# newline-separated targets (file ingest), but this is dual-use with the
# positional — there is NO `-tF` / `--targets-file` / `--input-file` flag in
# nxc. The file-form is detected by the absence of an IP/host shape; the
# url_host parser will return null and scope validation flags the call.
# We therefore document the limitation in gotchas rather than reject_flags.
reject_flags: []
reject_flags_reason: "netexec has no dedicated bulk-target ingest flag (no -tF / --targets-file / --input-file). The positional <target> is dual-use: single host, CIDR, or file path containing targets — file-path form is detected by the target_extraction shape regex returning null, which causes scope validation to flag the call. Do NOT reject any flag here — that would block legitimate netexec calls."

# Per-tool value-taking flags whose values must NOT be confused with positional
# targets. The DSL merges these with built-in defaults. Especially important
# for netexec because authentication values (-u, -p, -H, -d) and command
# values (-x, -X) frequently contain @ / : / / / shell-metachars that could
# masquerade as positional targets.
value_flags:
  # Authentication
  - "-u"                 # username (or path to userlist file)
  - "--username"
  - "-p"                 # password (or path to password file). Empty string OK
  - "--password"
  - "-H"                 # NTLM hash for pass-the-hash (LM:NT or bare NT)
  - "--hash"
  - "-d"                 # AD domain name
  - "--domain"
  - "-K"                 # alias for kerberos cache file (ccache)
  - "--kerberos"         # boolean, but listed for completeness — DSL handles either
  - "--use-kcache"       # boolean — use ccache file from KRB5CCNAME or default
  - "--aesKey"           # Kerberos AES128/AES256 hex key
  - "--kdcHost"          # KDC hostname (used when target is bare IP without SPN)
  - "--local-auth"       # boolean — local SAM auth (no value)
  - "--no-pass"          # boolean — no password (null session / Kerberos)
  # Targeting / connection
  - "--port"             # override default protocol port
  - "--threads"          # concurrent worker count (default 256)
  - "-t"                 # short alias for --threads
  - "--timeout"          # per-host timeout
  - "--jitter"           # delay jitter between requests
  - "--smb-timeout"
  # Module / extension
  - "-M"                 # module name (e.g., spider_plus, lsassy, zerologon)
  - "--module"
  - "-o"                 # module options (KEY=VALUE space-separated)
  - "--module-options"   # boolean lister; -o is the value form
  # Execution / commands
  - "-x"                 # CMD command to execute via SMB/MSSQL/WinRM/RDP/WMI
  - "--exec"
  - "-X"                 # PowerShell command to execute
  - "--ps-execute"
  - "--exec-method"      # wmiexec / atexec / smbexec / mmcexec / wmiexec-event
  - "--dump-method"      # cmd / powershell (WinRM SAM/LSA dump method)
  - "--codec"            # output codec (utf-8 default; cp437 for legacy)
  - "--obfs"             # PowerShell obfuscation for -X
  - "--amsi-bypass"      # AMSI bypass file path
  - "--no-encode"        # boolean, listed for safety
  - "--force-ps32"       # boolean
  # Enumeration with values
  - "--users"            # boolean (--users) OR value-taking (--users <userlist>)
  - "--groups"           # boolean (--groups) OR value-taking (--groups <name>)
  - "--filter-shares"    # comma-separated permission list (READ,WRITE)
  - "--rid-brute"        # max RID integer (default 4000)
  - "--ntds"             # method: drsuapi / vss
  - "--get-sid"          # boolean OR value-taking (--get-sid SID)
  - "--query"            # 2-arg LDAP custom query (filter, attributes)
  - "--base-dn"          # LDAP custom base DN
  - "--kerberoast-account"  # specific SPN account to roast
  - "--asreproast"       # output file path for AS-REP roast hashes
  - "--kerberoasting"    # output file path for Kerberoast hashes
  - "--bloodhound"       # boolean — runs bloodhound; -c for collection type
  - "-c"                 # bloodhound collection type (Default/All/DCOnly/...)
  - "--collection"
  - "--gen-relay-list"   # output file for SMB-signing-disabled hosts
  - "--dnsdump"          # output file for LDAP DNS dump
  - "--share"            # share name (alternative to --shares)
  - "--spider"           # share name to spider
  - "--depth"            # spider depth integer
  - "--pattern"          # spider regex pattern
  - "--exclude-dirs"     # spider directory exclude list
  - "--regex"            # spider regex variant
  - "--gmsa-convert-id"
  - "--gmsa-decrypt-lsa"
  # File transfer
  - "--put-file"         # 2-arg: local remote — DSL treats first arg as value
  - "--get-file"         # 2-arg: remote local
  # Output
  - "--log"              # output log file path
  - "--logfile"
  - "--json"             # boolean — JSON output to stdout
  # SSH-specific
  - "--key-file"         # private key path
  - "--sudo-check-method"  # sudo-stdin / mkfifo
  # RDP-specific
  - "--screenshot"       # boolean — capture screenshot
  - "--screentime"       # int seconds before capture
  - "--res"              # screen resolution (1024x768)
  - "--cmd-delay"        # int seconds between clipboard injection commands
  - "--clipboard-delay"  # int milliseconds for clipboard injection
  # MSSQL-specific
  - "-q"                 # SQL query string
  - "--query"            # also LDAP query — namespace collision; list once is fine
  - "--database"         # database name
  - "--mssql-port"
  # WMI-specific
  - "--wmi"              # WMI query string
  - "--wmi-namespace"    # default root\cimv2
  # General behaviour
  - "--continue-on-success"   # boolean — keep spraying after first hit
  - "--no-bruteforce"          # boolean — single user/pass per host (no cartesian)
  - "--no-progress"            # boolean
  - "--verbose"                # boolean
  - "-v"                       # boolean
  - "--debug"                  # boolean
  - "--no-smb-error"           # boolean
  - "--gfail-limit"            # int — global failure limit
  - "--ufail-limit"            # int — per-user failure limit
  - "--hfail-limit"            # int — per-host failure limit

usage_patterns:
  - name: "SMB null-session enum (anonymous shares + users)"
    command: "netexec smb {target} -u '' -p '' --shares --users"
    when: "First-pass SMB recon when no credentials are available. Empty username + empty password attempts a null session. Surfaces anonymous-readable shares and (on misconfigured DCs) the domain user list. STATUS_NOT_SUPPORTED here means NTLM is disabled — switch to Kerberos via impacket-getTGT first."

  - name: "SMB password spray on /24 with --continue-on-success"
    command: "netexec smb {cidr} -u {username} -p '{password}' --continue-on-success"
    when: "Spray a single password across an entire subnet to find any host where the user authenticates. CRITICAL: --continue-on-success is required because nxc STOPS at the first [+] by default. Combine with --no-bruteforce to avoid the cartesian product when both -u and -p are wordlists. Check --pass-pol FIRST to know the lockout threshold."

  - name: "SMB pass-the-hash with --shares and --sam dump"
    command: "netexec smb {target} -u {username} -H {nt_hash} --shares --sam"
    when: "Validate an NTLM hash via pass-the-hash, enumerate shares, and dump local SAM hashes if admin. Format: -H 31d6cfe0d16ae931b73c59d7e0c089c0 (bare NT) or -H aad3b435...:31d6cfe0... (LM:NT). --sam silently no-ops without admin — check for (Pwn3d!) marker first."

  - name: "LDAP Kerberoast against AD (Kerberos auth)"
    command: "netexec ldap {dc_target} -u {username} -p '{password}' -k --kerberoasting /session/output/kerberoast.txt"
    when: "Extract TGS hashes for SPN-bound accounts to crack offline. -k uses Kerberos via existing ccache (requires --use-kcache or KRB5CCNAME env). Output file lands in /session/ for hashcat -m 13100 / john --format=krb5tgs. Works on hardened AD where NTLM is disabled."

  - name: "MSSQL command exec via xp_cmdshell"
    command: "netexec mssql {target} -u {username} -p '{password}' --local-auth -x '{command}'"
    when: "Execute OS commands via xp_cmdshell (auto-enables if disabled). --local-auth is required for SQL accounts (sa); omit it for AD-authenticated SQL. Use -X for PowerShell. Requires sysadmin role; check with -q 'SELECT IS_SRVROLEMEMBER(\\'sysadmin\\')' first."

  - name: "WinRM PowerShell exec (post-exploitation)"
    command: "netexec winrm {target} -u {username} -p '{password}' -x '{command}'"
    when: "Execute commands via WinRM (port 5985/5986) when SMB exec is monitored or blocked. User must be in 'Remote Management Users' or 'Administrators'. -X for PowerShell with --obfs / --amsi-bypass options. NetExec WinRM does NOT support Kerberos — switch to evil-winrm if NTLM is disabled."

  - name: "NTDS dump from DC (DCSync)"
    command: "netexec smb {dc_target} -u {username} -p '{password}' --ntds"
    when: "Dump every domain user's NT hash via DRSUAPI replication. Default method is drsuapi (--ntds drsuapi); --ntds vss is the fallback (Volume Shadow Copy) when drsuapi is blocked. Requires Domain Admin or 'Replicating Directory Changes' / 'All' rights. Output streams to stdout — capture via --log /session/output/ntds.log."

  - name: "Module run (spider_plus for share content)"
    command: "netexec smb {target} -u {username} -p '{password}' -M spider_plus -o EXT=txt,ini,config OUTPUT_FOLDER=/session/output/spider"
    when: "Run a built-in module to enrich enumeration. spider_plus walks every readable share and writes a JSON inventory. -o passes module options as KEY=VALUE space-separated. Use `netexec smb -L` to list all available modules per protocol; `netexec smb -M <name> --module-options` shows a module's options."

  - name: "Subnet share enumeration (CIDR multi-target)"
    command: "netexec smb {cidr} -u '' -p '' --shares"
    when: "Walk every host in a /24 looking for anonymous-readable shares. CIDR is native — netexec spawns up to 256 threads (configurable with --threads). allow_multi_target: true permits this through plugin scope validation. Combine with --filter-shares READ,WRITE to drop the noise."

output_formats:
  # netexec primarily streams to stdout. Persistent capture via --log; --json
  # is supported for SOME operations (per-protocol — not universal). Hash
  # extraction (--kerberoasting / --asreproast) writes to a path argument.
  - flag: "--log /session/{name}.log"
    format: "text_log"
    preferred: true   # canonical persistent capture
  - flag: "--json"
    format: "json"
    preferred: false  # spotty per-operation support; verify per-protocol
  - flag: "--kerberoasting /session/{name}.txt"
    format: "hashes_file"
    preferred: false  # only for ldap protocol; format = $krb5tgs$
  - flag: "--asreproast /session/{name}.txt"
    format: "hashes_file"
    preferred: false  # only for ldap protocol; format = $krb5asrep$ (mode 18200)
  - flag: "--gen-relay-list /session/{name}.txt"
    format: "host_list"
    preferred: false  # SMB-signing-disabled hosts, one per line

common_options:
  protocol:
    - "FIRST POSITIONAL: protocol — one of: smb / ldap / mssql / winrm / ssh / ftp / wmi / rdp / nfs / vnc. REQUIRED. Each protocol has its own flag set; check `netexec <protocol> --help`"
  targeting:
    - "SECOND POSITIONAL: target — single IP / hostname / FQDN / IPv4 CIDR (10.10.10.0/24) / multiple space-separated targets / OR a file path containing newline-separated targets"
    - "CIDR is idiomatic — credential spraying across /24 is a primary use case (allow_multi_target: true)"
    - "--port N: override the default protocol port (default depends on protocol: SMB=445, LDAP=389/636, MSSQL=1433, WinRM=5985/5986, SSH=22, RDP=3389, FTP=21, WMI=135, NFS=2049, VNC=5900)"
  authentication:
    - "-u USER_OR_FILE: single username or path to a userlist file"
    - "-p PASS_OR_FILE: single password (use empty string '' for null) or path to a password file. With -u file -p file, all combinations are tried (cartesian); use --no-bruteforce for one-pair-per-host"
    - "-H HASH: NTLM pass-the-hash. Format: bare NT (31d6cfe0d16ae931b73c59d7e0c089c0) or LM:NT (aad3b435...:31d6cfe0...)"
    - "-d DOMAIN: AD domain name (mutually exclusive with --local-auth)"
    - "--local-auth: authenticate against local SAM (Workgroup / non-domain) — mutually exclusive with -d"
    - "--no-pass: null password / no password prompt (for null session or Kerberos -k)"
    - "-k: Kerberos auth (requires KRB5CCNAME env or --use-kcache pointing at a ccache)"
    - "--use-kcache: use ccache from default location (KRB5CCNAME)"
    - "--aesKey HEX: Kerberos AES128 (32 hex) or AES256 (64 hex) key"
    - "--kdcHost FQDN: explicit KDC hostname when target is bare IP (SPN resolution requires hostname)"
  enumeration:
    - "--shares: list shares with READ/WRITE access flags (boolean)"
    - "--filter-shares READ,WRITE: filter --shares output to only the listed permissions (comma-separated)"
    - "--users [LIST]: enum domain users (boolean) or verify a userlist (value form)"
    - "--groups [NAME]: enum domain groups (boolean) or filter by name (value form, ldap protocol only in newer nxc)"
    - "--computers: enum domain computers"
    - "--loggedon-users: enum currently logged-on users"
    - "--smb-sessions: enum active SMB sessions"
    - "--rid-brute MAX: RID brute force user discovery (default max 4000)"
    - "--pass-pol: dump domain password policy (lockout threshold, min length)"
    - "--sam: dump local SAM hashes (requires admin, boolean)"
    - "--lsa: dump LSA secrets (requires admin, boolean)"
    - "--ntds METHOD: dump NTDS.dit. METHOD = drsuapi (default, DCSync) or vss (Volume Shadow Copy)"
    - "--dpapi: dump DPAPI master keys + credentials (requires admin)"
    - "--get-sid [SID]: get domain SID (boolean) or look up specific SID (value form)"
    - "--asreproast PATH: AS-REP roast — write $krb5asrep$ hashes to PATH (ldap protocol)"
    - "--kerberoasting PATH: Kerberoast — write $krb5tgs$ hashes to PATH (ldap protocol)"
    - "--bloodhound -c COLLECTION: BloodHound data collection. -c values: Default / All / DCOnly / Group / LocalAdmin / Session / Trusts / ObjectProps / ACL"
  execution:
    - "-x CMD: execute CMD (cmd.exe) command via SMB/WinRM/MSSQL/RDP/WMI"
    - "-X PSCMD: execute PowerShell command (same protocols)"
    - "--exec-method METHOD: SMB only — wmiexec (default) / atexec / smbexec / mmcexec. Each has different stealth/reliability tradeoffs"
    - "--dump-method METHOD: WinRM only — cmd or powershell for SAM/LSA dump"
    - "--obfs: PowerShell obfuscation (-X)"
    - "--amsi-bypass FILE: AMSI bypass file path"
  modules:
    - "-M MODULE: run a built-in module (e.g., -M spider_plus, -M lsassy, -M zerologon, -M nopac, -M masky, -M nanodump)"
    - "-o KEY=VALUE [KEY=VALUE ...]: module options, space-separated"
    - "--module-options: list options for the specified -M module (boolean)"
    - "-L: list all available modules for the current protocol"
  output:
    - "--log PATH: persistent text log to PATH (canonical: /session/<name>.log)"
    - "--json: JSON output to stdout (PER-OPERATION support — not universal; verify per protocol)"
  performance:
    - "--threads N: concurrent worker count (default 256). Drop for fragile targets / over-VPN"
    - "--timeout N: per-host timeout (default ~30s). Raise for slow targets"
    - "--jitter N: delay jitter between requests (anti-IDS)"
  spraying:
    - "--continue-on-success: KEEP SPRAYING after first hit (default: STOP). REQUIRED for password spray across many targets"
    - "--no-bruteforce: with -u file -p file, run ONE user-password pair per host (avoid cartesian product)"
    - "--gfail-limit N: stop globally after N failures (lockout protection)"
    - "--ufail-limit N: stop spraying a user after N failures"
    - "--hfail-limit N: stop spraying a host after N failures"

gotchas:
  - "Sub-protocol MUST be the FIRST positional after the binary. `netexec smb <target>` is correct; `netexec <target> smb` produces argparse errors. Misordering is the #1 cause of confusing CLI errors."
  - "Targets are the SECOND positional, not a -t / -tF / --target flag. CIDR is supported natively (10.10.10.0/24) — `allow_multi_target: true` permits CIDR through scope validation. Single IP, hostname, FQDN, IPv6 (bracketed), or multiple space-separated targets all work."
  - "Authentication combinations: -u + -p (password), -u + -H (pass-the-hash), -u + -k (Kerberos via ccache), --no-pass (null session). Mixing them confuses netexec. --local-auth and -d are mutually exclusive."
  - "-x runs ONE command via SMB/WinRM/MSSQL/RDP/WMI; -X is PowerShell-specific. -X with --obfs adds basic obfuscation. AMSI bypass needs --amsi-bypass + a bypass payload file."
  - "--continue-on-success is REQUIRED for password spray. Default is STOP at first [+]. Without it, a successful auth on host[1] in a /24 means hosts [2..254] are NEVER tested. Counter-intuitive but documented."
  - "When -p value is a file path (e.g., -p /session/output/wordlist.txt), netexec auto-detects file mode. If the file does NOT exist, the value is treated as a LITERAL password — leading to confusing failures. Always pre-verify the file path exists before running."
  - "Output to /session/ — use --log /session/output/netexec.log for persistent capture. Hash extraction (--kerberoasting / --asreproast) takes a PATH argument, not a boolean."
  - "NTDS dump methods: --ntds drsuapi (default, DCSync via DRSUAPI RPC) vs --ntds vss (Volume Shadow Copy). drsuapi requires DRSUAPI replication rights on the DC. vss requires local admin on the DC + reachable SMB. Try drsuapi first; fall back to vss on STATUS_NOT_SUPPORTED."
  - "Modules (-M): each has its own option set. Use `netexec <protocol> -L` to list available modules. `netexec <protocol> -M <name> --module-options` shows a module's options. Module options pass via -o KEY=VALUE [KEY=VALUE ...]."
  - "NetExec WinRM does NOT support Kerberos — only NTLM. If the target has NTLM disabled (STATUS_NOT_SUPPORTED on WinRM), switch to evil-winrm (which supports KRB5CCNAME). This is a netexec limitation, not a target misconfig."
  - "Older alias `nxc` may not be on PATH inside the container — the canonical binary is `netexec`. The Kali apt package installs `netexec`; `nxc` is provided only when installed via pip."
  - "The mcp-server.py per-protocol methods (smb/winrm/ldap/mssql/ssh/rdp/wmi) AUTO-INHERIT run_cli from BaseMCPServer (mcp-common 0.3.0) — kind:cli is the new default. Legacy method handlers preserved for rollback per SKILL #21."
  - "Feature 28 dynamic recipes (RECIPE_DIR=/session/tool_recipes/netexec) are RETIRED for the kind:cli path — the LLM writes argv directly. Recipes still load for legacy method calls if /session/tool_recipes/netexec/ exists, but they're a dead branch under run_cli."
  - "STATUS_NOT_SUPPORTED on SMB / LDAP / WinRM means NTLM is disabled domain-wide (common on hardened AD like HTB Hercules). Switch to Kerberos: impacket-getTGT to write a ccache, export KRB5CCNAME, then `-k --use-kcache`. ldap protocol can use simple_bind as a fallback."
  - "BloodHound output (-c COLLECTION) writes JSON files to /root/.nxc/logs/ inside the container — files are TRAPPED on container restart. Prefer the bloodhound MCP tool for proper /session/ output. If you must use nxc, follow up with `find /root/.nxc/logs -name '*.json' -exec cp {} /session/ \\;` via bash."
  - "RDP screenshots write to /root/.nxc/screenshots/ — same trap as BloodHound. Capture with --screenshot but copy to /session/ post-run."
  - "netexec exits with a NON-ZERO code on auth failure but ZERO on operation failure (e.g., admin-required op silently no-ops with auth [+] but no result). ALWAYS pattern-match output for failure_signatures regardless of exit code."
  - "netexec REQUIRES -p even for null/blank password. If you have no password, pass `-p ''` explicitly — omitting -p (without a hash, ccache, or --no-pass) yields argparse 'the following arguments are required'. This is true for every protocol that supports password auth (smb/ldap/mssql/winrm/rdp/wmi/ftp); ssh accepts --key-file in lieu of -p."
  - "Silent admin-required failure: when -x / -X / --sam / --lsa / --ntds / --dpapi / --kerberos-keys are requested but the user is NOT a local admin, netexec emits auth [+] (and possibly no (Pwn3d!) marker) followed by NO operation output and a zero exit code. Detect by checking that the requested admin op produced visible output AND that (Pwn3d!) appears on the auth line; otherwise treat as 'admin required'. Counter-intuitive — the [+] makes it look successful."
  - "`--kerberos-keys` requires `--ntds` as a parent flag — pass `--ntds drsuapi --kerberos-keys` together. netexec rejects `--kerberos-keys` standalone with an argparse error."
  - "Closed ports on mssql / ssh / rdp / winrm protocols can produce ZERO [+] / [-] markers (only [*] init banner) and zero exit code — distinct from `Connection refused`. If output has only [*] lines and no host markers, treat as a network-layer failure and verify the port with nmap."
  - "Kerberos config file: when using -k, netexec reads /etc/krb5.conf. The legacy mcp-server.py copied /session/output/config/krb5.conf → /etc/krb5.conf on demand. Under kind:cli there is no wrapper — if KRB5_CONFIG is unset and /etc/krb5.conf doesn't reflect the target realm, GSSAPI may fail with KDC_ERR_S_PRINCIPAL_UNKNOWN even with a valid ccache. Workaround: pre-stage the krb5.conf in the container image, or set KRB5_CONFIG=/session/output/config/krb5.conf via env."
  - "BloodHound / Kerberoasting / AS-REP roast operations are slow (5+ min on busy DCs). The default 120 s wrapper timeout was raised to 300 s in the legacy method handlers. With kind:cli the runner uses idle_timeout_seconds=600 and max_runtime_seconds=21600 — long quiet stretches are normal."

failure_signatures:
  # Layer-diverse signals (SKILL #11) — at least 7 distinct verifiable layers:
  #   1. DNS  2. TCP  3. SMB / NTLM  4. Kerberos (preauth + service)
  #   5. NTDS / DCERPC  6. argparse / argument validation  7. module loader
  - signal: "Could not resolve"
    remediation: "DNS resolution failed for the target hostname. Verify spelling, /etc/hosts inside container, or pass an IP literal. netexec exits with stderr containing the resolver error verbatim."
  - signal: "Name or service not known"
    remediation: "Same root cause as 'Could not resolve' — DNS failure. Use IP if DNS is unreliable in the test environment."
  - signal: "Connection refused"
    remediation: "TCP connection refused — the protocol port is closed on the target. Confirm with nmap (-p 445 SMB / 389 LDAP / 1433 MSSQL / 5985,5986 WinRM / 22 SSH / 3389 RDP). The host is reachable but the service is down or filtered."
  - signal: "Connection timed out"
    remediation: "TCP / RPC timeout — target slow or filtered. Verify the port is open with nmap; check VPN routing. Raise --timeout or drop --threads to reduce load."
  - signal: "NetBIOSTimeout"
    remediation: "NetBIOS session timed out (SMB-specific) — port 445 reachable but session negotiation hung. Verify SMB signing settings; some targets reject high concurrency. Drop --threads to 16 and retry."
  - signal: "STATUS_LOGON_FAILURE"
    remediation: "Wrong password / wrong username / wrong domain. Verify creds; check the -d / --local-auth selection. NTLM hash format: -H :NT (bare NT) or -H LM:NT (LM is usually empty)."
  - signal: "STATUS_ACCESS_DENIED"
    remediation: "Auth succeeded but access to the requested resource was denied (operation-level). For --shares: try a different share (C$/ADMIN$ require local admin). For --sam/--lsa: requires admin. For --ntds: requires DRSUAPI replication rights."
  - signal: "STATUS_ACCOUNT_LOCKED_OUT"
    remediation: "STOP spraying immediately. Account is locked — wait for the lockout duration to expire or use a different user. Check --pass-pol BEFORE spraying to know the lockout threshold."
  - signal: "STATUS_ACCOUNT_DISABLED"
    remediation: "Target account is disabled. Use a different (enabled) user."
  - signal: "STATUS_PASSWORD_EXPIRED"
    remediation: "Credential is valid but expired. Use smbpasswd or impacket-changepasswd to set a new password before further auth."
  - signal: "STATUS_NOT_SUPPORTED"
    remediation: "NTLM is disabled domain-wide (common on hardened AD targets like HTB Hercules). Switch to Kerberos: 1) impacket-getTGT to write a ccache, 2) export KRB5CCNAME=/session/<user>.ccache, 3) re-run with `-k --use-kcache`. WinRM via netexec CANNOT use Kerberos — use evil-winrm."
  - signal: "KDC_ERR_PREAUTH_FAILED"
    remediation: "Wrong password during Kerberos preauth (the Kerberos equivalent of STATUS_LOGON_FAILURE)."
  - signal: "KDC_ERR_C_PRINCIPAL_UNKNOWN"
    remediation: "User principal not found in Kerberos realm. Verify [domain/]user format and that the domain matches the realm name."
  - signal: "KDC_ERR_S_PRINCIPAL_UNKNOWN"
    remediation: "Service principal (SPN) not found. For Kerberos to a host, the SPN (cifs/host or http/host) must be registered. Pass --kdcHost <FQDN> when target is a bare IP."
  - signal: "KRB_AP_ERR_SKEW"
    remediation: "Clock skew >5min between attacker and DC. Sync host clock (chronyc sources). The kind:cli image has libfaketime baked in via entrypoint — set FAKETIME env from clock_offset detection."
  - signal: "rpc_s_access_denied"
    remediation: "RPC permission denied (lower-level form of STATUS_ACCESS_DENIED). Common on --ntds when user lacks 'Replicating Directory Changes' rights. Try with a Domain Admin or escalate."
  - signal: "ERROR_DS_DRA_BAD_DN"
    remediation: "DCSync (--ntds drsuapi) replication request rejected. User lacks DRSUAPI rights. Try --ntds vss as fallback (requires local admin on DC), or a different user."
  - signal: "DCERPC Runtime Error"
    remediation: "Generic RPC error — read the next line for the specific code. 0x5 = access denied; 0x16c9a087 = endpoint not registered. Some endpoints require packet privacy."
  - signal: "Dumped 0 NTDS"
    remediation: "NTDS dump operation ran but produced zero entries — user likely lacks DRSUAPI rights. Same diagnostic as ERROR_DS_DRA_BAD_DN but silent. Try a Domain Admin user."
  - signal: "Dumped 0 LSA"
    remediation: "LSA dump ran but produced nothing — user lacks local admin on the target. Verify with --shares — admin sees C$/ADMIN$ as READ,WRITE. (Pwn3d!) marker confirms admin."
  - signal: "Dumped 0 SAM"
    remediation: "SAM dump ran but produced nothing — same as Dumped 0 LSA. User lacks local admin."
  - signal: "error: unrecognized arguments"
    remediation: "argparse rejected an unknown flag. Verify the flag exists for the SPECIFIC protocol (`netexec <protocol> --help`) — many flags are protocol-specific. Common: --kerberoasting only works on `ldap`, --shares only on `smb` and similar."
  - signal: "the following arguments are required"
    remediation: "Missing required arg — usually -u (username). Even null sessions require -u '' explicitly."
  - signal: "invalid choice"
    remediation: "argparse rejected an invalid value for a choice flag. Read 'choose from <values>' to see the allowed options. Common: --ntds requires drsuapi or vss; --exec-method requires wmiexec/atexec/smbexec/mmcexec."
  - signal: "Module .* failed"
    remediation: "Module execution error. Read the next line for the cause (target offline, missing prerequisites, module incompatibility). Use `netexec <protocol> -L` to list available modules; some modules are protocol-specific."
  - signal: "Could not run module"
    remediation: "Module loader could not load the requested -M module. Verify the module name with `netexec <protocol> -L`. Module names are case-sensitive."
  - signal: "successful bind must be completed"
    remediation: "LDAP requires valid credentials before search. Auth is unauthenticated or invalid — verify -u / -p / -H, or try --simple-bind for plaintext binds over LDAPS (port 636)."
  - signal: "PyAsn1Error"
    remediation: "netexec's pyasn1/impacket library cannot decode the DC's LDAP response — library compat issue, not auth failure. Try impacket-ldapsearch with -no-signing/-debug, or use ldap protocol with --simple-bind."
  - signal: "BER length field"
    remediation: "Same root as PyAsn1Error — pyasn1 BER decode error. Library compat issue with the target DC's LDAP response."
  - signal: "Exception while calling proto_flow"
    remediation: "netexec internal protocol module crash — usually impacket compat issue. Try a different protocol (e.g., smb instead of ldap for user enum), or update the netexec image."
  - signal: "nxc winrm only support NTLM"
    remediation: "NetExec WinRM does NOT support Kerberos — only NTLM. If the target has NTLM disabled (STATUS_NOT_SUPPORTED), switch to evil-winrm (which supports Kerberos via KRB5CCNAME). This is a hard netexec limitation — do not retry."
  - signal: "Invalid NTLM challenge received from server"
    remediation: "Same root as 'nxc winrm only support NTLM' — server rejected NTLM at the WinRM layer. Switch to evil-winrm or run nxc against SMB instead if the operation supports it."
  - signal: "[REMOVED] Arg moved to"
    remediation: "Flag moved between protocols in newer netexec versions. Read the suggestion line — call the indicated protocol instead (commonly: --groups <name> filter moved from smb to ldap)."
  - signal: "searchRequest -> operationsError"
    remediation: "LDAP bind succeeded but the DC rejected the search — usually LDAP signing / channel binding enforcement. Try simple_bind=false, or switch to LDAPS (port 636 with --simple-bind), or use impacket-ldapsearch with -no-signing/-debug to see the exact DC rejection reason."
  - signal: "operationsError: 000004DC"
    remediation: "Same root as 'searchRequest -> operationsError' — DC requires LDAP signing or channel binding. Switch to LDAPS or use a different LDAP client."
  - signal: "STATUS_PASSWORD_MUST_CHANGE"
    remediation: "Credential is valid but the account has been flagged for forced password change at next logon. Same posture as STATUS_PASSWORD_EXPIRED — change the password via smbpasswd / impacket-changepasswd before further auth."

help_commands:
  - command: "netexec --help"
    purpose: "Top-level help — lists protocols and global flags"
  - command: "netexec -h"
    purpose: "Short alias for --help"
  - command: "netexec smb --help"
    purpose: "SMB protocol flag reference (--shares, --sam, --lsa, --ntds, -x, -X, etc.)"
  - command: "netexec ldap --help"
    purpose: "LDAP protocol flag reference (--users, --kerberoasting, --asreproast, --bloodhound, etc.)"
  - command: "netexec mssql --help"
    purpose: "MSSQL protocol flag reference (-q, -x, --rid-brute, --put-file, etc.)"
  - command: "netexec winrm --help"
    purpose: "WinRM protocol flag reference (-x, -X, --sam, --lsa, --dpapi)"
  - command: "netexec ssh --help"
    purpose: "SSH protocol flag reference (--key-file, -x, --sudo-check)"
  - command: "netexec rdp --help"
    purpose: "RDP protocol flag reference (-x, --screenshot, --nla-screenshot)"
  - command: "netexec wmi --help"
    purpose: "WMI protocol flag reference (-x, -X, --wmi, --exec-method)"
  - command: "netexec smb -L"
    purpose: "List all SMB modules (lsassy, spider_plus, zerologon, nopac, masky, nanodump, ...)"
  - command: "netexec ldap -L"
    purpose: "List all LDAP modules"

