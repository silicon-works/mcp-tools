name: playwright-mcp
kind: mcp
version: "0.0.75"
description: "Browser automation via Microsoft's official @playwright/mcp npm package (v0.0.75) running as a vendor MCP container with VNC stack for human-in-the-loop CAPTCHA solving. 44 tools across 11 categories: navigation, accessibility snapshots, screenshots, form interaction, vision-mode (coordinate-based mouse for CAPTCHAs), verify primitives, JS evaluation, multi-tab, tracing, video recording, PDF generation. Chrome headless by default (chrome-headless-shell, VPN-compatible); HEADED=1 env switches to full Chrome rendered on Xvfb display :99 with noVNC at http://localhost:6080/vnc.html for human interaction. The container speaks MCP-over-stdio natively — no bridge needed (unlike ZAP)."
source: https://github.com/microsoft/playwright-mcp
image: "ghcr.io/silicon-works/mcp-tools-playwright:latest"
image_size_mb: 1550
timeout_seconds: 600
idle_timeout_seconds: 1800

service: true
service_name: "playwright"

capabilities:
  - browser_automation
  - javascript_rendering
  - form_filling
  - accessibility_snapshot
  - screenshot_capture
  - video_recording
  - pdf_generation
  - vision_mode_xy_clicks
  - request_response_capture
  - human_in_the_loop_vnc

phases:
  - enumeration
  - exploitation
  - post-exploitation

requirements:
  network: true
  privileged: false

resources:
  memory_mb: 2048
  cpu: 2.0

see_also:
  - tool: curl
    reason: "For simple API calls, file downloads, exploit payload delivery — anything that doesn't need JS rendering. Playwright is heavy; use it only when curl returns empty bodies, when the page is JS-rendered, or when you need to drive a form interactively."
  - tool: zap
    reason: "Combine for JS-heavy security testing: configure Playwright to proxy through ZAP (PLAYWRIGHT_MCP_PROXY_SERVER=http://127.0.0.1:8080), drive the user flow with Playwright, ZAP records all traffic + runs passive/active analysis on captured URLs."
  - tool: ffuf
    reason: "Content discovery for hidden routes Playwright's spider/crawl wouldn't find (Playwright follows links the page exposes; ffuf brute-forces what isn't linked)."
  - tool: nuclei
    reason: "Independent vuln scanner — once Playwright proves a path is reachable, nuclei templates can validate specific CVEs against it."

warnings:
  - "browser_run_code_unsafe runs in a sandboxed Node-side eval context with the Playwright `page` object exposed. Verified live 2026-05-08: globalThis = {page, __end__, __fn__}; require/process/fs/child_process are ALL undefined. The risk is NOT generic Node RCE — it's full Playwright API access (page.context().request can fetch arbitrary URLs, read/clear cookies, drive any tab). Roughly equivalent to giving the agent unrestricted browser_navigate+browser_evaluate+page.context().request in one shot. Use browser_evaluate for simple in-page JS; reserve run_code_unsafe for chained Playwright operations or context-level work."
  - "Vision mode (browser_mouse_*_xy) operates in raw screen coordinates with no element-tree awareness. A miscalibrated click hits whatever pixel is at that coordinate — including 'destructive' UI like delete buttons or logout links. Always preview with browser_take_screenshot first when working with vision mode."
  - "Active browser sessions hold real socket connections to the target. A wedged page (infinite redirect, stuck on a CAPTCHA wall, JS exception) can leak connections and consume the container's per-page memory budget. Use browser_close + browser_navigate to fresh-start, not browser_resume, when you suspect state corruption."

notes: |
  Architecture: vendor MCP runs natively. The Microsoft @playwright/mcp
  npm package speaks MCP-over-stdio directly, so unlike ZAP (where we
  run a stdio↔HTTP bridge) the container's entrypoint just
  `exec npx @playwright/mcp --config ... --caps=...` and ContainerManager
  talks to it on stdin/stdout. No bridge, no HTTP, no auth key.

  Two browser modes via env:
    HEADED=0 (default) — chrome-headless-shell binary. VPN-compatible
                         (works against tun0 IPs). Faster startup. Used
                         for 99% of agent flows.
    HEADED=1            — full Chrome binary on Xvfb :99. Renders to a
                         virtual display reachable via VNC at
                         http://localhost:6080/vnc.html. Used when an
                         operator needs to manually solve a CAPTCHA or
                         click through anti-automation walls. Requires
                         the socat-based VPN workaround (see entrypoint.sh)
                         when targeting HTB tun0 IPs because the full
                         Chrome binary cannot reach tun0 directly
                         (ERR_ADDRESS_UNREACHABLE).

  VNC stack always starts (Xvfb + x11vnc + websockify on port 6080)
  even in headless mode — only useful in HEADED=1 but cheap to leave
  running and keeps the entrypoint single-codepath.

  Caps in v0.0.75:
    vision   — browser_mouse_*_xy primitives
    pdf      — browser_pdf_save
    devtools — browser_run_code_unsafe (raw Node-side JS, RCE-equivalent)
    testing  — browser_verify_*, browser_generate_locator (NOT in --help
               output; looks retired but runtime still honors it)
  Tracing + video + annotation tools are now default-enabled (no cap
  flag needed in v0.0.75).

  Cold start: ~10-15s (Node + Chromium spawn, no JVM). Much faster
  than ZAP. Suitable for ephemeral or service mode; we run service.

  Migration history: NO Python wrapper to retire — playwright-mcp has
  always been a thin vendor wrapper around upstream's npm package. This
  May 2026 round added the standardization layer (failure_signatures,
  usage_patterns, gotchas, scenarios.md, smoke test, kind:mcp explicit,
  idle_timeout_seconds) that was missing.

routing:
  use_for:
    - "drive a login form (fill username + password + click submit)"
    - "navigate a JavaScript-rendered SPA where curl returns an empty body"
    - "see what is rendered on a page (accessibility snapshot, not raw HTML)"
    - "screenshot a page or specific element for evidence / report"
    - "validate XSS / CSRF payload execution (fire payload, observe console + network)"
    - "capture cookies / session tokens after authenticating to a web app"
    - "solve a CAPTCHA via VNC handoff (HEADED=1, operator clicks via http://localhost:6080)"
    - "click on coordinate-based CAPTCHAs (image grids, sliders) via vision-mode mouse_xy primitives"
    - "record a video of an exploitation flow for the engagement report"
    - "save a page as PDF for offline analysis"
    - "drive multi-tab / multi-popup flows (OAuth, payment redirects, etc.)"
    - "generate Playwright locator strings to reuse in custom test scripts"
  never_use_for:
    - task: "simple API request"
      use_instead: "curl"
      reason: "Heavy. Cold start ~15s + memory cost vs curl's instant. Only use when JS rendering is actually needed."
    - task: "file download from a known URL"
      use_instead: "curl"
    - task: "directory / route brute-force"
      use_instead: "ffuf"
    - task: "credential brute-force"
      use_instead: "hydra"
    - task: "vulnerability scanning"
      use_instead: "zap"
      reason: "ZAP has dedicated scan rules + alert engine. Playwright is for driving the UI, not scanning."
    - task: "exploit payload delivery / running shellcode"
      use_instead: "exploit-runner"
  triggers:
    - playwright
    - 'login form'
    - 'fill login'
    - 'web form'
    - 'javascript rendered'
    - 'JS-rendered'
    - 'browser automation'
    - 'headless browser'
    - screenshot
    - 'empty body'
    - 'page returns empty'
    - captcha
    - CAPTCHA
    - reCAPTCHA
    - 'image grid captcha'
    - 'slider captcha'
    - 'click captcha'
    - 'XSS validation'
    - 'XSS payload'
    - 'session cookie capture'
    - 'OAuth redirect'
    - 'payment flow'
    - SPA
    - 'single-page app'
  prefer_over: []

# ---------------------------------------------------------------------------
# Methods — 44 total, validated against @playwright/mcp v0.0.75 on 2026-05-08.
# ---------------------------------------------------------------------------
methods:

  # ── Navigation ──────────────────────────────────────────────────────
  browser_navigate:
    description: "Navigate the active page to a URL. Waits for the page's load event by default."
    when_to_use: "First step on most flows. Mental model: navigate → snapshot → interact."
    params:
      url: { type: string, required: true, description: "Target URL e.g. http://10.10.10.5/" }

  browser_navigate_back:
    description: "Navigate back in the history (browser back button)."
    when_to_use: "Multi-step flows where you need to return to a prior page after capturing state."
    params: {}

  browser_close:
    description: "Close the active page. Browser process keeps running; this only ends the current page tab."
    when_to_use: "End-of-flow cleanup, or when a page is wedged and you want to fresh-start (close + new navigate)."
    params: {}

  # ── Accessibility snapshot + screenshots ────────────────────────────
  browser_snapshot:
    description: "Capture an accessibility snapshot — a structured tree of the page's interactive elements with refs the agent uses for click/type/hover. Better than raw HTML for understanding what's on a page."
    when_to_use: "Before any interaction tool (click/type/hover/etc.) to get current refs. Refs are page-bound; navigate invalidates them."
    params:
      target: { type: string, description: "Optional: limit snapshot to a sub-tree by ref" }
      filename: { type: string, description: "Save snapshot to this file inside container (use /session/output/<name>.txt — platform convention; entrypoint pre-creates the dir)" }
      depth: { type: integer, description: "Snapshot depth limit (default unlimited)" }
      boxes: { type: boolean, description: "Include layout box positions" }

  browser_take_screenshot:
    description: "Capture a visual screenshot of the page or a specific element. Returns image content inline (base64) by default; pass filename to save instead."
    when_to_use: "Evidence capture for reports. For making decisions about what's on the page, prefer browser_snapshot — it's structured and lets you click by ref."
    params:
      type: { type: string, required: true, description: "Image format: 'png' or 'jpeg'" }
      element: { type: string, description: "Element description (used for permission prompt)" }
      target: { type: string, description: "Element ref from browser_snapshot to screenshot just that element" }
      filename: { type: string, description: "Save to this file inside container (use /session/output/<name>.png — platform convention; entrypoint pre-creates the dir)" }
      fullPage: { type: boolean, description: "Capture full scrollable page (default: viewport only)" }

  browser_pdf_save:
    description: "Render the current page as PDF (pdf cap)."
    when_to_use: "Evidence / reporting. PDF preserves printable layout; for screenshot of viewport prefer take_screenshot."
    params:
      filename: { type: string, description: "Output PDF path inside container (use /session/output/<name>.pdf — platform convention; entrypoint pre-creates the dir)" }

  # ── Console + network capture ───────────────────────────────────────
  browser_console_messages:
    description: "Return console messages observed since the last call (or page load)."
    when_to_use: "Validating payload execution (XSS popped an alert, exploit logged), debugging why a flow failed."
    params:
      level: { type: string, required: true, description: "Filter level — must be one of 'error', 'warning', 'info', 'debug' (NOT 'log' or 'all' as older docs claim — verified live 2026-05-08)" }
      all: { type: boolean, description: "Include all collected messages (not just since last call)" }
      filename: { type: string, description: "Dump messages to file (use /session/output/<name>.log — platform convention; entrypoint pre-creates the dir)" }

  browser_network_requests:
    description: "Return a numbered list of network requests since page load. Use the index with browser_network_request to fetch full headers + body."
    when_to_use: "Discovering API endpoints, OAuth redirects, hidden XHR routes after a UI action."
    params:
      static: { type: boolean, required: true, description: "true = include static assets (.js/.css/.png); false = filter to XHR/fetch/document only" }
      filter: { type: string, description: "Optional URL substring filter" }
      filename: { type: string, description: "Dump list to file" }

  browser_network_request:
    description: "Get full details (headers + body) of one specific request by index from browser_network_requests."
    when_to_use: "After listing requests, drill into the interesting one (auth POST, API response with secrets, etc.)."
    params:
      index: { type: integer, required: true, description: "Index from browser_network_requests" }
      part: { type: string, description: "Optional: 'request' or 'response' for just that side" }
      filename: { type: string, description: "Dump to file (request bodies can be large)" }

  # ── Element interaction ─────────────────────────────────────────────
  browser_click:
    description: "Click an element using a ref from a prior browser_snapshot."
    when_to_use: "Triggering links, buttons, checkboxes, radios. Always snapshot first."
    params:
      target: { type: string, required: true, description: "Element ref from browser_snapshot" }
      element: { type: string, description: "Human description for permission prompt" }
      doubleClick: { type: boolean, description: "Double-click instead of single" }
      button: { type: string, description: "'left' | 'middle' | 'right' (default left)" }
      modifiers: { type: array, description: "Modifier keys held during click ('Shift', 'Control', 'Meta', 'Alt')" }

  browser_type:
    description: "Type text into an editable element (input, textarea, contenteditable)."
    when_to_use: "Filling form fields. For multi-field forms in one shot, prefer browser_fill_form."
    params:
      target: { type: string, required: true, description: "Element ref" }
      text: { type: string, required: true, description: "Text to type" }
      element: { type: string, description: "Human description for permission prompt" }
      submit: { type: boolean, description: "Press Enter after typing" }
      slowly: { type: boolean, description: "Type character-by-character (triggers JS keyhandlers; required for some anti-automation forms)" }

  browser_fill_form:
    description: "Fill multiple form fields atomically. Faster + more reliable than sequential browser_type for full forms."
    when_to_use: "Login forms, registration, multi-field payloads."
    params:
      fields:
        type: array
        required: true
        description: "Array of {name, type, target, value}. type ∈ {textbox, checkbox, radio, combobox, slider}. NOTE: the field key is `target` NOT `ref` (drift from older docs — verified live 2026-05-08; passing `ref` returns 'expected string, received undefined at fields.0.target')."

  browser_press_key:
    description: "Press a single keyboard key (Enter, Tab, Escape, Arrow keys, F-keys, etc.)."
    when_to_use: "Triggering keyboard shortcuts the page expects, navigating dropdowns, dismissing dialogs without a ref."
    params:
      key: { type: string, required: true, description: "Key name e.g. 'Enter', 'Escape', 'ArrowDown', 'F12'" }

  browser_hover:
    description: "Hover the mouse over an element. Reveals tooltips, dropdown menus, hover-only UI."
    when_to_use: "Multi-level menus, contextual UI that only appears on hover, JS that fires on mouseenter."
    params:
      target: { type: string, required: true }
      element: { type: string, description: "Human description for permission" }

  browser_select_option:
    description: "Select an option from a dropdown / select element."
    when_to_use: "<select> elements where browser_click on the option doesn't work reliably."
    params:
      target: { type: string, required: true, description: "Select element ref" }
      values: { type: array, required: true, description: "Array of option values to select (multi-select supported)" }
      element: { type: string, description: "Human description" }

  browser_handle_dialog:
    description: "Accept or dismiss a JavaScript dialog (alert, confirm, prompt) that the page raised."
    when_to_use: "When a click triggers a confirm/prompt and you need to accept it to proceed."
    params:
      accept: { type: boolean, required: true, description: "true = OK / Accept, false = Cancel / Dismiss" }
      promptText: { type: string, description: "For prompt() dialogs, the text to enter" }

  browser_file_upload:
    description: "Upload one or more files to a file input. Doesn't require a click on the file input — file is attached programmatically."
    when_to_use: "File-upload exploits (path traversal, SSRF via SVG, malicious docx, etc.). Pre-stage the file in /session/output/ first (platform convention)."
    params:
      paths: { type: array, description: "Array of file paths inside the container to upload" }

  browser_drag:
    description: "Drag from one element to another (HTML5 drag-and-drop API)."
    when_to_use: "Drag-to-reorder UI, file-drop zones (use browser_drop for direct file paths instead), slider knobs."
    params:
      startTarget: { type: string, required: true, description: "Drag-source ref" }
      endTarget: { type: string, required: true, description: "Drop-target ref" }
      startElement: { type: string, description: "Human description for source" }
      endElement: { type: string, description: "Human description for target" }

  browser_drop:
    description: "Drop file paths or MIME-typed data onto an element, simulating a drag from outside the page."
    when_to_use: "File-drop zones (drag-from-OS UX). Pass paths to upload local files, or data to inject MIME blobs."
    params:
      target: { type: string, required: true, description: "Element ref to drop onto" }
      paths: { type: array, description: "File paths inside container to drop (use this OR data)" }
      data: { type: object, description: "Map of mime-type → string content to drop as DataTransfer items" }
      element: { type: string, description: "Human description" }

  # ── Vision mode (coordinate-based mouse, vision cap) ────────────────
  browser_mouse_click_xy:
    description: "Click at raw screen coordinates. NO element-tree awareness — clicks whatever pixel is at (x,y)."
    when_to_use: "CAPTCHA image grids, canvas-based UI, click-through walls. Always browser_take_screenshot first to compute coords."
    params:
      x: { type: integer, required: true }
      y: { type: integer, required: true }
      button: { type: string, description: "left | middle | right" }
      clickCount: { type: integer, description: "1 (single), 2 (double), 3 (triple)" }
      delay: { type: integer, description: "Delay in ms between mousedown and mouseup" }

  browser_mouse_move_xy:
    description: "Move the mouse cursor to (x,y) without clicking."
    when_to_use: "Hover-on-canvas UI, drawing curves (combine with mouse_down + multiple mouse_move + mouse_up)."
    params:
      x: { type: integer, required: true }
      y: { type: integer, required: true }

  browser_mouse_drag_xy:
    description: "Drag (mouse-down at start, move to end, mouse-up) using raw coords."
    when_to_use: "Slider CAPTCHAs, canvas drawing, custom drag UIs."
    params:
      startX: { type: integer, required: true }
      startY: { type: integer, required: true }
      endX: { type: integer, required: true }
      endY: { type: integer, required: true }

  browser_mouse_down:
    description: "Press mouse button (without releasing). Pair with mouse_move_xy + mouse_up for custom drag patterns."
    when_to_use: "Click-and-hold gestures, selection drawing, multi-step drag flows."
    params:
      button: { type: string, description: "left | middle | right (default left)" }

  browser_mouse_up:
    description: "Release the previously pressed mouse button."
    when_to_use: "Pair with mouse_down for custom gestures."
    params:
      button: { type: string, description: "left | middle | right (default left)" }

  browser_mouse_wheel:
    description: "Scroll the mouse wheel by deltaX / deltaY pixels."
    when_to_use: "Triggering infinite-scroll, lazy-loaded content, zoom-by-wheel."
    params:
      deltaX: { type: integer, required: true, description: "Horizontal scroll delta in pixels" }
      deltaY: { type: integer, required: true, description: "Vertical scroll delta in pixels (positive = scroll down)" }

  # ── Window controls + waits ─────────────────────────────────────────
  browser_resize:
    description: "Resize the browser window to specific pixel dimensions."
    when_to_use: "Triggering responsive breakpoints (mobile vs desktop), testing layouts at specific viewports."
    params:
      width: { type: integer, required: true }
      height: { type: integer, required: true }

  browser_wait_for:
    description: "Wait for text to appear / disappear on the page, or for a specific time."
    when_to_use: "After triggering an async action, before snapshotting / asserting. More reliable than fixed sleeps."
    params:
      time: { type: number, description: "Seconds to wait unconditionally" }
      text: { type: string, description: "Wait until this text appears" }
      textGone: { type: string, description: "Wait until this text disappears" }

  browser_resume:
    description: "Resume execution after a pause (used with debugger control flow)."
    when_to_use: "Advanced — not needed for typical agent flows. Mostly for manual debugging via the dashboard."
    params:
      step: { type: boolean, description: "If true, pause again before the next instruction" }
      location: { type: string, description: "Pause point identifier" }

  # ── Verify primitives (testing cap) ─────────────────────────────────
  browser_verify_element_visible:
    description: "Assert an element with given role + accessible name is visible. Returns success/failure."
    when_to_use: "After an interaction, confirm the expected UI appeared (e.g. a success banner, the correct page heading)."
    params:
      role: { type: string, required: true, description: "ARIA role e.g. 'button', 'heading', 'link'" }
      accessibleName: { type: string, required: true, description: "Accessible name (text content for buttons/links/headings)" }

  browser_verify_list_visible:
    description: "Assert that a list (ul/ol/role=list) contains the expected items in order."
    when_to_use: "Verifying search results, navigation menus, dropdown contents."
    params:
      element: { type: string, required: true, description: "Human description of the list" }
      target: { type: string, required: true, description: "Element ref of the list container" }
      items: { type: array, required: true, description: "Expected items in order" }

  browser_verify_text_visible:
    description: "Assert text is somewhere on the page. Prefer verify_element_visible if you know the role."
    when_to_use: "Quick text-presence check when you don't have a specific element in mind."
    params:
      text: { type: string, required: true, description: "Text to find" }

  browser_verify_value:
    description: "Assert an input/select/checkbox has a specific value or state."
    when_to_use: "Verifying form pre-fill, persisted state, post-submit values."
    params:
      type: { type: string, required: true, description: "Input type ('textbox', 'checkbox', 'select', etc.)" }
      element: { type: string, required: true, description: "Human description" }
      target: { type: string, required: true, description: "Element ref" }
      value: { type: string, required: true, description: "Expected value (or 'true'/'false' for checkbox)" }

  # ── JS evaluation ───────────────────────────────────────────────────
  browser_evaluate:
    description: "Run a JavaScript function inside the PAGE context. Has access to the DOM, page-side globals, the document object."
    when_to_use: "Reading page-state JS doesn't expose via the accessibility tree (deep object inspection, computed values, custom data attributes)."
    params:
      function: { type: string, required: true, description: "JS function source e.g. '() => document.title'" }
      element: { type: string, description: "Optional element ref — function gets it as argument" }
      target: { type: string, description: "Same — element ref alias" }
      filename: { type: string, description: "Dump return value to file" }

  browser_run_code_unsafe:
    description: "RCE-EQUIVALENT — runs a Playwright function in the SERVER process (Node, not the page) with the `page` object exposed. Has access to whatever the Playwright Node runtime can do (filesystem, env, subprocess, full Playwright API). Devtools cap."
    when_to_use: "ONLY when you need Playwright Node-side API access the standard tools don't expose (advanced trace manipulation, custom timeouts, multi-context juggling). 99% of the time browser_evaluate is what you actually want — it runs in the page context with `document`/`window` available."
    params:
      code: { type: string, description: "MUST be a function expression. Receives the Playwright `page` as first arg. Examples: '(page) => page.title()'; 'async (page) => { const t = await page.title(); return { title: t, url: page.url() }; }'. Bare expressions like '1+1' or 'document.title' fail with TypeError or ReferenceError — verified live 2026-05-08." }
      filename: { type: string, description: "Optional file path with the function expression instead of inline `code`" }

  # ── Multi-tab ───────────────────────────────────────────────────────
  browser_tabs:
    description: "List, create, close, or select tabs. Single tool with action verb argument."
    when_to_use: "OAuth flows that pop up a new tab, multi-window comparisons, isolating sessions per-tab."
    params:
      action: { type: string, required: true, description: "'list' | 'new' | 'close' | 'select'" }
      index: { type: integer, description: "Tab index for close/select actions" }
      url: { type: string, description: "URL for 'new' action" }

  # ── Tracing (default-enabled in v0.0.75) ────────────────────────────
  browser_start_tracing:
    description: "Start a Playwright trace (DOM snapshots + actions + network) saved as .zip."
    when_to_use: "Before a flow you might need to debug later. Trace can be opened in Playwright Trace Viewer post-hoc."
    params: {}

  browser_stop_tracing:
    description: "Stop tracing and save the .zip artifact."
    when_to_use: "After the flow completes, save evidence."
    params: {}

  # ── Video recording ─────────────────────────────────────────────────
  browser_start_video:
    description: "Start recording a video of the browser viewport."
    when_to_use: "Reproducing a complex flow for the engagement report, demonstrating an exploit chain."
    params:
      filename: { type: string, description: "Output video path inside container" }
      size: { type: string, description: "Video resolution e.g. '1920x1080'" }

  browser_stop_video:
    description: "Stop video recording and save the file."
    when_to_use: "End of a recorded flow."
    params: {}

  browser_video_chapter:
    description: "Add a chapter card to the video — full-screen overlay with title + optional description, useful for narrating exploit demos."
    when_to_use: "Marking phases in a recorded engagement walkthrough ('Reconnaissance', 'Exploitation', 'Post-Ex')."
    params:
      title: { type: string, required: true }
      description: { type: string, description: "Sub-text under the title" }
      duration: { type: number, description: "Seconds the chapter card stays visible" }

  # ── Highlight + locator generation (testing cap) ────────────────────
  browser_highlight:
    description: "Add a persistent visual highlight overlay around an element. Useful in headed mode + VNC for showing the operator what the agent is looking at."
    when_to_use: "Headed-mode flows where the human operator needs to see what the agent has identified before approving an action."
    params:
      target: { type: string, required: true, description: "Element ref to highlight" }
      element: { type: string, description: "Human description" }
      style: { type: string, description: "Optional CSS for the overlay" }

  browser_hide_highlight:
    description: "Remove a highlight overlay previously added."
    when_to_use: "Cleanup after a highlight session."
    params:
      target: { type: string, description: "Element ref (or omit to clear all highlights)" }
      element: { type: string, description: "Human description" }

  browser_annotate:
    description: "Open the Playwright Dashboard in annotation mode and wait for the user to draw annotations. Returns when user finishes."
    when_to_use: "Operator-in-the-loop UI labeling, building training data for a vision model, manual QA marking."
    params: {}

  browser_generate_locator:
    description: "Generate a Playwright locator string for an element (e.g. for use in a hand-written test script after the engagement)."
    when_to_use: "Exporting agent-discovered selectors into a deliverable test suite."
    params:
      target: { type: string, required: true, description: "Element ref" }
      element: { type: string, description: "Human description" }


# ---------------------------------------------------------------------------
# Failure signatures (substrings empirically observed in upstream alpha)
# ---------------------------------------------------------------------------
failure_signatures:
  - signal: "TimeoutError"
    error_class: tool_misconfigured
    remediation: "Default Playwright action timeout is 30s. If a wait_for / type / click times out, the page is wedged or the ref no longer points at a reachable element. Try browser_snapshot to get fresh refs, or browser_close + browser_navigate to reset."
  - signal: "expected ref"
    error_class: invalid_parameter
    remediation: "The 'target' arg must be a ref string from a prior browser_snapshot call. Refs are POSITION-based across snapshots, not identity-based — a stale ref from a prior page does NOT error, it silently routes to whatever element occupies that position in the current snapshot tree (verified live 2026-05-08). Always re-snapshot after any navigation before issuing click/type/fill_form."
  - signal: "ERR_ADDRESS_UNREACHABLE"
    error_class: network
    remediation: "Chromium can't reach the target IP. Most common cause: HEADED=1 mode against a tun0/VPN target without the socat workaround (full Chrome binary cannot reach tun0; chrome-headless-shell can). Switch to HEADED=0 OR set VPN_TARGET + VPN_HOSTNAME env to enable the socat proxy in entrypoint.sh."
  - signal: "ERR_NAME_NOT_RESOLVED"
    error_class: network
    remediation: "DNS lookup failed. For raw HTB IPs use http://10.x.x.x/ directly. For hostname-based vhosts (cozyhosting.htb), pass --add-host=host:ip in the docker run flags AND use the hostname URL in browser_navigate."
  - signal: "Permission denied to access property"
    error_class: invalid_parameter
    remediation: "Cross-origin frame access. The page navigated to a different origin and the iframe / popup is sandboxed. Use browser_tabs new + select to switch contexts instead of trying to evaluate across origins."
  - signal: "frame was detached"
    error_class: tool_misconfigured
    remediation: "The frame the ref pointed at is gone (navigation, parent frame removal). Re-snapshot to get fresh refs."
  - signal: "Page closed"
    error_class: session_lost
    remediation: "browser_close was called or the page crashed. Open a fresh page with browser_tabs action=new."
  - signal: "Ref"
    error_class: invalid_parameter
    remediation: "Live shape: 'Ref e9999 not found in the current page snapshot. Try capturing new snapshot.' — bogus ref. Run browser_snapshot to get current refs."
  - signal: "outside allowed roots"
    error_class: tool_misconfigured
    remediation: "Live shape: 'File access denied: <path> is outside allowed roots. Allowed roots: /tmp/.playwright-mcp, /'. Resolution: this image's entrypoint.sh already passes --allow-unrestricted-file-access — if you still see this, the image was built without the flag. The platform-wide convention for tool outputs is /session/output/<name>.<ext>; this image's entrypoint pre-creates that dir at container start. For deeper subdirs (e.g. /session/output/traces/foo/), `mkdir -p` first via a separate run_cli call (page.pdf / page.screenshot do NOT auto-create parent dirs)."
  - signal: "expected string, received undefined at fields"
    error_class: invalid_parameter
    remediation: "browser_fill_form schema strict-validates field entries. The key is `target` (NOT `ref` as older docs say). Use {name, type, target, value} per field."

# ---------------------------------------------------------------------------
# Gotchas
# ---------------------------------------------------------------------------
gotchas:
  - "Refs are POSITION-based across snapshots, not identity-based. Verified live 2026-05-08: navigated from /login (where e17 = Username textbox) to / (homepage), then called browser_click target=e17. Playwright did NOT error — it silently clicked whatever element was at the e17 position in the new snapshot tree (a generic div, ran `await page.locator('div').nth(2).click()`). ALWAYS browser_snapshot first after any navigation; reusing a stale ref does NOT fail safely, it executes a wrong action."
  - "44 tools, organized via --caps: vision (mouse_*_xy, 3 tools), pdf (pdf_save), devtools (run_code_unsafe, RCE-equivalent), testing (verify_*, generate_locator, 5 tools, undocumented but still works in v0.0.75). The entrypoint enables all four caps."
  - "browser_evaluate runs in the PAGE context (DOM available). browser_run_code_unsafe runs in the SERVER context (Node, filesystem + env access — RCE territory). Use browser_evaluate by default; only use run_code_unsafe when you need Playwright API access."
  - "Headless (default) uses chrome-headless-shell which IS VPN/tun0-compatible. Headed (HEADED=1) uses full Chrome which CANNOT reach tun0 directly — needs the socat-based VPN_TARGET+VPN_HOSTNAME workaround in entrypoint.sh. This is a real HTB engagement gotcha; chrome-headless-shell is the right choice unless an operator needs to see the page via VNC."
  - "Vision mode (browser_mouse_*_xy) operates in raw screen coordinates — no element awareness. Always browser_take_screenshot first to compute the right (x,y). A bad coord clicks whatever pixel is there, including 'destructive' UI."
  - "VNC stack always runs (Xvfb + x11vnc + websockify on port 6080) regardless of HEADED setting. In headless mode VNC is technically pointing at a blank framebuffer. Cheap to leave running; keeps entrypoint single-codepath."
  - "browser_console_messages requires a `level` parameter (now mandatory in v0.0.75). Use 'all' to get everything, or filter to 'error' / 'warn' for triage."
  - "browser_network_requests requires a `static` parameter. Set false to filter out static assets (.js/.css/images) — usually what you want when looking for API/XHR calls."
  - "The Chrome `channel` config setting (in /config.json) is empty string `\"\"` NOT `\"chrome\"`. Setting channel to 'chrome' breaks VPN/tun0 routing — verified incident from Feb 2026. We use chromium bundled with the @playwright/mcp package, which uses chrome-headless-shell binary."
  - "The container image is BIG (~1.55GB) — first pull is slow. Subsequent runs hit the local cache."
  - "Cold start ~10-15s (Node + Chromium spawn). Much faster than ZAP's JVM cold start. ContainerManager idle_timeout is 1800s (30 min) since browser flows can be long-running."
  - "browser_run_code_unsafe is RCE-equivalent: runs arbitrary Node JavaScript in the Playwright server process with full filesystem + env access. Treat as you would `bash` — don't accept untrusted input as the code parameter."
  - "For host-header-sensitive vhosts (e.g. cozyhosting.htb redirects raw IPs), use docker run --add-host=hostname:ip and navigate to the hostname URL. Without it, nginx/Apache will 301-redirect Chromium and the navigation appears to succeed but lands on a different page than the agent expected."
  - "File-output tools (browser_take_screenshot, browser_pdf_save, browser_start_video, browser_start_tracing) write to a sandboxed workspace by default (/tmp/.playwright-mcp/). The --allow-unrestricted-file-access flag (set in entrypoint.sh by default in this image) removes the sandbox. **Path convention** — use /session/output/<name>.<ext>, the platform-wide convention used by 70+ tools. This image's entrypoint pre-creates /session/output at container start, so flat writes to /session/output/foo.pdf succeed. Playwright's page.pdf / page.screenshot do NOT auto-create parent dirs — for deeper subdirs (e.g. /session/output/traces/foo/) the agent must `mkdir -p` first via a separate run_cli call. Verified live 2026-05-08: page.pdf to /session/output/x.pdf works with the flag + dir present."
  - "Unreachable URLs HANG for the FULL navigation timeout. Verified live 2026-05-08: browser_navigate to http://10.99.99.99/ blocked exactly 60s with upstream defaults, returning `TimeoutError: browserBackend.callTool: Timeout 60000ms exceeded`. CRITICAL: browser_navigate has NO per-call `timeout` argument (verified — schema is `{url}` only, additionalProperties:false). Per-page `page.setDefaultNavigationTimeout(N)` set via run_code_unsafe is IGNORED — the MCP wrapper enforces its own outer timeout, not Playwright's internal one. The ONLY way to lower it is the entrypoint flag `--timeout-navigation <ms>` (this image ships with 30000ms = 30s). For HTB engagements expect ~30s wasted on each unreachable target; budget accordingly."
  - "browser_take_screenshot, browser_pdf_save, browser_start_video, browser_start_tracing, snapshot/console-message dumps, etc. all auto-route to /session/output via `--output-dir /session/output` set in entrypoint.sh. Verified live 2026-05-08: video, snapshot YML, console log, and traces/ subdir all land on the bind-mount automatically without the agent specifying an absolute path. browser_start_video/browser_start_tracing take NO `filename` arg — their output is always `--output-dir`-relative. Means: opensploit's report agent can pick up videos + traces from /session/output/ without the playwright agent doing path bookkeeping."
  - "browser_navigate response does NOT include the snapshot inline — only a reference to a `tmp/.playwright-mcp/page-<timestamp>.yml` file inside the container. You MUST call browser_snapshot separately to get the page tree with refs. Same applies to click/fill_form/type — they confirm the Playwright code that ran but do not echo a fresh snapshot. Pattern: any state-changing action → browser_snapshot to see DOM state. Verified live 2026-05-08 against @playwright/mcp v0.0.75."
  - "browser_run_code_unsafe expects a FUNCTION EXPRESSION as the `code` param, not a bare statement. Verified live 2026-05-08: `code: '1+1'` failed with `TypeError: __fn__ is not a function`; `code: 'document.title'` failed with `ReferenceError: document is not defined`; `code: '(page) => page.title()'` succeeded. The function is invoked Node-side with the Playwright `page` object as its first arg — so to read DOM you must do `code: '(page) => page.evaluate(() => document.title)'`, or just use browser_evaluate. Mental model: this tool is `await (your_function)(page)` in Node, NOT `eval(your_code)` in the browser."
  - "Refs survive across non-navigating calls. Verified live 2026-05-08: e17/e20/e26 captured from /login snapshot remained valid after fill_form (which doesn't navigate). After clicking Login (POST → /login?error redirect), and after a 90s idle pause, the browser session was still alive and refs were re-derivable via fresh browser_snapshot. Idle-timeout=1800s is conservative; the actual browser session lasted at least 90s without any keepalive activity."
  - "browser_evaluate accepts a JS expression as a STRING that evaluates to a function (e.g. `() => document.title`). Internally it does `await page.evaluate('() => ...')`. Multi-statement function bodies work via `() => { stmt1; return stmt2; }`."
  - "CAPTCHA solving via VNC handoff: set HEADED=1, navigate to the page, ask the operator to attach to http://localhost:6080/vnc.html and solve the CAPTCHA manually, then continue the agent flow. Memory + screen real-estate cost is real; only use when needed."

# ---------------------------------------------------------------------------
# Usage patterns — concrete agent flows
# ---------------------------------------------------------------------------
usage_patterns:
  - name: "Login + capture session cookies (most common)"
    description: "Standard authenticated-app flow: navigate to login page, fill the form, submit, capture cookies + tokens for reuse."
    sequence:
      - method: browser_navigate
        args: { url: "http://TARGET/login" }
      - method: browser_snapshot
      - method: browser_fill_form
        args: { fields: [{name: "Username", type: "textbox", target: "<from-snapshot>", value: "admin"}, {name: "Password", type: "textbox", target: "<from-snapshot>", value: "..."}] }
      - method: browser_click
        args: { target: "<submit-button-ref>" }
      - method: browser_wait_for
        args: { text: "Welcome" }
      - method: browser_evaluate
        args: { function: "() => document.cookie" }

  - name: "XSS payload validation"
    description: "Fire an XSS payload, verify it executed via console messages."
    sequence:
      - method: browser_navigate
        args: { url: "http://TARGET/search?q=<script>console.log('XSS_FIRED')</script>" }
      - method: browser_console_messages
        args: { level: "all" }
      - method: browser_take_screenshot
        args: { type: "png", filename: "/session/output/xss-pop.png" }

  - name: "JS-heavy SPA exploration"
    description: "When curl returns empty body — drive the SPA, snapshot what's actually rendered."
    sequence:
      - method: browser_navigate
        args: { url: "http://TARGET/" }
      - method: browser_wait_for
        args: { time: 3 }
      - method: browser_snapshot
      - method: browser_network_requests
        args: { static: false }

  - name: "CAPTCHA solving via VNC handoff"
    description: "HEADED=1 + operator solves the CAPTCHA via http://localhost:6080/vnc.html, then agent continues."
    sequence:
      - method: browser_navigate
        args: { url: "http://TARGET/protected" }
      - method: browser_take_screenshot
        args: { type: "png", filename: "/session/output/captcha.png" }
      - method: browser_wait_for
        args: { text: "Welcome" }
      - method: browser_snapshot

  - name: "Vision-mode coordinate click for grid CAPTCHA"
    description: "When the CAPTCHA is a canvas / image grid the accessibility tree doesn't expose. Screenshot, decide pixel coords, click."
    sequence:
      - method: browser_take_screenshot
        args: { type: "png", filename: "/session/output/grid.png" }
      - method: browser_mouse_click_xy
        args: { x: 234, y: 156 }
      - method: browser_mouse_click_xy
        args: { x: 312, y: 156 }
      - method: browser_mouse_click_xy
        args: { x: 234, y: 234 }

  - name: "OAuth flow with multi-tab popup"
    description: "Login flow opens a new tab for OAuth provider, capture creds returned to the original tab. NOTE the explicit browser_snapshot calls — refs from the OAuth-launching page do NOT apply to the OAuth provider's page. Skipping these snapshots triggers the position-based-ref hazard (silent misroute, no error)."
    sequence:
      - method: browser_navigate
        args: { url: "http://TARGET/oauth-login" }
      - method: browser_snapshot                              # rule: snapshot before any ref-based interaction
      - method: browser_click
        args: { target: "<oauth-button-ref-from-snapshot>" }
      - method: browser_tabs
        args: { action: "list" }
      - method: browser_tabs
        args: { action: "select", index: 1 }
      - method: browser_snapshot                              # rule: snapshot AFTER tab switch — refs from prev page don't apply
        args: {}
      - method: browser_fill_form
        args: { fields: [{name: "email", type: "textbox", target: "<from-snapshot-of-tab-1>", value: "..."}] }
      - method: browser_click
        args: { target: "<consent-button-ref>" }
      - method: browser_tabs
        args: { action: "select", index: 0 }
      - method: browser_snapshot                              # rule: snapshot AFTER tab switch back — refs from tab 1 don't apply to tab 0
        args: {}
      - method: browser_evaluate
        args: { function: "() => localStorage.getItem('auth_token')" }
