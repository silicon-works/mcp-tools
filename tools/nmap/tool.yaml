name: nmap
kind: cli
binary: nmap
version: "7.98"
description: "Network scanner (nmap 7.98) for port discovery, service/version detection, OS fingerprinting, and NSE script-based vulnerability scanning. Supports TCP SYN/Connect/ACK/UDP/FIN/Window/NULL/Xmas/Maimon scan types, 613 NSE scripts across categories (vuln, exploit, brute, auth, default, discovery, safe), timing templates T0-T5, and structured XML/grepable/JSON output. Compiled with libssh2, openssl, lua 5.4. Container runs privileged (raw socket access) for SYN/UDP/OS-detection scans. Custom NSE scripts can be written to /session/nmap-scripts/ and referenced by absolute path with --script. Native CLI; LLM constructs the full nmap argv. Use for layer-3/4 reconnaissance and enumeration; not a web fuzzer (use ffuf), SQLi tester (sqlmap), or password cracker (hydra)."
image: "ghcr.io/silicon-works/mcp-tools-nmap:latest"
image_size_mb: 150
# Dual-clock model — nmap can be silent for many minutes between hosts on
# a /24 sweep with NSE scripts, and a full-port scan with vuln scripts on
# a slow target can run for hours. Generous caps: correctness > latency.
idle_timeout_seconds: 600       # 10 min silence between heartbeats — nmap is quiet between hosts
max_runtime_seconds: 86400      # 24 h hard wall — covers /24 + --script vuln + UDP top-1000
timeout_seconds: 86400          # legacy fallback for old clients

capabilities:
  - port_scanning
  - service_detection
  - os_fingerprinting
  - vulnerability_scanning
  - host_discovery

phases:
  - reconnaissance
  - enumeration

routing:
  use_for:
    - "port scanning and open-port discovery on a target IP, hostname, or CIDR"
    - "service and version detection on open ports (-sV)"
    - "OS fingerprinting and operating-system identification (-O)"
    - "host discovery and ping sweep across a subnet (-sn)"
    - "network enumeration as the first step of an engagement"
    - "NSE vulnerability script scanning (--script vuln)"
    - "TCP SYN, Connect, ACK, UDP, FIN, Window, NULL, Xmas, Maimon scan types"
    - "determine what services are running on a target"
    - "find open ports on an IP address or CIDR range"
    - "identify local network interfaces and LHOST IP (use bash + ip addr; nmap is overkill for this)"
    - "run custom NSE scripts from /session/nmap-scripts/"
    - "engagement-specific vulnerability checks via custom NSE scripts"
  never_use_for:
    - "web directory or parameter fuzzing — use ffuf"
    - "SQL injection — use sqlmap"
    - "password cracking — use hydra (network) or hashcat/john (offline)"
    - "subdomain discovery — use amass"
    - "reading targets from a file (-iL) — extract first and pass argv targets"
    - "random target generation (-iR) — out of scope by definition"
  triggers:
    - "nmap"
    - "port scan"
    - "service detection"
    - "version detection"
    - "OS fingerprint"
    - "host discovery"
    - "ping sweep"
    - "network scan"
    - "open ports"
    - "what services"
    - "NSE script"
    - "custom nmap script"
    - "fast scan"
    - "stealth scan"
    - "syn scan"
    - "udp scan"
    - "evasion"
    - "decoy scan"
    - "rate limit"
    - "min-rate"
  prefer_over:
    - "masscan"  # More reliable, better service detection

requirements:
  network: true
  privileged: true
  privileged_reason: "Raw socket access for SYN scans (-sS), UDP scans (-sU), OS detection (-O), and packet manipulation (-D, -f, --spoof-mac, --source-port). TCP connect scan (-sT) does not require privileged mode but is logged by the target and slower."

resources:
  memory_mb: 256
  cpu: 0.5

see_also:
  - tool: amass
    reason: "Run amass before nmap for subdomain discovery — passive OSINT and DNS brute-force find hostnames you'd otherwise miss."
  - tool: ffuf
    reason: "After nmap finds an HTTP/HTTPS port, switch to ffuf for directory and parameter fuzzing."
  - tool: nuclei
    reason: "After nmap version detection, run nuclei against the same host for templated CVE / misconfiguration checks (broader template surface than NSE)."
  - tool: nikto
    reason: "Web-server-specific checks complement nmap's --script http-* coverage."
  - tool: hydra
    reason: "Once nmap finds an authenticated service (ssh, ftp, smb, http-form), pivot to hydra for credential brute-force."

# ── kind:cli specific sections ──────────────────────────────────────

target_extraction:
  # nmap target is the LAST positional argument, after every flag and flag
  # value. Examples:
  #   nmap -sS -p 22,80,443 10.10.10.5
  #   nmap -sV --script vuln -oX /session/scan.xml target.htb
  #   nmap -Pn -T4 --min-rate 1000 192.168.1.0/24
  # The DSL's first_non_flag_positional rule walks argv, skipping every flag
  # and every value-flag's argument (per `value_flags` below), and returns the
  # first positional that isn't a flag value. nmap accepts: IPv4 (10.0.0.1),
  # IPv4 CIDR (10.0.0.0/24), IPv4 ranges (10.0.0.1-50, 10.0.0-3.1-254),
  # comma lists (10.0.0.1,10.0.0.5), hostnames (target.htb), FQDNs
  # (host.target.com), bare IPv6 (2001:db8::1), and bracketed IPv6
  # ([2001:db8::1]). The plugin's TargetValidation strips brackets and
  # extracts the host portion from CIDR/range/list before scope validation.
  - rule: "first_non_flag_positional"

# Flags whose presence makes target scope un-validatable. The plugin's
# cli_in_container rejects the call before docker spawn when any of these
# appear, with the reason below. The LLM must reformulate by extracting
# the targets from the file/random pool and passing them as positional argv.
reject_flags:
  - "-iL"   # read targets from input file — target list outside argv
  - "-iR"   # generate N random targets — by definition out of scope
reject_flags_reason: "File-based and random target ingestion put the target outside the command line where scope validation cannot reach. Read the target list yourself (with the read tool) and pass each target as a positional argument, or call nmap once per target."

# Per-tool value-taking flags whose values must NOT be confused with positional
# targets. Critical for nmap because the LLM might emit a command where a flag
# value looks IP-shaped (decoy IPs, source IPs, proxy URLs, output paths). The
# DSL merges these with its built-in defaults; we enumerate exhaustively.
value_flags:
  # Target / input control (also in reject_flags but listed here so DSL knows
  # the next token is the value, not a positional target)
  - "-iL"
  - "-iR"
  - "--exclude"
  - "--excludefile"
  # Port specification
  - "-p"
  - "--top-ports"
  - "--port-ratio"
  # Scan-type tuning
  - "--scanflags"
  # Service / version detection
  - "--version-intensity"
  - "--version-light"
  - "--version-all"
  - "--version-trace"
  # Script engine
  - "--script"
  - "--script-args"
  - "--script-args-file"
  - "--script-trace"
  - "--script-updatedb"
  - "--script-help"
  - "--script-timeout"
  # OS detection tuning
  - "--osscan-limit"
  - "--osscan-guess"
  - "--max-os-tries"
  # Timing & performance — every one takes a value
  - "--max-retries"
  - "--host-timeout"
  - "--scan-delay"
  - "--max-scan-delay"
  - "--min-rate"
  - "--max-rate"
  - "--min-parallelism"
  - "--max-parallelism"
  - "--min-rtt-timeout"
  - "--max-rtt-timeout"
  - "--initial-rtt-timeout"
  - "--min-hostgroup"
  - "--max-hostgroup"
  - "--defeat-rst-ratelimit"
  - "--defeat-icmp-ratelimit"
  # Firewall / IDS evasion — value-taking
  - "-D"               # decoy IPs — looks like a target, MUST NOT match
  - "-S"               # source IP — looks like a target, MUST NOT match
  - "-e"               # interface
  - "-g"               # source port (alias)
  - "--source-port"
  - "--proxies"        # proxy URLs
  - "--data"
  - "--data-string"
  - "--data-length"
  - "--ip-options"
  - "--ttl"
  - "--spoof-mac"
  - "--mtu"
  - "--badsum"
  # Output — file paths, MUST NOT match as targets
  - "-oN"
  - "-oX"
  - "-oS"
  - "-oG"
  - "-oA"
  - "-oJ"              # JSON (some forks)
  - "--append-output"
  - "--resume"
  - "--stylesheet"
  # Misc
  - "--datadir"
  - "--servicedb"
  - "--versiondb"
  - "--privileged"     # boolean but some forks accept value
  - "--unprivileged"
  - "--release-memory"
  # Host-discovery probes — value-taking forms
  - "-PS"              # TCP SYN ping with optional port list
  - "-PA"              # TCP ACK ping with optional port list
  - "-PU"              # UDP ping
  - "-PY"              # SCTP INIT ping
  - "-PE"              # ICMP echo (no value usually, but kept for safety)
  - "-PP"
  - "-PM"
  - "-PO"

usage_patterns:
  - name: "Quick TCP probe (top 1000 ports)"
    command: "nmap -sS --min-rate 1000 -T4 -Pn -oX {output_xml} {target}"
    when: "First-pass open-port discovery on a single host. Default port range is top 1000. SYN scan (-sS) requires the privileged container; falls back to -sT if unprivileged."

  - name: "Service and version detection with default scripts"
    command: "nmap -sV -sC -p- --min-rate 1000 -T4 -Pn -oX {output_xml} {target}"
    when: "After confirming the host is up, do a full-port (-p-) service detection (-sV) with default safe scripts (-sC). Standard second-pass for HTB-style boxes. Long runtime — let it finish; do NOT cancel."

  - name: "UDP top-100 scan (privileged)"
    command: "nmap -sU --top-ports 100 -T4 -Pn -oX {output_xml} {target}"
    when: "Find UDP services (DNS 53, SNMP 161, NetBIOS 137, NTP 123). Requires privileged mode for raw UDP packets. Slow by nature — UDP scans take 10x longer than TCP."

  - name: "Full TCP all ports (slow, thorough)"
    command: "nmap -sS -p- -T4 --min-rate 1000 -Pn -oX {output_xml} {target}"
    when: "Find services on non-standard ports. Use after a quick top-1000 scan if the target shows unexpectedly few open ports. SYN scan (-sS) requires privileged."

  - name: "Vulnerability script scan"
    command: "nmap -sV --script vuln -p {ports} -Pn -oX {output_xml} {target}"
    when: "After service_scan identifies versions, run NSE vuln category against the open ports. Filter -p to discovered open ports — do not run vuln scripts against all 65535 ports (waste of time)."

  - name: "Specific NSE script (e.g., MS17-010 EternalBlue)"
    command: "nmap --script smb-vuln-ms17-010 -p 445 -Pn -oX {output_xml} {target}"
    when: "Targeted vulnerability check when you have a specific CVE in mind. Common: smb-vuln-ms17-010, ssl-heartbleed, http-shellshock, http-vuln-cve2017-5638."

  - name: "Custom NSE script from /session"
    command: "nmap --script /session/nmap-scripts/{script_name} -p {ports} -Pn -oX {output_xml} {target}"
    when: "Engagement-specific check beyond nmap's built-in 613 scripts. Drop the .nse file via the write tool to /session/nmap-scripts/ first."

  - name: "Ping sweep (host discovery only)"
    command: "nmap -sn -T4 -oX {output_xml} {cidr}"
    when: "Find live hosts on a /24 before per-host port scans. Sends ICMP echo, TCP SYN/ACK to 80/443, ICMP timestamp. -sn = scan no ports."

  - name: "OS fingerprinting"
    command: "nmap -O --osscan-guess -Pn -oX {output_xml} {target}"
    when: "Identify the target OS for kernel-exploit selection. Best results when the target has both open and closed ports visible. Requires privileged."

  - name: "Aggressive scan (-A: OS + version + scripts + traceroute)"
    command: "nmap -A -T4 -Pn -oX {output_xml} {target}"
    when: "One-shot full enumeration — combines -sV, -sC, -O, --traceroute. Heavy/noisy; use only when stealth doesn't matter (HTB labs, authorized engagements with broad scope)."

  - name: "Stealth / IDS-evasion scan"
    command: "nmap -sS -T2 -f --source-port 53 -D RND:5 --max-retries 2 -Pn -oX {output_xml} {target}"
    when: "When the target has IDS/IPS and you need slow + decoyed scanning. -T2 (polite), -f (fragment), --source-port 53 (spoof DNS), -D RND:5 (5 random decoys)."

  - name: "Skip discovery (target filters ICMP)"
    command: "nmap -sS -p- --min-rate 1000 -T4 -Pn -oX {output_xml} {target}"
    when: "Default scan reports 'host seems down' but you know the target is up. -Pn skips host discovery and goes straight to port scanning. Standard for HTB."

  - name: "Subnet enumeration with skip-list"
    command: "nmap -sS -T4 --top-ports 100 --exclude {exclude_list} -oX {output_xml} {cidr}"
    when: "Scan a CIDR but skip gateways or known-out-of-scope IPs. --exclude is a comma-separated list (10.0.0.1,10.0.0.254)."

  - name: "Capture all output formats at once"
    command: "nmap -sV -sC -p- -Pn -oA {output_basename} {target}"
    when: "Save normal (.nmap), XML (.xml), and grepable (.gnmap) output simultaneously to one basename. Convenient for post-processing."

output_formats:
  # XML is preferred — structured, parseable, the canonical machine output.
  - flag: "-oX {path}"
    format: "xml"
    preferred: true
  - flag: "-oA {basename}"
    format: "all_three"      # writes .nmap + .xml + .gnmap
    preferred: false
  - flag: "-oG {path}"
    format: "grepable"
    preferred: false
  - flag: "-oN {path}"
    format: "normal_text"
    preferred: false
  - flag: "-oS {path}"
    format: "script_kiddie"  # joke output — never use
    preferred: false
  - flag: "-oJ {path}"
    format: "json"           # availability depends on nmap fork; verify before recommending
    preferred: false

common_options:
  scan_type:
    - "-sS: TCP SYN stealth scan (default when privileged; half-open, fast, less logged)"
    - "-sT: TCP connect scan (default unprivileged; full handshake, slower, logged by target)"
    - "-sU: UDP scan (slow; combine with --top-ports 100)"
    - "-sA: TCP ACK scan (firewall rule mapping; does NOT find open ports — only filtered/unfiltered)"
    - "-sF / -sN / -sX: FIN / NULL / Xmas (stealth scans against non-stateful firewalls)"
    - "-sW: Window scan (like ACK but distinguishes open/closed via TCP window size)"
    - "-sM: Maimon scan (FIN/ACK probe; some BSD systems drop the packet for open ports)"
    - "-sn: ping scan only, no port scan (host discovery)"
    - "-sV: service/version detection"
    - "-sC: run default safe NSE scripts (--script=default)"
    - "-O: OS detection"
    - "-A: aggressive — combines -sV -sC -O --traceroute"
  discovery:
    - "-Pn: skip host discovery (assume up — common for HTB / firewalled targets)"
    - "-PS [ports]: TCP SYN ping (default 80,443)"
    - "-PA [ports]: TCP ACK ping"
    - "-PU [ports]: UDP ping"
    - "-PE: ICMP echo"
    - "-PP: ICMP timestamp"
    - "-PM: ICMP netmask"
    - "-n: skip DNS resolution (faster on lab targets)"
    - "-R: always do reverse DNS"
  port_spec:
    - "-p PORTS: comma list (22,80,443), range (1-1000), all (-p-), or T:80,U:53"
    - "--top-ports N: scan the N most common ports (100 / 1000 / 5000)"
    - "--port-ratio N: ports above this open-frequency ratio (0.0-1.0)"
    - "-F: fast scan (top 100 ports — same as --top-ports 100)"
  service_detection:
    - "--version-intensity 0..9: probe intensity (default 7; 9 = thorough; 2 = fast)"
    - "--version-light: equivalent to --version-intensity 2"
    - "--version-all: equivalent to --version-intensity 9"
    - "--version-trace: show version-detection probe details"
  scripts:
    - "--script CATEGORY: vuln, exploit, brute, auth, default, discovery, safe, all"
    - "--script SCRIPT_NAME: single script (e.g., smb-vuln-ms17-010)"
    - "--script 'cat1 and cat2': boolean expression"
    - "--script-args 'name=value,...': script-specific args"
    - "--script-args-file FILE: args from file"
    - "--script-timeout N: per-script time cap (e.g., 30s)"
    - "Custom: --script /session/nmap-scripts/foo.nse"
  timing:
    - "-T0..T5: paranoid / sneaky / polite / normal / aggressive / insane"
    - "-T4 (aggressive) is the standard for HTB / lab targets"
    - "--min-rate N: minimum packets per second (1000 = fast, 5000 = aggressive, 10000 = insane)"
    - "--max-rate N: cap pps (stealth or production-safe)"
    - "--max-retries N: probe retransmissions (default 10; 1-2 on reliable nets)"
    - "--host-timeout 30s|5m|1h: skip slow hosts"
    - "--scan-delay / --max-scan-delay: pacing"
  output:
    - "-oX FILE: XML — preferred for parsing"
    - "-oN FILE: human-readable normal output"
    - "-oG FILE: grepable single-line-per-host"
    - "-oA BASENAME: writes .nmap + .xml + .gnmap"
    - "-v / -vv / -vvv: verbosity (heartbeat-friendly)"
    - "--reason: show why each port is in its state"
    - "--open: only show open ports"
  evasion:
    - "-f: fragment packets"
    - "--mtu N: custom MTU (multiple of 8)"
    - "-D IP1,IP2,RND:N: decoy scan (RND:5 = 5 random decoys)"
    - "-S IP: spoof source IP (also requires -e and -Pn)"
    - "-e IFACE: send via interface"
    - "-g PORT / --source-port PORT: spoof source port (53 = DNS, 88 = Kerberos)"
    - "--proxies URL1,URL2: chain through HTTP/SOCKS proxies"
    - "--data HEX: append custom payload bytes"
    - "--data-string STR: append custom ASCII payload"
    - "--data-length N: append N random bytes"
    - "--spoof-mac MAC|0|VENDOR: spoof MAC address"
    - "--badsum: send packets with bogus TCP/UDP checksum (firewall fingerprinting)"
  performance:
    - "--min-parallelism / --max-parallelism N: probe concurrency"
    - "--min-hostgroup / --max-hostgroup N: hosts scanned in parallel"
    - "--min-rtt-timeout / --max-rtt-timeout / --initial-rtt-timeout N: RTT tuning"

gotchas:
  - "Container runs --privileged in the engagement docker-compose because SYN, UDP, and OS-detection scans need raw socket access. Without privileged, those scan types silently fall back to -sT (TCP connect, slower, logged). Verify: 'nmap --privileged --version' should show '(privileged)' or just succeed without the unprivileged warning."
  - "nmap exits 0 even when ALL hosts are reported down. Pattern-match output for '0 hosts up' / 'host seems down' to detect this — do NOT trust the exit code as a success indicator."
  - "On HTB and firewalled targets, host discovery (the default first step) reports the target as 'down' because the firewall drops ICMP. ALWAYS pass -Pn to skip discovery if you know the target is up."
  - "Default scan timing (-T3 normal) is too slow for lab environments. Use -T4 + --min-rate 1000 on HTB; -T2 only on real engagements where stealth matters."
  - "-iL (read targets from file) and -iR (random targets) are REJECTED at the plugin layer — both put the target outside the command line. Read the file yourself and pass argv targets, or call nmap once per target."
  - "-D (decoy) and -S (source IP) take IP-looking values. The DSL's first_non_flag_positional rule plus value_flags listing prevents these from being mistaken for the actual target."
  - "Output files (-oX /session/scan.xml, -oN /session/scan.nmap) MUST land under /session/ to survive after the container exits. /tmp inside the container is ephemeral."
  - "OS detection (-O) needs at least one open and one closed port visible to be reliable. If the target only has open ports (or only closed), expect 'No exact OS matches'."
  - "NSE vuln scripts are noisy and slow — a full --script vuln on a /24 can run for hours. Pin to known open ports with -p and limit to specific scripts (smb-vuln-* rather than the whole vuln category) when possible."
  - "--script vuln + --script-timeout 30s prevents one slow script from hanging the whole scan."
  - "Bracketed IPv6 ([2001:db8::1]) is the canonical form on the URL/argv side; bare 2001:db8::1 also works. The plugin's TargetValidation strips brackets before scope validation."
  - "Ranges and lists (10.0.0.1-50, 10.0.0.1,10.0.0.5,10.0.0.10) are valid nmap target syntax — the plugin's scope validation expands them and checks every host."
  - "Aggressive scan (-A) implies -sV + -sC + -O + --traceroute. Don't combine with --script vuln unless you want the kitchen sink — runtime explodes."
  - "Always pass -v (or -vv) so nmap streams progress lines like 'Stats:', 'Scan Timing: About X% done', 'Completed ... Scan' to stderr. Without -v, nmap can be silent for 5+ minutes during slow scans, and the heartbeat-based idle classifier will believe it's hung. Legacy mcp-server.py auto-injected -v; the kind:cli LLM must add it explicitly."
  - "Nmap exits 0 when ALL scanned ports come back closed/filtered (host up but no service in range). Watch for 'All N scanned ports on TARGET are in ignored states' — same not-an-error-but-actually-a-finding shape as '0 hosts up'. Try -p- (all 65535) or --top-ports 5000 if you suspect non-standard ports."
  - "For LHOST / local-interface discovery, do NOT call nmap — use bash 'ip -j addr' or 'ip addr show' (legacy mcp-server.py's get_interfaces method ran ip-addr, not nmap). nmap has no built-in interface enumeration that returns IPs cleanly."
  - "When you want machine-parseable results, ALWAYS write -oX /session/<name>.xml. Plain stdout is human-formatted and lossy (no service.product, no os.accuracy, no script.id, etc.). After the scan, read the XML and parse, or follow up with bash 'xmllint --xpath' / a small python parse step."
  - "vuln-script noise: NSE vuln scripts emit findings inside <script id='...' output='...'> elements in the XML. To filter to actual vulnerabilities, grep the script.output for tokens like 'VULNERABLE', 'CVE-', 'exploit', 'critical', 'high' (legacy mcp-server.py's vuln_scan classifier). A script running successfully is NOT the same as a vuln being present — read the output text."
  - "Per-scan-type reasonable-runtime budget (legacy mcp-server.py defaults): port_scan/service_scan/vuln_scan ~10 min, OS detection ~5 min, ping_scan ~2 min. The container's max_runtime_seconds is 24 h (covers /24 + vuln + UDP top-1000); use --host-timeout to enforce a tighter per-host cap when scanning many hosts."

failure_signatures:
  # Layer-diverse signals (DNS, TCP, permission, script, fatal) per SKILL #11.
  # Live-verified strings — nmap's wording is stable across recent versions.
  - signal: "Failed to resolve"
    remediation: "DNS resolution failed — verify hostname spelling, check /etc/hosts inside the container, or pass an IP address directly. Common when the target is reachable by IP but not by name (lab DNS not configured)."
  - signal: "Temporary failure in name resolution"
    remediation: "DNS lookup transient failure — retry in 5s; if persistent, the container has no DNS access (check VPN / docker network)."
  - signal: "Note: Host seems down"
    remediation: "Target's firewall is dropping ICMP and SYN-ACK probes. Pass -Pn to skip host discovery and force the scan. Do NOT interpret as 'target is offline' — common in HTB / firewalled production environments."
  - signal: "0 hosts up"
    remediation: "All hosts in the scan range showed as down. Pass -Pn to assume up, or verify the CIDR / VPN routing. nmap exits 0 even when all hosts are down — do NOT trust exit code alone."
  - signal: "0 IP addresses"
    remediation: "Target list collapsed to zero hosts. Check --exclude for an over-broad rule, or verify the CIDR/range syntax."
  - signal: "requires root privileges"
    remediation: "This scan type (SYN -sS, UDP -sU, OS -O, raw-packet evasion) requires the privileged container flag. Switch to -sT (TCP connect) for unprivileged, or rebuild the container with --privileged."
  - signal: "dnet: Failed to open device"
    remediation: "libdnet cannot bind to a raw network device — the container is not running with sufficient capabilities. Restart with --privileged or NET_ADMIN+NET_RAW capabilities."
  - signal: "You requested a scan type which requires"
    remediation: "Selected scan type needs privileges the container doesn't have. Drop the privileged scan type (-sS → -sT) or rebuild the container privileged."
  - signal: "Could not open a raw socket"
    remediation: "Same root cause as 'requires root privileges' / 'dnet: Failed to open device' — privileged mode is missing."
  - signal: "Read script-args file failed"
    remediation: "--script-args-file points at an unreadable / missing path. Verify the file exists under /session/ and is readable inside the container."
  - signal: "NSE: failed to initialize the script engine"
    remediation: "NSE script directory or script source is corrupt. Run --script-updatedb in the container, or check that --script paths exist."
  - signal: "did not match any category, filename, or directory"
    remediation: "--script value names a script that doesn't exist. Run 'nmap --script-help all' inside the container to see available scripts; verify spelling and category names."
  - signal: "QUITTING!"
    remediation: "nmap fatal exit — the message immediately preceding QUITTING! contains the actual cause. Most common: privilege issue, malformed target spec, or unparseable flag value. Read the line above QUITTING! for the root cause."
  - signal: "No targets were specified"
    remediation: "Command had flags but no target argv. Add a positional target (IP, hostname, CIDR, range, list)."
  - signal: "Failed to determine route to"
    remediation: "Routing table cannot reach the target. Check VPN connectivity (tun0 up, route to target subnet present)."
  - signal: "Network is unreachable"
    remediation: "Same root cause — no route. VPN issue."
  - signal: "Cannot find nmap-services"
    remediation: "nmap data files missing from the container — rebuild the image or set --datadir to the correct path."
  - signal: "Invalid port range"
    remediation: "-p value is malformed. Valid forms: 22,80,443 / 1-1000 / 1-65535 / T:80,U:53 / -p-."
  - signal: "Found no matches for the host specification"
    remediation: "Target spec is malformed — verify CIDR / range / IP syntax. Bare hostnames without DNS will hit this too."
  - signal: "All \\d+ scanned ports"
    remediation: "All ports came back closed/filtered. Target may be using non-standard ports — try -p- (all 65535) or --top-ports 5000."

help_commands:
  - command: "nmap --help"
    purpose: "Common flags reference (concise)"
  - command: "nmap --version"
    purpose: "Version, compiled features (libssh2, openssl, lua), and platform info"
  - command: "nmap --script-help all"
    purpose: "Full NSE script catalog with descriptions"
  - command: "nmap --script-updatedb"
    purpose: "Rebuild the NSE script index after dropping custom .nse files into /session/nmap-scripts/"
