name: hydra
kind: cli
binary: hydra
version: "9.6"
description: "THC-Hydra v9.6 — network authentication brute-forcer supporting 50+ protocols including ssh, ftp, http-{get,post,get-form,post-form}, https-{get,post,get-form,post-form}, smb, smb2, rdp, mysql, mssql, postgres, vnc, telnet, smtp, pop3, imap, redis, mongodb, ldap2, ldap3, snmp, sshkey, http-proxy, sip, cisco, cisco-enable, oracle-listener, rsh, rlogin, rexec, irc, ncp, nntp, sapr3, socks5, vmauthd, teamspeak, xmpp, asterisk, cvs, firebird, icq, mcrouter, and more. Two target syntaxes: PROTOCOL://HOST[:PORT][/PATH] (preferred) OR `[-s PORT] HOST PROTOCOL` (alternate, two trailing positionals). Auth controlled by mutually-exclusive flag pairs: -l SINGLE / -L LISTFILE for usernames; -p SINGLE / -P LISTFILE for passwords; -C COMBOFILE replaces all four. -e nsr tries empty/same-as-login/reverse-login. http-post-form module spec format `/path:user=^USER^&pass=^PASS^:F=fail-string` (THREE colon-separated fields; ^USER^/^PASS^ are substituted). Native CLI; the LLM constructs the full hydra invocation."
image: "ghcr.io/silicon-works/mcp-tools-hydra:latest"
image_size_mb: 200
# Dual-clock model:
#   idle_timeout_seconds — silence between MCP heartbeats. hydra prints
#     [STATUS], [ATTEMPT], and [RESULT] lines as it works. Slow services
#     (rate-limited SSH with -W, MSSQL with timeouts) can be quiet between
#     hits; 10 min silent without -V = stuck or wedged. With -V you'll see
#     a line per attempt — set idle to 10 min to be safe across modes.
#   max_runtime_seconds — hard wall-clock cap; never resets on heartbeat.
#     24 h covers worst-case full user×password matrix with -W rate limiting
#     (e.g., 100 users × 10K passwords × 1s wait at -t 4 ≈ 70 h theoretical;
#     in practice attacks should be narrowed long before this cap).
# Legacy `timeout_seconds` is used by older clients as the hard cap.
idle_timeout_seconds: 600
max_runtime_seconds: 86400
timeout_seconds: 86400

capabilities:
  - password_bruteforce
  - credential_testing
  - online_brute_force

phases:
  - exploitation

routing:
  use_for:
    - "password brute-forcing against network services"
    - "credential testing and default password checking"
    - "SSH FTP RDP VNC login brute-force"
    - "HTTP web login form brute-force"
    - "MySQL PostgreSQL MSSQL database credential brute-force"
    - "test known credentials against multiple services"
    - "try default passwords on discovered services"
    - "SMTP IMAP POP3 email credential brute-force"
    - "SMB Windows share authentication testing"
    - "network login attack with wordlists like rockyou"
    - "Redis MongoDB LDAP SNMP credential brute-force"
    - "Cisco device login brute-force"
    - "combo file default credential testing login:pass"
    - "PIN brute-force password generation"
  never_use_for:
    - task: "hash cracking"
      use_instead: "hashcat or john"
      reason: "hydra is online (sends auth attempts to a live service); hashcat/john are offline (operate on local hash files). Use hashcat for GPU-accelerated cracking with explicit -m mode; use john for format auto-detection and *2john converters."
    - task: "Kerberos username enumeration / password spraying on port 88"
      use_instead: "kerbrute"
      reason: "hydra has no Kerberos AS-REQ module. kerbrute speaks Kerberos pre-auth on port 88 with KDC error analysis (KDC_ERR_PREAUTH_REQUIRED = valid user). Use kerbrute first to identify valid AD users WITHOUT incurring failed logins, then feed valid_users into hydra for any non-Kerberos services."
    - "vulnerability scanning (use nmap or nuclei)"
    - "SQL injection (use sqlmap)"
    - "fuzzing for hidden directories or parameters (use ffuf)"
  triggers:
    - "brute force"
    - "password attack"
    - "credential brute"
    - "hydra"
    - "login brute"
    - "default credentials"
    - "rockyou"
    - "wordlist attack"
    - "ssh brute"
    - "ftp brute"
    - "smb brute"
    - "rdp brute"
    - "web login brute"
    - "http-post-form"
    - "mysql brute"
  prefer_over: []

requirements:
  network: true
  privileged: false

resources:
  memory_mb: 256
  cpu: 1.0

see_also:
  - tool: kerbrute
    reason: "Use kerbrute FIRST for Kerberos username enumeration (port 88) and password spraying — kerbrute identifies valid AD users via pre-auth error codes WITHOUT incurring failed logins. Pipe kerbrute's valid_users into hydra's -L for any non-Kerberos services discovered on the same target."
  - tool: hashcat
    reason: "For OFFLINE password cracking (NTLM, bcrypt, Kerberos TGS-REP, etc.). hydra is online; hashcat is offline. After dumping NTDS via impacket-secretsdump, crack with hashcat — don't try to brute-force the same passwords online with hydra."
  - tool: john
    reason: "Same role as hashcat (offline cracking) but with format auto-detection and *2john converter scripts. Use when the hash format is unknown or when extracting hashes from encrypted files (zip2john, ssh2john, pdf2john)."
  - tool: nmap
    reason: "Run nmap first to discover which services are open (e.g., -sV against 22/tcp, 21/tcp, 445/tcp). Feed the open-port/service list into hydra's protocol selection."
  - tool: netexec
    reason: "For SMB/WinRM/LDAP credential validation across many hosts at once. netexec is faster than hydra for SMB password spraying with --continue-on-success and supports lateral-movement actions in the same pass (--shares, --users, --pass-pol). Use hydra when you need a non-Microsoft protocol netexec doesn't cover."
  - tool: ffuf
    reason: "For HTTP form discovery — ffuf finds the form path and parameter names; hydra brute-forces credentials against the discovered form."

# ── kind:cli specific sections ──────────────────────────────────────

target_extraction:
  # hydra has TWO target syntaxes:
  #
  # 1. PROTOCOL://HOST[:PORT][/PATH] as a positional argument (modern style):
  #      hydra -l admin -P passwords.txt ssh://10.10.10.5
  #      hydra -L users.txt -P passwords.txt 'http-post-form://10.10.10.5/login.php:user=^USER^&pass=^PASS^:Login failed'
  #    The host is captured from group 2 of the URL regex.
  #
  # 2. Trailing positionals form (legacy, common in tutorials):
  #      hydra -L users.txt -P passwords.txt 10.10.10.5 ssh
  #      hydra -l admin -p Password123 -s 1433 10.10.10.5 mssql
  #    The last two positionals are HOST and PROTOCOL respectively. The
  #    `first_non_flag_positional` fallback rule catches the bare-host form
  #    by walking argv (skipping value_flags) and returning the first
  #    non-flag positional that isn't a recognised hydra protocol token.
  #
  # 3. -m FORM-SPEC values (for http-post-form / http-get-form) frequently
  #    contain literal URL-shaped path strings like `/login.php` and may
  #    contain hostnames in the failure-indicator string (e.g.,
  #    `Location: /admin`). The -m flag is listed in value_flags so the
  #    DSL skips its value entirely — neither the path nor the failure
  #    string is misinterpreted as a target.
  - rule: "positional_match"
    pattern: "^([a-z][a-z0-9-]*?[2-3]?)://([^:/?#]+)"
    group: 2
    parse_as: "raw"
  # Fallback for the alternate `<host> <protocol>` form. The DSL walks argv
  # skipping flags and value_flags; the first non-flag positional is then
  # the host (with the protocol following). This works for the common
  # `hydra -l admin -P p.txt 10.10.10.5 ssh` shape.
  - rule: "first_non_flag_positional"

# Flags whose presence makes target scope un-validatable. The plugin's
# cli_in_container rejects the call before docker spawn when any of these
# appear, with the reason below.
reject_flags:
  - "-M"   # multi-target file: load list of hosts from file
reject_flags_reason: "File-based target ingestion (-M <file>) puts the host list outside the command line where scope validation cannot reach. Read the target list yourself (with the read tool) and call hydra once per target with the host as a positional argument or in a PROTOCOL://HOST URL."

# Per-tool value-taking flags whose values must NOT be confused with positional
# targets. hydra uses single-dash short flags exclusively (per `hydra --help`).
# Many flag values are file paths, integers, or module-option strings that
# could accidentally look like targets — listing them all keeps the DSL safe.
value_flags:
  # Authentication — username / password sources
  - "-l"   # single login (string)
  - "-L"   # login list file
  - "-p"   # single password (string — may contain @ or :)
  - "-P"   # password list file
  - "-C"   # combo file (login:pass per line) — replaces -l/-L/-p/-P
  - "-e"   # check empty/same/reverse: argument is one of n, s, r, ns, nr, sr, nsr
  - "-x"   # password-generator spec (MIN:MAX:CHARSET, e.g., 4:4:1)
  - "-y"   # disable use of symbols in -x bruteforce (boolean in some builds; safe to list)
  - "-r"   # use existing seed for -x (file path)
  # Targets / multi-target
  - "-M"   # multi-target file (REJECTED — listed so DSL skips its value if it slips through)
  - "-s"   # service port (int) — overrides default port for the protocol
  # Module options
  - "-m"   # per-module options (e.g., http-post-form spec '/path:body:fail-string')
  # Output / logging
  - "-o"   # output file path
  - "-b"   # output format: text | json | jsonv1
  - "-I"   # ignore restore file (boolean — listed for safety)
  # Threading / rate / timing
  - "-t"   # parallel tasks per target (int, default 16)
  - "-T"   # parallel tasks across all targets (int)
  - "-w"   # max wait for response (seconds, default 32)
  - "-W"   # wait between connect tries (seconds)
  - "-c"   # wait between login attempts per task (seconds)
  # Behaviour control (some are booleans but cheap to list for parser safety)
  - "-f"   # exit after first found pair per target (boolean)
  - "-F"   # exit after first found pair on any target (boolean)
  - "-u"   # loop around users instead of passwords (boolean — but list for safety)
  - "-S"   # use SSL (boolean)
  - "-O"   # use SSLv2 only (boolean)
  - "-K"   # do not redo failed attempts (boolean)
  - "-q"   # quiet mode — no per-attempt output (boolean)
  - "-v"   # verbose mode (boolean)
  - "-V"   # very verbose — show login+pass per attempt (boolean)
  - "-d"   # debug (boolean)
  - "-4"   # IPv4 only (boolean)
  - "-6"   # IPv6 only (boolean)
  - "-R"   # restore previous aborted session from ./hydra.restore (boolean)
  # Help / introspection
  - "-h"   # help (boolean)
  - "-U"   # show module-specific usage for the protocol given as next arg
  - "-N"   # show known service names (boolean — older builds)

usage_patterns:
  - name: "SSH single-user wordlist (lockout-aware: -t 4 -f)"
    command: "hydra -l admin -P /session/output/passwords.txt -t 4 -f -V -o /session/output/hydra-ssh.txt ssh://10.10.10.5"
    when: "Brute-force a known SSH username with a password list. -t 4 keeps under SSH MaxStartups (default 10:30:60); -f stops after the first valid pair; -V prints each attempt for observability. URL-positional `ssh://10.10.10.5` is the modern target syntax. Pin -o to /session/ so the result file survives the container exit. Always prefer this pattern over -L (multiple usernames) when you already know which account exists — limits failed attempts to ONE account's lockout counter."

  - name: "HTTP POST form attack (most common web-app brute-force shape)"
    command: "hydra -L /session/output/users.txt -P /session/output/passwords.txt -t 16 -f -V -o /session/output/hydra-http.txt 10.10.10.5 http-post-form '/login.php:user=^USER^&pass=^PASS^:Login failed'"
    when: "Brute-force a web login form. Uses the alternate `<host> <protocol> <module-spec>` positional form because http-post-form needs the module-spec as a separate positional argument. Module spec format: '<path>:<post-body-with-^USER^-and-^PASS^>:<fail-indicator>'. The fail-indicator is a string that appears ONLY on failed login (e.g., 'Login failed', 'Invalid', 'incorrect'). For 'success-detector' instead use S=indicator (e.g., 'S=Welcome admin'). For HTTPS, swap to https-post-form. -t 16 is fine for HTTP (web servers handle concurrency)."

  - name: "SMB Windows share single-user brute"
    command: "hydra -l administrator -P /session/output/passwords.txt -t 4 -f -V -o /session/output/hydra-smb.txt smb://10.10.10.5"
    when: "Brute-force SMB authentication with a known username. -t 4 because Windows AD lockout policies are tight (default 5 attempts in 30 minutes on modern AD). -f stops at first hit. For SMB1/SMB2 differences hydra auto-negotiates; if the server is SMB2-only and -e nsr fails, try the smb2 protocol explicitly: `smb2://...`. WARNING: this WILL count toward AD lockout. Run kerbrute --safe userenum FIRST to confirm the username is valid before burning lockout budget on hydra."

  - name: "FTP combo file (default credential testing)"
    command: "hydra -C /session/output/combos.txt -t 4 -f -V -o /session/output/hydra-ftp.txt ftp://10.10.10.5"
    when: "Test known user:pass combos from default-credential lists or prior dumps. Combo file format: one `username:password` per line. -C REPLACES all of -l/-L/-p/-P (mutually exclusive). Useful with /usr/share/seclists/Passwords/Default-Credentials/ftp-betterdefaultpasslist.txt. Always check anonymous FTP first (`hydra -l anonymous -p anonymous@ ftp://host`) before brute-forcing."

  - name: "MSSQL credential reuse — single user, single password"
    command: "hydra -l sa -p 'Password123!' -V -o /session/output/hydra-mssql.txt mssql://10.10.10.5"
    when: "Test ONE known credential pair against MSSQL — credential reuse from another service or a guessed default. No -L/-P → single combination tested ONCE. Common default is `sa:` (empty password, use -e n: `hydra -l sa -e n -V mssql://host`). For non-1433 ports use `-s <port> 10.10.10.5 mssql` (alternate form) or include the port in the URL: `mssql://10.10.10.5:1434`."

  - name: "MySQL user list × password list"
    command: "hydra -L /session/output/users.txt -P /session/output/passwords.txt -V -t 4 -f -o /session/output/hydra-mysql.txt mysql://10.10.10.5"
    when: "MySQL has expensive per-connection cost — keep -t low. Default port 3306. Common usernames: root, admin, mysql, dbadmin. ALWAYS test -e n FIRST (empty password is shockingly common for MySQL root). MySQL's `max_connect_errors` (default 100) will block the source IP — when this happens you need FLUSH HOSTS from another connection or wait."

  - name: "Empty/same/reverse password check (-e nsr — fast first pass)"
    command: "hydra -l root -e nsr -V -f -o /session/output/hydra-easy.txt ssh://10.10.10.5"
    when: "Try the three trivial password forms FIRST before any wordlist: n=null/empty, s=username-as-password (root:root), r=reversed-username (root:toor). Three attempts total per user; finishes in seconds. Catches misconfigured systems and dev/staging accounts. Always run before unleashing rockyou — if -e nsr hits, you're done; if it doesn't, you've burned only 3 lockout slots."

  - name: "User-loop mode (-u) — lockout-aware spray pattern"
    command: "hydra -L /session/output/users.txt -P /session/output/passwords.txt -u -t 4 -V -o /session/output/hydra-spray.txt smb://10.10.10.5"
    when: "Default hydra behaviour is `for user in users: for pass in passes: try`. With -u it becomes `for pass in passes: for user in users: try`. This is a 'horizontal' spray — every user gets ONE attempt with password1 before any user gets a SECOND attempt with password2. Critical when AD lockout threshold is 5 — spraying horizontally you can try 4 passwords against 100 users without locking ANY of them."

  - name: "PIN brute-force generator (-x)"
    command: "hydra -l admin -x 4:4:1 -V -f -o /session/output/hydra-pin.txt ssh://10.10.10.5"
    when: "Brute-force generated 4-digit PINs (10,000 candidates). -x format: MIN:MAX:CHARSET. CHARSET tokens: a=lowercase, A=uppercase, 1=digits, custom-string also supported. Examples: '4:4:1' = 10K 4-digit PINs; '6:8:aA1' = 6-8 char mixed; '8:8:abcdef0123456789' = 8-char hex. WARNING: keyspace explodes — '8:8:aA1' is ~218 trillion. Use only when wordlists exhaust and you suspect a structured password."

  - name: "https-post-form with custom fail string"
    command: "hydra -L /session/output/users.txt -P /session/output/passwords.txt -t 16 -f -V -o /session/output/hydra-https.txt -s 8443 10.10.10.5 https-post-form '/admin/login:username=^USER^&password=^PASS^&csrf=static_token:Invalid credentials'"
    when: "HTTPS form on a non-standard port. -s 8443 overrides default 443; module spec uses S= for success-string OR plain string for fail-string (the colon-separated 3rd field). Static CSRF tokens can be embedded; dynamic CSRF tokens (rotated per response) require -m to include H= cookie/header reuse and may not work — use ffuf+web-session for dynamic CSRF flows."

  - name: "Module help — print options for a specific protocol"
    command: "hydra -U http-post-form"
    when: "Print the per-module options string format for `-m`. Each protocol has different module syntax; -U is the canonical reference. Example output for http-post-form documents the `/path:body:F=fail` triple-colon spec including S=, F=, H=, C=, ^USER^, ^PASS^ tokens. Run `hydra -U <protocol>` BEFORE building a non-trivial -m string."

  - name: "Restore previous aborted session"
    command: "hydra -R"
    when: "Resume from ./hydra.restore (written when a previous run was Ctrl-C'd or otherwise interrupted). Useful for very long brute-forces. The restore file is in the current working directory of the previous run; if the container was destroyed the file is gone — restore only works on a persistent /session mount where the previous run wrote its restore file. Inside Docker without /session as cwd, restore typically WILL NOT work."

output_formats:
  # hydra writes results to BOTH stdout and (if -o set) a file. -b controls
  # the file format. text format is the default and is what mcp-server.py's
  # parser was built against; json/jsonv1 are machine-friendly alternatives.
  - flag: "-o {path} -b json"
    format: "json"
    preferred: true
  - flag: "-o {path} -b jsonv1"
    format: "json_v1"
    preferred: false
  - flag: "-o {path}"
    format: "text"
    preferred: false  # default text format; one line per finding
  - flag: "-V"
    format: "verbose_stdout_per_attempt"
    preferred: false  # noisy but useful for debugging

common_options:
  targeting:
    - "PROTOCOL://HOST[:PORT][/PATH]: positional URL form (preferred). Examples: ssh://10.10.10.5, mysql://user:pass@10.10.10.5, http-post-form://10.10.10.5/login.php"
    - "HOST PROTOCOL: alternate two-positional form. Example: `hydra -l admin -P p.txt 10.10.10.5 ssh`"
    - "-s <port>: override default port. Example: `-s 2222 10.10.10.5 ssh`"
    - "-M <file>: REJECTED — multi-target file. Use shell loop or call hydra per-host instead."
  authentication:
    - "-l <user>: single username (mutually exclusive with -L)"
    - "-L <file>: username list file"
    - "-p <pass>: single password (mutually exclusive with -P)"
    - "-P <file>: password list file"
    - "-C <file>: combo file (`username:password` per line) — REPLACES -l/-L/-p/-P"
    - "-e n|s|r|ns|nr|sr|nsr: try empty/same-as-login/reverse-login passwords (combine with -l/-L)"
    - "-x MIN:MAX:CHARSET: password generator. CHARSET tokens: a=lower, A=upper, 1=digits, custom string"
  threading:
    - "-t <int>: tasks per target (default 16). SSH: drop to 4. HTTP: 16-32 OK. Database: 4."
    - "-T <int>: tasks across all targets (used with -M, but -M is rejected)"
    - "-w <int>: max wait for response (default 32 s). Increase on slow links."
    - "-W <int>: wait BETWEEN connect attempts (rate limit; useful with -t 1)"
    - "-c <int>: wait between login attempts per task"
  behaviour:
    - "-f: stop after first valid pair on this target"
    - "-F: stop after first valid pair on ANY target"
    - "-u: loop around users instead of passwords (lockout-aware spray pattern)"
    - "-S: use SSL"
    - "-K: do not redo failed attempts"
    - "-q: quiet (suppress per-attempt output)"
    - "-V: very verbose (show login+pass for each attempt — useful for debugging)"
    - "-v: verbose"
    - "-d: debug"
  output:
    - "-o <file>: write results to file"
    - "-b text|json|jsonv1: result-file format (default text)"
    - "-I: ignore existing restore file"
  module:
    - "-m <opts>: per-module options. For http-post-form: '/path:body-with-^USER^-^PASS^:fail-or-S=success'. For others run `hydra -U <protocol>`."
    - "-U <protocol>: print module-specific options for the named protocol"
  restore:
    - "-R: restore aborted session from ./hydra.restore (must run in same cwd as the original)"

gotchas:
  - "-l (single login) and -L (login list) are MUTUALLY EXCLUSIVE. Same for -p (single pass) vs -P (pass list). Specifying both forms hydra accepts the LATER flag silently — easy to lose track of which one is active."
  - "-C <combo-file> REPLACES -l/-L AND -p/-P entirely. Combo file format: `username:password` per line. If you specify -C alongside -l/-P hydra ignores the latter (different from kerbrute which has separate sub-commands)."
  - "-e nsr is the fastest first pass: n=empty/null password, s=same-as-username, r=reversed-username. Three attempts per user. ALWAYS run BEFORE wordlist attacks — if it hits, you're done; if it doesn't, you've burned only 3 lockout slots per user."
  - "http-post-form module spec is THREE colon-separated fields: `<path>:<post-data-template>:<failure-OR-success-indicator>`. Use S=<string> for success-detector or plain string for fail-detector. ^USER^ and ^PASS^ are substituted; literal colons in any field must be escaped as `\\:`. WHAT TO ESCAPE: any colon inside the path (rare), inside the post-data values (e.g., `csrf=foo:bar` → `csrf=foo\\:bar`), or inside the fail/success string (e.g., `Location: /admin` → `Location\\: /admin`). The path's leading `/` is fine (no colon). Always test the spec with a SINGLE -p first (`hydra -l admin -p WrongPassword -V ...`) to confirm the parser sees what you mean."
  - "-V (uppercase) prints EVERY attempt's login:pass — VERY noisy on big wordlists but invaluable when debugging why nothing matches. -v (lowercase) is gentler. Default is silent (no per-attempt output)."
  - "-f (per-target stop) vs -F (any-target stop): -f is what you usually want. -F only matters with -M (multiple targets, but -M is rejected by this tool spec) — for single-target work -F and -f behave identically."
  - "-t default is 16 — way too high for SSH (MaxStartups limits unauthenticated connections to ~10), MySQL (per-connection cost), and aggressive Windows AD lockout policies. Drop to 1-4 for SSH/MySQL/SMB; 16-32 OK for HTTP."
  - "-x <min>:<max>:<charset>: keyspace explodes fast. `8:8:aA1` is 62^8 ≈ 218 trillion — infeasible. Reserve for short fixed-length brute-forces (4-digit PINs = 10K, 6-digit numeric = 1M)."
  - "Restore file (`hydra.restore`) is written on Ctrl-C in the CURRENT WORKING DIRECTORY of the running process. Resume with `hydra -R`. In Docker without a /session mount as cwd, the restore file dies with the container — long brute-forces should pin -o to /session/output/."
  - "Some protocols accept credentials in the URL: `mysql://user:pass@10.10.10.5`. The DSL extracts the host (group 2 of the URL regex) — `user:pass@` is part of the userinfo and not extracted. Useful for testing a single known cred without -l/-p."
  - "SSL: -S flag, OR use the protocol-with-`s`-suffix variant (e.g., `https-post-form` instead of `http-post-form`, `smtps` instead of `smtp`). The variants set sane SSL defaults; -S on the bare protocol is more error-prone."
  - "ACCOUNT LOCKOUT RISK: hydra is a brute-force tool. It WILL lock out accounts in any environment with a lockout policy (most production AD; many enterprise web apps). Mitigations: (a) use -l (single user) not -L; (b) use -e nsr for free triple-shot first; (c) on AD use kerbrute --safe to enumerate valid users WITHOUT failed logins, then narrow hydra's -L; (d) check lockout policy with netexec --pass-pol on a domain-joined host before any spray. Document explicit user authorisation before any production brute-force."
  - "MySQL specifically blocks the source IP after `max_connect_errors` (default 100). Once tripped, you can't connect at all until `FLUSH HOSTS` is run from another connection or the server times out. Stay under the limit by keeping -t 4 and -P narrow."
  - "Some hydra builds (especially older 9.x) have known issues with `http-post-form` when the response includes Set-Cookie that changes between attempts (rotating CSRF). For dynamic CSRF use ffuf with `-replay-proxy` or build a web-session login flow."
  - "hydra reports the full `[<port>][<service>] host: <h>   login: <u>   password: <p>` line on a hit. Password-only protocols (snmp, vnc, redis, cisco, cisco-enable, oracle-listener) emit `host: <h>   password: <p>` with no login field — hydra silently ignores -l/-L/-C for these. WHEN ATTACKING THESE PROTOCOLS: do NOT pass -l/-L/-C; use only -p/-P (or -x). Passing -l alongside -P typically still works but emits a `[INFO] Generating ... login tries` line that double-counts the keyspace and may confuse the parser."
  - "DNS resolution failures appear as `Could not resolve <host>` or `unable to resolve` (libc/getaddrinfo). TCP failures appear as `Connection refused` / `timeout`. SSH-specific failures (key exchange, version mismatch) surface as `SSH protocol error`. See failure_signatures for full list."
  - "hydra's exit code is NOT a reliable success indicator: 0 means 'ran to completion' regardless of whether any creds were found, 255 means 'argument error or fatal init failure'. Always parse output for `valid passwords found` count or grep for the result line."
  - "Built-in wordlists shipped in the container (legacy aliases — pass FULL PATHS, not aliases): rockyou=/usr/share/wordlists/rockyou.txt; common-passwords=/usr/share/seclists/Passwords/Common-Credentials/10k-most-common.txt; default-passwords=/usr/share/seclists/Passwords/Default-Credentials/default-passwords.txt; usernames=/usr/share/seclists/Usernames/top-usernames-shortlist.txt. The legacy MCP server resolved these short names to paths automatically; the kind:cli path requires the LLM to write the FULL PATH on the command line. For session-specific lists, write them to /session/<file> with the `write` tool first."
  - "Service-specific safe thread defaults (encoded from legacy SERVICE_THREADS map): SSH=-t 4 (MaxStartups), FTP=-t 8, MySQL=-t 4 (per-connection cost + max_connect_errors=100), Postgres=-t 4, SMB/SMB2=-t 8 (Windows is touchy), RDP=-t 4 (sensitive to concurrent), VNC=-t 4, Redis=-t 8, MongoDB=-t 4, MSSQL=-t 4, LDAP2/3=-t 8, sshkey=-t 4, oracle-listener=-t 4, firebird=-t 4. HTTP and other protocols use the hydra default of 16. PRODUCTION AD: drop SMB/RDP/MSSQL further (-t 1 to -t 2) to stay under lockout thresholds."
  - "Hydra prints an [INFO] line on startup with the keyspace estimate and may print further [INFO] advisories during the run. The legacy parser treated [INFO] as advisory (folded into warnings, not errors). [WARNING] lines are non-fatal; [ERROR] lines are fatal UNLESS credentials were found in the same run, in which case errors should be promoted to warnings (legacy behaviour: 'creds-found-despite-errors = success with warnings')."

failure_signatures:
  # Layer-diverse signals (SKILL #11):
  #   - DNS layer (hostname resolution)
  #   - TCP layer (connection refused / unreachable)
  #   - Protocol-specific (SSH key exchange, SMB protocol negotiation)
  #   - Module / syntax layer (-m form spec malformed, missing required option)
  #   - File I/O layer (wordlist not found, output file unwritable)
  #   - Auth-policy layer (account lockout, max_connect_errors)
  #   - Argument validation (unknown service, conflicting flags)
  - signal: "Could not resolve"
    remediation: "DNS resolution failed for the target hostname. Pass an IP address directly (most reliable for HTB / labs), or verify /etc/resolv.conf inside the container, or check that VPN routing forwards DNS for the lab domain."
  - signal: "unable to resolve"
    remediation: "Generic libc getaddrinfo() failure variant — same root cause as `Could not resolve`. Pass --target as IP."
  - signal: "Connection refused"
    remediation: "TCP connection to the target was refused on the protocol's port. Either hydra is hitting the wrong host (IP typo) OR the named service is not actually running. Verify with `nmap -p <port> <target>` first; expect the service to show as `open`."
  - signal: "cannot connect"
    remediation: "Generic TCP-layer connect failure. Same family as `Connection refused`. Check route/VPN reachability with ping or nmap."
  - signal: "Connection timed out"
    remediation: "TCP connect timeout — typically firewalled. Verify route/VPN, or try a different port. Increase -w (response wait) if the network is slow but reachable."
  - signal: "SSH protocol error"
    remediation: "SSH-specific protocol failure during the version exchange or initial handshake. The target may not be SSH (try `nmap -sV -p 22 <target>` to confirm) OR may be a hardened sshd that rejects hydra's banner. Try `-t 1 -W 3` to slow down the handshake and avoid being flagged as a scanner."
  - signal: "Key exchange failed"
    remediation: "SSH key exchange (KEX) algorithm negotiation failed. Modern OpenSSH disables old KEX algorithms (e.g., diffie-hellman-group1-sha1) by default; very old hydra clients may not negotiate the modern set. Workaround: ensure the container ships hydra v9.x; for legacy targets fall back to `ssh -o KexAlgorithms=...` directly."
  - signal: "0 valid passwords found"
    remediation: "hydra ran to completion but no credentials worked. Either the wordlist doesn't contain the password OR the username is wrong. Re-run with -V to see attempts; verify the username with kerbrute (AD) / SMB null session / known users. Consider adding -e nsr."
  - signal: "Syntax:.*see -h"
    remediation: "Argument parser rejected the command line. Usually a missing operand (forgot the host or protocol) or conflicting flags (-l with -L). Run `hydra -h` for the global synopsis or `hydra -U <protocol>` for protocol-specific module options."
  - signal: "unknown service:"
    remediation: "Protocol name not recognised. Run `hydra -h` to list supported services. Common typos: `https` (not a hydra service — use `https-get`/`https-post-form`); `mssql` is correct (NOT `microsoft-sql`); `smb` (NOT `cifs`). For SMB2-only servers use `smb2` explicitly."
  - signal: "Module .* requires"
    remediation: "Selected protocol needs additional module options via -m or as a positional after the protocol. Most common with http-post-form / http-get-form (need `-m '/path:body:fail'` or that string as the trailing positional). Run `hydra -U <protocol>` to see the module's required option string."
  - signal: "File for .* not found"
    remediation: "A path passed to -L, -P, -C, -o, or -m couldn't be opened. Verify the path inside the container (typically /session/<file>). For -L/-P/-C verify the file is readable; for -o verify the directory exists and is writable. /session/ is always writable."
  - signal: "Could not open"
    remediation: "Generic file-open failure variant. Same family as `File for .* not found`. Check `ls -l /session/<file>` and confirm the file was created with the `write` tool before invoking hydra."
  - signal: "Restorefile .* found"
    remediation: "A previous hydra run left a restore file in cwd. hydra prompts before continuing. Pass -I to ignore it (start fresh) or -R to resume. In non-interactive container use, ALWAYS pass -I unless explicitly resuming."
  - signal: "all children have been disabled"
    remediation: "All connection slots failed (every parallel task hit a fatal error). Usually a network reachability problem (firewall) or the service is down. Verify with `nmap -p <port> <target>`; reduce -t to 1 to isolate."
  - signal: "max_connect_errors"
    remediation: "MySQL-specific. The target's `max_connect_errors` was tripped (default 100 failed connects from one IP). MySQL now BLOCKS the source IP at the protocol level. Mitigations: (a) wait for the timeout (varies by version), (b) run `FLUSH HOSTS` from a working connection, (c) source from a different IP. Stay under the limit by keeping -t 4 with bounded -P."
  - signal: "account is locked"
    remediation: "Auth-policy layer failure. The target account is currently locked. Stop attacking it. For AD, check policy with `netexec smb <dc> -u <user> -p <pass> --pass-pol`. WAIT for the lockout window to expire OR ask the engagement contact to unlock."
  - signal: "child .* connection error"
    remediation: "A worker thread couldn't establish its connection. Sporadic instances are normal (rate limiting); a flood of these means the service is dropping hydra. Reduce -t and add -W <int> to space attempts."

help_commands:
  - command: "hydra -h"
    purpose: "Top-level help — lists all global flags, all supported services (50+), and short usage examples. Pipe to less; full output is ~150 lines."
  - command: "hydra --help"
    purpose: "Same as -h. Some hydra builds accept --help; others only -h. Both are safe to try."
  - command: "hydra -U <protocol>"
    purpose: "Print MODULE-specific usage for a single protocol (the option string passed to -m). Critical for http-post-form, http-get-form, and other modules with non-trivial -m syntax. Example: `hydra -U http-post-form` prints the `/path:body:fail` triple-colon spec details. Run BEFORE constructing any non-trivial -m string."
